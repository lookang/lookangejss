<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>字词游戏 - 字音和字形</title>
    <link rel="stylesheet" href="styles.css">
<script async="true" src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-S9EWRY1CPJ');

<style id="aiz-footer-style">
#aiz-footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 10px;
  z-index: 2147483000;
  display: flex;
  justify-content: center;
  pointer-events: auto; /* keep links clickable */
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
  color: #222;
}
#aiz-footer p {
  margin: 0;
  padding: 6px 10px;
  background: rgba(255,255,255,0.9);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
#aiz-footer a { color: #0b69ff; text-decoration: underline; }
</style>
</head>
<body>
    <!-- Main container adapts to iframe or standalone -->
    <div id="mainContainer">
        
        <!-- Tooltip for header info (appears on hover over info icon) -->
        <div id="headerTooltip" class="tooltip hidden">
            <span class="close-btn" id="closeTooltip">✕</span>
            <h3>字词游戏：字音和字形</h3>
            <p>学习目标：掌握9个词语的读音、字形和意思</p>
            <p>游戏模式：从简单到困难，逐步挑战！</p>
        </div>

        <!-- Info icon to trigger tooltip -->
        <div id="infoIcon" title="点击查看说明">ℹ️</div>

        <!-- Progress indicator -->
        <div id="progressBar">
            <div id="progressFill"></div>
            <span id="progressText">进度: 0/9</span>
        </div>

        <!-- Game mode selector -->
        <div id="modeSelector">
            <button class="mode-btn active" data-mode="learn">📚 学习模式</button>
            <button class="mode-btn" data-mode="easy">🌟 简单</button>
            <button class="mode-btn" data-mode="medium">⭐ 中等</button>
            <button class="mode-btn" data-mode="hard">💫 困难</button>
        </div>

        <!-- Main game area -->
        <div id="gameArea">
            <!-- Learning mode: vocabulary cards -->
            <div id="learnMode" class="game-mode active">
                <div id="vocabCards"></div>
                <button id="startQuizBtn" class="action-btn">开始测验 🎯</button>
            </div>

            <!-- Quiz mode: drag and drop / multiple choice -->
            <div id="quizMode" class="game-mode hidden">
                <div id="questionArea">
                    <div id="questionText"></div>
                    <div id="hintArea"></div>
                </div>
                
                <div id="answerArea">
                    <!-- Dynamic content based on difficulty -->
                </div>

                <div id="feedbackArea"></div>

                <div id="quizControls">
                    <button id="checkBtn" class="action-btn">检查答案 ✓</button>
                    <button id="nextBtn" class="action-btn hidden">下一题 →</button>
                    <button id="backToLearnBtn" class="action-btn secondary">返回学习 ←</button>
                </div>
            </div>
        </div>

        <!-- Score display -->
        <div id="scoreBoard">
            <span id="scoreText">得分: 0</span>
            <span id="accuracyText">正确率: 0%</span>
        </div>

        <!-- Analytics toggle button -->
        <button id="analyticsToggle" class="toggle-btn">📊 显示学习记录</button>

        <!-- Analytics panel (collapsible) -->
        <div id="analyticsPanel" class="collapsed">
            <div class="analytics-header">
                <h3>📊 学习分析记录</h3>
                <button id="clearAnalytics" class="small-btn">清除记录</button>
                <button id="closeAnalytics" class="close-btn">✕</button>
            </div>
            <div id="analyticsContent">
                <div id="actionLog">
                    <h4>🔍 操作日志</h4>
                    <div id="actionLogContent"></div>
                </div>
                <div id="quizLog">
                    <h4>📝 答题记录</h4>
                    <div id="quizLogContent"></div>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
<footer id="aiz-footer" role="contentinfo"><p id="generated-footer-credit">Made by XueHui, using Claude 4.6 SLS For more resources: <a href="https://sg.iwant2study.org/ospsg/index.php/interactive-resources/mother-tongue-languages/chinese" target="_blank" rel="noopener noreferrer">https://sg.iwant2study.org/ospsg/index.php/interactive-resources/mother-tongue-languages/chinese</a></p></footer>
</body>
</html>
