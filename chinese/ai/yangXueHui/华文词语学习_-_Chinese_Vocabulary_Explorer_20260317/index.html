<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>华文词语学习 - Chinese Vocabulary Explorer</title>
    <link rel="stylesheet" href="styles.css">
<script async="true" src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-S9EWRY1CPJ');

<style id="aiz-footer-style">
#aiz-footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 10px;
  z-index: 2147483000;
  display: flex;
  justify-content: center;
  pointer-events: auto; /* keep links clickable */
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
  color: #222;
}
#aiz-footer p {
  margin: 0;
  padding: 6px 10px;
  background: rgba(255,255,255,0.9);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
#aiz-footer a { color: #0b69ff; text-decoration: underline; }
</style>
</head>
<body>
    <!-- Main Container -->
    <div id="mainContainer">
        
        <!-- Tooltip for header info (appears on hover over info icon) -->
        <div id="headerTooltip" class="tooltip hidden">
            <span class="close-tooltip" onclick="closeTooltip()">✕</span>
            <h3>华文词语学习互动</h3>
            <p>适合小学五、六年级学生</p>
            <p>点击词语听发音，拖动卡片配对词语与意思</p>
        </div>

        <!-- Info Icon (top-right corner) -->
        <div id="infoIcon" title="点击查看说明">ℹ️</div>

        <!-- Control Panel -->
        <div id="controlPanel">
            <!-- Mode Selection -->
            <div class="control-group">
                <label>学习模式：</label>
                <button class="mode-btn active" data-mode="learn">学习模式</button>
                <button class="mode-btn" data-mode="practice">练习模式</button>
                <button class="mode-btn" data-mode="quiz">测验模式</button>
            </div>

            <!-- Audio Controls -->
            <div class="control-group audio-controls">
                <label>语速：</label>
                <input type="range" id="rateSlider" min="0.5" max="1.5" step="0.1" value="1">
                <span id="rateValue">1.0x</span>
                
                <label style="margin-left: 15px;">音调：</label>
                <input type="range" id="pitchSlider" min="0.8" max="1.2" step="0.1" value="1">
                <span id="pitchValue">1.0</span>
            </div>

            <!-- Pinyin Toggle -->
            <div class="control-group">
                <label>
                    <input type="checkbox" id="pinyinToggle" checked>
                    显示拼音
                </label>
                <label style="margin-left: 15px;">
                    <input type="checkbox" id="toneColorToggle" checked>
                    声调颜色
                </label>
            </div>
        </div>

        <!-- Main Content Area -->
        <div id="contentArea">
            
            <!-- Learn Mode: Vocabulary Cards -->
            <div id="learnMode" class="mode-content active">
                <div id="vocabGrid"></div>
            </div>

            <!-- Practice Mode: Drag and Match -->
            <div id="practiceMode" class="mode-content">
                <div class="practice-instruction">拖动右边的意思卡片到对应的词语上</div>
                <div id="practiceArea">
                    <div id="wordColumn" class="column"></div>
                    <div id="meaningColumn" class="column"></div>
                </div>
                <div class="practice-controls">
                    <button id="checkAnswers" class="action-btn">检查答案</button>
                    <button id="resetPractice" class="action-btn">重新开始</button>
                </div>
            </div>

            <!-- Quiz Mode: Multiple Choice -->
            <div id="quizMode" class="mode-content">
                <div id="quizProgress"></div>
                <div id="quizQuestion"></div>
                <div id="quizOptions"></div>
                <div id="quizFeedback"></div>
                <div class="quiz-controls">
                    <button id="nextQuestion" class="action-btn hidden">下一题</button>
                    <button id="restartQuiz" class="action-btn hidden">重新测验</button>
                </div>
            </div>

        </div>

        <!-- Analytics Panel (Collapsible) -->
        <div id="analyticsPanel">
            <div id="analyticsHeader">
                <span>📊 学习分析</span>
                <button id="toggleAnalytics">▼</button>
                <button id="clearAnalytics" title="清除记录">🗑️</button>
            </div>
            <div id="analyticsContent">
                <div id="actionLog"></div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
<footer id="aiz-footer" role="contentinfo"><p id="generated-footer-credit">Made by XueHui, using Claude 4.6 SLS For more resources: <a href="https://sg.iwant2study.org/ospsg/index.php/interactive-resources/mother-tongue-languages/chinese" target="_blank" rel="noopener noreferrer">https://sg.iwant2study.org/ospsg/index.php/interactive-resources/mother-tongue-languages/chinese</a></p></footer>
</body>
</html>
