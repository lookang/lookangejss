<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Pinyin Racing Game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S9EWRY1CPJ');
  </script>
</head>
<body>
    <!-- Main Game Container -->
    <div id="gameContainer" class="game-container">
        
        <!-- Top Stats Bar -->
        <div class="stats-bar">
            <div class="stat-item" title="Current Score">
                <span class="stat-label">Score</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-item" title="Highest Score Achieved">
                <span class="stat-label">High Score</span>
                <span id="highScore" class="stat-value">0</span>
            </div>
            <div class="stat-item" title="Current Difficulty Level">
                <span class="stat-label">Level</span>
                <span id="level" class="stat-value">1</span>
            </div>
            <div class="stat-item" title="Consecutive Correct Answers">
                <span class="stat-label">Combo</span>
                <span id="combo" class="stat-value combo-display">0</span>
            </div>
        </div>

        <!-- Current Word Display -->
        <div class="word-display">
            <div class="hanzi" id="currentHanzi">准备好了吗？</div>
            <div class="instruction">Type the Pinyin below!</div>
        </div>

        <!-- Race Track -->
        <div class="race-track">
            <!-- Finish Line -->
            <div class="finish-line"></div>
            
            <!-- Player Lane -->
            <div class="lane player-lane">
                <div class="racer player-racer" id="playerRacer">
                    <span class="racer-icon">🏃</span>
                    <span class="racer-label">You</span>
                </div>
                <div class="distance-marker">0m</div>
            </div>

            <!-- AI Opponent 1 -->
            <div class="lane ai-lane">
                <div class="racer ai-racer" id="aiRacer1">
                    <span class="racer-icon">🤖</span>
                    <span class="racer-label">AI 1</span>
                </div>
                <div class="distance-marker">0m</div>
            </div>

            <!-- AI Opponent 2 -->
            <div class="lane ai-lane">
                <div class="racer ai-racer" id="aiRacer2">
                    <span class="racer-icon">🚗</span>
                    <span class="racer-label">AI 2</span>
                </div>
                <div class="distance-marker">0m</div>
            </div>

            <!-- AI Opponent 3 -->
            <div class="lane ai-lane">
                <div class="racer ai-racer" id="aiRacer3">
                    <span class="racer-icon">🚀</span>
                    <span class="racer-label">AI 3</span>
                </div>
                <div class="distance-marker">0m</div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <input 
                type="text" 
                id="pinyinInput" 
                class="pinyin-input" 
                placeholder="Type pinyin here..."
                autocomplete="off"
                spellcheck="false"
            />
            <button id="startBtn" class="start-btn">Start Race!</button>
        </div>

        <!-- Particle Container for Effects -->
        <div id="particleContainer" class="particle-container"></div>
    </div>

    <!-- Result Overlay -->
    <div id="resultOverlay" class="result-overlay hidden">
        <div class="result-card">
            <div id="resultTitle" class="result-title">🏆 You Win!</div>
            <div class="result-stats">
                <div class="result-stat">
                    <span class="result-label">Final Score:</span>
                    <span id="finalScore" class="result-value">0</span>
                </div>
                <div class="result-stat">
                    <span class="result-label">Level Reached:</span>
                    <span id="finalLevel" class="result-value">1</span>
                </div>
                <div class="result-stat">
                    <span class="result-label">Max Combo:</span>
                    <span id="maxCombo" class="result-value">0</span>
                </div>
            </div>
            <button id="restartBtn" class="restart-btn">Race Again!</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
