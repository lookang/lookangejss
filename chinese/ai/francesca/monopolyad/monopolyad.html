    <script>
        const apiKey = ""; 

        // --- Gemini API Helpers ---
        // 1. Text Generation (Quiz, Facts)
        async function callGemini(prompt, systemInstruction = "You are a game master for a Singapore MRT Monopoly game.") {
            if (!apiKey) return null;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
                generationConfig: { responseMimeType: "application/json" }
            };
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error(response.statusText);
                const data = await response.json();
                return JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text);
            } catch (e) { 
                console.error("Gemini API Error:", e);
                return null; 
            }
        }

        // 2. Text-to-Speech (TTS)
        async function callGeminiTTS(text) {
            if (!apiKey) return;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: text }] }],
                generationConfig: { 
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }
                }
            };

            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error(response.statusText);
                const data = await response.json();
                const audioData = data.candidates[0].content.parts[0].inlineData.data;
                
                const pcmData = Uint8Array.from(atob(audioData), c => c.charCodeAt(0));
                const wavBytes = pcmToWav(pcmData, 24000); // Kore is usually 24kHz
                const blob = new Blob([wavBytes], { type: 'audio/wav' });
                const audioUrl = URL.createObjectURL(blob);
                const audio = new Audio(audioUrl);
                audio.play();
            } catch (e) {
                console.error("TTS Error:", e);
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'zh-CN';
                speechSynthesis.speak(u);
            }
        }

        // Helper: PCM to WAV Converter
        function pcmToWav(pcmData, sampleRate) {
            const numChannels = 1;
            const byteRate = sampleRate * numChannels * 2;
            const blockAlign = numChannels * 2;
            const dataSize = pcmData.length;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); 
            view.setUint16(20, 1, true); 
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true); 
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);
            const pcmView = new Uint8Array(buffer, 44);
            pcmView.set(pcmData);
            return buffer;
        }
        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // --- 2. Sound & Audio (Enhanced) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let soundEnabled = true;

        function playSound(type) {
            if (!soundEnabled) return;
            const t = audioCtx.currentTime;

            // Helper to create simple oscillator sound
            const createOsc = (wavetype, freqStart, freqEnd, duration, delay = 0) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.type = wavetype;
                osc.frequency.setValueAtTime(freqStart, t + delay);
                if (freqEnd) {
                    osc.frequency.exponentialRampToValueAtTime(freqEnd, t + delay + duration);
                }
                
                gain.gain.setValueAtTime(0.1, t + delay);
                gain.gain.exponentialRampToValueAtTime(0.01, t + delay + duration);
                
                osc.start(t + delay);
                osc.stop(t + delay + duration);
            };

            if (type === 'move') {
                createOsc('sine', 400, 600, 0.1);
            } else if (type === 'coin') {
                createOsc('triangle', 1000, 1800, 0.1); // High pitch ping
                createOsc('triangle', 1500, 2000, 0.1, 0.05); // Second ping for sparkle effect
            } else if (type === 'bad') {
                createOsc('sawtooth', 150, 100, 0.3);
            } else if (type === 'correct') {
                // Exciting Major Arpeggio (C5 - E5 - G5)
                createOsc('sine', 523.25, null, 0.2, 0);    // Do
                createOsc('sine', 659.25, null, 0.2, 0.1);  // Mi
                createOsc('triangle', 783.99, null, 0.4, 0.2);  // Sol (Longer)
            } else if (type === 'wrong') {
                // Disappointing Slide Down
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, t);
                osc.frequency.linearRampToValueAtTime(50, t + 0.4); // Pitch drop
                
                gain.gain.setValueAtTime(0.15, t);
                gain.gain.linearRampToValueAtTime(0.01, t + 0.4);
                
                osc.start(t);
                osc.stop(t + 0.4);
            }
        }

        centerPole.position.y = 3; scene.add(centerPole);
        const flag = new THREE.Mesh(new THREE.BoxGeometry(4, 2.5, 0.2), new THREE.MeshStandardMaterial({color: 0xe74c3c}));
        flag.position.set(0, 5, 0); scene.add(flag);

        // --- 4. Procedural Board Generation ---
        const boardScale = 18; const tilesPerSide = 5; const stepSize = (boardScale * 2) / tilesPerSide; 
        const pathCoords = [];
        for (let i = 0; i < 20; i++) {
            let x, z, rot;
            if (i === 0) { x = -boardScale; z = boardScale; rot = Math.PI/2; }
            else if (i > 0 && i < 5) { x = -boardScale; z = boardScale - (i * stepSize); rot = Math.PI/2; }
            else if (i === 5) { x = -boardScale; z = -boardScale; rot = 0; }
            else if (i > 5 && i < 10) { x = -boardScale + ((i - 5) * stepSize); z = -boardScale; rot = 0; }
            else if (i === 10) { x = boardScale; z = -boardScale; rot = -Math.PI/2; }
            else if (i > 10 && i < 15) { x = boardScale; z = -boardScale + ((i - 10) * stepSize); rot = -Math.PI/2; }
            else if (i === 15) { x = boardScale; z = boardScale; rot = Math.PI; }
            else if (i > 15) { x = boardScale - ((i - 15) * stepSize); z = boardScale; rot = Math.PI; }
            pathCoords.push({x, z, rot});

        const trackR = new THREE.Mesh(new THREE.BoxGeometry(tW, 0.2, len), trackMat); trackR.position.set(boardScale, 0.1, 0); scene.add(trackR);
        const trackT = new THREE.Mesh(new THREE.BoxGeometry(len, 0.2, tW), trackMat); trackT.position.set(0, 0.1, -boardScale); scene.add(trackT);

            else { ctx.fillStyle = '#7f8c8d'; ctx.font = 'italic 30px Arial'; ctx.fillText(station.type === 'start' ? "GO ->" : station.type.toUpperCase(), 128, 200); }
            const tex = new THREE.CanvasTexture(canvas);
            const tile = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.4, 3.5), [

            ]);
            tile.position.y = 0.2; tile.rotation.y = -Math.PI / 2; tile.receiveShadow = true; group.add(tile);
            if (station.type === 'prop' && station.image) {

            } else if (station.type === 'chance' || station.type === 'jail' || station.type === 'start') {
                const markerGeo = new THREE.CylinderGeometry(0.5, 0.5, 2);

                const marker = new THREE.Mesh(markerGeo, markerMat);
                marker.position.set(0, 1.5, -1); group.add(marker); station.animObj = marker;
            }
            const houseGroup = new THREE.Group();
            houseGroup.position.set(0, 4, -1.5); group.add(houseGroup); station.houseGroup = houseGroup;
            scene.add(group);
            station.worldPos = new THREE.Vector3(coord.x, 0.1, coord.z);
        }

            triggerAI: async function(sid) {

                const btn = event.target;
                btn.innerHTML = '<div class="loader"></div>';
                const data = await callGemini(`Generate a multiple choice question about Singapore MRT station ${s.name} (${s.en}) suitable for primary school kids. Focus on history, landmarks, or color. Return JSON {question, options:[], answer:int_index}.`);
                if(data) this.renderBuyModal(s, true, data);
                else btn.innerText = "失败";
            },
            // AI Feature 2: Fun Fact Guide
            triggerAIGuide: async function(sid) {
                const s = STATIONS[sid];
                const contentDiv = document.getElementById(`ai-guide-content-${s.id}`);
                contentDiv.classList.remove('hidden');
                contentDiv.innerHTML = '<div class="loader"></div> AI 正在翻阅旅游指南...';
                
                const fact = await callGemini(
                    `Tell me a fun, short "Did you know?" fact about the Singapore MRT station area: ${s.name} (${s.en}). Keep it under 30 words, in Chinese, suitable for kids.`,
                    "You are a friendly Singaporean tour guide."
                );
                
                if(fact) {
                    contentDiv.innerText = fact;
                    // Auto-read the fact
                    // game.triggerTTS(fact); 
                } else {
                    contentDiv.innerText = "AI 导游迷路了...";
                }
            },
            // AI Feature 3: Text to Speech
            triggerTTS: function(text) {
                callGeminiTTS(text);
            },

            answer: function(idx, sid) {
                const s = STATIONS[sid];
                document.getElementById('modal-container').innerHTML = '';
                if (idx === s.tempAns) {
                    playSound('correct'); // Play exciting correct sound!
                    this.getCurrentPlayer().pay(s.price);
                    s.owner = this.getCurrentPlayer().id;
                    this.log(`购买 ${s.name} 成功!`);
                    const flag = new THREE.Mesh(new THREE.BoxGeometry(1, 0.6, 0.1), new THREE.MeshLambertMaterial({color: this.getCurrentPlayer().id===1?0xe74c3c:0x3498db}));
                    flag.position.y = 0.5; s.houseGroup.add(flag);
                } else {
                    playSound('wrong'); // Play disappointing wrong sound
                    this.log("回答错误!");
                }
                setTimeout(() => this.switchTurn(), 1500);
            },
            payRent: function(p, s) {
                const owner = this.players.find(pl => pl.id === s.owner);
                p.pay(s.rent); owner.earn(s.rent);
                this.log(`支付租金 $${s.rent}`);
                setTimeout(()=>this.switchTurn(), 1500);
            },
            drawChanceCard: function(p) {
                const c = CHANCE_CARDS[Math.floor(Math.random()*CHANCE_CARDS.length)];
                p.earn(c.amount);
                document.getElementById('modal-container').innerHTML = `
                    <div class="modal-box p-6 bg-yellow-50 pointer-events-auto text-center">
                        <div class="text-4xl">⚡</div>
                        <p class="my-4 font-bold">${c.text}</p>
                        <button onclick="game.closeModal()" class="bg-yellow-500 text-white px-6 py-2 rounded font-bold">确定</button>
                    </div>
                `;
            },
            closeModal: function() { document.getElementById('modal-container').innerHTML = ''; this.switchTurn(); }
        };
        
        document.getElementById('p1-card').classList.add('player-active');

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            STATIONS.forEach(s => { if(s.animObj) s.animObj.rotation.y += 0.02; });
            if (game.cameraMode === 'follow') {
                const p = game.getCurrentPlayer();
                const t = new THREE.Vector3(p.mesh.position.x, p.mesh.position.y + 15, p.mesh.position.z + 20);
                camera.position.lerp(t, 0.05); controls.target.lerp(p.mesh.position, 0.05);
            }
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
