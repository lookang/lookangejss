  function _ODE_evolution1() {
    var __odeSelf = {};
    var __eventSolver;
    var __solverClass = EJSS_ODE_SOLVERS.rungeKutta4;
    var __state=[];
    var _ODE_evolution1_Event1;
    var _ODE_evolution1_Event2;
    var __ignoreErrors=false;
    var __mustInitialize=true;
    var __isEnabled=true;
    var __mustUserReinitialize=false;
    var __mustReinitialize=true;


    __odeSelf.setSolverClass = function(__aSolverClass) {
      __solverClass = __aSolverClass;
      __instantiateSolver();
    };

    function __instantiateSolver() {
      __state=[];
      __pushState();
      __eventSolver = EJSS_ODE_SOLVERS.interpolatorEventSolver(__solverClass(),__odeSelf);
      __mustInitialize = true;
    }

    __odeSelf.setEnabled = function(_enabled) { __isEnabled = _enabled; };

    __odeSelf.getIndependentVariableValue = function() { return __eventSolver.getIndependentVariableValue(); };

    __odeSelf.getInternalStepSize = function() { return __eventSolver.getInternalStepSize(); };

    __odeSelf.isAccelerationIndependentOfVelocity = function() { return false; };

    __odeSelf.initializeSolver = function() {
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); return; }
      __pushState();
      __eventSolver.initialize(dt);
      __eventSolver.setBestInterpolation(false);
      __eventSolver.setMaximumInternalSteps(10000);
      __eventSolver.removeAllEvents();
      if (__pagesEnabled["Event"]) __eventSolver.addEvent(_ODE_evolution1_Event1());
      if (__pagesEnabled["Event 2"]) __eventSolver.addEvent(_ODE_evolution1_Event2());
      __eventSolver.setEstimateFirstStep(false);
      __eventSolver.setEnableExceptions(false);
      __eventSolver.setTolerances(0.00001,0.00001);
      __mustReinitialize = true;
      __mustInitialize = false;
    };

    function __pushState() {
      // Copy our variables to __state[] 
        var __j=0;
        var __n=0;
        var __cIn=0;
        if (__state[__cIn]!=x) __mustReinitialize = true;
        __state[__cIn++] = x;
        if (__state[__cIn]!=t) __mustReinitialize = true;
        __state[__cIn++] = t;
    }

    function __arraysChanged () {
      return false;
    }

    __odeSelf.getEventSolver = function() {
      return __eventSolver;
    };

    __odeSelf.resetSolver = function() {
      __mustUserReinitialize = true;
    };

    __odeSelf.automaticResetSolver = function() {
      __mustReinitialize = true;
    };

    function __errorAction () {
      if (__ignoreErrors) return;
      console.log (__eventSolver.getErrorMessage());
      _pause();
      // Make sure the solver is reinitialized;
      __mustReinitialize = true;
    }

    __odeSelf.step = function() { return __privateStep(false); };

    __odeSelf.solverStep = function() { return __privateStep(true); };

    function __privateStep(__takeMaximumStep) {
      if (!__isEnabled) return 0;
      if (dt===0) return 0;
      if (__mustInitialize) __odeSelf.initializeSolver();
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); }
      __eventSolver.setStepSize(dt);
      __eventSolver.setInternalStepSize(dt);
      __eventSolver.setMaximumInternalSteps(10000);
      __eventSolver.setTolerances(0.00001,0.00001);
      __pushState();
      if (__mustUserReinitialize) { 
        __eventSolver.userReinitialize();
        __mustUserReinitialize = false;
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      else if (__mustReinitialize) { 
        __eventSolver.reinitialize();
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      var __stepTaken = __takeMaximumStep ? __eventSolver.maxStep() : __eventSolver.step();
      // Extract our variables from __state
        var __i=0;
        var __cOut=0;
        x = __state[__cOut++];
        t = __state[__cOut++];
      // Check for error
      if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      return __stepTaken;
    }

    __odeSelf.getState = function() { return __state; };

    __odeSelf.getRate = function(_aState,_aRate) {
      // Extract our variables from _aState
        var __i=0;
        var __cOut=0;
        var x = _aState[__cOut++];
        var t = _aState[__cOut++];
      // Compute the rate
        var __cRate=0;
        _aRate[__cRate++] = vx; // Rate for ODE: Evol Page:x

        return _aRate;
    }; //end of getRate

    _view._9(EJSS_INTERFACE.html,"htmlArea", _view.bottom) // EJsS HtmlView.HtmlView Page: declaration of element 'htmlArea'
      .setProperty("Html","<h2> <a href=\"https://www.seab.gov.sg/content/syllabus/olevel/2015Syllabus/5059_2015.pdf\">Topics</a> </h2> Measurement of length and time<br /> <h2>  Description </h2> Play with the Vernier Caliper Model. Test what you've learned by trying the input field. <br /> <br /> Vernier calipers can measure internal dimensions (using the uppermost jaws in the picture at right), external dimensions using the pictured lower jaws, and depending on the manufacturer, depth measurements by the use of a probe that is attached to the movable head and slides along the centre of the body. This probe is slender and can get into deep grooves that may prove difficult for other measuring tools.<br /> <br /> The vernier scales can be in <a href=\"http://en.wikipedia.org/wiki/Metre\">metric</a>  measurements on the upper and lower part of the scale. <br /> <br /> Vernier calipers commonly used in industry provide a precision to a hundredth of a millimetre (10 <a href=\"http://en.wikipedia.org/wiki/Micrometre\">micrometres</a>).<br /> <br /> A more precise instrument used for the same purpose is the <a href=\"http://en.wikipedia.org/wiki/Micrometer_%28device%29\">micrometer</a> <br /> <br /> <br /> <h2> Parts of a vernier caliper: </h2> Outside jaws: used to measure external diameter or width of an object (Blue)<br /> <br /> Inside jaws: used to measure internal diameter of an object <br /> Depth probe: used to measure depths of an object or a hole ( not shown in this model)<br /> <br /> Main scale: gives measurements in mm. <br /> Vernier gives measurements up to one decimal places in mm <br /> Retainer: used to block movable part to allow the easy transferring a measurement ( not shown in this model) <br /> <br /> The Vernier calipers model has<br /> <br /> an object (Blue) for the internal jaws to measure width of an object with slider to control width of the object and simple drag action to control position of object. <br /> an object (Green) for external jaws to measure internal diameter of a cylinder for example with slider to control dimensions of the cylinder. <br /> a slider for zero error slider <br /> checkbox for hint to scaffold the learners attention and point of focus <br /> checkbox for answer to show the meaning of reading on the main scale and the vernier scale with zero error calculations if any. <br /> drop down menu of the various common vernier scales for sense making and additional testing out by learners their ideas of how vernier works. <br /> fine &lt;&gt; control buttons for learners to manipulate the model with single incremental precision <br /> slider control for fast changes in the vernier measurement <br /> reset button to bring simulaton back to original (default) setting. <br /> <br /> <h2> Research</h2> <a href=\"http://arxiv.org/abs/1408.3803\">arXiv:1408.3803</a> [<a href=\"http://arxiv.org/pdf/1408.3803\">pdf</a>]<br />Vernier caliper and micrometer computer models using Easy Java Simulation and its pedagogical design feature-ideas to augment learning with real instruments<br /><a href=\"http://arxiv.org/find/physics/1/au:+Wee_L/0/1/0/all/0/1\">Loo Kang Wee</a>, <a href=\"http://arxiv.org/find/physics/1/au:+Ning_H/0/1/0/all/0/1\">Hwee Tiang Ning</a><br />Comments: 8 pages, 8 figures, Physics Education journal<br />Subjects: Physics Education (physics.ed-ph); Instrumentation and Detectors (physics.ins-det)<div> <br> <a href=\"https://youtu.be/jHoA5M-_1R4\">https://youtu.be/jHoA5M-_1R4</a><br /> <iframe allowfullscreen=\"\" frameborder=\"0\" height=\"315\" src=\"https://www.youtube.com/embed/jHoA5M-_1R4\" width=\"560\"></iframe> <h2> Video</h2> <div> <a href=\"https://youtu.be/zz4Fha5sISo\">https://youtu.be/zz4Fha5sISo</a></div> <iframe allowfullscreen=\"\" frameborder=\"0\" height=\"315\" src=\"https://www.youtube.com/embed/zz4Fha5sISo\" width=\"560\"></iframe> <br>     <a href=\"https://youtu.be/qXtE07tbK8s\">https://youtu.be/qXtE07tbK8s</a> <br>      <iframe width=\"560\" height=\"315\" src=\"https://www.youtube.com/embed/qXtE07tbK8s\" frameborder=\"0\" allowfullscreen=\"#DEFAULT\"></iframe> <br /> <h2>  Sample Learning Goals </h2> (g) describe how to measure a variety of lengths with appropriate accuracy by means of tapes, rules, micrometers and calipers, using a vernier scale as necessary. <br /> <br /> <br /> <h2>  Version: </h2> <ol> <li><a href=\"http://weelookang.blogspot.sg/2015/07/ejss-vernier-caliper-model.html\">http://weelookang.blogspot.sg/2015/07/ejss-vernier-caliper-model.html</a></li> <li><a href=\"http://weelookang.blogspot.sg/2010/06/ejs-open-source-vernier-calipers-java.html\">http://weelookang.blogspot.sg/2010/06/ejs-open-source-vernier-calipers-java.html</a></li> <li> <a href=\"http://iwant2study.org/lookangejss/01_measurement/ejs/ejs_model_AAPTVernierCaliper.jar\">http://iwant2study.org/lookangejss/01_measurement/ejs/ejs_model_AAPTVernierCaliper.jar</a> </li>   <li><a href=\"http://www.opensourcephysics.org/items/detail.cfm?ID=9707\">http://www.opensourcephysics.org/items/detail.cfm?ID=9707</a></li> <li><a href=\"http://www.phy.ntnu.edu.tw/ntnujava/index.php?topic=684.msg2452#msg2452\">http://www.phy.ntnu.edu.tw/ntnujava/index.php?topic=684.msg2452#msg2452</a></li> <li><a href=\"http://www.phy.ntnu.edu.tw/ntnujava/index.php?topic=567.msg2364#msg2364\">http://www.phy.ntnu.edu.tw/ntnujava/index.php?topic=567.msg2364#msg2364</a></li> </ol> <div> <div> <ol> </ol> <div> <br /></div> </div> </div>") // EJsS HtmlView.HtmlView Page: setting property 'Html' for element 'htmlArea'
