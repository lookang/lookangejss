  // for string value of l_answer and l_x  // > CustomCode.dvalue:2
  function dvalue(v, unit) {  // > CustomCode.dvalue:3
    if (v > 0) dv = 0.5;  // > CustomCode.dvalue:4
    else if (v < 0) dv = -0.5;  // > CustomCode.dvalue:5
    else dv = 0.0;  // > CustomCode.dvalue:6
