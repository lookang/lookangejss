  function rectifyVectorChange() {  // > CustomCode.quizmaker:55
    A = Math.round(Math.sqrt(Ax * Ax + Ay * Ay) * 10) / 10; // attempt to solve round problem in answers  // > CustomCode.quizmaker:56
    cta = (Math.atan2(Ay, Ax));  // > CustomCode.quizmaker:57
    ctadegree = Math.round(cta * 180 / Math.PI);// attempt to solve round problem in answers  // > CustomCode.quizmaker:58
    if (cta <= pi / 2 && cta >= 0) { //1 quadrant  // > CustomCode.quizmaker:59
      //cta=pi-cta;   // > CustomCode.quizmaker:60
      quandrant = 1;  // > CustomCode.quizmaker:61
      transformationangle = 0;  // > CustomCode.quizmaker:62
      Axtexty = -0.7;  // > CustomCode.quizmaker:63
      Axtextx = Ax / 2;  // > CustomCode.quizmaker:64
      Aytextx = -1;  // > CustomCode.quizmaker:65
      Aytexty = Ay / 1.2;  // > CustomCode.quizmaker:66
      angledisplayx = Math.cos(cta / 3);  // > CustomCode.quizmaker:67
      angledisplayy = Math.sin(cta / 3);  // > CustomCode.quizmaker:68
      angledisplayxvertical = Math.cos(pi / 4 + cta / 2);  // > CustomCode.quizmaker:69
      angledisplayyvertical = Math.sin(pi / 4 + cta / 2);  // > CustomCode.quizmaker:70
      ctadegreeacute = ctadegree;  // > CustomCode.quizmaker:71
    }  // > CustomCode.quizmaker:72
    else if (cta >= pi / 2 && cta <= pi) { //2 q  // > CustomCode.quizmaker:73
      quandrant = 2;  // > CustomCode.quizmaker:74
      cta = pi - cta;  // > CustomCode.quizmaker:75
      transformationangle = pi - cta;  // > CustomCode.quizmaker:76
      Axtexty = -1;  // > CustomCode.quizmaker:77
      Axtextx = Ax / 2;  // > CustomCode.quizmaker:78
      Aytextx = +0.6;  // > CustomCode.quizmaker:79
      Aytexty = Ay / 1.2;  // > CustomCode.quizmaker:80
      angledisplayx = -Math.cos(cta / 3);  // > CustomCode.quizmaker:81
      angledisplayy = Math.sin(cta / 3)  // > CustomCode.quizmaker:82
      angledisplayxvertical = Math.cos(3 * pi / 4 - cta / 2);  // > CustomCode.quizmaker:83
      angledisplayyvertical = Math.sin(3 * pi / 4 - cta / 2);  // > CustomCode.quizmaker:84
      ctadegreeacute = 180 - ctadegree;  // > CustomCode.quizmaker:85
    }  // > CustomCode.quizmaker:86
    else if (cta <= -pi / 2 && cta >= -pi) { //3 quadrant  // > CustomCode.quizmaker:87
      quandrant = 3;  // > CustomCode.quizmaker:88
      cta = pi + cta;  // > CustomCode.quizmaker:89
      transformationangle = pi;  // > CustomCode.quizmaker:90
      Axtexty = +0.3;  // > CustomCode.quizmaker:91
      Axtextx = Ax / 2;  // > CustomCode.quizmaker:92
      Aytextx = +1;  // > CustomCode.quizmaker:93
      Aytexty = Ay / 1.2;  // > CustomCode.quizmaker:94
      angledisplayx = -Math.cos(cta / 3);  // > CustomCode.quizmaker:95
      angledisplayy = -Math.sin(cta / 3)  // > CustomCode.quizmaker:96
      angledisplayxvertical = Math.cos(5 * pi / 4 + cta / 2);  // > CustomCode.quizmaker:97
      angledisplayyvertical = Math.sin(5 * pi / 4 + cta / 2);  // > CustomCode.quizmaker:98
      ctadegreeacute = 180 + ctadegree;  // > CustomCode.quizmaker:99
    }  // > CustomCode.quizmaker:100
    else if (cta >= -pi / 2 && cta <= 0) { //4 q  // > CustomCode.quizmaker:101
      //cta=pi-cta;   // > CustomCode.quizmaker:102
      quandrant = 4;  // > CustomCode.quizmaker:103
      transformationangle = 0;  // > CustomCode.quizmaker:104
      Axtexty = +0.3;  // > CustomCode.quizmaker:105
      Axtextx = Ax / 2;  // > CustomCode.quizmaker:106
      Aytextx = -1;  // > CustomCode.quizmaker:107
      Aytexty = Ay / 1.2;  // > CustomCode.quizmaker:108
      angledisplayx = Math.cos(cta / 3);  // > CustomCode.quizmaker:109
      angledisplayy = Math.sin(cta / 3);  // > CustomCode.quizmaker:110
      //angledisplayxvertical=Math.cos(7*pi/4-cta/2);  // > CustomCode.quizmaker:111
      //angledisplayyvertical=Math.sin(7*pi/4-cta/2);  // > CustomCode.quizmaker:112
      //angledisplayxvertical=Math.cos(3*pi/2+(-cta/2));  // > CustomCode.quizmaker:113
      //angledisplayyvertical=Math.sin(3*pi/2+(-cta/2));  // > CustomCode.quizmaker:114
      angledisplayxvertical = Math.cos((cta / 2 - pi / 4));  // > CustomCode.quizmaker:115
      angledisplayyvertical = Math.sin((cta / 2 - pi / 4));  // > CustomCode.quizmaker:116
      ctadegreeacute = -ctadegree;  // > CustomCode.quizmaker:117
    }  // > CustomCode.quizmaker:118
  }  // > CustomCode.quizmaker:119

  function _setSolverClass(_odeName, _engine) {
    var ode = _getODE(_odeName);
    if (ode===null) return;
    if (!_engine.setODE) {
      var classname = _engine.toLowerCase();
      if      (classname.indexOf("boga")>=0)   _engine = EJSS_ODE_SOLVERS.bogackiShampine23;
      else if (classname.indexOf("cash")>=0)   _engine = EJSS_ODE_SOLVERS.cashKarp45;
      else if (classname.indexOf("dopri5")>=0) _engine = EJSS_ODE_SOLVERS.dopri5;
      else if (classname.indexOf("dopri8")>=0) _engine = EJSS_ODE_SOLVERS.dopri853;
      else if (classname.indexOf("richa")>=0)  _engine = EJSS_ODE_SOLVERS.eulerRichardson;
      else if (classname.indexOf("euler")>=0)  _engine = EJSS_ODE_SOLVERS.euler;
      else if (classname.indexOf("fehlberg87")>=0) _engine = EJSS_ODE_SOLVERS.fehlberg87;
      else if (classname.indexOf("fehlberg8")>=0)  _engine = EJSS_ODE_SOLVERS.fehlberg8;
      else if (classname.indexOf("radau")>=0)   _engine = EJSS_ODE_SOLVERS.radau5;
      else if (classname.indexOf("runge")>=0)  _engine = EJSS_ODE_SOLVERS.rungeKutta4;
      else if (classname.indexOf("rk4")>=0)    _engine = EJSS_ODE_SOLVERS.rungeKutta4;
      else if (classname.indexOf("verlet")>=0) _engine = EJSS_ODE_SOLVERS.velocityVerlet;
    }
    if (_engine) ode.setSolverClass(_engine);
  }
