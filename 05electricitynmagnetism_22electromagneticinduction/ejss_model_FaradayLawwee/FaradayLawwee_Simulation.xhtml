  // gets the magnetic field at x  // > CustomCode.Get Field:1
  function getB(x,t) {  // > CustomCode.Get Field:2
    return  _view.functionField.evaluate({ t : t, x : x });  // > CustomCode.Get Field:3
  }  // > CustomCode.Get Field:4
  // gets flux at time t  // > CustomCode.Get Field:5
  function getFlux(t) {  // > CustomCode.Get Field:6
    var L=ytop-ybottom;  // > CustomCode.Get Field:7
    var ns=99;  // > CustomCode.Get Field:8
    var dx=(x-xleft)/(ns-1);  // > CustomCode.Get Field:9
    var flux=_view.functionField.evaluate({ t : t, x : xleft })+_view.functionField.evaluate({ t : t, x : x }); // end points  // > CustomCode.Get Field:10
    flux+=4*_view.functionField.evaluate({ t : t, x : x }); // last point  // > CustomCode.Get Field:11
    var xi=xleft+dx;  // first point  // > CustomCode.Get Field:12
    for(var i=0, np=(ns-3)/2; i<np; i++){ // simpson's rule  // > CustomCode.Get Field:13
      flux+= 4*_view.functionField.evaluate({ t : t, x : xi });  // > CustomCode.Get Field:14
      xi+=dx;  // > CustomCode.Get Field:15
      flux+= 2*_view.functionField.evaluate({ t : t, x : xi });  // > CustomCode.Get Field:16
      xi+=dx;  // > CustomCode.Get Field:17
    }  // > CustomCode.Get Field:18
    return L*flux*dx/3;  // > CustomCode.Get Field:19
  }  // > CustomCode.Get Field:20
  // gets flux rate of change at time t  // > CustomCode.Get Field:21
  function getFluxRate(t) {  // > CustomCode.Get Field:22
    var dt=1.0E-6;  // > CustomCode.Get Field:23
    return (getFlux(t+dt)-getFlux(t-dt))/(2*dt);  // > CustomCode.Get Field:24
  }  // > CustomCode.Get Field:25

  // This function must draw on the canvas  // > CustomCode.DrawField:1
  // receives the context of the canvas  // > CustomCode.DrawField:2
  // and the underlying element that can be used to process information  // > CustomCode.DrawField:3
  function drawField(context,element) {  // > CustomCode.DrawField:4
    if(!showB) return;  // > CustomCode.DrawField:5
    var cord = _view.drawingPanel.getInnerRect();  // > CustomCode.DrawField:6
    var wi=cord.x+width*xleft/xSpace; // left wire pixel position  // > CustomCode.DrawField:7
    var top=cord.y+height*2/ySpace;   // top wire pixel position  // > CustomCode.DrawField:8
    var bottom=top-1+height*(ySpace-4)/ySpace;  // > CustomCode.DrawField:9
    var xi=xleft;                     // starting position  // > CustomCode.DrawField:10
    var dx=2*xSpace/width;            // linewidth=2 for speed  // > CustomCode.DrawField:11
    var np=width*wireLength/xSpace/2; // number of lines to be drawn   // > CustomCode.DrawField:12
    //context.fillStyle=backgroundColor;  // > CustomCode.DrawField:13
    //context.fillRect(left,top,w,h);  // > CustomCode.DrawField:14
    for(var i=0; i<np; i++){  // > CustomCode.DrawField:15
      context.beginPath();  // > CustomCode.DrawField:16
      context.lineWidth=3;// one pix overlap  // > CustomCode.DrawField:17
      context.strokeStyle=getColor(getB(xi,t));  // > CustomCode.DrawField:18
      context.moveTo(wi,top);  // > CustomCode.DrawField:19
      context.lineTo(wi,bottom);  // > CustomCode.DrawField:20
      context.stroke();  // > CustomCode.DrawField:21
      xi+=dx;  // > CustomCode.DrawField:22
      wi+=2;  // > CustomCode.DrawField:23
    }  // > CustomCode.DrawField:24
  }  // > CustomCode.DrawField:25

  // converts a field value to a color  // > CustomCode.Get Color:1
  function getColor (val) {  // > CustomCode.Get Color:2
    var max=1, min=-1;  // > CustomCode.Get Color:3
    if(val>=max) return 'Red';  // > CustomCode.Get Color:4
    if(val<=min) return 'Blue';  // > CustomCode.Get Color:5
    val=Math.floor(255*val/max);  // > CustomCode.Get Color:6
    var r=255;  // > CustomCode.Get Color:7
    var g=255;  // > CustomCode.Get Color:8
    var b=255;  // > CustomCode.Get Color:9
    if(val>0) {  // > CustomCode.Get Color:10
      b=g=255-val;  // > CustomCode.Get Color:11
    } else if(val<0) {  // > CustomCode.Get Color:12
      g=r=255+val;  // > CustomCode.Get Color:13
    }  // > CustomCode.Get Color:14
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);  // > CustomCode.Get Color:15
    //return "rgb("+r+","+g+","+b+")";  // > CustomCode.Get Color:16
  }  // > CustomCode.Get Color:17

  function _setSolverClass(_odeName, _engine) {
    var ode = _getODE(_odeName);
    if (ode===null) return;
    if (!_engine.setODE) {
      var classname = _engine.toLowerCase();
      if      (classname.indexOf("boga")>=0)   _engine = EJSS_ODE_SOLVERS.bogackiShampine23;
      else if (classname.indexOf("cash")>=0)   _engine = EJSS_ODE_SOLVERS.cashKarp45;
      else if (classname.indexOf("dopri5")>=0) _engine = EJSS_ODE_SOLVERS.dopri5;
      else if (classname.indexOf("dopri8")>=0) _engine = EJSS_ODE_SOLVERS.dopri853;
      else if (classname.indexOf("richa")>=0)  _engine = EJSS_ODE_SOLVERS.eulerRichardson;
      else if (classname.indexOf("euler")>=0)  _engine = EJSS_ODE_SOLVERS.euler;
