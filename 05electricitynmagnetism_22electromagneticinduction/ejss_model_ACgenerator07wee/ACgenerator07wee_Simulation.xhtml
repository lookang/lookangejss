  function getCurrent () {  // > CustomCode.getCurrent:1

    //angleFunction is name of the input field for 5*t for example  // > CustomCode.getCurrent:4
  // var thetaMinus = _view.angleFunction.evaluate(t-dt); //angle at t-dt  // > CustomCode.getCurrent:5
  // var thetaPlus = _view.angleFunction.evaluate(t+dt);  //angle at t+dt  // > CustomCode.getCurrent:6
    var thetaMinus = _view.angleFunction.evaluate({ t : t-dt }); //angle at t-dt  // > CustomCode.getCurrent:7
   var thetaPlus = _view.angleFunction.evaluate({ t : t+dt });  //angle at t+dt  // > CustomCode.getCurrent:8
   return (Math.sin(thetaPlus)-Math.sin(thetaMinus))/dt/2;  // central difference approximation  // > CustomCode.getCurrent:9

  function compute_Omega () {  // > CustomCode.compute_Omega:1
  // need functionfield to work  // > CustomCode.compute_Omega:2

   var thetaPlus1 = _view.angleFunction.evaluate({ t : t+dt });  //angle at t+dt  // > CustomCode.compute_Omega:6
