  //generate bestfitline // > Custom code page: bestFitLine - line 1
  function generateBestFitLine(xValues, yValues) { // > Custom code page: bestFitLine - line 2
      function calculateRSquared(observed, predicted) { // > Custom code page: bestFitLine - line 3
          const mean = observed.reduce((sum, val) => sum + val) / observed.length; // > Custom code page: bestFitLine - line 4
          const ssTot = observed.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0); // > Custom code page: bestFitLine - line 5
          const ssRes = observed.reduce((sum, val, index) => sum + Math.pow(val - predicted[index], 2), 0); // > Custom code page: bestFitLine - line 6
          return 1 - (ssRes / ssTot); // > Custom code page: bestFitLine - line 7
      } // > Custom code page: bestFitLine - line 8
   // > Custom code page: bestFitLine - line 9
      function linearRegression(x, y) { // > Custom code page: bestFitLine - line 10
          const n = x.length; // > Custom code page: bestFitLine - line 11
          const sumX = x.reduce((sum, val) => sum + val, 0); // > Custom code page: bestFitLine - line 12
          const sumY = y.reduce((sum, val) => sum + val, 0); // > Custom code page: bestFitLine - line 13
          const sumXY = x.reduce((sum, val, index) => sum + val * y[index], 0); // > Custom code page: bestFitLine - line 14
          const sumX2 = x.reduce((sum, val) => sum + val * val, 0); // > Custom code page: bestFitLine - line 15
          const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX); // > Custom code page: bestFitLine - line 16
          const intercept = (sumY - slope * sumX) / n; // > Custom code page: bestFitLine - line 17
          const predicted = x.map(val => slope * val + intercept); // > Custom code page: bestFitLine - line 18
          return { rSquared: calculateRSquared(y, predicted), predicted }; // > Custom code page: bestFitLine - line 19
      } // > Custom code page: bestFitLine - line 20
   // > Custom code page: bestFitLine - line 21
      function exponentialRegression(x, y) { // > Custom code page: bestFitLine - line 22
          const logY = y.map(Math.log); // > Custom code page: bestFitLine - line 23
          const { rSquared, predicted } = linearRegression(x, logY); // > Custom code page: bestFitLine - line 24
          const exponentialPredicted = predicted.map(val => Math.exp(val)); // convert back // > Custom code page: bestFitLine - line 25
          return { rSquared, predicted: exponentialPredicted }; // > Custom code page: bestFitLine - line 26
      } // > Custom code page: bestFitLine - line 27
   // > Custom code page: bestFitLine - line 28
      function polynomialRegression(x, y, degree = 2) { // > Custom code page: bestFitLine - line 29
          const n = x.length; // > Custom code page: bestFitLine - line 30
          const X = Array.from({ length: n }, () => Array(degree + 1).fill(0)); // > Custom code page: bestFitLine - line 31
       // > Custom code page: bestFitLine - line 32
          for (let i = 0; i < n; i++) { // > Custom code page: bestFitLine - line 33
              for (let j = 0; j <= degree; j++) { // > Custom code page: bestFitLine - line 34
                  X[i][j] = Math.pow(x[i], j); // > Custom code page: bestFitLine - line 35
              } // > Custom code page: bestFitLine - line 36
          } // > Custom code page: bestFitLine - line 37
       // > Custom code page: bestFitLine - line 38
          const XtX = math.multiply(math.transpose(X), X);  // > Custom code page: bestFitLine - line 39
          const XtY = math.multiply(math.transpose(X), y);  // > Custom code page: bestFitLine - line 40
          const invXtX = math.inv(XtX); // > Custom code page: bestFitLine - line 41
          const coeffs = math.multiply(invXtX, XtY);  // > Custom code page: bestFitLine - line 42
       // > Custom code page: bestFitLine - line 43
          const predicted = x.map(val =>  // > Custom code page: bestFitLine - line 44
              coeffs.reduce((sum, coeff, idx) => sum + coeff * Math.pow(val, idx), 0) // > Custom code page: bestFitLine - line 45
          ); // > Custom code page: bestFitLine - line 46
           // > Custom code page: bestFitLine - line 47
          return { rSquared: calculateRSquared(y, predicted), predicted }; // > Custom code page: bestFitLine - line 48
      } // > Custom code page: bestFitLine - line 49
   // > Custom code page: bestFitLine - line 50
      function powerRegression(x, y) { // > Custom code page: bestFitLine - line 51
          const logX = x.map(Math.log); // > Custom code page: bestFitLine - line 52
          const logY = y.map(Math.log); // > Custom code page: bestFitLine - line 53
          const { rSquared, predicted } = linearRegression(logX, logY); // > Custom code page: bestFitLine - line 54
          const powerPredicted = predicted.map(val => Math.exp(val));  // > Custom code page: bestFitLine - line 55
          return { rSquared, predicted: powerPredicted }; // > Custom code page: bestFitLine - line 56
      } // > Custom code page: bestFitLine - line 57
   // > Custom code page: bestFitLine - line 58
      const linearFit = linearRegression(xValues, yValues); // > Custom code page: bestFitLine - line 59
      const exponentialFit = exponentialRegression(xValues, yValues); // > Custom code page: bestFitLine - line 60
      const polynomialFit = polynomialRegression(xValues, yValues); // > Custom code page: bestFitLine - line 61
      const powerFit = powerRegression(xValues, yValues); // > Custom code page: bestFitLine - line 62
   // > Custom code page: bestFitLine - line 63
      const fits = [ // > Custom code page: bestFitLine - line 64
          { type: 'Linear', rSquared: linearFit.rSquared, predicted: linearFit.predicted }, // > Custom code page: bestFitLine - line 65
          { type: 'Exponential', rSquared: exponentialFit.rSquared, predicted: exponentialFit.predicted }, // > Custom code page: bestFitLine - line 66
          { type: 'Polynomial', rSquared: polynomialFit.rSquared, predicted: polynomialFit.predicted }, // > Custom code page: bestFitLine - line 67
          { type: 'Power', rSquared: powerFit.rSquared, predicted: powerFit.predicted }, // > Custom code page: bestFitLine - line 68
      ]; // > Custom code page: bestFitLine - line 69
   // > Custom code page: bestFitLine - line 70
      const bestFit = fits.reduce((best, current) => (current.rSquared > best.rSquared ? current : best)); // > Custom code page: bestFitLine - line 71
   // > Custom code page: bestFitLine - line 72
      return { // > Custom code page: bestFitLine - line 73
          bestFit: bestFit.type, // > Custom code page: bestFitLine - line 74
          rSquared: bestFit.rSquared, // > Custom code page: bestFitLine - line 75
          predictedY: bestFit.predicted, // > Custom code page: bestFitLine - line 76
          predictedX: xValues,  // > Custom code page: bestFitLine - line 77
      }; // > Custom code page: bestFitLine - line 78
  } // > Custom code page: bestFitLine - line 79
