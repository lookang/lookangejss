<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Reproductive Structures</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main container that adapts to iframe or standalone -->
    <div id="main-container">
        
        <!-- Mode selector buttons - compact to save vertical space -->
        <div id="mode-selector">
            <button class="mode-btn active" data-mode="explore" title="Click on flower parts to learn about them">Explore Mode</button>
            <button class="mode-btn" data-mode="guided" title="Step-by-step guided learning">Guided Learning</button>
            <button class="mode-btn" data-mode="quiz" title="Test your knowledge">Check Understanding</button>
        </div>

        <!-- Main content area -->
        <div id="content-area">
            
            <!-- EXPLORE MODE -->
            <div id="explore-mode" class="mode-content active">
                <div class="two-column-layout">
                    <!-- Left: Flower diagram with clickable hotspots -->
                    <div class="diagram-container">
                        <!-- Scientifically accurate flower image with embedded labels -->
                        <img id="flower-diagram" src="flower.png" alt="Flower Reproductive Structures" class="flower-image">
                        
                        <div class="instruction-hint">Select a part from the list on the right to learn more</div>
                    </div>
                    
                    <!-- Right: Information panel -->
                    <div class="info-panel">
                        <div id="info-display">
                            <div class="welcome-message">
                                <h2>Welcome! 🌸</h2>
                                <p>Click on any part of the flower to learn about its reproductive structures.</p>
                                <div class="legend">
                                    <div class="legend-item">
                                        <span class="legend-color male"></span>
                                        <span>Male parts</span>
                                    </div>
                                    <div class="legend-item">
                                        <span class="legend-color female"></span>
                                        <span>Female parts</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- GUIDED LEARNING MODE -->
            <div id="guided-mode" class="mode-content">
                <div class="two-column-layout">
                    <div class="diagram-container">
                        <!-- Scientifically accurate flower image with embedded labels -->
                        <img id="guided-diagram" src="flower.png" alt="Flower Reproductive Structures" class="flower-image">
                    </div>
                    
                    <div class="info-panel">
                        <div id="guided-content">
                            <div class="guided-text"></div>
                            <div class="guided-controls">
                                <button id="prev-step" class="nav-btn" disabled>← Previous</button>
                                <span id="step-indicator">Step 1 of 7</span>
                                <button id="next-step" class="nav-btn">Next →</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- QUIZ MODE -->
            <div id="quiz-mode" class="mode-content">
                <div class="quiz-container">
                    <!-- Question display -->
                    <div id="question-area">
                        <div class="question-header">
                            <span id="question-number">Question 1 of 6</span>
                        </div>
                        <div id="question-text" class="question-text"></div>
                        <div id="answer-area"></div>
                        <div id="feedback-area"></div>
                        <button id="next-question" class="nav-btn" style="display:none;">Next Question</button>
                    </div>
                    
                    <!-- Results summary -->
                    <div id="results-area" style="display:none;">
                        <h2>Well Done! 🌟</h2>
                        <div id="score-display"></div>
                        <button id="retry-quiz" class="nav-btn">Try Again</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Tooltip for displaying additional information on hover -->
        <div id="tooltip" class="tooltip"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
