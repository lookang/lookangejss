  function changeV (init) {  // > CustomCode.changeV:1
    // change Volume  // > CustomCode.changeV:2
    var angle;  // > CustomCode.changeV:3
    for(var i=0;i<n;i++) {  // > CustomCode.changeV:4
      angle=Math.random()*Math.PI*2.0;  // > CustomCode.changeV:5
      vx[i]=v0*Math.cos(angle);  // > CustomCode.changeV:6
      vy[i]=v0*Math.sin(angle);  // > CustomCode.changeV:7
    }  // > CustomCode.changeV:8
      // > CustomCode.changeV:9
    if(init) {  // > CustomCode.changeV:10
      // if init is true  // > CustomCode.changeV:11
      vBar=0.0; // set vBar =0  // > CustomCode.changeV:12
      yeq=n*R*T/pBar*(xmax-xmin)/width; // yeq = y equilibrium used to control the vBar  // > CustomCode.changeV:13
    }  // > CustomCode.changeV:14
  }  // > CustomCode.changeV:15

  function changeM() {  // > CustomCode.changeM:1
    mRatio=1000.0*pBar;  // > CustomCode.changeM:2
    // pPa = pBar*13600*g*0.76;  // > CustomCode.changeM:3
    barHeight=mRatio/80.0;  // > CustomCode.changeM:4
    vBar=0.0;  // > CustomCode.changeM:5
    yeq=n*R*T/pBar*(xmax-xmin)/width;  // > CustomCode.changeM:6
  }  // > CustomCode.changeM:7

  function collide (collision, collision2) {  // > CustomCode.collision:1
    var dx = x[collision2]-x[collision];  // > CustomCode.collision:2
    var dy = y[collision2]-y[collision];  // > CustomCode.collision:3
    var distance = Math.sqrt(dx*dx+dy*dy);  // > CustomCode.collision:4
    // Unit vector in the direction of the collision  // > CustomCode.collision:5
    var ax=dx/distance;  // > CustomCode.collision:6
    var ay=dy/distance;  // > CustomCode.collision:7
    // Projection of the velocities in these axes  // > CustomCode.collision:8
    var va1=(vx[collision]*ax+vy[collision]*ay);  // > CustomCode.collision:9
    var vb1=(-vx[collision]*ay+vy[collision]*ax);  // > CustomCode.collision:10
      // > CustomCode.collision:11
    var va2=(vx[collision2]*ax+vy[collision2]*ay);   // > CustomCode.collision:12
    var vb2=(-vx[collision2]*ay+vy[collision2]*ax);  // > CustomCode.collision:13
      // > CustomCode.collision:14
    // New velocities in these axes  // > CustomCode.collision:15
    var vaP1=va1 + (1+ed)*(va2-va1)/(1+mass[collision]/mass[collision2]);  // > CustomCode.collision:16
    var vaP2=va2 + (1+ed)*(va1-va2)/(1+mass[collision2]/mass[collision]);  // > CustomCode.collision:17
      // > CustomCode.collision:18
    // Undo the projections  // > CustomCode.collision:19
    vx[collision]=vaP1*ax-vb1*ay;    // > CustomCode.collision:20
    vy[collision]=vaP1*ay+vb1*ax;  // > CustomCode.collision:21
      // > CustomCode.collision:22
    vx[collision2]=vaP2*ax-vb2*ay;    // > CustomCode.collision:23
    vy[collision2]=vaP2*ay+vb2*ax;  // > CustomCode.collision:24
  }  // > CustomCode.collision:25

  _model.addToFixedRelations(function() {
    if (!__pagesEnabled["Cons Page"]) return;
    //constant introduced to make it more like PV = NkT numerically  // > FixedRelations.Cons Page:1
    // example  // > FixedRelations.Cons Page:2
    //1.01*e5*1.09*e-21 = 400*1.38*e-23*200  // > FixedRelations.Cons Page:3
    // define k3m as 3*amu/kboltzman  // > FixedRelations.Cons Page:4
    //factor = 7697.456493  // > FixedRelations.Cons Page:5
    k3m = factor*3*amu/kboltzman;  // > FixedRelations.Cons Page:6
    //http://hyperphysics.phy-astr.gsu.edu/Hbase/kinetic/eqpar.html#c2  // > FixedRelations.Cons Page:7
    v0realrms = 526.4511433781818/100*v0; // to reconcile the values for real life vs the model  // > FixedRelations.Cons Page:8
    // codes to make HardDiskGas by wolfgang work here  // > FixedRelations.Cons Page:9
    //cellSize = xmax-xmin;  // > FixedRelations.Cons Page:10
    //cellSizex = cellSize;  // > FixedRelations.Cons Page:11
    //cellSizey = ymax-ymin;  // > FixedRelations.Cons Page:12
    if(cstv&&selected[0]!="isobaric, pressure constant") {  // > FixedRelations.Cons Page:13
      volume = V/(0.00138)*0.00123*2; // make slider V control oldVolume  // > FixedRelations.Cons Page:14
      yBar=volume/width*(xmax-xmin); // move the yBar  // > FixedRelations.Cons Page:15
      // k=pBar*volume/(n*T)*barF;  // > FixedRelations.Cons Page:16
      pBar=n*k*T/(volume);//*barF);  // > FixedRelations.Cons Page:17
      pPa = pBar*13600*(-g)*0.76; // to fix the problem of constant volume  // > FixedRelations.Cons Page:18
      // pPa = pBar*0.760*g*13600; // added by wee to define pressure in Pa  // > FixedRelations.Cons Page:19
    } else {  // > FixedRelations.Cons Page:20
      V = volume*(0.00138)/0.00123/2; // // make slider oldVolume control V  // > FixedRelations.Cons Page:21
      volume=yBar*width/(xmax-xmin); // formula to calculate volume  // > FixedRelations.Cons Page:22
      // P.V = N.k.T the n=N,  // > FixedRelations.Cons Page:23
      k=pBar*volume/(n*T); // k = 0.00126 at equilibrium  // > FixedRelations.Cons Page:24
    }  // > FixedRelations.Cons Page:25
    barF=0.0;  // > FixedRelations.Cons Page:26
    for(var i=0;i<n;i++) {  // > FixedRelations.Cons Page:27
      if(x[i]<minx) {  // > FixedRelations.Cons Page:28
        // if x[i] is outside left,  // > FixedRelations.Cons Page:29
        x[i]=2*minx-x[i]; // clever way to move the x[i] back,  // > FixedRelations.Cons Page:30
        vx[i]=-ep*vx[i]; // e added by wee to add Additional option in applet to change elastic to inelastic (i.e. coefficient of restitution)  // > FixedRelations.Cons Page:31
      } else if(x[i]>maxx) {  // > FixedRelations.Cons Page:32
        // x[i] is outside right  // > FixedRelations.Cons Page:33
        x[i]=2*maxx-x[i];  // > FixedRelations.Cons Page:34
        vx[i]=-ep*vx[i];  // > FixedRelations.Cons Page:35
      }  // > FixedRelations.Cons Page:36
      dvy=0.0;  // > FixedRelations.Cons Page:37
      if(y[i]<ymin) {  // > FixedRelations.Cons Page:38
        // if y[i] is outside bottom  // > FixedRelations.Cons Page:39
        y[i]=2*ymin-y[i];  // > FixedRelations.Cons Page:40
        vy[i]=-ep*vy[i];  // > FixedRelations.Cons Page:41
      } else if(y[i]>yBar) {  // > FixedRelations.Cons Page:42
        // if y[i] is higher than the ybar  // > FixedRelations.Cons Page:43
        y[i]=2*yBar-y[i];  // > FixedRelations.Cons Page:44
        dvy+=vy[i]; // dvy rate of change of vy added cumulatively  // > FixedRelations.Cons Page:45
        vy[i]=-ep*vy[i];  // > FixedRelations.Cons Page:46
      }  // > FixedRelations.Cons Page:47
      barF+=2.0*dvy/mRatio;// conservation of momentum  // > FixedRelations.Cons Page:48

    if(yBar>ymax*scale*0.9)  // > FixedRelations.Cons Page:50
