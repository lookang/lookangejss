<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elements and Periodic Table Explorer</title>
    <link rel="stylesheet" href="styles.css">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S9EWRY1CPJ');
  </script>
</head>
<body>
    <!-- Main Container -->
    <div class="main-container">
        
        <!-- Top Panel: Element Cards Display (laid out horizontally) -->
        <div class="top-panel">
            <div class="panel-header">
                <!-- Tooltip with description for info icon -->
                <span class="info-icon" title="Given the following information of the newly discovered substances, how will you classify them. Give a name to the category you've assigned too.">ℹ️</span>
                <!-- Title centered using flex layout -->
                <span class="panel-header-title">How will you classify the following?</span>
                <span class="info-icon-spacer"></span>
            </div>
            <!-- Level selector: gradually reveals more data properties -->
            <div class="level-selector">
                <span class="level-selector-label">Level:</span>
                <button class="level-btn active" data-level="1">
                    <span class="level-num">1</span>
                    <span class="level-desc">State · Color</span>
                </button>
                <button class="level-btn" data-level="2">
                    <span class="level-num">2</span>
                    <span class="level-desc">+ Protons · Mass</span>
                </button>
                <button class="level-btn" data-level="3">
                    <span class="level-num">3</span>
                    <span class="level-desc">+ Shells · Outer e⁻</span>
                </button>
                <button class="level-btn" data-level="4">
                    <span class="level-num">4</span>
                    <span class="level-desc">+ Melt · Boil</span>
                </button>
            </div>
            <div id="elementCards" class="element-cards-container"></div>
        </div>

        <!-- Bottom Section: Classification Workspace (full width) -->
        <div class="bottom-section">
            <!-- Center Panel: Classification Workspace -->
            <div class="center-panel">
                <div class="workspace-header">
                    <span>Classification Workspace</span>
                    <div class="workspace-controls">
                        <!-- MODIFIED: Changed Download Excel to Download Picture -->
                        <button id="downloadPictureBtn" class="control-btn">📷 Download Picture</button>
                        <button id="sampleAnswerBtn" class="control-btn">💡 Sample Answer</button>
                        <button id="resetBtn" class="control-btn">↻ Reset</button>
                    </div>
                </div>
                
                <!-- MODIFIED: Changed to freeform canvas workspace for drag and drop arrangement -->
                <!-- MODIFIED: Added scrollable container for expanded workspace -->
                <div id="freeformWorkspace" class="freeform-workspace">
                    <!-- Cards will be freely positioned here -->
                    <div class="workspace-instructions">Drag and drop element cards here to arrange them freely</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for expanded element view -->
    <div id="elementModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="modalElementDetails"></div>
        </div>
    </div>

    <!-- Sample Answer Modal -->
    <div id="sampleAnswerModal" class="modal">
        <div class="modal-content sa-modal-content">
            <span class="modal-close" id="sampleAnswerClose">&times;</span>
            <div id="sampleAnswerDetails"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
