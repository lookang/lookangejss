  function findRoot (Tol,Band) {  // > CustomCode.findRoot:1
    // Tol passes the tolerance values for bisection (TolBEP or TolEAPEPT)  // > CustomCode.findRoot:2
    // Band is a flag (=0 before the equi. point; =1 at,and after the equi. point  // > CustomCode.findRoot:3
    //  double fx1;  // value of the function, BEP or EPAEP, at X1  // > CustomCode.findRoot:4
    //  double fx2;  // value of the function, BEP or EPAEP, at X2  // > CustomCode.findRoot:5
    //  double xm;   // middle point of the bisection interval  // > CustomCode.findRoot:6
    //  double fxm;  // value of the function, BEP or EPAEP, at xm  // > CustomCode.findRoot:7
    if (Band === 0) {  // > CustomCode.findRoot:8
       fx1 = BEP(X1);  // > CustomCode.findRoot:9
       fx2 = BEP(X2);  // > CustomCode.findRoot:10
    }  // > CustomCode.findRoot:11
    else {  // > CustomCode.findRoot:12
      fx1 = EPAEP(X1);  // > CustomCode.findRoot:13
      fx2 = EPAEP(X2);  // > CustomCode.findRoot:14
    }  // > CustomCode.findRoot:15
    while (Math.abs(X1-X2)> Tol) {  // > CustomCode.findRoot:16
      xm = (X1+X2)/2;  // > CustomCode.findRoot:17
      if (Band === 0) {  // > CustomCode.findRoot:18
        fx1=BEP(X1);  // > CustomCode.findRoot:19
        fxm=BEP(xm);  // > CustomCode.findRoot:20
      }  // > CustomCode.findRoot:21
      else {  // > CustomCode.findRoot:22
        fx1 =EPAEP(X1);  // > CustomCode.findRoot:23
        fxm =EPAEP(xm);  // > CustomCode.findRoot:24
      }  // > CustomCode.findRoot:25
      if ( (fxm*fx1) > 0)  // > CustomCode.findRoot:26
      X1=xm;  // > CustomCode.findRoot:27
      else  // > CustomCode.findRoot:28
      X2=xm;  // > CustomCode.findRoot:29
    }  // > CustomCode.findRoot:30
    return -Math.log((X1+X2)/2)*0.43422;   // > CustomCode.findRoot:31
  }  // > CustomCode.findRoot:32

  function BEP (X) {  // > CustomCode.funcBEP:1

      .setProperty("Html","<h1>Titrations</h1> <p> <i>The Titrations Model is a JavaScript simulation that complements experimental work. A typical student's training in a chemistry laboratory is the titration of an acidic solution by a padronized base in order to determine the acid concentration in the sample. If the titration is followed by a visual method, a suitable indicator has to be previously chosen to detect the end point of the titration (the so-called equivalence point) by the sudden change of the indicator color. This is a common practice (alternative to using a pH meter) and does not imply the errors that may be thought on the subjective aspect of a color change, providing that the right indicator is chosen. This application is restricted to monoprotic acids and monofunctional strong bases.</i> </p> <p>Take a flask with a known volume (VA) of an aqueous solution of a monoprotic acid whose concentration is unknown. In a buret there is a padronized (well-known molar concentration) aqueous solution of a monofunctional strong base (sodium hydroxide, for example). Add to the flask a few drops of a suitable visual indicator and start pouring, slowly, the base over the acid. </p> <figure> <img src=\"./Titrations/buret.png\" class=\"centered\" /> <figcaption> (source: &quot;<a href=\"http://www.mpcfaculty.net/mark_bishop/titration.htm\">Mark Bishop's Chemistry site</a>&quot;)</figcaption> </figure> <p> The titration end point (equivalence point) is detected by a sudden change of the indicator color. Then, the buret scale indicates the volume of the base (VB) used in the neutralization reaction, and as its molar concentration, [Base], is well-known the corresponding number of moles is NB=VB*[Base]/1000. This number is equal to the number of acid moles, NA=NB, that have reacted and as the sample volume is VA, the acid molar concentration is worked out: [Acid] = NA*1000/VA. Therefore, the titration coordinate (f=NB/NA) is equal to 1 at the equivalence point. </p> <p>The indicator is chosen accordingly to its effectiveness color range, that is, the equivalence point pH should be approximately at the middle of that range. </p> <figure> <img src=\"./Titrations/pH_RangeForColorChange.gif\" class=\"centered\" /> <figcaption> (source: <a href=\"http://www.dlt.ncssm.edu/tiger/chem6.htm\">NCSSM</a>)</figcaption> </figure> <p> The simulations determine the pH at the equivalence point and choose the proper indicator from a table included in the program. The acid is characterized by the ionization constant (Ka); the default value is for acetic acid. As the base is assumed strong (fully ionized) its constant (Kb) is not a program input. The pH at equivalence point depends on Ka, [Base] and also on [Acid]. But the acid concentration is precisely what we want to know! Of course, the indicator choice requires a previous trial and error study to screen possible concentration bands of the acidic sample and assess whether or not the same indicator is appropriate for each band. To this end, different simulations should be done by changing the [Acid] and [Base] fields for a given acid. The program can probe wide ranges of Ka, from 10<sup>- 10</sup> (very weak acids like hydrocyanic acid and phenol) to 10<sup>9</sup> (very strong acids like hydrochloric and sulphuric acids), and of [Acid] and [Base]. </p>") // EJsS HtmlView.HtmlView Page: setting property 'Html' for element 'NarrativePanel'
