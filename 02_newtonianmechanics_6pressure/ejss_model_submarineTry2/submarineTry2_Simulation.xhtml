  function calculateSubmergedVolume(L, r, Depth) {  // > CustomCode.submergedV:5
      // Check if the cylinder is not submerged  // > CustomCode.submergedV:6

    function __pushState() {
      // Copy our variables to __state[] 
        var __j=0;
        var __n=0;

        if (__state[__cIn]!=y) __mustReinitialize = true;
        __state[__cIn++] = y;
        if (__state[__cIn]!=vy) __mustReinitialize = true;
        __state[__cIn++] = vy;

        __state[__cIn++] = angleValveWater;
        if (__state[__cIn]!=t) __mustReinitialize = true;
        __state[__cIn++] = t;

      return false;
    }

      return __eventSolver;
