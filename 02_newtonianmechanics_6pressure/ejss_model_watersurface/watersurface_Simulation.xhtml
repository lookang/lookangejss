  function gridinit () {  // > CustomCode.gridinit:2

  gdy=(ymax-ymin)/(ng-2);  // > CustomCode.gridinit:4

   //GX[i]=GX[i+1]=xmin-gdx+(i/2)*gdx;  // > CustomCode.gridinit:9

   GY[ng2+i]=GY[ng2+i+1]=ymin-gdy+(i/2)*gdy;  // > CustomCode.gridinit:12
