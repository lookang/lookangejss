  function _getEngineSolverClass(classname) {
    classname = classname.toLowerCase();
    if (classname.indexOf('rungekuttafehlberg')>=0) return EJSS_ODE_SOLVERS.cashKarp45;
    if (classname.indexOf('cash')>=0)   return EJSS_ODE_SOLVERS.cashKarp45;
    if (classname.indexOf('boga')>=0)   return EJSS_ODE_SOLVERS.bogackiShampine23;
    if (classname.indexOf('dopri5')>=0) return EJSS_ODE_SOLVERS.doPri5;
    if (classname.indexOf('dopri8')>=0) return EJSS_ODE_SOLVERS.doPri853;
    if (classname.indexOf('richa')>=0)  return EJSS_ODE_SOLVERS.eulerRichardson;
    if (classname.indexOf('euler')>=0)  return EJSS_ODE_SOLVERS.euler;
    if (classname.indexOf('fehlberg78')>=0) return EJSS_ODE_SOLVERS.fehlberg78;
    if (classname.indexOf('fehlberg8')>=0)  return EJSS_ODE_SOLVERS.fehlberg8;
    //if (classname.indexOf('radau')>=0)  return EJSS_ODE_SOLVERS.radau5;
    if (classname.indexOf('runge')>=0)  return EJSS_ODE_SOLVERS.rungeKutta4;
    if (classname.indexOf('verlet')>=0) return EJSS_ODE_SOLVERS.velocityVerlet;
    return EJSS_ODE_SOLVERS.rungeKutta4;
  }

  function _setSolverClass(_odeName, _engine) {

    if (_engine) ode.setSolverClass(_engine);
  }

  function _ODE_evolution1() {
    var __odeSelf = {};
    var __eventSolver;
    var __solverClass = _getEngineSolverClass('RungeKutta');
    var __state=[];
    var _ODE_evolution1_Event1;
    var _ODE_evolution1_Event2;
    var _ODE_evolution1_Event3;
    var _ODE_evolution1_Event4;
    var __ignoreErrors=false;
    var __mustInitialize=true;
    var __isEnabled=true;
    var __mustUserReinitialize=false;
    var __mustReinitialize=true;


    __odeSelf._getOdeVars = function (){ return ['ya','vya','yw','t']; }

    __odeSelf.setSolverClass = function(__aSolverClass) {
      __solverClass = __aSolverClass;
      __instantiateSolver();
    }

    function __instantiateSolver() {
      __state=[];
      __pushState();
      __eventSolver = EJSS_ODE_SOLVERS.interpolatorEventSolver(__solverClass(),__odeSelf);
      __mustInitialize = true;
    }

    __odeSelf.setEnabled = function(_enabled) { __isEnabled = _enabled; }

    __odeSelf.getIndependentVariableValue = function() { return __eventSolver.getIndependentVariableValue(); }

    __odeSelf.getInternalStepSize = function() { return __eventSolver.getInternalStepSize(); }

    __odeSelf.isAccelerationIndependentOfVelocity = function() { return false; }

    __odeSelf.initializeSolver = function() {
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); return; }
      __pushState();
      __eventSolver.initialize(dt);
      __eventSolver.setBestInterpolation(false);
      __eventSolver.setMaximumInternalSteps(10000);
      __eventSolver.removeAllEvents();
      if (__pagesEnabled['alsojustentersolution']) __eventSolver.addEvent(_ODE_evolution1_Event1());
      if (__pagesEnabled['floatingend']) __eventSolver.addEvent(_ODE_evolution1_Event2());
      if (__pagesEnabled['justcompletelyimmersed']) __eventSolver.addEvent(_ODE_evolution1_Event3());
      if (__pagesEnabled['sittingonimmersedscale']) __eventSolver.addEvent(_ODE_evolution1_Event4());
      for (k in _userEvents1) {__eventSolver.addEvent(_userEvents1[k]);}
      __eventSolver.setEstimateFirstStep(false);
      __eventSolver.setEnableExceptions(false);
      __eventSolver.setTolerances(0.00001,0.00001);
      __mustReinitialize = true;
      __mustInitialize = false;
    }

    function __pushState() {
      // Copy our variables to __state[]
      var __j=0;
      var __n=0;
      var __cIn=0;
      if (__state[__cIn]!=ya) __mustReinitialize = true;
      __state[__cIn++] = ya;
      if (__state[__cIn]!=vya) __mustReinitialize = true;
      __state[__cIn++] = vya;
      if (__state[__cIn]!=yw) __mustReinitialize = true;
      __state[__cIn++] = yw;
      if (__state[__cIn]!=t) __mustReinitialize = true;
      __state[__cIn++] = t;
    }

    function __arraysChanged () {
      return false;
    }

    __odeSelf.getEventSolver = function() {
      return __eventSolver;
    }

    __odeSelf.resetSolver = function() {
      __mustUserReinitialize = true;
    }

    __odeSelf.automaticResetSolver = function() {
      __mustReinitialize = true;
    }

    function __errorAction () {
      if (__ignoreErrors) return;
      console.log (__eventSolver.getErrorMessage());
      if (window.confirm('Numerical solver error. Continue the simulation?')) __ignoreErrors = true;
      else _pause();
      // Make sure the solver is reinitialized;
      __mustReinitialize = true;
    }

    __odeSelf.step = function() { return __privateStep(false); }

    __odeSelf.solverStep = function() { return __privateStep(true); }

    function __privateStep(__takeMaximumStep) {
      if (!__isEnabled) return 0;
      if (dt===0) return 0;
      if (__mustInitialize) __odeSelf.initializeSolver();
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); }
      __eventSolver.setStepSize(dt);
      __eventSolver.setInternalStepSize(dt);
      __eventSolver.setMaximumInternalSteps(10000);
      __eventSolver.setTolerances(0.00001,0.00001);
      __pushState();
      if (__mustUserReinitialize) {
        __eventSolver.userReinitialize();
        __mustUserReinitialize = false;
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      else if (__mustReinitialize) {
        __eventSolver.reinitialize();
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      var __stepTaken = __takeMaximumStep ? __eventSolver.maxStep() : __eventSolver.step();
      // Extract our variables from __state
      var __i=0;
      var __cOut=0;
      ya = __state[__cOut++];
      vya = __state[__cOut++];

      .setProperty("Html","<iframe width=\"560\" height=\"315\" src=\"https://www.youtube.com/embed/V5eAuGWN7-I?si=U-7_HqtPDr1PAyJT\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen></iframe> <style>   .archimedes-wrap {     max-width: 1100px;     margin: 24px auto;     font-family: \"Segoe UI\", Arial, sans-serif;     color: #163047;     line-height: 1.6;   }    .archimedes-hero {     background: linear-gradient(135deg, #e7f7ff 0%, #fff8e8 100%);     border: 1px solid #cfe3ef;     border-radius: 18px;     padding: 24px;     box-shadow: 0 10px 24px rgba(20, 50, 80, 0.08);   }    .archimedes-tag {     display: inline-block;     background: #fff1b8;     border: 1px solid #efd67b;     border-radius: 999px;     padding: 6px 12px;     font-size: 0.95rem;     margin-bottom: 12px;   }    .archimedes-wrap h1,   .archimedes-wrap h2,   .archimedes-wrap h3 {     margin-top: 0;     color: #0d4d73;   }    .archimedes-wrap h1 {     font-size: 2rem;     margin-bottom: 10px;   }    .archimedes-wrap h2 {     font-size: 1.35rem;     margin-bottom: 10px;   }    .archimedes-wrap h3 {     font-size: 1.05rem;     margin-bottom: 8px;   }    .archimedes-wrap p {     margin: 0 0 12px;   }    .archimedes-highlight {     background: #f5fbff;     border-left: 5px solid #1790b5;     padding: 14px 16px;     border-radius: 12px;     margin-top: 16px;   }    .archimedes-grid {     display: grid;     grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));     gap: 16px;     margin-top: 18px;   }    .archimedes-card {     background: #ffffff;     border: 1px solid #d7e6ef;     border-radius: 16px;     padding: 18px;     box-shadow: 0 6px 16px rgba(20, 50, 80, 0.05);   }    .archimedes-card ul {     margin: 10px 0 0;     padding-left: 20px;   }    .archimedes-card li {     margin-bottom: 8px;   }    .archimedes-challenge {     background: #fffef6;     border: 1px solid #ecd98d;     border-radius: 16px;     padding: 18px;     margin-top: 18px;   }    .archimedes-note {     margin-top: 18px;     font-size: 0.97rem;     color: #456075;   } </style>  <div class=\"archimedes-wrap\">   <section class=\"archimedes-hero\">     <div class=\"archimedes-tag\">Physics • Density • Upthrust • Archimedes Principle</div>     <h1>Archimedes Principle: Weight of Cube and Weight of Solution Collected</h1>     <p>       This interactive helps students understand how <strong>density</strong>,       <strong>upthrust</strong>, and <strong>apparent weight</strong> are connected.       By changing the density of the solution, the mass of the cube, and the volume of the cube,       learners can observe whether the cube <strong>floats</strong>, <strong>sinks</strong>,       or stays in <strong>neutral buoyancy</strong>.     </p>     <div class=\"archimedes-highlight\">       <strong>Key idea:</strong> The upthrust acting on the cube is equal to the       <strong>weight of the displaced solution</strong>. This is why the collected solution       and the force balance can be compared directly.     </div>   </section>    <div class=\"archimedes-grid\">     <section class=\"archimedes-card\">       <h2>Learning Goals</h2>       <ul>         <li>Explain why an object floats, sinks, or remains suspended.</li>         <li>Relate <strong>density</strong> to the behaviour of the cube in the solution.</li>         <li>Describe <strong>upthrust</strong> as the weight of displaced liquid.</li>         <li>Interpret the meaning of the spring scale and lower scale readings.</li>         <li>Use evidence from the simulation to explain Archimedes principle.</li>       </ul>     </section>      <section class=\"archimedes-card\">       <h2>How To Use</h2>       <ul>         <li>Adjust <strong>&rho;<sub>solution</sub></strong> to change the density of the liquid.</li>         <li>Adjust <strong>V cube</strong> to change the cube volume.</li>         <li>Adjust <strong>M cube</strong> to change the cube mass.</li>         <li>Turn on <strong>show weight</strong> and <strong>show upthrust</strong> to see the force arrows.</li>         <li>Use <strong>Teacher: On</strong> for guided explanations during the motion.</li>         <li>Use <strong>Eq: On</strong> to compare cube density, upthrust, collected liquid, and apparent weight.</li>         <li>Press <strong>Play</strong> to observe what happens, then <strong>Reset</strong> to try another case.</li>       </ul>     </section>      <section class=\"archimedes-card\">       <h2>What To Notice</h2>       <ul>         <li>Is the solution density greater than, equal to, or less than the cube density?</li>         <li>Does the cube float higher, sink deeper, or stay suspended?</li>         <li>How does the spring scale reading change as the cube enters the liquid?</li>         <li>How does the collected solution compare with the upthrust shown?</li>         <li>What happens to the apparent weight of the cube?</li>       </ul>     </section>   </div>    <section class=\"archimedes-card\" style=\"margin-top:18px;\">     <h2>Activities To Try</h2>      <h3>1. Floating Case</h3>     <ul>       <li>Set <strong>&rho;<sub>solution</sub> = 1.0 g/cm<sup>3</sup></strong>, <strong>M = 800 g</strong>, and <strong>V = 1000 cm<sup>3</sup></strong>.</li>       <li>Predict what will happen before pressing <strong>Play</strong>.</li>       <li>Explain why the cube floats when the solution is denser than the cube.</li>     </ul>      <h3>2. Sinking Case</h3>     <ul>       <li>Change the solution density to <strong>0.6 g/cm<sup>3</sup></strong>.</li>       <li>Observe how the cube sinks deeper and may rest on the lower scale.</li>       <li>Compare the spring scale reading before and after the cube enters the liquid.</li>     </ul>      <h3>3. Neutral Buoyancy</h3>     <ul>       <li>Set <strong>&rho;<sub>solution</sub> = 1.0 g/cm<sup>3</sup></strong>.</li>       <li>Adjust the cube so that <strong>cube density = 1.0 g/cm<sup>3</sup></strong>, for example <strong>M = 1000 g</strong> and <strong>V = 1000 cm<sup>3</sup></strong>.</li>       <li>Observe how the cube remains suspended in the liquid.</li>       <li>Use this case to explain the meaning of <strong>upthrust = weight</strong>.</li>     </ul>      <h3>4. Very Dense Solution</h3>     <ul>       <li>Increase the solution density to <strong>2.0 g/cm<sup>3</sup></strong>.</li>       <li>Observe how quickly the upthrust becomes large.</li>       <li>Compare this with the floating case at <strong>1.0 g/cm<sup>3</sup></strong>.</li>     </ul>      <h3>5. Use Teacher and Equation Mode Together</h3>     <ul>       <li>Turn on <strong>Teacher: On</strong> and <strong>Eq: On</strong>.</li>       <li>Pause at each important stage and read the explanation aloud.</li>       <li>Use the displayed values as evidence for your physics explanation.</li>     </ul>   </section>    <section class=\"archimedes-challenge\">     <h2>Challenge Questions</h2>     <ul>       <li>Why does a cube with the same mass behave differently in different liquids?</li>       <li>How can a cube lose apparent weight without changing its actual weight?</li>       <li>What evidence from the simulation supports the statement: <strong>upthrust equals the weight of displaced liquid</strong>?</li>       <li>What must be true about densities for neutral buoyancy to occur?</li>       <li>If the cube volume increases while mass stays the same, what happens to cube density and why?</li>     </ul>   </section>    <section class=\"archimedes-card\" style=\"margin-top:18px;\">     <h2>Teacher Suggestions</h2>     <ul>       <li>Ask students to <strong>predict first</strong>, then test their idea with the simulation.</li>       <li>Encourage students to use the words <strong>density</strong>, <strong>upthrust</strong>, <strong>apparent weight</strong>, and <strong>displaced liquid</strong> in full sentences.</li>       <li>Use the <strong>0.6</strong>, <strong>1.0</strong>, and <strong>2.0</strong> cases as a structured comparison task.</li>       <li>Ask students to explain both the <strong>visual motion</strong> and the <strong>numerical readings</strong>.</li>       <li>Use the equal-density case to discuss why neutral buoyancy is different from floating on the surface.</li>     </ul>   </section>    <p class=\"archimedes-note\">     A strong explanation should not only describe what the cube does, but also explain     <strong>why</strong> it happens using density, force balance, and displaced liquid.   </p> </div>")
