<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>3D Shapes in WebGL</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
    }
    #controls button {
      padding: 10px;
      margin-right: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <!-- Controls -->
  <div id="controls">
    <button id="playPauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
  </div>

  <!-- Include Three.js and OrbitControls from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.124.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.124.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // Set up the scene, camera, and renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      45, window.innerWidth / window.innerHeight, 1, 1000
    );
    camera.position.set(0, 2, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Add lighting
    const ambientLight = new THREE.AmbientLight(0xcccccc);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
    directionalLight.position.set(0, 1, 1).normalize();
    scene.add(directionalLight);

    // Add OrbitControls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; // Enable smooth camera motion
    controls.dampingFactor = 0.05;

    // Define the CubeNet class
    class CubeNet {
      constructor() {
        this.group = new THREE.Group();
        scene.add(this.group);

        this.faces = [];
        this.createNet();
      }

      createNet() {
        // Different colors for each face
        const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff];
        const materials = colors.map(color => new THREE.MeshLambertMaterial({ color: color, side: THREE.DoubleSide }));

        // Size of the cube
        const size = 1;
        const halfSize = size / 2;

        // Geometry for cube faces
        const geometry = new THREE.PlaneGeometry(size, size);

        let materialIndex = 0;

        // Center face (does not rotate)
        this.createFace(
          new THREE.Vector3(0, 0, 0), // facePosition
          new THREE.Vector3(0, 0, 0), // pivotPosition
          new THREE.Vector3(0, 0, 0), // rotationAxis
          geometry,
          materials[materialIndex++ % materials.length]
        );

        // Left face
        this.createFace(
          new THREE.Vector3(-size, 0, 0),       // facePosition
          new THREE.Vector3(-halfSize, 0, 0),   // pivotPosition
          new THREE.Vector3(0, 1, 0),           // rotationAxis (Y-axis)
          geometry,
          materials[materialIndex++ % materials.length],
          -Math.PI / 2                          // targetRotation
        );

        // Right face
        this.createFace(
          new THREE.Vector3(size, 0, 0),
          new THREE.Vector3(halfSize, 0, 0),
          new THREE.Vector3(0, 1, 0),
          geometry,
          materials[materialIndex++ % materials.length],
          Math.PI / 2
        );

        // Top face
        this.createFace(
          new THREE.Vector3(0, size, 0),
          new THREE.Vector3(0, halfSize, 0),
          new THREE.Vector3(1, 0, 0),          // rotationAxis (X-axis)
          geometry,
          materials[materialIndex++ % materials.length],
          -Math.PI / 2
        );

        // Bottom face
        this.createFace(
          new THREE.Vector3(0, -size, 0),
          new THREE.Vector3(0, -halfSize, 0),
          new THREE.Vector3(1, 0, 0),
          geometry,
          materials[materialIndex++ % materials.length],
          Math.PI / 2
        );

        // Back face
        this.createFace(
          new THREE.Vector3(0, 0, -size),
          new THREE.Vector3(0, 0, -halfSize),
          new THREE.Vector3(0, 1, 0),
          geometry,
          materials[materialIndex++ % materials.length],
          Math.PI
        );
      }

      createFace(facePosition, pivotPosition, rotationAxis, geometry, material, targetRotation = 0) {
        const face = new THREE.Mesh(geometry, material);

        // Position the face relative to the pivot
        face.position.copy(facePosition.clone().sub(pivotPosition));

        const pivot = new THREE.Object3D();
        pivot.position.copy(pivotPosition);
        pivot.add(face);
        this.group.add(pivot);

        this.faces.push({
          pivot: pivot,
          rotationAxis: rotationAxis.clone(),
          targetRotation: targetRotation,
          initialRotation: 0, // Store initial rotation for reset
        });
      }

      reset() {
        // Reset the rotations of all faces to their initial state
        for (let i = 1; i < this.faces.length; i++) {
          const faceData = this.faces[i];
          const pivot = faceData.pivot;
          const axis = faceData.rotationAxis;

          const rotationProperty = axis.x
            ? 'x'
            : axis.y
            ? 'y'
            : 'z';

          pivot.rotation[rotationProperty] = faceData.initialRotation;
        }

        this.isAnimating = true;
        playPauseBtn.textContent = 'Pause';
      }

      animateFolding() {
        const foldingSpeed = 0.05;
        const scope = this;

        this.isAnimating = true; // Control play/pause

        function animate() {
          requestAnimationFrame(animate);

          if (scope.isAnimating) {
            let foldingComplete = true;
            for (let i = 1; i < scope.faces.length; i++) {
              const faceData = scope.faces[i];
              const pivot = faceData.pivot;
              const axis = faceData.rotationAxis;
              const target = faceData.targetRotation;

              const rotationProperty = axis.x
                ? 'x'
                : axis.y
                ? 'y'
                : 'z';

              const currentRotation = pivot.rotation[rotationProperty];
              const deltaRotation = target - currentRotation;

              if (Math.abs(deltaRotation) > 0.001) {
                foldingComplete = false;
                const rotationStep = Math.min(Math.abs(deltaRotation), foldingSpeed) * Math.sign(deltaRotation);
                pivot.rotation[rotationProperty] += rotationStep;
              } else {
                pivot.rotation[rotationProperty] = target;
              }
            }

            if (foldingComplete) {
              scope.isAnimating = false;
              playPauseBtn.textContent = 'Play';
            }
          }

          controls.update();
          renderer.render(scene, camera);
        }

        animate();
      }
    }

    // Initialize and animate the cube net
    const cubeNet = new CubeNet();
    cubeNet.animateFolding();

    // Handle window resize
    window.addEventListener(
      'resize',
      function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      },
      false
    );

    // Controls
    const playPauseBtn = document.getElementById('playPauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    playPauseBtn.addEventListener('click', () => {
      cubeNet.isAnimating = !cubeNet.isAnimating;
      playPauseBtn.textContent = cubeNet.isAnimating ? 'Pause' : 'Play';
    });

    resetBtn.addEventListener('click', () => {
      cubeNet.reset();
    });

  </script>
</body>
</html>
