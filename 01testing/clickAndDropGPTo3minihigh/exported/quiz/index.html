    function wrapText(ctx, text, maxWidth) {
  const words = text.split(" ");
  const lines = [];
  let currentLine = words[0];
  for (let i = 1; i < words.length; i++) {
    const word = words[i];
    const width = ctx.measureText(currentLine + " " + word).width;
    if (width < maxWidth) { currentLine += " " + word; }
    else { lines.push(currentLine); currentLine = word; }
  }
  lines.push(currentLine);
  return lines;
}
    function drawTextInHotspot(ctx, text, x, y, width, height) {
  let fontSize = Math.floor(height * 0.5);
  let lines = [];
  while (fontSize > 5) {
    ctx.font = fontSize + "px Arial";
    lines = wrapText(ctx, text, width - 10);
    const lineHeight = fontSize * 1.2;
    if (lines.length * lineHeight <= height) break;
    fontSize--;
  }
  const lineHeight = fontSize * 1.2;
  const totalTextHeight = lines.length * lineHeight;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#000";
  for (let i = 0; i < lines.length; i++) {
    const lineY = y + (height - totalTextHeight) / 2 + i * lineHeight + lineHeight / 2;
    ctx.fillText(lines[i], x + width / 2, lineY);
  }
}

    const canvas = document.getElementById("quizCanvas");
    const ctx = canvas.getContext("2d");
    let baseImg = new Image();
    let quizTested = false;
    function drawHotspots() {
      quizData.hotspots.forEach(hotspot => {
        // Use exact coordinates without scaling
        ctx.strokeStyle = "#888";
        ctx.lineWidth = 2;
        ctx.strokeRect(
          hotspot.x,
          hotspot.y,
          hotspot.width,
          hotspot.height
        );
        
        if (hotspot.placed) {
          const opt = quizData.options.find(o => o.label === hotspot.placed);
          if (opt) {
            if (opt.src) {
              const img = new Image();
              img.onload = () => { 
                ctx.drawImage(
                  img,
                  hotspot.x,
                  hotspot.y,
                  hotspot.width,
                  hotspot.height
                );
              };
              img.src = opt.src;
            } else if (opt.text) {
              drawTextInHotspot(
                ctx,
                opt.text,
                hotspot.x,
                hotspot.y,
                hotspot.width,
                hotspot.height
              );
            }
          }
        }
        // If the quiz has been tested, draw indicators
        if (quizTested && hotspot.placed) {
          ctx.font = "24px Arial";
          ctx.textAlign = "right";
          ctx.textBaseline = "top";
          if (hotspot.isCorrect) {
            ctx.fillText("✅", hotspot.x + hotspot.width, hotspot.y);
          } else {
            ctx.fillText("❌", hotspot.x + hotspot.width, hotspot.y);
          }
        }
      });
    }
    function redrawCanvasContent() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(baseImg, 0, 0, canvas.width, canvas.height);
      drawHotspots();
    }
    function renderDraggableOptions() {
      const container = document.getElementById("draggableOptionsContainer");
      container.innerHTML = "";
      quizData.options.forEach(option => {
        let elem;
        if (option.src) {
          elem = document.createElement("img");
          elem.src = option.src; 
          elem.alt = "Option " + option.label;
          elem.style.maxWidth = "100px"; 
          elem.style.maxHeight = "100px";
        } else if (option.text) {
          elem = document.createElement("div");
          elem.textContent = option.text;
          elem.style.padding = "10px"; 
          elem.style.border = "1px solid #ccc";
          elem.style.fontSize = "16px"; 
          elem.style.fontWeight = "bold";
        }
        elem.setAttribute("draggable", "true"); 
        elem.dataset.label = option.label;
        elem.className = "draggable-option";
        elem.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", option.label); });
        container.appendChild(elem);
      });
      addTouchDragSupport();
    }
    baseImg.onload = () => { redrawCanvasContent(); renderDraggableOptions(); };
    baseImg.src = quizData.baseImage;
    canvas.addEventListener("dragover", (e) => { e.preventDefault(); });
    canvas.addEventListener("drop", (e) => {
      e.preventDefault();
      const droppedOptionLabel = e.dataTransfer.getData("text/plain");
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      const scaleX = canvas.width / quizData.baseWidth;
      const scaleY = canvas.height / quizData.baseHeight;
      let foundHotspot = quizData.hotspots.find(h =>
        x >= h.x * scaleX &&
        x <= (h.x + h.width) * scaleX &&
        y >= h.y * scaleY &&
        y <= (h.y + h.height) * scaleY
      );
      if(foundHotspot){ foundHotspot.placed = droppedOptionLabel; redrawCanvasContent(); }
    });
    document.getElementById("testQuizBtn").addEventListener("click", function() {
      let allPlaced = quizData.hotspots.every(h => h.placed);
      if(!allPlaced) {
        alert("Please drop all option images/texts onto the hotspots before testing the quiz.");
        return;
      }
      let score = 0;
      quizData.hotspots.forEach(h => {
        h.isCorrect = (h.placed === h.option);
        if(h.isCorrect){ score += h.maxMarks; }
      });
      let totalScore = quizData.hotspots.reduce((sum, h) => sum + h.maxMarks, 0);
      document.getElementById("result").textContent = "Your score: " + score + " / " + totalScore;
      sendScore(score);
      quizTested = true;
      redrawCanvasContent();
    });
    function addTouchDragSupport() {
      let touchItem = null;
      let offsetX = 0, offsetY = 0;
      const optionsElems = document.querySelectorAll(".draggable-option");
      optionsElems.forEach(elem => {
        elem.addEventListener("touchstart", (e) => {
          e.preventDefault();
          touchItem = elem.cloneNode(true);
          touchItem.style.position = "absolute";
          touchItem.style.opacity = "0.7";
          document.body.appendChild(touchItem);
          const touch = e.touches[0];
          const rect = elem.getBoundingClientRect();
          offsetX = touch.clientX - rect.left;
          offsetY = touch.clientY - rect.top;
          touchItem.style.left = (touch.clientX - offsetX) + "px";
          touchItem.style.top = (touch.clientY - offsetY) + "px";
        });
        elem.addEventListener("touchmove", (e) => {
          e.preventDefault();
          if(touchItem) {
            const touch = e.touches[0];
            touchItem.style.left = (touch.clientX - offsetX) + "px";
            touchItem.style.top = (touch.clientY - offsetY) + "px";
          }
        });
        elem.addEventListener("touchend", (e) => {
          e.preventDefault();
          if(touchItem) {
            const canvasRect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / canvasRect.width;
            const scaleY = canvas.height / canvasRect.height;
            const touch = e.changedTouches[0];
            const x = (touch.clientX - canvasRect.left) * scaleX;
            const y = (touch.clientY - canvasRect.top) * scaleY;
            let foundHotspot = quizData.hotspots.find(h =>
              x >= h.x && x <= (h.x + h.width) && y >= h.y && y <= (h.y + h.height)
            );
            if(foundHotspot) {
              foundHotspot.placed = elem.dataset.label;
              redrawCanvasContent();
            }
            touchItem.parentNode.removeChild(touchItem);
            touchItem = null;
          }
        });
      });
    }
    window.addEventListener("load", addTouchDragSupport);
  </script>
  <script>
      const XAPIUtils = {
          parameters: null,
          getParameters: function() {
              if(!this.parameters) {
                  const urlParams = new URLSearchParams(window.location.search);
                  const endpoint = urlParams.get("endpoint");
                  const auth = urlParams.get("auth");
                  const agent = JSON.parse(urlParams.get("agent") || "null");
                  const stateId = urlParams.get("stateId");
                  const activityId = urlParams.get("activityId");
                  if(endpoint && auth) {
                      ADL.XAPIWrapper.changeConfig({
                          endpoint: endpoint + "/",
                          auth: `Basic ${auth}`
                      });
                  }
                  this.parameters = { agent, stateId, activityId };
              }
              return this.parameters;
          }
      };
      function sendScore(score) {
          try {
              const parameters = XAPIUtils.getParameters();
              if(!parameters || !parameters.activityId) return;
              const { agent, stateId, activityId } = parameters;
              const registration = null;
              const stateValue = { score };
              ADL.XAPIWrapper.sendState(activityId, agent, stateId, registration, stateValue);
          } catch(err) {
              console.error("An error occurred sending xAPI score:", err);
          }
      }
  </script>
</body>
