        if (gOldOnError) return gOldOnError(errorMsg, url, lineNumber);

    <script type="text/javascript"><!--//--><![CDATA[//><!--
function _simulation (_topFrame, _libraryPath, _codebasePath, _inputParameters) {

  var _model = EJSS_CORE.createAnimationLMS();
  var _view;
  var _isPlaying = false;
  var _isPaused = true;
  var _isEPub = false;
  var _isMobile = (navigator===undefined) ? false : navigator.userAgent.match(/iPhone|iPad|iPod|Android|BlackBerry|Opera Mini|IEMobile/i);

  var _stringProperties = {};
  var _tools = {
    showInputDialog : EJSS_INTERFACE.BoxPanel.showInputDialog,
    showOkDialog : EJSS_INTERFACE.BoxPanel.showOkDialog,
    showOkCancelDialog : EJSS_INTERFACE.BoxPanel.showOkCancelDialog,
    downloadText: EJSS_TOOLS.File.downloadText,
    uploadText: function(action) { EJSS_TOOLS.File.uploadText(_model,action); } 
  };

  function _play()  { _isPaused = false; _isPlaying = true;  _model.play();  }
  function _pause() { _isPaused = true;  _isPlaying = false; _model.pause(); }
  function _step()  { _pause();  _model.step(); }
  function _reset() { _model.reset();  _isPaused = _model.isPaused(); _isPlaying = _model.isPlaying(); }
  _model._play  = _play;
  _model._pause = _pause;
  _model._step  = _step;
  _model._reset = _reset;

  function _update() { _model.update(); }
  function _initialize() { _model.initialize(); }
  function _setFPS(_fps) { _model.setFPS(_fps); }
  function _setDelay(_delay) { _model.setDelay(_delay); }
  function _setStepsPerDisplay(_spd) { _model.setStepsPerDisplay(_spd); }
  function _setUpdateView(_updateView) { _model.setUpdateView(_updateView); }
  function _setAutoplay(_auto) { _model.setAutoplay(_auto); }
  function _println(_message) { console.log(_message); }
  function _breakAfterThisPage() { _model.setShouldBreak(true); }
  function _resetSolvers() { if (_model.resetSolvers) _model.resetSolvers(); }
  function _saveText(name,type,content) { if (_model.saveText) _model.saveText(name,type,content); }
  function _saveState(name) { if (_model.saveState) _model.saveState(name); }
  function _saveImage(name,panelname) { if (_model.saveImage) _model.saveImage(name,panelname); }
  function _readState(url,type) { if (_model.readState) _model.readState(url,type); }
  function _readText(url,type,varname) { if (_model.readText) _model.readText(url,type,varname); }
  // Is this still needed if we don't have locales???
  function _getStringProperty(propertyName) {
    var _value = _stringProperties[propertyName];
    if (_value===undefined) return propertyName;
    else return _value;
  }

  var __pagesEnabled = [];
  function _setPageEnabled(pageName,enabled) { __pagesEnabled[pageName] = enabled; }

  var G; // Model.Variables.Constants.G
  var M; // Model.Variables.Constants.M
  var R; // Model.Variables.Constants.R
  var g; // Model.Variables.Constants.g

  var y; // Model.Variables.Variable.y
  var v; // Model.Variables.Variable.v
  var t; // Model.Variables.Variable.t
  var m; // Model.Variables.Variable.m
  var v_escape; // Model.Variables.Variable.v_escape
  var dt; // Model.Variables.Variable.dt
  var a; // Model.Variables.Variable.a

  function _serialize() { return _model.serialize(); }

  _model._userSerialize = function() {
    return { G : G, M : M, R : R, g : g, y : y, v : v, t : t, m : m, v_escape : v_escape, dt : dt, a : a };
  }
  function _serializePublic() { return _model.serializePublic(); }

  _model._userSerializePublic = function() {
    return { G : G, M : M, R : R, g : g, y : y, v : v, t : t, m : m, v_escape : v_escape, dt : dt, a : a };
  }

  _model._readParameters = function(json) {
    if(typeof json.G != 'undefined') G = json.G;
    if(typeof json.M != 'undefined') M = json.M;
    if(typeof json.R != 'undefined') R = json.R;
    if(typeof json.g != 'undefined') g = json.g;
    if(typeof json.y != 'undefined') y = json.y;
    if(typeof json.v != 'undefined') v = json.v;
    if(typeof json.t != 'undefined') t = json.t;
    if(typeof json.m != 'undefined') m = json.m;
    if(typeof json.v_escape != 'undefined') v_escape = json.v_escape;
    if(typeof json.dt != 'undefined') dt = json.dt;
    if(typeof json.a != 'undefined') a = json.a;
  }

  _model._readParametersPublic = function(json) {
    if(typeof json.G != 'undefined') G = json.G;
    if(typeof json.M != 'undefined') M = json.M;
    if(typeof json.R != 'undefined') R = json.R;
    if(typeof json.g != 'undefined') g = json.g;
    if(typeof json.y != 'undefined') y = json.y;
    if(typeof json.v != 'undefined') v = json.v;
    if(typeof json.t != 'undefined') t = json.t;
    if(typeof json.m != 'undefined') m = json.m;
    if(typeof json.v_escape != 'undefined') v_escape = json.v_escape;
    if(typeof json.dt != 'undefined') dt = json.dt;
    if(typeof json.a != 'undefined') a = json.a;
  }

  function _unserializePublic(json) { return _model.unserializePublic(json); }

  _model._userUnserializePublic = function(json) {
    _model._readParametersPublic(json);
    _resetSolvers();
    _model.update();
  }

  function _unserialize(json) { return _model.unserialize(json); }

  _model._userUnserialize = function(json) {
    _model._readParameters(json);
    _resetSolvers();
    _model.update();
  }

  _model.getOdes = function() { return []; }

  _model.removeEvents = function(){
  }

  _model.addToReset(function() {
    __pagesEnabled['Evol Page 1'] = true;
    __pagesEnabled['Equations'] = false;
    __pagesEnabled['FixRel Page 2'] = true;
  });

  _model.addToReset(function() { // Reset of Constants
    G = 6.67430 * Math.pow(10,-11); // Model.Variables.Constants.G
    M = 5.97 * Math.pow(10, 24); // Model.Variables.Constants.M
    R = 6.371 * Math.pow(10, 6); // Model.Variables.Constants.R
    g = 9.81; // Model.Variables.Constants.g
  }); // End of reset of Constants

  _model.addToReset(function() { // Reset of Variable
    y = R*1.001; // Model.Variables.Variable.y
    v = 1*Math.pow(10,5); // Model.Variables.Variable.v
    t = 0; // Model.Variables.Variable.t
    m = 1; // Model.Variables.Variable.m
    v_escape = 0; // Model.Variables.Variable.v_escape
    dt = 100; // Model.Variables.Variable.dt
    a = 0; // Model.Variables.Variable.a
  }); // End of reset of Variable

  if (_inputParameters) {
    _inputParameters = _model.parseInputParameters(_inputParameters);
    if (_inputParameters) _model.addToReset(function() { _model._readParameters(_inputParameters); });
  }

  _model.addToReset(function() {
    _model.setAutoplay(true);
    _model.setPauseOnPageExit(false);
    _model.setFPS(20);
    _model.setStepsPerDisplay(1);
  });

  // isGrouded // > Custom code page: isGrouded - line 1
  function isGrounded(){ // > Custom code page: isGrouded - line 2
      if (y > R){ // > Custom code page: isGrouded - line 3
          v = v + a*dt; // > Custom code page: isGrouded - line 4
          y = y + v*dt; // > Custom code page: isGrouded - line 5
      } // > Custom code page: isGrouded - line 6
          else if(y < R){ // > Custom code page: isGrouded - line 7
              y = R; // > Custom code page: isGrouded - line 8
              v = 0; // > Custom code page: isGrouded - line 9
              _pause(); // > Custom code page: isGrouded - line 10
          } // > Custom code page: isGrouded - line 11
          //println(y); // > Custom code page: isGrouded - line 12
  } // > Custom code page: isGrouded - line 13
  //_pause() // > Custom code page: isGrouded - line 14
  //println(y); // > Custom code page: isGrouded - line 15

  _model.addToEvolution(function() {
    if (!__pagesEnabled['Evol Page 1']) return;
  // Evol Page 1 // > Evolution page: Evol Page 1 - line 1
  v_escape = Math.sqrt(2 * G * M / R); // > Evolution page: Evol Page 1 - line 2
  a = -G * M / ((y)*(y)); // > Evolution page: Evol Page 1 - line 3
  v = v + a * dt; // > Evolution page: Evol Page 1 - line 4
  y = y + v * dt; // > Evolution page: Evol Page 1 - line 5
  t = t + dt; // > Evolution page: Evol Page 1 - line 6
  })

  _model.addToFixedRelations(function() { _isPaused = _model.isPaused(); _isPlaying = _model.isPlaying(); });

  _model.addToFixedRelations(function() {
    if (!__pagesEnabled['Equations']) return;
    // Equations // > Fixed Relations page: Equations - line 1
    v_escape = Math.sqrt(2 * G * M / R); // > Fixed Relations page: Equations - line 2
    a = -G * M / ((y+R)*(y+R)); // > Fixed Relations page: Equations - line 3
    v = v + a * dt; // > Fixed Relations page: Equations - line 4
    y = y + v * dt; // > Fixed Relations page: Equations - line 5
    t = t + dt; // > Fixed Relations page: Equations - line 6
  });

  _model.addToFixedRelations(function() {
    if (!__pagesEnabled['FixRel Page 2']) return;
    // FixRel Page 2 // > Fixed Relations page: FixRel Page 2 - line 1
    isGrounded(); // > Fixed Relations page: FixRel Page 2 - line 2
  });

  // Intentionally repeated
  _model.addToFixedRelations(function() { _isPaused = _model.isPaused(); _isPlaying = _model.isPlaying(); });

  _model._fontResized = function(iBase,iSize,iDelta) {
    _view._fontResized(iBase,iSize,iDelta);
  }; // end of _fontResized

  function _createView() {
    _view = new _simulationView(_topFrame,_libraryPath,_codebasePath);
    var _view_super_reset = _view._reset;
    _view._reset = function() {
      _view_super_reset();
      _view.drawingPanel.linkProperty('MinimumX', function() { return -2.5*Math.pow(10,8); }); // linking MinimumX of drawingPanel
      _view.drawingPanel.linkProperty('MaximumX', function() { return 2.5*Math.pow(10,8); }); // linking MaximumX of drawingPanel
      _view.drawingPanel.linkProperty('MinimumY', function() { return -0.5*Math.pow(10,8); }); // linking MinimumY of drawingPanel
      _view.drawingPanel.linkProperty('MaximumY', function() { return +4.5*Math.pow(10,8); }); // linking MaximumY of drawingPanel
      _view.drawingPanel.linkProperty('TRMessage', function() { return "y = " +y; }); // linking TRMessage of drawingPanel
      _view.Earth.linkProperty('SizeX', function() { return 2*R; }); // linking SizeX of Earth
      _view.Earth.linkProperty('SizeY', function() { return 2*R; }); // linking SizeY of Earth
      _view.Object.linkProperty('Y', function() { return y; }, function(_v) { y = _v; }); // linking Y of Object
      _view.Object.linkProperty('SizeX', function() { return 0.5*R; }); // linking SizeX of Object
      _view.Object.linkProperty('SizeY', function() { return 0.5*R; }); // linking SizeY of Object
      _view.runPauseButton.setAction('OffClick', _pause); // Action OffClick for element runPauseButton
      _view.runPauseButton.linkProperty('State', function() { return _isPaused; }); // linking State of runPauseButton
      _view.runPauseButton.setAction('OnClick', _play); // Action OnClick for element runPauseButton
      _view.stepButton.setAction('OnClick', _step); // Action OnClick for element stepButton
      _view.initButton.setAction('OnClick', _initialize); // Action OnClick for element initButton
      _view.resetButton.setAction('OnClick', _reset); // Action OnClick for element resetButton
    }; // end of new reset

    _model.setView(_view);
    _model.reset();
    _view._enableEPub();
  } // end of _createView

  _model.setAutoplay(true);
  _model.setFPS(20);
  _model.setStepsPerDisplay(1);
  _createView(); // this includes _model.reset()
  return _model;
}

function _simulationView (_topFrame,_libraryPath,_codebasePath) {
  var _view = EJSS_CORE.createView(_topFrame);

  if (_libraryPath)  _view._setLibraryPath(_libraryPath);
  if (_codebasePath) _view._setResourcePath(_codebasePath);


  _view._reset = function() {
    _view._clearAll();
    _view._addElement(EJSS_INTERFACE.panel, 'singleDrawingPanel', _view._topFrame);
    _view._addElement(EJSS_INTERFACE.panel, 'labelPanel', _view.singleDrawingPanel);
    _view._addElement(EJSS_INTERFACE.imageAndTextButton, 'topLabel', _view.labelPanel);
    _view._addElement(EJSS_INTERFACE.wrappedPanel, 'wrappedPanel', _view.singleDrawingPanel);
    _view._addElement(EJSS_DRAWING2D.drawingPanel, 'drawingPanel', _view.wrappedPanel)
      .setProperty("Height",350)
      .setProperty("Width",350)
      .setProperty("Enabled",true)
      .setProperty("EnabledZooming",true)
      ;
    _view._addElement(EJSS_DRAWING2D.shape, 'Earth', _view.drawingPanel)
      .setProperty("FillColor","Blue")
      .setProperty("X",0)
      .setProperty("Y",0)
      .setProperty("LineColor","Blue")
      ;
    _view._addElement(EJSS_DRAWING2D.shape, 'Object', _view.drawingPanel)
      .setProperty("FillColor","Red")
      .setProperty("X",0)
      .setProperty("LineColor","Red")
      ;
    _view._addElement(EJSS_INTERFACE.panel, 'controlPanel', _view.wrappedPanel)
      .setProperty("Width",398)
      .setProperty("CSS",{"display":"block"})
      .setProperty("BorderStyle","solid")
      .setProperty("BorderColor","Gray")
      .setProperty("BorderWidth",1)
      ;
    _view._addElement(EJSS_INTERFACE.panel, 'firstRowPanel', _view.controlPanel);
    _view._addElement(EJSS_INTERFACE.panel, 'executionPanel', _view.firstRowPanel);
    _view._addElement(EJSS_INTERFACE.twoStateButton, 'runPauseButton', _view.executionPanel)
      .setProperty("Tooltip","Play/Pause")
      .setProperty("ImageOnUrl","/org/opensourcephysics/resources/controls/images/play.gif")
      .setProperty("ImageOffUrl","/org/opensourcephysics/resources/controls/images/pause.gif")
      ;
    _view._addElement(EJSS_INTERFACE.button, 'stepButton', _view.executionPanel)
      .setProperty("Tooltip","Step")
      .setProperty("ImageUrl","/org/opensourcephysics/resources/controls/images/stepforward.gif")
      ;
    _view._addElement(EJSS_INTERFACE.button, 'initButton', _view.executionPanel)
      .setProperty("Tooltip","Initialize")
      .setProperty("ImageUrl","/org/opensourcephysics/resources/controls/images/reset1.gif")
      ;
    _view._addElement(EJSS_INTERFACE.button, 'resetButton', _view.executionPanel)
      .setProperty("Tooltip","Reset")
      .setProperty("ImageUrl","/org/opensourcephysics/resources/controls/images/reset.gif")
      ;
    _view._addElement(EJSS_INTERFACE.panel, 'narrativePanel', _view.singleDrawingPanel);
  }; // end of _view._reset
  return _view;
}

    //--><!]]></script>

    <script type="text/javascript"><!--//--><![CDATA[//><!--

      var _model;
      var _scorm;
      window.addEventListener('load',
        function () {
          _model = new _simulation("_topFrame","./_ejs_library/",null);

          if (typeof _isApp !== "undefined" && _isApp) _model.setRunAlways(true);
          TextResizeDetector.TARGET_ELEMENT_ID = '_topFrame';
          TextResizeDetector.USER_INIT_FUNC = function () {
            var iBase = TextResizeDetector.addEventListener(function(e,args) {
                _model._fontResized(args[0].iBase,args[0].iSize,args[0].iDelta);
