  ///Define MC and MR functions // > Custom code page: Solvers - line 2
  function mcFn(x,mc) { return 0.004*x*(x*x - 450) + mc} // > Custom code page: Solvers - line 3
  function mrFn(x,ped,Cd) {return 2*ped*(x - 0.5*Cd)} // > Custom code page: Solvers - line 4
   // > Custom code page: Solvers - line 5
  //Function to use numerical analysis to return the intersection of MC and MR // > Custom code page: Solvers - line 6
  function findIntersectionX(curve1, curve2, mc, ped, Cd) { // > Custom code page: Solvers - line 7
    for (let x = 3.5; x <= 50; x += 0.001) { // > Custom code page: Solvers - line 8
      let y1 = curve1(x,mc); // > Custom code page: Solvers - line 9
      let y2 = curve2(x,ped,Cd); // > Custom code page: Solvers - line 10
      if (Math.abs(y1 - y2) < 0.01) {  // Tolerance for floating-point comparison // > Custom code page: Solvers - line 11
        return x; // > Custom code page: Solvers - line 12
      } // > Custom code page: Solvers - line 13
    } // > Custom code page: Solvers - line 14
    return 0;  // No intersection found // > Custom code page: Solvers - line 15
  } // > Custom code page: Solvers - line 16
   // > Custom code page: Solvers - line 17
   // > Custom code page: Solvers - line 18
  // Solver for profit // > Custom code page: Solvers - line 19
  function findProfitMargin(mc,fc,ped,Cd) { // > Custom code page: Solvers - line 20
      let xEq2 = findIntersectionX(mcFn, mrFn, mc, ped, Cd); // > Custom code page: Solvers - line 21
      let acEq2 = 0.001*(xEq2+30)*xEq2*(xEq2-30) + mc + fc/xEq2; // > Custom code page: Solvers - line 22
      let pEq2 = ped*(xEq2 - Cd); // > Custom code page: Solvers - line 23
      return pEq2 - acEq2; // > Custom code page: Solvers - line 24
  } // > Custom code page: Solvers - line 25
