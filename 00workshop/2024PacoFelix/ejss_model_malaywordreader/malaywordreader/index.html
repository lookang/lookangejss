<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malay Words Reader Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #game-container {
            text-align: center;
            background: white;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .option {
            margin: 10px;
            padding: 10px 20px;
            border: 2px solid #007BFF;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }
        .option:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
        #result {
            margin-top: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Malay Words Reader Game</h1>
        <p id="question">Select the correct word for "cat":</p>
        <div id="options">
            <div class="option" onclick="checkAnswer(this)">kucing</div>
            <div class="option" onclick="checkAnswer(this)">anjing</div>
            <div class="option" onclick="checkAnswer(this)">burung</div>
            <div class="option" onclick="checkAnswer(this)">ikan</div>
        </div>
        <div id="result"></div>
    </div>

    <script>
        const correctAnswer = "kucing";

        function checkAnswer(option) {
            const resultDiv = document.getElementById('result');
            if (option.textContent === correctAnswer) {
                resultDiv.textContent = "Correct!";
                resultDiv.style.color = "green";
            } else {
                resultDiv.textContent = "Wrong, try again!";
                resultDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
