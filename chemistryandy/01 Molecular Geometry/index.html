    <body>

    <div id = "structure"></div>
    <div id="molecules">
        <button id= "CO2" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Linear';scene.remove(curMol); curMol=CO2; scene.add(CO2);" style="top: 3%">CO<sub>2</sub></button>
        <br />
        <button id= "BF3" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Trigonal planar';scene.remove(curMol);curMol=BF3;scene.add(BF3);" style="top: 10%">BF<sub>3</sub></button>
        <button id= "SO2" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Angular';scene.remove(curMol);curMol=SO2;scene.add(SO2);" style="top: 17%">SO<sub>2</sub></sub></button>
        <br />
        <button id= "CH4" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Tetrahedral';scene.remove(curMol);curMol=CH4;scene.add(CH4);" style="top: 24%">CH<sub>4</sub></button>
        <button id= "NH3" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Trigonal Planar';scene.remove(curMol);curMol=NH3;scene.add(NH3);" style="top: 31%">NH<sub>3</sub></button>
        <button id= "H2O" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Angular';scene.remove(curMol);curMol=H2O;scene.add(H2O);" style="top: 38%">H<sub>2</sub>O</button>
        <br />
        <button id= "PCl5" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Trigonal bipyramidal';scene.remove(curMol);curMol=PCl5;scene.add(PCl5);" style="top: 45%">PC<i style="font-family:Georgia, 'Times New Roman', Times, serif">l</i><sub>5</sub></button>
        <button id= "SF4" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Seesaw';scene.remove(curMol);curMol=SF4;scene.add(SF4);" style="top: 52%">SF<sub>4</sub></button>
        <button id= "ClF3" class = "shape" onclick="document.getElementById('structure').innerHTML = 'T-shaped';scene.remove(curMol);curMol=ClF3;scene.add(ClF3);" style="top: 59%">C<i style="font-family:Georgia, 'Times New Roman', Times, serif">l</i>F<sub>3</sub></button>
        <button id= "XeF2" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Linear';scene.remove(curMol);curMol=XeF2;scene.add(XeF2);" style="top: 59%">XeF<sub>2</sub></button>
        <br />
        <button id= "SF6" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Octahedral';scene.remove(curMol);curMol=SF6;scene.add(SF6);" style="top: 66%">SF<sub>6</sub></button>
        <button id= "BrF5" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Square pyramidal';scene.remove(curMol);curMol=BrF5;scene.add(BrF5);" style="top: 66%">BrF<sub>5</sub></button>
        <button id= "XeF4" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Square planar';scene.remove(curMol);curMol=XeF4;scene.add(XeF4);" style="top: 66%">XeF<sub>4</sub></button>
        <br />
        <button id= "IF7" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Pentagonal bipyramidal';scene.remove(curMol);curMol=IF7;scene.add(IF7);" style="top: 66%">IF<sub>7</sub></button>
        <button id= "XeOF5" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Pentagonal pyramidal';scene.remove(curMol);curMol=XeOF5;scene.add(XeOF5);" style="top: 66%">XeOF<sub>5</sub><sup>–</sup></button>
        <button id= "XeF5" class = "shape" onclick="document.getElementById('structure').innerHTML = 'Pentagonal planar';scene.remove(curMol);curMol=XeF5;scene.add(XeF5);" style="top: 66%">XeF<sub>5</sub><sup>–</sup></button>
