<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]><!--> <html class="no-js"> <!--<![endif]-->
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Periodic Trends of Elements</title>
        <meta name="description" content="ALCHEM">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="styles/ctrlpanel.css">

        <script src ="data/ELEMENT DB.js"></script>
        <script src="js/jquery-3.4.1.js"></script>
        <script src="js/d3.v5.js"></script>
        <script src="js/units.js"></script>

    </head>
    <body>

        <div id="controlpanel">
                <div id = "lcp" class = "cp">
                    <button id = "atomicWeight" class="ctrls" onclick="target = 'atomicWeight'; updateChart();">Atomic Weight</button>
                    <button id = "firstIE" class="ctrls" onclick="target = 'IE1'; updateChart();">1st Ionisation Energy</button>
                    <button id = "electronegativity" class="ctrls" onclick="target = 'electronegativity'; updateChart();">Electronegativity</button>
                    <button id = "covalentRadius" class="ctrls" onclick="target = 'covRadius'; updateChart();">Covalent Radius</button>
                    <button id = "atomicRadius" class="ctrls" onclick="target = 'atomicRadius'; updateChart();">Atomic Radius</button>
                    <!-- <button id = "vanDerWaalsRadius" class="ctrls" onclick="target = 'vdwRadius'; updateChart();">Van der Waals Radius</button> -->
                    <button id = "valency" class="ctrls" onclick="target = 'valency'; updateChart();">Valency</button>
                </div>
                <div id = "rcp" class = "cp">
                    <button id = "meltingPoint" class="ctrls" onclick="target = 'meltingPoint'; updateChart();">Melting Point</button>
                    <button id = "boilingPoint" class="ctrls" onclick="target = 'boilingPoint'; updateChart();">Boiling Point</button>
                    <button id = "heatCapacity" class="ctrls" onclick="target = 'heatCap'; updateChart();">Heat Capacity</button>
                    <button id = "density" class="ctrls" onclick="target = 'density'; updateChart();">Density</button>
                </div>
            </div>        
            
            <div id="colorSchemeSel"> <b style="text-decoration: underline; font-size: 1.2em; margin: 5px">Colour Scheme</b> <br \>
                <input type="radio" name="colorScheme" onclick="colSchemeChose = 'none'; updateChart();" value="none" id="colorScheme" checked> None<br>
                <input type="radio" name="colorScheme" onclick="colSchemeChose = 'period'; updateChart();" value="period" id = "colorScheme"> By Period<br>
                <input type="radio" name="colorScheme" onclick="colSchemeChose = 'group'; updateChart();" value="group" id="colorScheme"> By Group<br>
                <input type="radio" name="colorScheme" onclick="colSchemeChose = 'subshell'; updateChart();" value="subshell" id="colorScheme"> By subshell<br>
            </div>


        <div id="slider-guide" onclick = "slideout()"> &#9776;</div>
        <div id = "slider-bar">
            <div class="header"> <b>Select Elements</b></div>
            <div>
                <div style="width: 50%; display: block"><br \> <input type="checkbox" id = "period1" class = "periodSel" value="1" checked><label for="period1" class="ctrlab">Period 1</label>
                </div><div style="width: 50%; display: block"><br \> <input type="checkbox" id = "period2" class = "periodSel" value="2" checked><label for="period2" class="ctrlab">Period 2</label>
                </div><div style="width: 50%; display: block"><br \> <input type="checkbox" id = "period3" class = "periodSel" value="3" checked><label for="period3" class="ctrlab">Period 3</label>
                </div><div style="width: 50%; display: block"><br \> <input type="checkbox" id = "period4" class = "periodSel" value="4" checked><label for="period4" class="ctrlab">Period 4</label>
                </div><div style="width: 50%; display: block"><br \> <input type="checkbox" id = "period5" class = "periodSel" value="5" checked><label for="period5" class="ctrlab">Period 5</label>
                </div><div style="width: 50%; display: block"><br \> <input type="checkbox" id = "period6" class = "periodSel" value="6" ><label for="period6" class="ctrlab">Period 6</label>
                </div><div style="width: 50%; display: block"><br \> <input type="checkbox" id = "period7" class = "periodSel" value="7" ><label for="period7" class="ctrlab">Period 7</label>
                </div><div style="width: 90%; display: block"><br \> <input type="checkbox" id = "TE" class = "periodSel" value="TE" checked><label for="TE" class="ctrlab">Transition Elements</label>            
                </div><div style="width: 100%; display: block"><br \> <input type="checkbox" id = "LAC" class = "periodSel" value="LAC" ><label for="LAC" class="ctrlab">Lanthanoids/Actinoids</label>            
                </div>
            </div>
        </div>


        <svg id = "svg"></svg>

    </body>
    <script src="js/ctrlpanel.js"></script>
    <script src="js/main.js"></script>
</html>
