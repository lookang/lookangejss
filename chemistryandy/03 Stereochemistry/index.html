            <button class="sel" onclick="document.getElementById('lab2a').innerHTML='(L)-Bromofluorochloromethane';document.getElementById('lab1a').innerHTML='(R)-Bromofluorochloromethane';if(c1){scene1.remove(c1);scene2.remove(c2)};if(c3){scene1.remove(c3);scene2.remove(c4)};if(c5){scene1.remove(c5);scene2.remove(c6)};if(c7){scene1.remove(c7);scene2.remove(c8)};scene1.add(c1); scene2.add(c2);if(Flip){flipUndo();};" style="top: 4%">optical isomers</button>

<script>


// create mirrors
for (i=0; i<window.innerHeight;i+=60){
    var div = document.createElement("div");
    div.style.position = "absolute";
    div.style.width = "100%";
    div.style.height = "40px";
    div.style.background = "black";
    div.style.display = "absolute";
    div.style.top = i + "px";
    document.getElementById("mirror").appendChild(div);
}

var checkbox1 = document.getElementById("checkbox1");
checkbox1.addEventListener( 'change', function() {
    if(this.checked) {  
        turn = true; 
    } else {
        turn = false; 
    }
});


var checkbox2 = document.getElementById("checkbox2");
checkbox2.addEventListener( 'change', function() {
    if(this.checked) {  
        syncView = true; 
    } else {
        syncView = false; 
    }
});


function Flip(){
    var btn = document.createElement("BUTTON");
    btn.id = "Flip";
    btn.onclick = function(){
        c7.rotation.x += Math.PI;
        c7.translateZ(-50);
    }
    btn.style.position = "absolute";
    btn.style.top = "65%";
    btn.style.right = "20%";
    btn.style.fontSize = "1.2em";
    btn.style.fontFamily = 'Lucida Sans';
    btn.style.border = "1px black";
    btn.style.height = "2%";
    btn.style.margin = "0";
    btn.style.backgroundColor = "red";
    btn.style.color = "antiquewhite";
    btn.style.cursor =  "pointer";




    var t = document.createTextNode("Rotate molecule vertically");
    btn.appendChild(t);
    document.body.appendChild(btn);
}

function flipUndo(){
    var undo = document.getElementById("Flip");
    undo.parentNode.removeChild(undo);
}


</script>
