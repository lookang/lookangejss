<script>
          var cb = document.getElementById("controlBtns");
          
    
    var isRotating = true; // Variable to track the rotation state
    var playPauseBtn = document.createElement("BUTTON");
    playPauseBtn.className = "playPauseBtn";
    playPauseBtn.onclick = function() {
        if (isRotating) {
            controls.autoRotate = false; // Pause rotation
            playPauseBtn.innerHTML = "Play"; // Change button text to "Play"
        } else {
            controls.autoRotate = true; // Resume rotation
            playPauseBtn.innerHTML = "Pause"; // Change button text to "Pause"
        }
        isRotating = !isRotating; // Toggle rotation state
    };
    playPauseBtn.innerHTML = "Pause"; // Start with "Pause" since rotation starts enabled
    cb.appendChild(playPauseBtn);



    var btn = document.createElement("BUTTON");
          btn.className = "Crystal";
          btn.onclick = function(){
            clearScene();
            scene.add(NaCl);
          };
          btn.innerHTML = "NaCl";
          cb.appendChild(btn);

          var btn = document.createElement("BUTTON");
          btn.className = "Crystal";
          btn.onclick = function(){
            clearScene();
            scene.add(CsCl);
          };
          btn.innerHTML = "CsCl";
          cb.appendChild(btn);

          var btn = document.createElement("BUTTON");
          btn.className = "Crystal";
          btn.onclick = function(){
            clearScene();
            scene.add(diamond);
          };
          btn.innerHTML = "diamond";
          cb.appendChild(btn);

          var btn = document.createElement("BUTTON");
          btn.className = "Crystal";
          btn.onclick = function(){
            clearScene();
            scene.add(graphite);
          };
          btn.innerHTML = "graphite";
          cb.appendChild(btn);
          

let clearScene = function(){
  scene.remove(NaCl);
  scene.remove(CsCl);
  scene.remove(diamond);
  scene.remove(graphite);
}
          
</script>
