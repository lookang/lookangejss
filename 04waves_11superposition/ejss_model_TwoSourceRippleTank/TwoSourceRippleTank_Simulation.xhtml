  function calculateDistances () {  // > CustomCode.Calculate Distances:1
    var lambdapx = (width * lambda)/(xmax - xmin); // wavelength in pixels  // > CustomCode.Calculate Distances:2
    var xs=width*separation/2/(xmax - xmin);  // source position  // > CustomCode.Calculate Distances:3
    // calculate distance from source for each pixel  // > CustomCode.Calculate Distances:4
    for (var i=0; i<width; i++) {  // > CustomCode.Calculate Distances:5
      var dxRight=i-width/2.0-xs;  // > CustomCode.Calculate Distances:6
      var dxLeft=i-width/2.0+xs;  // > CustomCode.Calculate Distances:7
      for (var j=0; j<height; j++) {  // > CustomCode.Calculate Distances:8
        var dy=j-height/2.0;  // > CustomCode.Calculate Distances:9
        var dist= Math.sqrt(dxRight*dxRight + dy*dy); // distance from right source  // > CustomCode.Calculate Distances:10
        rightPhase[i+j*width]=-(dist-2*width)/lambdapx;  // > CustomCode.Calculate Distances:11
        dist= Math.sqrt(dxLeft*dxLeft + dy*dy); // distance from left  // > CustomCode.Calculate Distances:12
        leftPhase[i+j*width]=-(dist-2*width)/lambdapx;  // > CustomCode.Calculate Distances:13
        //_println("distance ="+distance[i+j*width]);  // > CustomCode.Calculate Distances:14
      }  // > CustomCode.Calculate Distances:15
    }  // > CustomCode.Calculate Distances:16
  }  // > CustomCode.Calculate Distances:17

  function resetImage () {  // > CustomCode.Compute Image:1
    calculateDistances ();  // > CustomCode.Compute Image:2
    computeImage ();  // > CustomCode.Compute Image:3
  }  // > CustomCode.Compute Image:4
  function computeImage () {  // > CustomCode.Compute Image:5
    //convert lambda from cm to px  // > CustomCode.Compute Image:6
    var twoPI=2*Math.PI;  // > CustomCode.Compute Image:7
    var timePhase= twoPI*t/T;  // > CustomCode.Compute Image:8
    for (var i=0; i<width; i++) {  // > CustomCode.Compute Image:9
      for (var j=0; j<height; j++) {   // > CustomCode.Compute Image:10
        var phase=rightPhase[i+j*width]+timePhase;  // > CustomCode.Compute Image:11
        var rightIndex=Math.floor((nColors*phase)%nColors); //  range is 0>ncolors  // > CustomCode.Compute Image:12
        var rightIntensity = greyList[rightIndex];  // > CustomCode.Compute Image:13
        phase=leftPhase[i+j*width]+timePhase;  // > CustomCode.Compute Image:14
        var leftIndex=Math.floor((nColors*phase)%nColors); //  range is 0>ncolors  // > CustomCode.Compute Image:15
        var leftIntensity = greyList[leftIndex];  // > CustomCode.Compute Image:16
        var color=Math.floor((rightIntensity+leftIntensity)/2);  // > CustomCode.Compute Image:17
        //_println("phase ="+phase+"  index ="+colorIndex+"  color ="+color);  // > CustomCode.Compute Image:18
        var index = 4*i+4*width*j;  // > CustomCode.Compute Image:19
        imageData.data[index+0] = color;  //red  // > CustomCode.Compute Image:20
        imageData.data[index+1] = color;  //green  // > CustomCode.Compute Image:21
        imageData.data[index+2] = color;  // blue  // > CustomCode.Compute Image:22
      }  // > CustomCode.Compute Image:23
    }  // > CustomCode.Compute Image:24
    _view.canvas.getContext().putImageData(imageData, 0, 0);  // > CustomCode.Compute Image:25
    drawSource ();  // > CustomCode.Compute Image:26
  }  // > CustomCode.Compute Image:27

  function drawSource () {  // > CustomCode.Draw Source:1
    var context = _view.canvas.getContext('2d');  // > CustomCode.Draw Source:2
    context.fillStyle = '#ff0000';		// red  // > CustomCode.Draw Source:3
    var pixelX=width/2.0- width*separation/2/(xmax - xmin);  // source position  // > CustomCode.Draw Source:4
    var pixelY = height/2.0;  // > CustomCode.Draw Source:5
    context.beginPath();  // > CustomCode.Draw Source:6
    context.arc(pixelX, pixelY, 20, 0, 2*Math.PI); //20 is the size  // > CustomCode.Draw Source:7
    context.fill();  // > CustomCode.Draw Source:8
    pixelX=width/2.0+ width*separation/2/(xmax - xmin);  // source position  // > CustomCode.Draw Source:9
    context.beginPath();  // > CustomCode.Draw Source:10
    context.arc(pixelX, pixelY, 20, 0, 2*Math.PI); //20 is the size  // > CustomCode.Draw Source:11
    context.fill();   // > CustomCode.Draw Source:12
  }  // > CustomCode.Draw Source:13

  function dragSource () {  // > CustomCode.Drag Source:1

   // var dx = (-width/2.0)*(xmax - xmin)/width;  // > CustomCode.Drag Source:4
    //y = position[1];  // > CustomCode.Drag Source:5
