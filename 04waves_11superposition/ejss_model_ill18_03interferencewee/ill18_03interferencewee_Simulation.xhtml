  function computeCurves () {  // > CustomCode.Compute Curves:1
    var y1; var y2; var sum;  // > CustomCode.Compute Curves:2
    var dx = (xmax - xmin) / (points - 1);  // > CustomCode.Compute Curves:3
    var xi = xmin;  // > CustomCode.Compute Curves:4
    _view.y1Trail.clear();  // > CustomCode.Compute Curves:5
    _view.y2Trail.clear();  // > CustomCode.Compute Curves:6
    _view.sumTrail.clear();  // > CustomCode.Compute Curves:7
    for (var i = 0; i < points; i++) {  // > CustomCode.Compute Curves:8
      y1 = 0.5*Math.sin(2*Math.PI*xi*f1 / v - 2*Math.PI*f1*t);  // > CustomCode.Compute Curves:9
      y2 = 0.5*Math.sin(2*Math.PI*xi*f2 / v - 2*Math.PI*f2*t);  // > CustomCode.Compute Curves:10
      sum = y1 + y2;  // > CustomCode.Compute Curves:11
      _view.y1Trail.addPoint(xi, y1);  // > CustomCode.Compute Curves:12
      _view.y2Trail.addPoint(xi, y2);  // > CustomCode.Compute Curves:13
      _view.sumTrail.addPoint(xi, sum);  // > CustomCode.Compute Curves:14
      xi+=dx;  // > CustomCode.Compute Curves:15
    }  // > CustomCode.Compute Curves:16
  }  // > CustomCode.Compute Curves:17
