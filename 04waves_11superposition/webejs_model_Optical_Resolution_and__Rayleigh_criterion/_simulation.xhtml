  _model.addToFixedRelations(function() {
    if (!__pagesEnabled['Cons Page']) return;
    let cst, alpha1, ratio1, ratio2, alpha2; // > Fixed Relations page: Cons Page - line 1
    let dx = (xmax - xmin) / (nx - 1); // > Fixed Relations page: Cons Page - line 2
    let dy = (ymax - ymin) / (ny - 1); // > Fixed Relations page: Cons Page - line 3
    let x, y, r1, r2; // > Fixed Relations page: Cons Page - line 4
    cst = Math.PI * D / lambda; // > Fixed Relations page: Cons Page - line 5
    D = Dr * lambda; // > Fixed Relations page: Cons Page - line 6
     // > Fixed Relations page: Cons Page - line 7
     // > Fixed Relations page: Cons Page - line 8
     // > Fixed Relations page: Cons Page - line 9
     // > Fixed Relations page: Cons Page - line 10
     // > Fixed Relations page: Cons Page - line 11
     // > Fixed Relations page: Cons Page - line 12
     // > Fixed Relations page: Cons Page - line 13
    ; // > Fixed Relations page: Cons Page - line 14
    // Rayleigh criterion: minimum angular separation // > Fixed Relations page: Cons Page - line 15
    //theta_min = 1.22 / Dr; // > Fixed Relations page: Cons Page - line 16
    theta_min = 1.22 * lambda / (Dr *lambda); // > Fixed Relations page: Cons Page - line 17
    theta_min_scientific  = theta_min.toExponential(3); // > Fixed Relations page: Cons Page - line 18
     // > Fixed Relations page: Cons Page - line 19
    var factor = 5 // > Fixed Relations page: Cons Page - line 20
    for (let i = 0; i < nx; i++) { // > Fixed Relations page: Cons Page - line 21
      x = XP[i]; // > Fixed Relations page: Cons Page - line 22
      for (let j = 0; j < ny; j++) { // > Fixed Relations page: Cons Page - line 23
        y = ymin + j * dy; // > Fixed Relations page: Cons Page - line 24
        r1 = Math.sqrt((x - xd) * (x - xd) + y * y); // > Fixed Relations page: Cons Page - line 25
        r2 = Math.sqrt((x + xd) * (x + xd) + y * y); // > Fixed Relations page: Cons Page - line 26
        alpha1 = cst * r1 / L; // > Fixed Relations page: Cons Page - line 27
        ratio1 = Math.sin(alpha1) / alpha1; // > Fixed Relations page: Cons Page - line 28
        alpha2 = cst * r2 / L; // > Fixed Relations page: Cons Page - line 29
        ratio2 = Math.sin(alpha2) / alpha2; // > Fixed Relations page: Cons Page - line 30
        I[i][j] = (ratio1 * ratio1 + ratio2 * ratio2) * yscale/factor; // > Fixed Relations page: Cons Page - line 31
         // > Fixed Relations page: Cons Page - line 32
        if (j === Math.floor(ny / 2)) { // > Fixed Relations page: Cons Page - line 33
          YP[i] = ymin + I[i][j] * xmax; // > Fixed Relations page: Cons Page - line 34
          YP1[i] = ymin + ratio1 * ratio1 * yscale * xmax/ factor; // > Fixed Relations page: Cons Page - line 35
          YP2[i] = ymin + ratio2 * ratio2 * yscale * xmax/ factor; // > Fixed Relations page: Cons Page - line 36
        } // > Fixed Relations page: Cons Page - line 37
      } // > Fixed Relations page: Cons Page - line 38
    } // > Fixed Relations page: Cons Page - line 39
     // > Fixed Relations page: Cons Page - line 40
    //lookang // > Fixed Relations page: Cons Page - line 41
    //theta = xd / L // > Fixed Relations page: Cons Page - line 42
    // Calculate angles for the two sources // > Fixed Relations page: Cons Page - line 43
    theta1 = r1 / L; // Angle for the first source // > Fixed Relations page: Cons Page - line 44
    theta2 = r2 / L; // Angle for the second source // > Fixed Relations page: Cons Page - line 45
    // Calculate total angular separation // > Fixed Relations page: Cons Page - line 46
    theta = Math.abs(theta1 - theta2); // > Fixed Relations page: Cons Page - line 47
     // > Fixed Relations page: Cons Page - line 48
    // Compare with Rayleigh criterion's minimum angular separation // > Fixed Relations page: Cons Page - line 49
    if (theta >= theta_min) { // > Fixed Relations page: Cons Page - line 50
      resolveText =  "The two sources are resolvable since θ > θmin" // > Fixed Relations page: Cons Page - line 51
    } else { // > Fixed Relations page: Cons Page - line 52
      resolveText =  "The two sources are not resolvable since θ < θmin" // > Fixed Relations page: Cons Page - line 53
    } // > Fixed Relations page: Cons Page - line 54
  });

  function _getEngineSolverClass(classname) {
    classname = classname.toLowerCase();
    if (classname.indexOf('rungekuttafehlberg')>=0) return EJSS_ODE_SOLVERS.cashKarp45;
    if (classname.indexOf('cash')>=0)   return EJSS_ODE_SOLVERS.cashKarp45;
    if (classname.indexOf('boga')>=0)   return EJSS_ODE_SOLVERS.bogackiShampine23;
    if (classname.indexOf('dopri5')>=0) return EJSS_ODE_SOLVERS.doPri5;
    if (classname.indexOf('dopri8')>=0) return EJSS_ODE_SOLVERS.doPri853;

each source are then calculated as:</p>  <p><code>&theta;1 = r1 / L</code> and <code>&theta;2 = r2 / L</code></p>  <p>where <code>L</code> is the distance from the aperture to the observation screen. The total angular separation <code>&theta;</code> is the absolute difference between these two angles:</p>  <p><code>&theta; = |&theta;1 - &theta;2|</code></p>  <p>By comparing this angular separation <code>&theta;</code> to the Rayleigh criterion's minimum value <code>&theta;_{\\text{min}}</code>, the simulation determines whether the two sources are resolvable. If <code>&theta; &ge; &theta;_{\\text{min}}</code>, the two sources are resolvable, otherwise, they are not.</p>  <p>Users can modify variables like the wavelength (<code>λ</code>), aperture diameter (<code>a</code>), and source separation (<code>xd</code>) to see how diffraction limits impact the clarity and separation of the two light sources. The interactive nature of the model makes it an effective tool for studying optical phenomena such as interference and diffraction.</p>  <p>The simulation was originally developed in Java and later converted to JavaScript to improve accessibility on modern platforms. In addition, the new scalar field element introduced in EJS 6.1 allows for a more accurate representation of the intensity fields, enhancing the simulation's educational value.</p>")
