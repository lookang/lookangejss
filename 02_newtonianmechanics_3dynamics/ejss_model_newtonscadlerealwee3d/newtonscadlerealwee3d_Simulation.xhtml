    _view._addElement(EJSS_INTERFACE.panel,"html", _view._topFrame) // EJsS HtmlView.HtmlView Page: declaration of element 'html'
      .setProperty("Html","<h2>Newton's cradle</h2>  <p>Newton's cradle is a device that demonstrates conservation of momentum and energy using a series of swinging spheres. When one sphere at the end is lifted and released, it strikes the stationary spheres, transmitting a force through the stationary spheres that pushes the last sphere upward. The last sphere swings back and strikes the still nearly stationary spheres, repeating the effect in the opposite direction. The device is named after 17th-century English scientist Sir Isaac Newton. It is also known as Newton's pendulum, Newton's balls, Newton's rocker or executive ball clicker (since the device makes a click each time the balls collide, which they do repeatedly in a steady rhythm).</p> <p>A typical Newton's cradle consists of a series of identically sized metal balls suspended in a metal frame so that they are just touching each other at rest. Each ball is attached to the frame by two wires of equal length angled away from each other. This restricts the pendulums' movements to the same plane.</p> <h2>Controls</h2> <p>The first comboBox allows eay selection of number of balls in the Newton's cradle</p> <p> 1 ball to the left</p> <p> 2 balls to the left</p> <p> 3 balls to the left</p> <p> 4 balls to the left</p> <p> 5 balls to the left</p> <p> 6 balls to the left</p> <p> 7 balls to the left</p> <p> 1 ball 1 raises 1 ball to the left and 1 ball to the right</p> <p> 2 ball 1 raises 2 ball to the left and 1 ball to the right</p> <p> 2 ball 2 raises 2 balls to the left and 2 balls to the right</p> <p> 3 ball 3 raises 3 balls to the left and 3 balls to the right</p> <p>n is the number of balls allowed</p> <p>i is the index of the ball to change</p> <p>for which m[i] is the mass of the index ball</p> <p>play button starts the simulation</p> <p>reset button starts the simulation at afresh</p> <h2>Physics explanation</h2> <p>Newton's cradle can be modeled fairly accurately with simple mathematical equations with the assumption that the balls always collide in pairs.</p> <p> The motion of the balls are modelled using $ \\frac{d\\theta[i]}{dt} = \\omega[i]$ </p> <p>where $\\theta$ is the angle of the ball</p> <p> $ \\omega $ is the angular velocity </p> <p> i represents each element of the ball</p> <p> t is time </p> <p> the second order differential equation is $\\frac{d(\\omega[i])}{dt}=-\\frac{g*sin(\\theta[i])}{L}-k*L*\\omega[i] $ </p> <p> where g is gravitational constant 9.81 $m/s^2$ </p> <p> L is the length of the inextensible string connecting the ball to the support for rotational motion </p> <p> k is a resistant coefficient to rotational motion $ \\omega $ </p> <h2>Events of the ordinary differential equations</h2> <p>In a state event, a TOLERANCE =1.0e-6 is defined, a loop to check through each ball i, where a check of the $\\theta[i]$ is greater than $\\theta[i+1]$ plus the TOLERANCE, if true, return the balls to their closed up angular position $\\theta[i+1]-\\theta[i]$. If false, do nothing. </p> <h2>Fixed Relationship Calculations</h2> <p>There is a for loop over i=0 to i less than number of balls to calculate the following to constraint the masses to move in pendulum-part of a circular path</p> <p> $ dx[i]=L*(sin \\theta[i]) $ where dx[i] is the change is x[i] position</p> <p> $ dy[i]=-L*cos(\\theta[i])  $ where dy[i] is the change in y[i] position</p> <p> x[i]=xc[i]+dx[i] where xc[i] is each balls centre or equilibrium x position</p> <p> y[i]=ymax+dy[i] where ymax is the support y position</p> <p>  $ vx[i]=L*\\omega[i]*cos(\\theta[i]) $ where vx[i] is the x direction linear velocities of each ball</p> <p> $ vy[i]=L*\\omega[i]*sin(\\theta[i]) $ where vy[i] is the y direction linear velocities of each ball</p> <h2>Others</h2> <ul>   <li><a href=\"https://shope.ee/3AhkYwOP03?share_channel_code=1\" target=\"_blank\">Buy from Shopee</a></li>   <li><a href=\"https://iwant2study.org/ospsg/index.php/interactive-resources/physics/02-newtonian-mechanics/02-dynamics/47-newton-cradle\" target=\"_blank\">Need a 2D version?</a></li>   <li><a href=\"https://iwant2study.org/ospsg/index.php/interactive-resources/physics/02-newtonian-mechanics/02-dynamics/48-newton-cradle-3d\" target=\"_blank\">Need a 3D version?</a></li> </ul>") // EJsS HtmlView.HtmlView Page: setting property 'Html' for element 'html'
