      .setProperty("Html","<div style=\"font-family: Arial, sans-serif; line-height: 1.6; max-width: 960px; margin: 0 auto; color: #1f2937;\">   <style>     .sim-card {       background: linear-gradient(135deg, #f8fbff, #eef6ff);       border: 1px solid #cfe3ff;       border-radius: 16px;       padding: 20px;       margin-bottom: 18px;       box-shadow: 0 6px 18px rgba(0,0,0,0.06);     }     .sim-card h2, .sim-card h3 {       margin-top: 0;       color: #0f3d66;     }     .question-box {       background: #ffffff;       border: 1px solid #d7e3f4;       border-radius: 14px;       padding: 16px;       margin: 14px 0;     }     .question-title {       font-weight: bold;       color: #123b5d;       margin-bottom: 10px;     }     .answer-box {       display: none;       margin-top: 12px;       padding: 12px 14px;       background: #eef9f0;       border-left: 5px solid #2f9e44;       border-radius: 8px;     }     .reveal-btn {       background: #0f6cbf;       color: white;       border: none;       border-radius: 8px;       padding: 8px 14px;       cursor: pointer;       font-size: 14px;     }     .reveal-btn:hover {       background: #0b568f;     }     .sim-note {       background: #fff7cc;       border-left: 6px solid #f2b400;       padding: 12px 14px;       border-radius: 8px;       margin: 14px 0;     }   </style>    <div class=\"sim-card\">     <h2>Suggested Activities</h2>     <p>       Use the simulation to explore how masses, initial velocities, and collision type affect the       motion of two carts in one dimension.     </p>      <div class=\"sim-note\">       <strong>Try this first:</strong> Before pressing play, predict what will happen to the       total momentum and total kinetic energy.     </div>      <ol>       <li>Choose the <strong>elastic</strong> mode and set different masses for the two carts. Predict the final velocities before running the simulation.</li>       <li>Keep the same masses and initial velocities, then switch to <strong>inelastic</strong> mode. Compare the motion and the graphs.</li>       <li>Set the collision to <strong>perfectly inelastic</strong> and observe what happens after impact. Check whether the carts move together.</li>       <li>Use the <strong>momentum-time graph</strong> to test whether total momentum changes during the collision.</li>       <li>Use the <strong>kinetic energy-time graph</strong> to compare how much kinetic energy is lost in different collision types.</li>       <li>Observe the <strong>force-time graph</strong> and relate the force pulse to the collision interval.</li>       <li>Change only one variable at a time, such as mass or initial velocity, and explain how the outcome changes.</li>     </ol>   </div>    <div class=\"sim-card\">     <h3>Thinking Questions</h3>      <div class=\"question-box\">       <div class=\"question-title\">1. What quantity is conserved in all the collision modes shown in this simulation?</div>       <button class=\"reveal-btn\" onclick=\"toggleAnswer('a1')\">Show Suggested Answer</button>       <div class=\"answer-box\" id=\"a1\">         Total momentum is conserved in all the collision modes, as long as the system is treated as isolated.       </div>     </div>      <div class=\"question-box\">       <div class=\"question-title\">2. In which collision mode is total kinetic energy conserved?</div>       <button class=\"reveal-btn\" onclick=\"toggleAnswer('a2')\">Show Suggested Answer</button>       <div class=\"answer-box\" id=\"a2\">         Total kinetic energy is conserved only in the elastic collision mode.       </div>     </div>      <div class=\"question-box\">       <div class=\"question-title\">3. What happens to the carts after a perfectly inelastic collision?</div>       <button class=\"reveal-btn\" onclick=\"toggleAnswer('a3')\">Show Suggested Answer</button>       <div class=\"answer-box\" id=\"a3\">         The carts move together with the same final velocity after the collision.       </div>     </div>      <div class=\"question-box\">       <div class=\"question-title\">4. Why can the individual momenta of the carts change while the total momentum stays constant?</div>       <button class=\"reveal-btn\" onclick=\"toggleAnswer('a4')\">Show Suggested Answer</button>       <div class=\"answer-box\" id=\"a4\">         The carts exert equal and opposite forces on each other during the collision, so momentum is transferred between the carts while the total momentum of the system remains constant.       </div>     </div>      <div class=\"question-box\">       <div class=\"question-title\">5. How can the kinetic energy graph help you distinguish elastic and inelastic collisions?</div>       <button class=\"reveal-btn\" onclick=\"toggleAnswer('a5')\">Show Suggested Answer</button>       <div class=\"answer-box\" id=\"a5\">         In an elastic collision, the total kinetic energy before and after collision is the same. In an inelastic collision, the total kinetic energy after collision is smaller.       </div>     </div>      <div class=\"question-box\">       <div class=\"question-title\">6. If one cart has a much larger mass than the other, how does that affect the final velocities?</div>       <button class=\"reveal-btn\" onclick=\"toggleAnswer('a6')\">Show Suggested Answer</button>       <div class=\"answer-box\" id=\"a6\">         The more massive cart usually changes velocity less, while the less massive cart usually changes velocity more.       </div>     </div>      <div class=\"question-box\">       <div class=\"question-title\">7. What does the force-time graph tell you about the collision?</div>       <button class=\"reveal-btn\" onclick=\"toggleAnswer('a7')\">Show Suggested Answer</button>       <div class=\"answer-box\" id=\"a7\">         It shows that the collision happens over a short time interval, during which the carts exert large equal-and-opposite forces on each other.       </div>     </div>      <div class=\"question-box\">       <div class=\"question-title\">8. How can you use the simulation to test whether your prediction is correct?</div>       <button class=\"reveal-btn\" onclick=\"toggleAnswer('a8')\">Show Suggested Answer</button>       <div class=\"answer-box\" id=\"a8\">         Set the masses, velocities, and collision type, predict the outcome, then run the simulation and compare the world view and graphs with your prediction.       </div>     </div>   </div> </div>  <script>   function toggleAnswer(id) {     var box = document.getElementById(id);     if (box.style.display === \"block\") {       box.style.display = \"none\";     } else {       box.style.display = \"block\";     }   } </script>")
