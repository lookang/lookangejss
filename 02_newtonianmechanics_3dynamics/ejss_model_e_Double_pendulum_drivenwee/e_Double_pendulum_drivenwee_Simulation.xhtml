  function getB1 ( a1, a2,  va1, va2) {  // > CustomCode.formula:1
  if ( L2/L1 > 0.0 && m2>0.0 ) {   //excludes singularity and noise  // > CustomCode.formula:2
  //return  1/(m1+m2*Math.sin(a1-a2)*Math.sin(a1-a2))*  // > CustomCode.formula:3
  //(-g/L1*((m1+m2)*Math.sin(a1)- m2*Math.sin(a2)*Math.cos(a1-a2))  // > CustomCode.formula:4
  //-m2*Math.sin(a1-a2)*(L2/L1*va2*va2+va1*va1*Math.cos(a1-a2)));  // > CustomCode.formula:5
  return (-g/L1*((m1+m2)*Math.sin(a1)- m2*Math.sin(a2)*Math.cos(a1-a2))  // > CustomCode.formula:6
  -m2*Math.sin(a1-a2)*(L2/L1*va2*va2+va1*va1*Math.cos(a1-a2)))/(m1+m2*Math.sin(a1-a2)*Math.sin(a1-a2));  // > CustomCode.formula:7
  }  // > CustomCode.formula:8
  else  // > CustomCode.formula:9
  return -g/L1*Math.sin(a1);//equation of the simple Pendulum  // > CustomCode.formula:10
  }  // > CustomCode.formula:11
  function getB2 (a1, a2, va1,va2) {  // > CustomCode.formula:12
  if ( L2/L1 > 0.0 && m2>0.0 ) {   //excludes singularity and noise  // > CustomCode.formula:13
  return -g/L2*Math.sin(a2)+L1/L2*va1*va1*Math.sin(a1-a2)  // > CustomCode.formula:14
  -L1/L2*Math.cos(a1-a2)*  // > CustomCode.formula:15
  (-g/L1*((m1+m2)*Math.sin(a1)- m2*Math.sin(a2)*Math.cos(a1-a2))  // > CustomCode.formula:16
  -m2*Math.sin(a1-a2)*(L2/L1*va2*va2+va1*va1*Math.cos(a1-a2)))/(m1+m2*Math.sin(a1-a2)*Math.sin(a1-a2));  // > CustomCode.formula:17
  }  // > CustomCode.formula:18
  else   // > CustomCode.formula:19
  return 0; //Zero for the single pendulum  // > CustomCode.formula:20
  }  // > CustomCode.formula:21

  function _setSolverClass(_odeName, _engine) {
    var ode = _getODE(_odeName);
    if (ode===null) return;
    if (!_engine.setODE) {
      var classname = _engine.toLowerCase();
      if      (classname.indexOf("boga")>=0)   _engine = EJSS_ODE_SOLVERS.bogackiShampine23;
      else if (classname.indexOf("cash")>=0)   _engine = EJSS_ODE_SOLVERS.cashKarp45;
      else if (classname.indexOf("dopri5")>=0) _engine = EJSS_ODE_SOLVERS.dopri5;
      else if (classname.indexOf("dopri8")>=0) _engine = EJSS_ODE_SOLVERS.dopri853;
