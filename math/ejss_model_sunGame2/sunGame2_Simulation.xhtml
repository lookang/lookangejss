  function toggleEdge(edgeIdx) {  // > CustomCode.toggleEdge:1
    if(gameOver)  // > CustomCode.toggleEdge:2
      return;  // > CustomCode.toggleEdge:3
        // > CustomCode.toggleEdge:4
    linesActive[edgeIdx] = (linesActive[edgeIdx] + 1) % 3;  // > CustomCode.toggleEdge:5
    var val;  // > CustomCode.toggleEdge:6
    // Setting the colors of the edges  // > CustomCode.toggleEdge:7
    // inactive  // > CustomCode.toggleEdge:8
    if(linesActive[edgeIdx] == 0) {  // > CustomCode.toggleEdge:9
      linesAttribute[edgeIdx]["stroke-dasharray"] = "10 5";  // > CustomCode.toggleEdge:10
      linesColor[edgeIdx] = linesColorInactive;  // > CustomCode.toggleEdge:11
      val = 0;  // > CustomCode.toggleEdge:12
    }  // > CustomCode.toggleEdge:13
    // active  // > CustomCode.toggleEdge:14
    else if(linesActive[edgeIdx] == 1) {  // > CustomCode.toggleEdge:15
      linesAttribute[edgeIdx]["stroke-dasharray"] = 0;  // > CustomCode.toggleEdge:16
      linesColor[edgeIdx] = linesColorActive;  // > CustomCode.toggleEdge:17
      val = 1;  // > CustomCode.toggleEdge:18
    }  // > CustomCode.toggleEdge:19
    // flagged  // > CustomCode.toggleEdge:20
    else if(linesActive[edgeIdx] == 2) {  // > CustomCode.toggleEdge:21
      linesAttribute[edgeIdx]["stroke-dasharray"] = "10 30";  // > CustomCode.toggleEdge:22
      linesColor[edgeIdx] = linesColorFlagged;  // > CustomCode.toggleEdge:23
      val = -1;  // > CustomCode.toggleEdge:24
    }  // > CustomCode.toggleEdge:25
    // Checking if the number of edges connected to the node matches the grid value  // > CustomCode.toggleEdge:26
    for(var i = 0; i < edgeList[edgeIdx].length; i++) {  // > CustomCode.toggleEdge:27
      var curNode = edgeList[edgeIdx][i];  // > CustomCode.toggleEdge:28
      nodeVal[curNode] += val;  // > CustomCode.toggleEdge:29
      if(nodeVal[curNode] == grid[curNode]) {  // > CustomCode.toggleEdge:30
        circleColor[curNode] = colorValid;  // > CustomCode.toggleEdge:31
      }   // > CustomCode.toggleEdge:32
      else if(nodeVal[curNode] > grid[curNode]) {  // > CustomCode.toggleEdge:33
        circleColor[curNode] = colorInvalid;  // > CustomCode.toggleEdge:34
      }   // > CustomCode.toggleEdge:35
      else {  // > CustomCode.toggleEdge:36
        circleColor[curNode] = colorNormal;  // > CustomCode.toggleEdge:37
      }  // > CustomCode.toggleEdge:38
    }  // > CustomCode.toggleEdge:39
    // checking for game over  // > CustomCode.toggleEdge:40
    var completed = true;  // > CustomCode.toggleEdge:41
    for(var i = 0; i < numOfNodes; i++) {  // > CustomCode.toggleEdge:42
      if(nodeVal[i] != grid[i]) {  // > CustomCode.toggleEdge:43
        completed = false;  // > CustomCode.toggleEdge:44
        break;  // > CustomCode.toggleEdge:45
      }  // > CustomCode.toggleEdge:46
    }  // > CustomCode.toggleEdge:47
    if(completed) {  // > CustomCode.toggleEdge:48
      _tools.showOkDialog("Completed! Well done!");  // > CustomCode.toggleEdge:49
      gameOver = true;  // > CustomCode.toggleEdge:50
    }  // > CustomCode.toggleEdge:51
  }  // > CustomCode.toggleEdge:52

    for(var i = 0; i < numOfRows; i++) {  // > Initialization.Init Page:41
      for(var j = 0; j < numOfCols; j++) {     // > Initialization.Init Page:42
        var curX = j * linesLength;   // > Initialization.Init Page:43

          // > Initialization.Init Page:45
        // horizontal lines  // > Initialization.Init Page:46
        if(j < numOfCols - 1) {  // > Initialization.Init Page:47
          linesX.push(curX); linesXSize.push(linesLength);  // > Initialization.Init Page:48
          linesY.push(curY); linesYSize.push(0);  // > Initialization.Init Page:49
            // > Initialization.Init Page:50
          edgeList.push([i * numOfRows + j, i * numOfRows + j + 1]);  // > Initialization.Init Page:51
            // > Initialization.Init Page:52
          //start lookang trying to create hotdots for clicking lines  // > Initialization.Init Page:53
          // hotdots position  // > Initialization.Init Page:54
          linesXoffset1.push(curX + linesLength * offset);  // > Initialization.Init Page:55
          linesYoffset1.push(curY);  // > Initialization.Init Page:56
            // > Initialization.Init Page:57
          linesXoffset2.push(curX + linesLength * (1 -offset));  // > Initialization.Init Page:58
          linesYoffset2.push(curY);  // > Initialization.Init Page:59
        }  // > Initialization.Init Page:60
        // vertical lines  // > Initialization.Init Page:61
        if(i < numOfRows - 1) {  // > Initialization.Init Page:62
          linesX.push(curX); linesXSize.push(0);  // > Initialization.Init Page:63
          linesY.push(curY); linesYSize.push(linesLength);  // > Initialization.Init Page:64
            // > Initialization.Init Page:65
          edgeList.push([i * numOfRows + j, (i + 1) * numOfRows + j]);  // > Initialization.Init Page:66
            // > Initialization.Init Page:67
          // hotdots position  // > Initialization.Init Page:68
          linesXoffset1.push(curX);  // > Initialization.Init Page:69
          linesYoffset1.push(curY + linesLength * offset);  // > Initialization.Init Page:70
            // > Initialization.Init Page:71
          linesXoffset2.push(curX);  // > Initialization.Init Page:72
          linesYoffset2.push(curY + linesLength * (1 - offset));  // > Initialization.Init Page:73
        }  // > Initialization.Init Page:74
          // > Initialization.Init Page:75
        // diagonally left  // > Initialization.Init Page:76
        if(j > 0 && i < numOfRows - 1){  // > Initialization.Init Page:77
          linesX.push(curX); linesXSize.push(-linesLength);  // > Initialization.Init Page:78
          linesY.push(curY); linesYSize.push(linesLength);  // > Initialization.Init Page:79
       // > Initialization.Init Page:80
          edgeList.push([i * numOfRows + j, (i + 1) * numOfRows + j - 1]);  // > Initialization.Init Page:81
            // > Initialization.Init Page:82
          // hotdots position  // > Initialization.Init Page:83
          linesXoffset1.push(curX - linesLength * offset);  // > Initialization.Init Page:84
          linesYoffset1.push(curY + linesLength * offset);  // > Initialization.Init Page:85
            // > Initialization.Init Page:86
          linesXoffset2.push(curX - linesLength * (1 - offset));  // > Initialization.Init Page:87
          linesYoffset2.push(curY + linesLength * (1 - offset));  // > Initialization.Init Page:88
        }  // > Initialization.Init Page:89
          // > Initialization.Init Page:90
        // diagonally right  // > Initialization.Init Page:91
        if(j < numOfCols - 1 && i < numOfRows - 1) {  // > Initialization.Init Page:92
          linesX.push(curX); linesXSize.push(linesLength);  // > Initialization.Init Page:93
          linesY.push(curY); linesYSize.push(linesLength);  // > Initialization.Init Page:94
            // > Initialization.Init Page:95
          edgeList.push([i * numOfRows + j, (i + 1) * numOfRows + j + 1]);  // > Initialization.Init Page:96
            // > Initialization.Init Page:97
          // hotdots position  // > Initialization.Init Page:98
          linesXoffset1.push(curX + linesLength * offset);  // > Initialization.Init Page:99
          linesYoffset1.push(curY + linesLength * offset);  // > Initialization.Init Page:100
            // > Initialization.Init Page:101
          linesXoffset2.push(curX + linesLength * (1 - offset));  // > Initialization.Init Page:102
          linesYoffset2.push(curY + linesLength * (1 - offset));  // > Initialization.Init Page:103
        }  // > Initialization.Init Page:104
          // > Initialization.Init Page:105
        nodeVal.push(0);  // > Initialization.Init Page:106
        // circle position (the vertices)  // > Initialization.Init Page:107
