function e_Complex_number_operations(_topFrame,_libraryPath,_codebasePath, _inputParameters) {

  function _breakAfterThisPage() { _model.setShouldBreak(true); }

  function _resetSolvers() { if (_model.resetSolvers) _model.resetSolvers(); }

  function _saveText(name,type,content) { if (_model.saveText) _model.saveText(name,type,content); }

  var t; // EjsS Model.Variables.VariableWC.t
  var dt; // EjsS Model.Variables.VariableWC.dt
  var zx; // EjsS Model.Variables.VariableWC.zx
  var zy; // EjsS Model.Variables.VariableWC.zy
  var theta; // EjsS Model.Variables.VariableWC.theta
  var wx0; // EjsS Model.Variables.VariableWC.wx0
  var wy0; // EjsS Model.Variables.VariableWC.wy0
  var wx; // EjsS Model.Variables.VariableWC.wx
  var wy; // EjsS Model.Variables.VariableWC.wy
  var showAdd; // EjsS Model.Variables.VariableWC.showAdd
  var showSub; // EjsS Model.Variables.VariableWC.showSub
  var showMult; // EjsS Model.Variables.VariableWC.showMult
  var showDiv; // EjsS Model.Variables.VariableWC.showDiv
  var showNegation; // EjsS Model.Variables.VariableWC.showNegation
  var showUnitCircle; // EjsS Model.Variables.VariableWC.showUnitCircle
  var font; // EjsS Model.Variables.VariableWC.font

  var _privateOdesList;
  var _ODEi_evolution1;
  var userEvents1=[];

  _model.getOdes = function() { return [_ODEi_evolution1]; };

  _model.removeEvents = function(){
    userEvents1=[];
  };

  function _serialize() { return _model.serialize(); }

  _model._userSerialize = function() {
    return {
      t : t,
      dt : dt,
      zx : zx,
      zy : zy,
      theta : theta,
      wx0 : wx0,
      wy0 : wy0,
      wx : wx,
      wy : wy,
      showAdd : showAdd,
      showSub : showSub,
      showMult : showMult,
      showDiv : showDiv,
      showNegation : showNegation,
      showUnitCircle : showUnitCircle,
      font : font
    };
  };

  _model._readParameters = function(json) {
    if(typeof json.t != "undefined") t = json.t;
    if(typeof json.dt != "undefined") dt = json.dt;
    if(typeof json.zx != "undefined") zx = json.zx;
    if(typeof json.zy != "undefined") zy = json.zy;
    if(typeof json.theta != "undefined") theta = json.theta;
    if(typeof json.wx0 != "undefined") wx0 = json.wx0;
    if(typeof json.wy0 != "undefined") wy0 = json.wy0;
    if(typeof json.wx != "undefined") wx = json.wx;
    if(typeof json.wy != "undefined") wy = json.wy;
    if(typeof json.showAdd != "undefined") showAdd = json.showAdd;
    if(typeof json.showSub != "undefined") showSub = json.showSub;
    if(typeof json.showMult != "undefined") showMult = json.showMult;
    if(typeof json.showDiv != "undefined") showDiv = json.showDiv;
    if(typeof json.showNegation != "undefined") showNegation = json.showNegation;
    if(typeof json.showUnitCircle != "undefined") showUnitCircle = json.showUnitCircle;
    if(typeof json.font != "undefined") font = json.font;
  };

  _model._inputAndPublicParameters = ["t",  "dt",  "zx",  "zy",  "theta",  "wx0",  "wy0",  "wx",  "wy",  "showAdd",  "showSub",  "showMult",  "showDiv",  "showNegation",  "showUnitCircle",  "font"]; 

  _model._outputAndPublicParameters = ["t",  "dt",  "zx",  "zy",  "theta",  "wx0",  "wy0",  "wx",  "wy",  "showAdd",  "showSub",  "showMult",  "showDiv",  "showNegation",  "showUnitCircle",  "font"];

  function _unserialize(json) { return _model.unserialize(json); }

  _model._userUnserialize = function(json) {
    _model._readParameters(json);
   _resetSolvers();
   _model.update();
  };

  _model.addToReset(function() {
    __pagesEnabled["Init Page"] = true;
    __pagesEnabled["Evol Page"] = true;
    __pagesEnabled["Event"] = true;
    __pagesEnabled["FixRel Page"] = false;
  });

  _model.addToReset(function() {
    t = 0; // EjsS Model.Variables.VariableWC.t
    dt = 0.05; // EjsS Model.Variables.VariableWC.dt
    zx = Math.ceil(Math.random()*2); // EjsS Model.Variables.VariableWC.zx
    zy = Math.ceil(Math.random()*2); // EjsS Model.Variables.VariableWC.zy
    theta = Math.atan2(zy,zx); // EjsS Model.Variables.VariableWC.theta
    wx0 = 0; // EjsS Model.Variables.VariableWC.wx0
    wy0 = 0; // EjsS Model.Variables.VariableWC.wy0
    wx = Math.ceil(Math.random()*2); // EjsS Model.Variables.VariableWC.wx
    wy = -Math.ceil(Math.random()*2); // EjsS Model.Variables.VariableWC.wy
    showAdd = true; // EjsS Model.Variables.VariableWC.showAdd
    showSub = false; // EjsS Model.Variables.VariableWC.showSub
    showMult = false; // EjsS Model.Variables.VariableWC.showMult
    showDiv = false; // EjsS Model.Variables.VariableWC.showDiv
    showNegation = false; // EjsS Model.Variables.VariableWC.showNegation
    showUnitCircle = false; // EjsS Model.Variables.VariableWC.showUnitCircle
    font = "normal normal 1.5vw"; // EjsS Model.Variables.VariableWC.font
  });

  if (_inputParameters) {
    _inputParameters = _model.parseInputParameters(_inputParameters);
    if (_inputParameters) _model.addToReset(function() { _model._readParameters(_inputParameters); });
  }

  _model.addToReset(function() {
    _privateOdesList=[];
    _ODEi_evolution1 = _ODE_evolution1();
    _privateOdesList.push(_ODEi_evolution1);
  });

  _model.addToReset(function() {
    _model.setAutoplay(false);
    _model.setPauseOnPageExit(true);
    _model.setFPS(20);
    _model.setStepsPerDisplay(1);
  });

  _model.addToInitialization(function() {
    if (!__pagesEnabled["Init Page"]) return;
    _view.operationPanel.getAxisX().setPosition([0,0.5]);  // > Initialization.Init Page:1
    _view.operationPanel.getTitleX().setPosition([0.95,0.5]);  // > Initialization.Init Page:2
    _view.operationPanel.getAxisY().setPosition([0.5,0]);  // > Initialization.Init Page:3
    _view.operationPanel.getTitleY().setPosition([0.5,0.95]);  // > Initialization.Init Page:4
  });

  _model.addToInitialization(function() {
    _initializeSolvers();
  });

  _model.addToEvolution(function() {
    if (!__pagesEnabled["Evol Page"]) return;
    _ODEi_evolution1.step();
  });

  _model.addToFixedRelations(function() { _isPaused = _model.isPaused(); _isPlaying = _model.isPlaying(); });

  _model.addToFixedRelations(function() {
    if (!__pagesEnabled["FixRel Page"]) return;
    if (wx<0.05 && wx>-0.05) {  // > FixedRelations.FixRel Page:1
      wx = 0.05;  // > FixedRelations.FixRel Page:2
    }  // > FixedRelations.FixRel Page:3
  });

  _model.addToFixedRelations(function() { _isPaused = _model.isPaused(); _isPlaying = _model.isPlaying(); });

  function _initializeSolvers() {
    for (var i=0,n=_privateOdesList.length; i<n; i++) _privateOdesList[i].initializeSolver();
  }

  function _automaticResetSolvers() {
    for (var i=0,n=_privateOdesList.length; i<n; i++) _privateOdesList[i].automaticResetSolver();
  }

  _model.resetSolvers = function() {
    for (var i=0,n=_privateOdesList.length; i<n; i++) _privateOdesList[i].resetSolver();
  };

  _getODE = function (_odeName) {
    if (_odeName=="Evol Page") return _ODEi_evolution1;
    return null;
  }

  function _getEventSolver(_odeName) {
    var ode = _getODE(_odeName);
    if (ode===null) return null;
    return ode.getEventSolver();
  }

  function _setSolverClass(_odeName, _engine) {
    var ode = _getODE(_odeName);
    if (ode===null) return;
    if (!_engine.setODE) {
      var classname = _engine.toLowerCase();
      if      (classname.indexOf("boga")>=0)   _engine = EJSS_ODE_SOLVERS.bogackiShampine23;
      else if (classname.indexOf("cash")>=0)   _engine = EJSS_ODE_SOLVERS.cashKarp45;
      else if (classname.indexOf("dopri5")>=0) _engine = EJSS_ODE_SOLVERS.dopri5;
      else if (classname.indexOf("dopri8")>=0) _engine = EJSS_ODE_SOLVERS.dopri853;
      else if (classname.indexOf("richa")>=0)  _engine = EJSS_ODE_SOLVERS.eulerRichardson;
      else if (classname.indexOf("euler")>=0)  _engine = EJSS_ODE_SOLVERS.euler;
      else if (classname.indexOf("fehlberg87")>=0) _engine = EJSS_ODE_SOLVERS.fehlberg87;
      else if (classname.indexOf("fehlberg8")>=0)  _engine = EJSS_ODE_SOLVERS.fehlberg8;
      else if (classname.indexOf("radau")>=0)   _engine = EJSS_ODE_SOLVERS.radau5;
      else if (classname.indexOf("runge")>=0)  _engine = EJSS_ODE_SOLVERS.rungeKutta4;
      else if (classname.indexOf("rk4")>=0)    _engine = EJSS_ODE_SOLVERS.rungeKutta4;
      else if (classname.indexOf("verlet")>=0) _engine = EJSS_ODE_SOLVERS.velocityVerlet;
    }
    if (_engine) ode.setSolverClass(_engine);
  }

  function _ODE_evolution1() {
    var __odeSelf = {};
    var __eventSolver;
    var __solverClass = EJSS_ODE_SOLVERS.rungeKutta4;
    var __state=[];
    var _ODE_evolution1_Event1;
    var __ignoreErrors=false;
    var __mustInitialize=true;
    var __isEnabled=true;
    var __mustUserReinitialize=false;
    var __mustReinitialize=true;


    __odeSelf._getOdeVars = function (){ return["wx0","wy0","t"]};

    __odeSelf.setSolverClass = function(__aSolverClass) {
      __solverClass = __aSolverClass;
      __instantiateSolver();
    };

    function __instantiateSolver() {
      __state=[];
      __pushState();
      __eventSolver = EJSS_ODE_SOLVERS.interpolatorEventSolver(__solverClass(),__odeSelf);
      __mustInitialize = true;
    }

    __odeSelf.setEnabled = function(_enabled) { __isEnabled = _enabled; };

    __odeSelf.getIndependentVariableValue = function() { return __eventSolver.getIndependentVariableValue(); };

    __odeSelf.getInternalStepSize = function() { return __eventSolver.getInternalStepSize(); };

    __odeSelf.isAccelerationIndependentOfVelocity = function() { return false; };

    __odeSelf.initializeSolver = function() {
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); return; }
      __pushState();
      __eventSolver.initialize(dt);
      __eventSolver.setBestInterpolation(false);
      __eventSolver.setMaximumInternalSteps(10000);
      __eventSolver.removeAllEvents();
      if (__pagesEnabled["Event"]) __eventSolver.addEvent(_ODE_evolution1_Event1());
      for(k in userEvents1){__eventSolver.addEvent(userEvents1[k]);}
      __eventSolver.setEstimateFirstStep(false);
      __eventSolver.setEnableExceptions(false);
      __eventSolver.setTolerances(0.00001,0.00001);
      __mustReinitialize = true;
      __mustInitialize = false;
    };

    function __pushState() {
      // Copy our variables to __state[] 
        var __j=0;
        var __n=0;
        var __cIn=0;
        if (__state[__cIn]!=wx0) __mustReinitialize = true;
        __state[__cIn++] = wx0;
        if (__state[__cIn]!=wy0) __mustReinitialize = true;
        __state[__cIn++] = wy0;
        if (__state[__cIn]!=t) __mustReinitialize = true;
        __state[__cIn++] = t;
    }

    function __arraysChanged () {
      return false;
    }

    __odeSelf.getEventSolver = function() {
      return __eventSolver;
    };

    __odeSelf.resetSolver = function() {
      __mustUserReinitialize = true;
    };

    __odeSelf.automaticResetSolver = function() {
      __mustReinitialize = true;
    };

    function __errorAction () {
      if (__ignoreErrors) return;
      console.log (__eventSolver.getErrorMessage());
      _pause();
      // Make sure the solver is reinitialized;
      __mustReinitialize = true;
    }

    __odeSelf.step = function() { return __privateStep(false); };

    __odeSelf.solverStep = function() { return __privateStep(true); };

    function __privateStep(__takeMaximumStep) {
      if (!__isEnabled) return 0;
      if (dt===0) return 0;
      if (__mustInitialize) __odeSelf.initializeSolver();
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); }
      __eventSolver.setStepSize(dt);
      __eventSolver.setInternalStepSize(dt);
      __eventSolver.setMaximumInternalSteps(10000);
      __eventSolver.setTolerances(0.00001,0.00001);
      __pushState();
      if (__mustUserReinitialize) { 
        __eventSolver.userReinitialize();
        __mustUserReinitialize = false;
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      else if (__mustReinitialize) { 
        __eventSolver.reinitialize();
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      var __stepTaken = __takeMaximumStep ? __eventSolver.maxStep() : __eventSolver.step();
      // Extract our variables from __state
        var __i=0;
        var __cOut=0;
        wx0 = __state[__cOut++];
        wy0 = __state[__cOut++];
        t = __state[__cOut++];
      // Check for error
      if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      return __stepTaken;
    }

    __odeSelf.getState = function() { return __state; };

    __odeSelf.getRate = function(_aState,_aRate) {
      // Extract our variables from _aState
        var __i=0;
        var __cOut=0;
        var wx0 = _aState[__cOut++];
        var wy0 = _aState[__cOut++];
        var t = _aState[__cOut++];
      // Compute the rate
        var __cRate=0;
        _aRate[__cRate++] = Math.cos(theta); // Rate for ODE: Evol Page:wx0
        _aRate[__cRate++] = Math.sin(theta); // Rate for ODE: Evol Page:wy0
        _aRate[__cRate++] = 1; // independent variable
        return _aRate;
    }; //end of getRate

    __odeSelf._addEvent = function(userCondition,userAction,eventType,eventMethod,maxIter,eventTolerance,endAtEvent){
    var User_Event = function (userCondition,userAction,eventType,eventMethod,maxIter,eventTolerance,endAtEvent) {
      var _eventSelf = {};

      _eventSelf.getTypeOfEvent = function() { return eventType; };

      _eventSelf.getRootFindingMethod = function() { return eventMethod; };

      _eventSelf.getMaxIterations = function() { return maxIter; };

      _eventSelf.getTolerance = function() { return eventTolerance; };

      _eventSelf.evaluate = function(_aState) { 
      // Extract our variables from _aState
        var __i=0;
        var __cOut=0;
        var wx0 = _aState[__cOut++];
        var wy0 = _aState[__cOut++];
        var t = _aState[__cOut++];
      return eval(userCondition);
      };

      _eventSelf.action = function() { 
      // Extract our variables from __state
        var __i=0;
        var __cOut=0;
        wx0 = __state[__cOut++];
        wy0 = __state[__cOut++];
        t = __state[__cOut++];
        var _returnValue = __userDefinedAction();
      // Copy our variables to __state[] 
        var __j=0;
        var __n=0;
        var __cIn=0;
        __state[__cIn++] = wx0;
        __state[__cIn++] = wy0;
        __state[__cIn++] = t;
        return _returnValue;
      };

      function __userDefinedAction() {
        if (undefined != functions) eval(functions.toString());
        eval(userAction);
        return endAtEvent;
      }

      return _eventSelf;
    }; // End of event

   userEvents1.push(User_Event(userCondition,userAction,eventType,eventMethod,maxIter,eventTolerance,endAtEvent));
   }

    _ODE_evolution1_Event1 = function() {
      var _eventSelf = {};

      _eventSelf.getTypeOfEvent = function() { return EJSS_ODE_SOLVERS.EVENT_TYPE.CROSSING_EVENT; };

      _eventSelf.getRootFindingMethod = function() { return EJSS_ODE_SOLVERS.EVENT_METHOD.BISECTION; };

      _eventSelf.getMaxIterations = function() { return 100; };

      _eventSelf.getTolerance = function() { return 1.0e-5; };

      _eventSelf.evaluate = function(_aState) { 
      // Extract our variables from _aState
        var __i=0;
        var __cOut=0;
        var wx0 = _aState[__cOut++];
        var wy0 = _aState[__cOut++];
        var t = _aState[__cOut++];
        return zx-wx0;  // > Event zero-condition for page Evol Page:1
      };

      _eventSelf.action = function() { 
      // Extract our variables from __state
        var __i=0;
        var __cOut=0;
        wx0 = __state[__cOut++];
        wy0 = __state[__cOut++];
        t = __state[__cOut++];
        var _returnValue = __userDefinedAction();
      // Copy our variables to __state[] 
        var __j=0;
        var __n=0;
        var __cIn=0;
        __state[__cIn++] = wx0;
        __state[__cIn++] = wy0;
        __state[__cIn++] = t;
        return _returnValue;
      };

      function __userDefinedAction() {
        _pause();  // > Event action for page Evol Page:1
        return true;
      }

      return _eventSelf;
    }; // End of event

    __instantiateSolver();

    return __odeSelf;
  }

  function _historic_wx0(__time) {
    var __index = 0;
    return _ODEi_evolution1.getEventSolver().getStateHistory().interpolate(__time,__index);
  }

  function _historic_wy0(__time) {
    var __index = 0 + 1;
    return _ODEi_evolution1.getEventSolver().getStateHistory().interpolate(__time,__index);
  }

    _model._fontResized = function(iBase,iSize,iDelta) {
      _view._fontResized(iBase,iSize,iDelta);
  }; // end of _fontResized

  function _getViews() {
    var _viewsInfo = [];
    var _counter = 0;
    _viewsInfo[_counter++] = { name : "Simulation View", width : 800, height : 600 };
    return _viewsInfo;
  } // end of _getViews

  function _selectView(_viewNumber) {
    _view = null;
    _view = new e_Complex_number_operations_View(_topFrame,_viewNumber,_libraryPath,_codebasePath);
    var _view_super_reset = _view._reset;
    _view._reset = function() {
      _view_super_reset();
      switch(_viewNumber) {
        case -10 : break; // make Lint happy
        default :
        case 0:
          _view.controlPanel.linkProperty("Font",  function() { return font; }, function(_v) { font = _v; } ); // Simulation View linking property 'Font' for element 'controlPanel'
          _view.comboBox2.linkProperty("Options",  function() { return ["Parallelogram Rule for+","Addition as translation","Negation","unit circle |z|=1","triangle inequality |z+w|≤|z|+|w|","Subtraction z-w","Multiplying a complex number by a real number","Powers of i, i^n=i^(n-4)","Multiplication of real number and its absolute value |zw| =|z||w|","multiplication |zw|=|z||w| and arg(zw) = arg(z)+arg(w)","z is conjugates of w","1/w"]; } ); // Simulation View linking property 'Options' for element 'comboBox2'
          _view.comboBox2.setAction("OnChange", function(_data,_info) {
  //["+","-","×","÷"]
  var opts = _view.comboBox2.getProperty("SelectedOptions");  // array of options
      var option = (opts.length > 0)? opts[0]:""; // selected option 
  if ( option=="Parallelogram Rule for+"){
   showAdd=true;
  showSub=false;
  showMult=false;
  showDiv=false;
  showUnitCircle=false;
  showNegation=false;
  _view.comboBox.setSelectedOptions(["+"]);
    }
    //"Addition as translation"
    else if ( option=="Addition as translation"){
   showAdd=true;
   _play();
  showSub=false;
  showMult=false;
  showDiv=false;
  showUnitCircle=false;
  showNegation=false;
  _view.comboBox.setSelectedOptions(["+"]);
    }
    //"Negation"
    else if ( option=="Negation"){
   showAdd=false;
  showSub=false;
  showMult=false;
  showDiv=false;
  showUnitCircle=false;
  showNegation=true;
  _view.comboBox.setSelectedOptions(["+"]);
    }
    //"unit circle |z|=1"
    else if ( option=="unit circle |z|=1"){
   showAdd=false;
  showSub=false;
  showMult=false;
  showDiv=false;
  showNegation=false;
  showUnitCircle=true;
  _view.comboBox.setSelectedOptions(["+"]);
    }
    //"triangle inequality |z+w|≤|z|+|w|"
    else if ( option=="triangle inequality |z+w|≤|z|+|w|"){
   showAdd=true;
  showSub=false;
  showMult=false;
  showDiv=false;
  showUnitCircle=false;
  showNegation=false;
  _view.comboBox.setSelectedOptions(["+"]);
    }
    else if ( option=="Subtraction z-w"){
    showAdd=false;
  showSub=true;
  showMult=false;
  showDiv=false;
  showUnitCircle=false;
  showNegation=false;
  _view.comboBox.setSelectedOptions(["-"]);
    }
    else if ( option=="multiplication |zw|=|z||w| and arg(zw) = arg(z)+arg(w)"){
    showAdd=false;
  showSub=false;
  showMult=true;
