<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primary Math Thinking Aloud Travel Shortest Distance</title>
    <script src="index.js" defer></script>
    <script src="./lib/xapiwrapper.min.js"></script>
    <script src="./lib/xAPI.js"></script>
    <style>
        canvas {
            border: 1px solid black;
            display: flex;
            margin: 0 auto;
        }

        #scenarios-div {
            display: flex;
            justify-content: center;
            margin: 10px;
        }

        #description {
            text-align: center;
            font-size: 20px;
            font-weight: lighter;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <p id="description">Scenario Description</p>
    <div id="scenarios-div">
        <select name="scenarios" id="scenarios">
            <option value="Task A">Task A</option>
            <option value="Task B">Task B</option>
            <option value="Task C">Task C</option>
            <option value="Task D">Task D</option>
        </select>
        <button id="check">Check</button>
        <button id="reset">Reset</button>
    </div>
    <div style="width: 1200px; margin: 0 auto; margin-top: 10px; display: flex; justify-content: space-between;">
        <p id="points-travelled" style="padding: 0px; margin: 0px; text-align: left">Points Travelled: </p>
        <p id="scenarios-completed" style="padding: 0px; margin: 0px; text-align: left">Tasks Completed: </p>
    </div>

    <canvas id="plotCanvas" width="1200" height="600"></canvas>
    <div style="width: 1200px; margin: 0 auto; margin-top: 10px">
        <p id="past-attempts" style="padding: 0px; margin: 0px auto; text-align: left; display: block;"></p>
    </div>

</body>

</html>
