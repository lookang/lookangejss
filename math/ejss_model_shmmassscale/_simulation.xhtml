      .setProperty("Html","<!DOCTYPE html> <html lang=\"en\">   <head>     <meta charset=\"UTF-8\">     <title>Reading Mass Scales</title>     <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">     <style>       :root {         --bg: #f7fbff;         --card: #ffffff;         --ink: #17324d;         --accent: #0f8aa6;         --accent-soft: #dff5fa;         --gold: #fff4c7;         --line: #cfe0eb;       }        body {         margin: 0;         font-family: \"Segoe UI\", Arial, sans-serif;         background: linear-gradient(180deg, #eef8ff 0%, #f9fcff 100%);         color: var(--ink);         line-height: 1.6;       }        .wrap {         max-width: 960px;         margin: 0 auto;         padding: 24px 18px 40px;       }        .hero {         background: linear-gradient(135deg, #dff5fa 0%, #ffffff 100%);         border: 1px solid var(--line);         border-radius: 18px;         padding: 24px;         box-shadow: 0 10px 28px rgba(20, 50, 80, 0.08);       }        h1, h2, h3 {         margin-top: 0;         color: #0d4d73;       }        h1 {         font-size: 2rem;         margin-bottom: 10px;       }        h2 {         font-size: 1.35rem;         margin-bottom: 10px;       }        h3 {         font-size: 1.05rem;         margin-bottom: 8px;       }        p {         margin: 0 0 12px;       }        .tag {         display: inline-block;         background: var(--gold);         border: 1px solid #eadf9a;         border-radius: 999px;         padding: 6px 12px;         font-size: 0.95rem;         margin-bottom: 12px;       }        .grid {         display: grid;         grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));         gap: 16px;         margin-top: 18px;       }        .card {         background: var(--card);         border: 1px solid var(--line);         border-radius: 16px;         padding: 18px;         box-shadow: 0 6px 18px rgba(20, 50, 80, 0.05);       }        .steps, .tips, .goals, .ideas {         padding-left: 20px;         margin: 10px 0 0;       }        .steps li, .tips li, .goals li, .ideas li {         margin-bottom: 8px;       }        .highlight {         background: var(--accent-soft);         border-left: 5px solid var(--accent);         padding: 14px 16px;         border-radius: 12px;         margin: 18px 0;       }        .challenge {         background: #fffef7;         border: 1px solid #efe3a4;         border-radius: 16px;         padding: 18px;         margin-top: 18px;       }        .footer-note {         margin-top: 20px;         font-size: 0.96rem;         color: #47627a;       }        strong.code {         color: #0b6178;       }     </style>   </head>   <body>     <div class=\"wrap\">       <section class=\"hero\">         <div class=\"tag\">Primary Mathematics • Measurement • Reading Scales</div><iframe width=\"560\" height=\"315\" src=\"https://www.youtube.com/embed/jFI3ioSFcb0?si=gpTIdq9plfvvW_dR\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen></iframe>         <h1>Reading Mass Scales</h1>         <p>           This interactive helps learners read the mass shown on different scale faces.           Students can practise reading in <strong>grams</strong> and <strong>kilograms</strong>,           compare different scales, and explain how they know the answer.         </p>         <div class=\"highlight\">           <strong>Big idea:</strong> To read a scale correctly, first identify the <strong>maximum value</strong>,           then work out the <strong>value of each small division</strong>, and finally count carefully to the pointer.         </div>       </section>        <div class=\"grid\">         <section class=\"card\">           <h2>Learning Goals</h2>           <ul class=\"goals\">             <li>Read a scale accurately in grams or kilograms.</li>             <li>Work out the value of one small division.</li>             <li>Choose the correct unit for the answer.</li>             <li>Explain how the answer was found.</li>           </ul>         </section>          <section class=\"card\">           <h2>How To Use</h2>           <ul class=\"steps\">             <li>Choose a scale or a random question from the first menu.</li>             <li>Watch the pointer settle, or switch to still mode for an instant reading.</li>             <li>Enter the answer using the response field or dropdown.</li>             <li>Tap <strong class=\"code\">g</strong> or <strong class=\"code\">kg</strong> to change the unit shown.</li>             <li>Use <strong class=\"code\">Hint</strong> for guided help, not just the answer.</li>             <li>Use <strong class=\"code\">Replay</strong> to see the same reading again.</li>             <li>Use <strong class=\"code\">Reset</strong> for a new question on the same scale.</li>           </ul>         </section>          <section class=\"card\">           <h2>What To Look For</h2>           <ul class=\"tips\">             <li>What is the largest value on this scale face?</li>             <li>How many small divisions are there between two labelled marks?</li>             <li>What is each small division worth?</li>             <li>Is the answer better written in grams or kilograms?</li>           </ul>         </section>       </div>        <section class=\"card\" style=\"margin-top: 18px;\">         <h2>Activities To Try</h2>          <h3>1. Quick Start</h3>         <ul class=\"ideas\">           <li>Choose the <strong>1.00 kg</strong> scale.</li>           <li>Read 5 different random positions in <strong>grams</strong>.</li>           <li>Say the value of each small division before answering.</li>         </ul>          <h3>2. Unit Switch</h3>         <ul class=\"ideas\">           <li>Read one scale position in grams.</li>           <li>Switch the display and read the same position in kilograms.</li>           <li>Discuss how the number changes but the mass stays the same.</li>         </ul>          <h3>3. Compare The Scale Faces</h3>         <ul class=\"ideas\">           <li>Try the <strong>1.00 kg</strong>, <strong>4.00 kg</strong>, and <strong>5.0 kg</strong> scales.</li>           <li>For each one, identify the value of one small division.</li>           <li>Explain which scale is easiest to read and why.</li>         </ul>          <h3>4. Guided Practice With Hints</h3>         <ul class=\"ideas\">           <li>Attempt the reading first without help.</li>           <li>Use <strong>Hint 1</strong> to identify the scale range and the correct unit.</li>           <li>Use <strong>Hint 2</strong> to work out the value of each small division and count from the nearest labelled mark.</li>         </ul>          <h3>5. Everyday Objects</h3>         <ul class=\"ideas\">           <li>Select the <strong>apple</strong>, <strong>pineapple</strong>, or <strong>$1 coin</strong>.</li>           <li>Estimate the mass before reading the scale.</li>           <li>Compare your estimate with the actual reading.</li>         </ul>       </section>        <section class=\"challenge\">         <h2>Challenge Questions</h2>         <ul class=\"ideas\">           <li>How do you know whether each small division is worth 20 g, 50 g, or 100 g?</li>           <li>Which is harder to read: a scale with more divisions or fewer divisions? Why?</li>           <li>If the pointer is halfway between two small marks, what should you do?</li>           <li>Can you explain your answer in a full sentence using the correct unit?</li>         </ul>       </section>        <section class=\"card\" style=\"margin-top: 18px;\">         <h2>Teacher Suggestions</h2>         <ul class=\"ideas\">           <li>Ask pupils to say the division value aloud before giving the reading.</li>           <li>Encourage pupils to explain their thinking, not just state an answer.</li>           <li>Use still mode for first attempts and animated mode for replay and discussion.</li>           <li>Pair pupils and let one student read while the other checks the unit and counting.</li>         </ul>       </section>        <p class=\"footer-note\">         Success means more than getting the correct number. A strong answer includes the         <strong>correct value</strong>, the <strong>correct unit</strong>, and a clear explanation         of how the scale was read.       </p>     </div>   </body> </html>")
