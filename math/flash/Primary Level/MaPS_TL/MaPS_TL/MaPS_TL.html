function doEvalForFlash(str,ln) {

    var validEquation = true;
    var percentageDetected = false;
    var ratioDetected = false;
    var isAlphabet = /^([a-zA-Z])$/;
    var evaluateString;
    var numOfEquals = 0;
    for (var i=0; i<=str.length-1; i++) {
       
       if(numOfEquals < 1 ) {
       if(str.charAt(i) == '=' && !equalsDetected ) {
       retrieveIndex = i;
       equalsDetected = true;
       }     
       }
       if(str.charAt(i) == '=') {
       numOfEquals++;
       if (numOfEquals > 1) {
       equalsDetected = false;
       returnState = "false" + "@" + ln;
       validEquation = false;
       }
       }
    }

    leftEq = str.substring(0,retrieveIndex);
    rightEq = str.substring(retrieveIndex+1,str.length);
    leftEq = leftEq.replace(/^\s+|\s+$/g, '');

    if ( leftEq.length == 0 || rightEq.length == 0) {
    }

    evaluateString = leftEq.length - 1;
    }

    evaluateString = rightEq.length - 1;
    }
    for (var i =0 ; i<=evaluateString;i++) {
        if (leftEq.charAt(i).match(isAlphabet) || rightEq.charAt(i).match(isAlphabet)) {
         validEquation = false;
         break;
        }
        else {
        if (leftEq.charAt(i) == '%' || rightEq.charAt(i) == '%') { 
         percentageDetected = true; 
         validEquation = false;
        }
        if (leftEq.charAt(i) == ':' || rightEq.charAt(i) == ":") {

        }
        else {

        }

        var rightRatio;
        var leftRatio2;

        var firstLeftColonIndex = 0;

        var noColons = true;
        for (var i = 0 ; i <= evaluateString; i++) {
        if (leftEq.charAt(i) == ':' || leftEq.charAt(i).match(isValidNumber) || leftEq.charAt(i) == " " || rightEq.charAt(i) == ':' || rightEq.charAt(i).match(isValidNumber) || rightEq.charAt(i) == " ") {
        if (leftEq.charAt(i) == ':') {
        noColons = false;
        validEquation = false;

        firstLeftColonIndex = i;
        firstNum = leftEq.substring(0,i);
        secondNum = leftEq.substring(i+1,leftEq.length);
        }
        else if (leftColon == 1) {
        firstNum = leftEq.substring(0,firstLeftColonIndex);
        secondNum = leftEq.substring(firstLeftColonIndex+1,i);
        fifthNum = leftEq.substring(i+1,leftEq.length);
        twoColons = true;
        }
        else if (leftColon > 1) {
        noColons = true;
        twoColons = false;
        break;
        }
        else {
        validEquation = false;
        }
        leftColon +=1;
        }
        if (rightEq.charAt(i) == ':') {
        noColons = false;
        validEquation = false;
        if (rightColon == 0) {

        twoColons = true;
        }

        }

        }

        break;

        leftRatio = eval(firstNum / secondNum);

    }
    }

if (!equalsDetected) {
returnState = "asdasdsasdas" + "@" + ln;
}
