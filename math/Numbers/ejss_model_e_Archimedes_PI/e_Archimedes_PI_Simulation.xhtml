  function plus () { // to increment n in steps of 1  // > CustomCode.Lib Page:1
    n++;  // > CustomCode.Lib Page:2
    if (n>12) {  // > CustomCode.Lib Page:3
      n = 12;  // > CustomCode.Lib Page:4
    }  // > CustomCode.Lib Page:5

    //micro_off();  // > CustomCode.Lib Page:7
    //zoom = true;  // > CustomCode.Lib Page:8
  }  // > CustomCode.Lib Page:9
  function micro_off () { // for 1:1 drawing  // > CustomCode.Lib Page:10
    A = -1.5;  // > CustomCode.Lib Page:11
    B = -A;  // > CustomCode.Lib Page:12
    C = A;  // > CustomCode.Lib Page:13
    D = A;  // > CustomCode.Lib Page:14
  }  // > CustomCode.Lib Page:15
  function micro_on () { // zoom  // > CustomCode.Lib Page:16
    D = 1.1*y2[1];  // > CustomCode.Lib Page:17
    B = r2;  // > CustomCode.Lib Page:18
    A = r2 - D;  // > CustomCode.Lib Page:19
    C = 0;  // > CustomCode.Lib Page:20
  }  // > CustomCode.Lib Page:21

  function nCalc () {  // > CustomCode.Approximations:1
    if ( n==2 ) {  // > CustomCode.Approximations:2
      h=1/2.0*Math.sqrt(2.0);  // > CustomCode.Approximations:3
      s=Math.sqrt(2.0);  // > CustomCode.Approximations:4
    }  // > CustomCode.Approximations:5
    if ( n==3 ) {  // > CustomCode.Approximations:6
      h=1/2.0*Math.sqrt(2.0+Math.sqrt(2.0));  // > CustomCode.Approximations:7
      s=Math.sqrt(2.0-Math.sqrt(2.0));  // > CustomCode.Approximations:8
    }  // > CustomCode.Approximations:9
    if ( n==4 ) {  // > CustomCode.Approximations:10
      h=1/2.0*Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0)));  // > CustomCode.Approximations:11
      s=Math.sqrt(2.0-Math.sqrt(2.0+Math.sqrt(2.0)));  // > CustomCode.Approximations:12
    }  // > CustomCode.Approximations:13
    if ( n==5 ) {  // > CustomCode.Approximations:14
      h=1/2.0*Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0))));  // > CustomCode.Approximations:15
      s=Math.sqrt(2.0-Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0))));  // > CustomCode.Approximations:16
    }  // > CustomCode.Approximations:17
    if ( n==6 ) {  // > CustomCode.Approximations:18
      h=1/2.0*Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0)))));  // > CustomCode.Approximations:19
      s=Math.sqrt(2.0-Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0)))));  // > CustomCode.Approximations:20
    }  // > CustomCode.Approximations:21
    if ( n==7 ) {  // > CustomCode.Approximations:22
      h=1/2.0*Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0))))));  // > CustomCode.Approximations:23
      s=Math.sqrt(2.0-Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0))))));  // > CustomCode.Approximations:24
    }  // > CustomCode.Approximations:25
    if ( n==8 ) {  // > CustomCode.Approximations:26
      h=1/2.0*Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0)))))));  // > CustomCode.Approximations:27
      s=Math.sqrt(2.0-Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0)))))));  // > CustomCode.Approximations:28
    }  // > CustomCode.Approximations:29
    if ( n==9 ) {  // > CustomCode.Approximations:30
      h=1/2.0*Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0))))))));  // > CustomCode.Approximations:31
      s=Math.sqrt(2.0-Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0))))))));  // > CustomCode.Approximations:32
    }  // > CustomCode.Approximations:33
    if ( n==10 ) {  // > CustomCode.Approximations:34
      h=1/2.0*Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0)))))))));  // > CustomCode.Approximations:35
      s=Math.sqrt(2.0-Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0)))))))));  // > CustomCode.Approximations:36
    }  // > CustomCode.Approximations:37
    if ( n==11 ) {  // > CustomCode.Approximations:38
      h=1/2.0*Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0))))))))));  // > CustomCode.Approximations:39
      s=Math.sqrt(2.0-Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0))))))))));  // > CustomCode.Approximations:40
    }  // > CustomCode.Approximations:41
    if ( n==12 ) {  // > CustomCode.Approximations:42
      h=1/2.0*Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0)))))))))));  // > CustomCode.Approximations:43
      s=Math.sqrt(2.0-Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0+Math.sqrt(2.0)))))))))));  // > CustomCode.Approximations:44
    }  // > CustomCode.Approximations:45
  }  // > CustomCode.Approximations:46

  function calculations () {  // > CustomCode.Calculations:1
    N = Math.pow(2,n); //Calculate N(n)  // > CustomCode.Calculations:2
    phi = 1/N*2*Math.PI; //angle of triangle  // > CustomCode.Calculations:3
    // phi = 1/n*Math.PI; //angle of triangle  // > CustomCode.Calculations:4
    r2 = 1+(1-h)/Math.cos(phi/2); //maximum of external polygon  // > CustomCode.Calculations:5
    //calculations of edges as function of N in loop  // > CustomCode.Calculations:6
    //for (var i=0; i<N+1 ; i++) {  // > CustomCode.Calculations:7
      for (var j=0; j<i+1 ; j++) { // set to zero  // > CustomCode.Calculations:8
      x1[j] = 0; //x1,y1 internal polygon  // > CustomCode.Calculations:9
      y1[j] = 0;  // > CustomCode.Calculations:10
      x2[j] = 0; //x2,y2 external polygon  // > CustomCode.Calculations:11
      y2[j] = 0;  // > CustomCode.Calculations:12
      }  // > CustomCode.Calculations:13
       // > CustomCode.Calculations:14
       for (var k=0; k<N+1 ; k++) {  // > CustomCode.Calculations:15
      p[k] = k*phi;  // > CustomCode.Calculations:16
   //   x1[k] = Math.cos(p[k]); //x1,y1 internal polygon  // > CustomCode.Calculations:17
     // y1[k] = Math.sin(p[k]);  // > CustomCode.Calculations:18
       x1[k] = Math.cos(k*phi); //x1,y1 internal polygon  // > CustomCode.Calculations:19
      y1[k] = Math.sin(k*phi);  // > CustomCode.Calculations:20
      x2[k] = r2*Math.cos(p[k]); //x2,y2 external polygon  // > CustomCode.Calculations:21
      y2[k] = r2*Math.sin(p[k]);  // > CustomCode.Calculations:22
      text[k] = ""+k;  // > CustomCode.Calculations:23
    }  // > CustomCode.Calculations:24
     // > CustomCode.Calculations:25
    Uu = s*N; //Circumference internal polygon  // > CustomCode.Calculations:26
    Uo = r2*Uu; //Circumference external polygon  // > CustomCode.Calculations:27
  }  // > CustomCode.Calculations:28

}); // SImulation View setting action 'OnChange' for element 'slider'
