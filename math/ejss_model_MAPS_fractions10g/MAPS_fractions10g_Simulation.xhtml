  function align_Left () {  // > CustomCode.Align Left:4
    for (var i = 0;i<sizetext;i++) {  // > CustomCode.Align Left:5
      textposx[i] =0; // resets x position of the element to 0  // > CustomCode.Align Left:6
    }  // > CustomCode.Align Left:7
    for (var i = 0; i<sizearrow; i++) {  // > CustomCode.Align Left:8
      arrowposx[i] =0;  // > CustomCode.Align Left:9
    }  // > CustomCode.Align Left:10
    var tempBoxes = [];  // > CustomCode.Align Left:11
    for (var i = 0; i<sizebox; i++) {  // > CustomCode.Align Left:12
       tempBoxes.push(i);   // > CustomCode.Align Left:13
    }  // > CustomCode.Align Left:14
    // align the fraction sets first  // > CustomCode.Align Left:15
    for (var i = 0; i<fractionList.length; i++) {  // > CustomCode.Align Left:16
      boxposx[fractionList[i][0]] = 0;  // > CustomCode.Align Left:17
      for (var j = 0; j<fractionList[i].length; j++) {  // > CustomCode.Align Left:18
        if(i>0) boxposx[fractionList[i][j]] = getPreSize(fractionList[i][j],fractionList[i]);  // > CustomCode.Align Left:19
        tempBoxes.indexOf(fractionList[i][j]) !== -1 && tempBoxes.splice(tempBoxes.indexOf(fractionList[i][j]),1);  // > CustomCode.Align Left:20
      }  // > CustomCode.Align Left:21
      var lastid = fractionList[i][fractionList.length-1];  // > CustomCode.Align Left:22
      circleposx[lastid] = getPreSize(lastid,fractionList[i])+boxsizex[lastid];  // > CustomCode.Align Left:23
    }  // > CustomCode.Align Left:24
    for (var i = 0; i<tempBoxes.length; i++) {  // > CustomCode.Align Left:25
      // align everything else still in temp array  // > CustomCode.Align Left:26
      boxposx[tempBoxes[i]]=0;  // > CustomCode.Align Left:27
      circleposx[boxid]=boxposx[boxid]+boxsizex[boxid]; // aligns the circle on bottom right to the new position  // > CustomCode.Align Left:28
    }  // > CustomCode.Align Left:29
  }  // > CustomCode.Align Left:30
  // function to calculate the x-position of any section in a fraction box  // > CustomCode.Align Left:31

        break;  // > CustomCode.Align Left:37
      length += boxsizex[i];  // > CustomCode.Align Left:38
    }  // > CustomCode.Align Left:39
    return length;  // > CustomCode.Align Left:40

  function snapArrow (arrowid) {  // > CustomCode.snapArrow:1
    // snaps an arrow to the smallest y-value and smallest x-value  // > CustomCode.snapArrow:2
    // get the height of arrow as difference between boxsize+largest y-value and smallest y-value  // > CustomCode.snapArrow:3
      // > CustomCode.snapArrow:4
    // initial values to first box  // > CustomCode.snapArrow:5
    minX = boxposx[0];  // > CustomCode.snapArrow:6
    minY = boxposy[0];  // > CustomCode.snapArrow:7
    maxX = boxposx[0];  // > CustomCode.snapArrow:8
    maxY = boxposy[0];  // > CustomCode.snapArrow:9
      // > CustomCode.snapArrow:10
    // search for values  // > CustomCode.snapArrow:11
    for(var b=1; b<boxposx.length; b++) {  // > CustomCode.snapArrow:12
      if(boxposx[b] < minX) minX = boxposx[b];  // > CustomCode.snapArrow:13
      if(boxposy[b] < minY) minY = boxposy[b];  // > CustomCode.snapArrow:14
        // > CustomCode.snapArrow:15
      // for finding max values, factor in the size of box   // > CustomCode.snapArrow:16
      // since the box x-y coordinates only correspond to bottom left corner of box  // > CustomCode.snapArrow:17
      // hardcoding box y-size here since it is not variable(?)  // > CustomCode.snapArrow:18
      boxHeight = 1;  // > CustomCode.snapArrow:19
        // > CustomCode.snapArrow:20
      // we can use circle x-y coordinate for finding greatest x-value of box  // > CustomCode.snapArrow:21
      if(boxposx[b]+boxsizex[b] > maxX) maxX = boxposx[b]+boxsizex[b];  // > CustomCode.snapArrow:22
      if(boxposy[b]+boxHeight > maxY) maxY = boxposy[b];  // > CustomCode.snapArrow:23
    }  // > CustomCode.snapArrow:24
      // > CustomCode.snapArrow:25
    /*  // > CustomCode.snapArrow:26
    console.log("minX="+minX);  // > CustomCode.snapArrow:27
    console.log("minY="+minY);  // > CustomCode.snapArrow:28
    console.log("maxX="+maxX);  // > CustomCode.snapArrow:29
    console.log("maxY="+maxY);  // > CustomCode.snapArrow:30
    */  // > CustomCode.snapArrow:31
      // > CustomCode.snapArrow:32
    arrowposx[arrowid] = enablesizearrow[arrowid-1]=="ENABLED_X" ? minX : minX-0.5;  // > CustomCode.snapArrow:33
    arrowposy[arrowid] = enablesizearrow[arrowid-1]=="ENABLED_X" ? minY-1 : minY-0.5;  // > CustomCode.snapArrow:34
      // > CustomCode.snapArrow:35
    // find whether arrow is vertical or horizontal based on its enable size value  // > CustomCode.snapArrow:36
    if(enablesizearrow[arrowid-1]=="ENABLED_X") arrowsizex[arrowid] = maxX-minX+1;  // > CustomCode.snapArrow:37
    else arrowsizey[arrowid] = maxY-minY+1;  // > CustomCode.snapArrow:38
      // > CustomCode.snapArrow:39
    console.log("maxX="+maxX);  // > CustomCode.snapArrow:40
    console.log("minX="+minX);  // > CustomCode.snapArrow:41
    console.log("x="+arrowposx[arrowid]);  // > CustomCode.snapArrow:42
    console.log("y="+arrowposy[arrowid]);  // > CustomCode.snapArrow:43
  }  // > CustomCode.snapArrow:44
