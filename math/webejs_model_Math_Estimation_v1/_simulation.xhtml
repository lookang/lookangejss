function _simulation (_topFrame, _libraryPath, _codebasePath, _inputParameters) {

  var _model = EJSS_CORE.createAnimationLMS();
  var _view;
  var _isPlaying = false;
  var _isPaused = true;
  var _isEPub = false;
  var _isMobile = (navigator===undefined) ? false : navigator.userAgent.match(/iPhone|iPad|iPod|Android|BlackBerry|Opera Mini|IEMobile/i);

  var _stringProperties = {};
  var _tools = {
    showInputDialog : EJSS_INTERFACE.BoxPanel.showInputDialog,
    showOkDialog : EJSS_INTERFACE.BoxPanel.showOkDialog,
    showOkCancelDialog : EJSS_INTERFACE.BoxPanel.showOkCancelDialog,
    downloadText: EJSS_TOOLS.File.downloadText,
    uploadText: function(action) { EJSS_TOOLS.File.uploadText(_model,action); } 
  };

  function _play()  { _isPaused = false; _isPlaying = true;  _model.play();  }
  function _pause() { _isPaused = true;  _isPlaying = false; _model.pause(); }
  function _step()  { _pause();  _model.step(); }
  function _reset() { _model.reset();  _isPaused = _model.isPaused(); _isPlaying = _model.isPlaying(); }
  _model._play  = _play;
  _model._pause = _pause;
  _model._step  = _step;
  _model._reset = _reset;

  function _update() { _model.update(); }
  function _initialize() { _model.initialize(); }
  function _setFPS(_fps) { _model.setFPS(_fps); }
  function _setDelay(_delay) { _model.setDelay(_delay); }
  function _setStepsPerDisplay(_spd) { _model.setStepsPerDisplay(_spd); }
  function _setUpdateView(_updateView) { _model.setUpdateView(_updateView); }
  function _setAutoplay(_auto) { _model.setAutoplay(_auto); }
  function _println(_message) { console.log(_message); }
  function _breakAfterThisPage() { _model.setShouldBreak(true); }
  function _resetSolvers() { if (_model.resetSolvers) _model.resetSolvers(); }
  function _saveText(name,type,content) { if (_model.saveText) _model.saveText(name,type,content); }
  function _saveState(name) { if (_model.saveState) _model.saveState(name); }
  function _saveImage(name,panelname) { if (_model.saveImage) _model.saveImage(name,panelname); }
  function _readState(url,type) { if (_model.readState) _model.readState(url,type); }
  function _readText(url,type,varname) { if (_model.readText) _model.readText(url,type,varname); }
  // Is this still needed if we don't have locales???
  function _getStringProperty(propertyName) {
    var _value = _stringProperties[propertyName];
    if (_value===undefined) return propertyName;
    else return _value;
  }

  var __pagesEnabled = [];
  function _setPageEnabled(pageName,enabled) { __pagesEnabled[pageName] = enabled; }

  var scenarios; // Model.Variables.Var Table 1.scenarios
  var selectedScenario; // Model.Variables.Var Table 1.selectedScenario
  var shapeX; // Model.Variables.Var Table 1.shapeX
  var shapeY; // Model.Variables.Var Table 1.shapeY
  var imagePiece; // Model.Variables.Var Table 1.imagePiece

  function _serialize() { return _model.serialize(); }

  _model._userSerialize = function() {
    return { scenarios : scenarios, selectedScenario : selectedScenario, shapeX : shapeX, shapeY : shapeY, imagePiece : imagePiece };
  }
  function _serializePublic() { return _model.serializePublic(); }

  _model._userSerializePublic = function() {
    return { scenarios : scenarios, selectedScenario : selectedScenario, shapeX : shapeX, shapeY : shapeY, imagePiece : imagePiece };
  }

  _model._readParameters = function(json) {
    if(typeof json.scenarios != 'undefined') scenarios = json.scenarios;
    if(typeof json.selectedScenario != 'undefined') selectedScenario = json.selectedScenario;
    if(typeof json.shapeX != 'undefined') shapeX = json.shapeX;
    if(typeof json.shapeY != 'undefined') shapeY = json.shapeY;
    if(typeof json.imagePiece != 'undefined') imagePiece = json.imagePiece;
  }

  _model._readParametersPublic = function(json) {
    if(typeof json.scenarios != 'undefined') scenarios = json.scenarios;
    if(typeof json.selectedScenario != 'undefined') selectedScenario = json.selectedScenario;
    if(typeof json.shapeX != 'undefined') shapeX = json.shapeX;
    if(typeof json.shapeY != 'undefined') shapeY = json.shapeY;
    if(typeof json.imagePiece != 'undefined') imagePiece = json.imagePiece;
  }

  function _unserializePublic(json) { return _model.unserializePublic(json); }

  _model._userUnserializePublic = function(json) {
    _model._readParametersPublic(json);
    _resetSolvers();
    _model.update();
  }

  function _unserialize(json) { return _model.unserialize(json); }

  _model._userUnserialize = function(json) {
    _model._readParameters(json);
    _resetSolvers();
    _model.update();
  }

  _model.getOdes = function() { return []; }

  _model.removeEvents = function(){
  }

  _model.addToReset(function() {
    __pagesEnabled['scenarios'] = true;
    __pagesEnabled['init'] = true;
  });

  _model.addToReset(function() { // Reset of Var Table 1
    scenarios = {}; // Model.Variables.Var Table 1.scenarios
    selectedScenario = "Scenario A"; // Model.Variables.Var Table 1.selectedScenario
    shapeX = []; // Model.Variables.Var Table 1.shapeX
    shapeY = []; // Model.Variables.Var Table 1.shapeY
    imagePiece = []; // Model.Variables.Var Table 1.imagePiece
  }); // End of reset of Var Table 1

  if (_inputParameters) {
    _inputParameters = _model.parseInputParameters(_inputParameters);
    if (_inputParameters) _model.addToReset(function() { _model._readParameters(_inputParameters); });
  }

  _model.addToReset(function() {
    _model.setAutoplay(false);
    _model.setFPS(20);
    _model.setStepsPerDisplay(1);
  });

  function initShape() { // > Custom code page: initShape - line 1
      shapeX = []; // > Custom code page: initShape - line 2
      shapeY = []; // > Custom code page: initShape - line 3
      imagePiece = []; // > Custom code page: initShape - line 4
   // > Custom code page: initShape - line 5
      let numOfPieces = scenarios[selectedScenario].pieces.length; // > Custom code page: initShape - line 6
      let rows = scenarios[selectedScenario].y; // > Custom code page: initShape - line 7
      let columns = scenarios[selectedScenario].x; // > Custom code page: initShape - line 8
   // > Custom code page: initShape - line 9
      let margin = 3.2; // > Custom code page: initShape - line 10
      let graphWidth = 20; // > Custom code page: initShape - line 11
      let graphHeight = 20; // > Custom code page: initShape - line 12
      let index = 1; // > Custom code page: initShape - line 13
   // > Custom code page: initShape - line 14
      let totalSpacingX = (columns - 1) * margin; // > Custom code page: initShape - line 15
      let totalSpacingY = (rows - 1) * margin; // > Custom code page: initShape - line 16
   // > Custom code page: initShape - line 17
      let startX = (graphWidth - totalSpacingX) / 2; // > Custom code page: initShape - line 18
      let startY = (graphHeight - totalSpacingY) / 2; // > Custom code page: initShape - line 19
   // > Custom code page: initShape - line 20
      for (let row = rows - 1; row >= 0; row--) { // > Custom code page: initShape - line 21
          for (let col = 0; col < columns; col++) { // > Custom code page: initShape - line 22
              let x = startX + col * margin; // > Custom code page: initShape - line 23
              let y = startY + row * margin; // > Custom code page: initShape - line 24
   // > Custom code page: initShape - line 25
              shapeX.push(x); // > Custom code page: initShape - line 26
              shapeY.push(y); // > Custom code page: initShape - line 27
              imagePiece.push(`./${scenarios[selectedScenario].shape}/${scenarios[selectedScenario].shape}-${index}.png`); // > Custom code page: initShape - line 28
               // > Custom code page: initShape - line 29
              index += 1; // > Custom code page: initShape - line 30
          } // > Custom code page: initShape - line 31
      } // > Custom code page: initShape - line 32
  } // > Custom code page: initShape - line 33
   // > Custom code page: initShape - line 34

  _model.addToInitialization(function() {
    if (!__pagesEnabled['scenarios']) return;
    scenarios = { // > Initialization page: scenarios - line 1
          "Scenario A": { // > Initialization page: scenarios - line 2
            shape: "heart", // > Initialization page: scenarios - line 3
            scenario: "Estimate the area of this heart", // > Initialization page: scenarios - line 4
            x: 4, // > Initialization page: scenarios - line 5
            y: 3, // > Initialization page: scenarios - line 6
            pieces: [ // > Initialization page: scenarios - line 7
                {connected: [8]}, // > Initialization page: scenarios - line 8
                {connected: -1}, // > Initialization page: scenarios - line 9
                {connected: -1}, // > Initialization page: scenarios - line 10
                {connected: [11]}, // > Initialization page: scenarios - line 11
                {connected: [9]}, // > Initialization page: scenarios - line 12
                {connected: -1}, // > Initialization page: scenarios - line 13
                {connected: -1}, // > Initialization page: scenarios - line 14
                {connected: [10]}, // > Initialization page: scenarios - line 15
                {connected: [0]}, // > Initialization page: scenarios - line 16
                {connected: [4]}, // > Initialization page: scenarios - line 17
                {connected: [7]}, // > Initialization page: scenarios - line 18
                {connected: [3]}, // > Initialization page: scenarios - line 19
            ] // > Initialization page: scenarios - line 20
        }, // > Initialization page: scenarios - line 21
    } // > Initialization page: scenarios - line 22
  });

  _model.addToInitialization(function() {
    if (!__pagesEnabled['init']) return;
    initShape(); // > Initialization page: init - line 1
  });

  _model.addToFixedRelations(function() { _isPaused = _model.isPaused(); _isPlaying = _model.isPlaying(); });

  // Intentionally repeated
  _model.addToFixedRelations(function() { _isPaused = _model.isPaused(); _isPlaying = _model.isPlaying(); });

  _model._fontResized = function(iBase,iSize,iDelta) {
    _view._fontResized(iBase,iSize,iDelta);
  }; // end of _fontResized

  function _createView() {
    _view = new _simulationView(_topFrame,_libraryPath,_codebasePath);
    var _view_super_reset = _view._reset;
    _view._reset = function() {
      _view_super_reset();
      _view.currentScenario.linkProperty('Text', function() { return scenarios[selectedScenario].scenario; }); // linking Text of currentScenario
      _view.selectScenario.setAction('OnChange', function(_data, _info) { // Action OnChange for element selectScenario
        var opts = _view.selectScenario.getProperty("SelectedOptions");   // property OnChange of selectScenario: line 1
        selectedScenario = (opts.length > 0)? opts[0]:""; // property OnChange of selectScenario: line 2
        initShape(); // property OnChange of selectScenario: line 3
      });
      _view.shapeSet.linkProperty('NumberOfElements', function() { return scenarios[selectedScenario].pieces.length; }); // linking NumberOfElements of shapeSet
      _view.shapeSet.linkProperty('X', function() { return shapeX; }, function(_v) { shapeX = _v; }); // linking X of shapeSet
      _view.shapeSet.linkProperty('Y', function() { return shapeY; }, function(_v) { shapeY = _v; }); // linking Y of shapeSet
      _view.shapeSet.linkProperty('ImageUrl', function() { return imagePiece; }, function(_v) { imagePiece = _v; }); // linking ImageUrl of shapeSet
    }; // end of new reset

    _model.setView(_view);
    _model.reset();
    _view._enableEPub();
  } // end of _createView

  _model.setAutoplay(false);
  _model.setFPS(20);
  _model.setStepsPerDisplay(1);
  _createView(); // this includes _model.reset()
  return _model;
}

function _simulationView (_topFrame,_libraryPath,_codebasePath) {
  var _view = EJSS_CORE.createView(_topFrame);

  if (_libraryPath)  _view._setLibraryPath(_libraryPath);
  if (_codebasePath) _view._setResourcePath(_codebasePath);


  _view._reset = function() {
    _view._clearAll();
    _view._addElement(EJSS_INTERFACE.panel, 'wrapper', _view._topFrame);
    _view._addElement(EJSS_INTERFACE.panel, 'firstRow', _view.wrapper)
      .setProperty("CSS","{ margin-bottom: 10px }")
      ;
    _view._addElement(EJSS_INTERFACE.imageAndTextButton, 'currentScenario', _view.firstRow);
    _view._addElement(EJSS_INTERFACE.panel, 'secondRow', _view.wrapper)
      .setProperty("CSS","{ margin-bottom: 10px }")
      ;
    _view._addElement(EJSS_INTERFACE.comboBox, 'selectScenario', _view.secondRow)
      .setProperty("CSS","{ margin-right: 10px }")
      .setProperty("Options",["Scenario A", "Scenario B", "Scenario C"])
      ;
    _view._addElement(EJSS_INTERFACE.button, 'check', _view.secondRow)
      .setProperty("Text","check")
      .setProperty("CSS","{ margin-right: 10px }")
      ;
    _view._addElement(EJSS_INTERFACE.button, 'reset', _view.secondRow)
      .setProperty("Text","reset")
      ;
    _view._addElement(EJSS_DRAWING2D.plottingPanel, 'plottingPanel', _view.wrapper)
      .setProperty("Width","100%")
      .setProperty("Height","90vh")
      .setProperty("AutoScaleX",false)
      .setProperty("AutoScaleY",false)
      .setProperty("MinimumX",0)
      .setProperty("MinimumY",0)
      .setProperty("MaximumX",20)
      .setProperty("MaximumY",20)
      .setProperty("Enabled",true)
      .setProperty("Gutters",[0,0,0,0])
      ;
    _view._addElement(EJSS_DRAWING2D.imageSet, 'shapeSet', _view.plottingPanel)
      .setProperty("SizeX",3)
      .setProperty("SizeY",3)
      ;
    _view._addElement(EJSS_DRAWING2D.shapeSet, 'shapeCoverSet', _view.plottingPanel);
  }; // end of _view._reset
  return _view;
}

    //--><!]]></script>

    <script type="text/javascript"><!--//--><![CDATA[//><!--

      var _model;
      var _scorm;

        function () {
          _model = new _simulation("_topFrame","./_ejs_library/",null);

          if (typeof _isApp !== "undefined" && _isApp) _model.setRunAlways(true);
          TextResizeDetector.TARGET_ELEMENT_ID = '_topFrame';
          TextResizeDetector.USER_INIT_FUNC = function () {
            var iBase = TextResizeDetector.addEventListener(function(e,args) {
