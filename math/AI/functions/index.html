<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Function Machine</title>
    <link rel="stylesheet" href="styles.css">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S9EWRY1CPJ');
  </script>
</head>
<body>
    <div id="app">
        <h1>Fun Function Machine</h1>

        <div id="playArea">
            <div class="column" id="inputs">
                <p class="label">Pick a number:</p>
                <div id="numberBtns"></div>
            </div>

            <div id="machine">
                </div>

            <div class="column" id="outputs">
                <p class="label">Output:</p>
                <div id="outputDisplay">?</div>
            </div>
        </div>

        <table id="attemptTable">
            <thead>
                <tr><th>Input</th><th>Output</th></tr>
            </thead>
            <tbody></tbody>
        </table>

        <div id="studentAnswer">
            <p>What do you think the function rule is?</p>
            <input type="text" id="functionGuess" placeholder="e.g., *2 or +1 or ^2">
            <button id="checkAnswerBtn">Check My Answer</button>
            <div id="feedbackMessage"></div> <div id="scoreDisplay">Score: 0</div> </div>

        <div id="controls">
            <button id="revealBtn">Reveal Rule</button>
            <button id="newRuleBtn">New Rule</button>
        </div>

        <div id="moreResources">
            <p>For more resources visit: <a href="https://sg.iwant2study.org/ospsg/index.php/interactive-resources/mathematics" target="_blank">sg.iwant2study.org</a></p>
        </div>

        <p id="credit">Created with ❤️ using <a href="https://moeptt.vercel.app/#menuD" target="_blank">https://moeptt.vercel.app/#menuD</a></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
