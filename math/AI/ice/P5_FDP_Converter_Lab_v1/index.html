
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>P5 FDP Converter Lab</title>
<link rel="stylesheet" href="style.css">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S9EWRY1CPJ');
  </script>
</head>
<body>

<h2>P5 Percentage–Fraction–Decimal Converter Lab</h2>

<div id="activity">
  <div id="questionBox"></div>
  <div>
    <label>Fraction:</label>
    <input type="text" id="fractionInput">
  </div>
  <div>
    <label>Decimal:</label>
    <input type="text" id="decimalInput">
  </div>
  <div>
    <label>Percentage:</label>
    <input type="text" id="percentInput">
  </div>
  <button onclick="submitAnswer()">Submit</button>
  <p id="feedback"></p>
</div>

<hr>

<div id="dashboard" style="display:none;">
  <h3>Analytics Dashboard</h3>
  <p id="summary"></p>
  <button onclick="downloadJSON()">Download Analytics JSON</button>
</div>

<script src="questions.js"></script>
<script src="validation.js"></script>
<script src="analytics.js"></script>
<script>
let currentIndex = 0;
let score = 0;

function loadQuestion() {
  const q = questions[currentIndex];
  document.getElementById("questionBox").innerHTML =
    "Convert: <b>" + q.given + "</b>";
}

function submitAnswer() {
  const q = questions[currentIndex];
  const fraction = document.getElementById("fractionInput").value.trim();
  const decimal = document.getElementById("decimalInput").value.trim();
  const percent = document.getElementById("percentInput").value.trim();

  const result = validateAnswer(q, fraction, decimal, percent);
  logAttempt(q.id, fraction, decimal, percent, result.correct);

  if (result.correct) {
    score++;
    document.getElementById("feedback").innerText = "Correct!";
  } else {
    document.getElementById("feedback").innerText = "Incorrect.";
  }

  currentIndex++;
  if (currentIndex < questions.length) {
    loadQuestion();
  } else {
    finishActivity();
  }
}

function finishActivity() {
  document.getElementById("activity").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  document.getElementById("summary").innerText =
    "Score: " + score + " / " + questions.length;
}

loadQuestion();
</script>

</body>
</html>
