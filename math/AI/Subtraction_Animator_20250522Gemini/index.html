<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtraction Animator</title>
    <link rel="stylesheet" href="styles.css">
 <script
 async="true" src=" https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ "></script>
 <script>
   window.dataLayer = window.dataLayer || [];
   function gtag(){dataLayer.push(arguments);}
   gtag('js', new Date());

   gtag('config', 'G-S9EWRY1CPJ');
 </script>
</head>
<body>
    <div class="container">
        <h1>Subtraction with Regrouping</h1>

        <div class="problem-setup">
            <input type="number" id="minuendInput" value="40" min="10" max="99">
            <span>-</span>
            <input type="number" id="subtrahendInput" value="27" min="0" max="99">
            <span>=</span>
            <span id="actualResult">?</span>
        </div>
        <button id="calculateBtn">Show Steps</button>
        <button id="prevStepBtn" disabled>&lt; Previous Step</button>
        <button id="nextStepBtn" disabled>Next Step &gt;</button>

        <div class="elsa-container">
            <img src="Generated Image May 22, 2025 - 8_08AM.jpeg" alt="Elsa teaching" class="elsa-image">
            <div class="working-area">
                <table>
                    <thead>
                        <tr>
                            <th></th>
                            <th>T</th>
                            <th>O</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Minuend Row -->
                        <tr>
                            <td></td>
                            <td class="minuend-tens">
                                <span class="original-digit" id="mTens"></span>
                                <span class="strikethrough" id="mTensStrike"></span>
                                <span class="borrowed-digit" id="mTensNew"></span>
                            </td>
                            <td class="minuend-ones">
                                <span class="original-digit" id="mOnes"></span>
                                <span class="strikethrough" id="mOnesStrike"></span>
                                <span class="borrowed-digit" id="mOnesNew"></span>
                            </td>
                        </tr>
                        <!-- Subtrahend Row -->
                        <tr>
                            <td class="operator">-</td>
                            <td id="sTens"></td>
                            <td id="sOnes"></td>
                        </tr>
                        <!-- Separator Row -->
                        <tr class="separator-row">
                            <td colspan="3"><hr></td>
                        </tr>
                        <!-- Result Row -->
                        <tr>
                            <td></td>
                            <td id="rTens"></td>
                            <td id="rOnes"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div id="explanation" class="explanation-text"></div>
    </div>

    <script src="script.js"></script>
<footer>
    <p>Credit: using Gemini 2.5 Pro</p>
    <p>For more resources: <a href="https://sg.iwant2study.org/ospsg/index.php/interactive-resources/mathematics/numbers-and-algebra/whole-numbers/2-addition-and-subtraction">Subtraction Resources</a></p>
</footer>
</body>
</html>
