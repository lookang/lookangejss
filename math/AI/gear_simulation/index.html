<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interlocking Gears</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Analytics -->
    <script async="true" src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-S9EWRY1CPJ');
    </script>
</head>
<body>
    <h1>How many times must each wheel turn to make all of the dots line up again?</h1>

    <div class="controls">
        <button id="turnButton">Turn</button>
        <button id="resetButton">Reset</button>
    </div>

    <div class="labels">
        <div class="label-group">
            <span class="label-text">A</span>
            <input type="number" class="teeth-input" id="teethA" value="8" min="1" title="Teeth A">
            <span class="rotation-count" id="rotCountA" title="Full Rotations A">0</span>
        </div>
        <div class="label-group">
            <span class="label-text">B</span>
            <input type="number" class="teeth-input" id="teethB" value="16" min="1" title="Teeth B">
             <span class="rotation-count" id="rotCountB" title="Full Rotations B">0</span>
        </div>
        <div class="label-group">
            <span class="label-text">C</span>
            <input type="number" class="teeth-input" id="teethC" value="24" min="1" title="Teeth C">
             <span class="rotation-count" id="rotCountC" title="Full Rotations C">0</span>
        </div>
    </div>

    <div class="simulation-container">
        <div class="answer-check-inline">
            <label for="answerA">Turns of A for alignment:</label>
            <input type="number" id="answerA" min="1" inputmode="numeric">
            <button id="checkAnswerButton">Check Answer</button>
            <p id="feedbackMessage" class="feedback-message"></p>
        </div>
        <div class="gear-assembly">
            <div class="gear gear-a" id="gearA">
                <div class="radius-line"></div>
                <div class="dot"></div>
            </div>
            <div class="gear gear-b" id="gearB">
                <div class="radius-line"></div>
                <div class="dot"></div>
            </div>
            <div class="gear gear-c" id="gearC">
                <div class="radius-line"></div>
                <div class="dot"></div>
            </div>
        </div>
        <!-- Duplicate labels div fully removed -->
    </div>

    <script src="script.js"></script>
    
    <footer style="text-align: center; margin-top: 20px; font-size: 0.9em; color: #666;">
        <p>Credit: made using Trae, Cline Extension, Gemini 2.5 Pro</p>
        <p>For more resources, visit <a href="https://sg.iwant2study.org/ospsg/index.php/interactive-resources/mathematics" target="_blank">sg.iwant2study.org</a></p>
    </footer>
</body>
</html>
