    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
            color: #333;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 700px;
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .rule-selection button, .game-area button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        .rule-selection button:hover, .game-area button:hover {
            background-color: #2980b9;
        }
        
        .game-area button#back-button {
            background-color: #e74c3c;
        }
        .game-area button#back-button:hover {
            background-color: #c0392b;
        }

        .game-area {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .problem-statement {
            font-size: 1.4em;
            margin: 20px 0;
            color: #555;
            font-weight: bold;
        }
        
        .problem-statement .blank {
            display: inline-block;
            width: 50px;
            border-bottom: 2px solid #3498db;
            text-align: center;
            font-weight: bold;
            color: #e74c3c;
        }
        
        .problem-statement input[type="number"],
        .problem-statement input[type="text"] {
            width: 60px;
            padding: 8px;
            margin: 0 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            text-align: center;
        }
        
        .problem-statement .operator {
            margin: 0 10px;
        }

        .feedback {
            margin-top: 15px;
            font-size: 1.1em;
            font-weight: bold;
            min-height: 25px;
        }

        .feedback.correct {
            color: #2ecc71;
        }

        .feedback.incorrect {
            color: #e74c3c;
        }

        .rule-explanation {
            margin-top: 15px;
            padding: 10px;
            background-color: #e0eaf4;
            border-left: 4px solid #3498db;
            font-style: italic;
            color: #2c3e50;
            text-align: left;
        }

        .score {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
        
        sub, sup {
            font-size: 0.75em;
        }

        .game-area {
            display: none;
        }

        /* Log Styles */
        #log-container {
            margin-top: 20px; /* Reduced margin as resources link is now below it */
            width: 100%;
            text-align: left;
            border-top: 1px solid #ccc;
            padding-top: 15px;
        }
        #log-container h3 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .log-entry {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 0.9em;
            line-height: 1.4;
            border: 1px solid #eee;
            word-wrap: break-word;
        }
        .log-entry.correct-attempt {
            background-color: #e8f5e9;
            border-left: 4px solid #4CAF50;
        }
        .log-entry.incorrect-attempt {
            background-color: #ffebee;
            border-left: 4px solid #f44336;
        }
        .log-entry p {
            margin: 4px 0;
        }
        .log-entry strong {
            color: #333;
        }
        #log-entries {
            max-height: 400px;
            overflow-y: auto;
            background-color: #fdfdfd;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
        }
        #log-entries .no-attempts {
            text-align: center;
            color: #777;
            font-style: italic;
        }

        /* Footer Links & Credit */
        .page-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9em;
            color: #555;
        }
        .page-footer a {
            color: #3498db;
            text-decoration: none;
        }
        .page-footer a:hover {
            text-decoration: underline;
            color: #2980b9;
        }
        .page-footer p {
            margin: 8px 0;
        }
        .credit-line {
            font-size: 0.8em;
            color: #777;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Logarithm Rules Challenge</h1>

        <div id="rule-selection-area" class="rule-selection">
            <p>Choose a logarithm rule to practice:</p>
            <button onclick="startGame('product')">Product Rule</button>
            <button onclick="startGame('quotient')">Quotient Rule</button>
            <button onclick="startGame('power')">Power Rule</button>
            <button onclick="startGame('definition')">Definition of Log</button>
            <button onclick="startGame('special')">Special Cases</button>
        </div>

        <div id="game-area" class="game-area">
            <h2 id="game-title"></h2>
            <div class="rule-explanation" id="rule-explanation-text"></div>
            <div class="problem-statement" id="problem-statement-text"></div>
            
            <button onclick="checkAnswer()">Check Answer</button>
            <button onclick="nextProblem()">Next Problem</button>
            <button id="back-button" onclick="showMenu()">Back to Menu</button>

            <div class="feedback" id="feedback-text"></div>
        </div>
        
        <div class="score" id="score-text">Score: 0 / 0</div>

        <div id="log-container">
            <h3>Attempt Log</h3>
            <button onclick="clearLog()" style="float: right; margin-bottom: 5px; background-color: #f39c12;">Clear Log</button>
            <div id="log-entries">
                <p class="no-attempts">No attempts yet.</p>
            </div>
        </div>
    </div>

    <div class="page-footer">
        <p>
            <a href="https://sg.iwant2study.org/ospsg/index.php/interactive-resources/mathematics/measurement-and-geometry/geometry" target="_blank" rel="noopener noreferrer">
                Click here for More Mathematics Resources
            </a>
        </p>
        <p class="credit-line">
            Made with assistance from Gemini on <a href="https://aistudio.google.com/" target="_blank" rel="noopener noreferrer">aistudio.google.com</a>
        </p>
    </div>

    <script>
        let currentRule = '';
        let problemData = {};
        let score = 0;
        let totalAsked = 0;
        let userAttemptsLog = [];

        const ruleSelectionArea = document.getElementById('rule-selection-area');
        const gameArea = document.getElementById('game-area');
        const gameTitle = document.getElementById('game-title');
        const ruleExplanationText = document.getElementById('rule-explanation-text');
        const problemStatementText = document.getElementById('problem-statement-text');
        const feedbackText = document.getElementById('feedback-text');
        const scoreText = document.getElementById('score-text');
        const logEntriesDiv = document.getElementById('log-entries');

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function showMenu() {
            ruleSelectionArea.style.display = 'block';
            gameArea.style.display = 'none';
            feedbackText.textContent = '';
        }

        function startGame(rule) {
            currentRule = rule;
            ruleSelectionArea.style.display = 'none';
            gameArea.style.display = 'block';
            feedbackText.textContent = '';
            
            switch (rule) {
                case 'product':
                    gameTitle.textContent = 'Product Rule Challenge';
                    ruleExplanationText.innerHTML = '<strong>Product Rule:</strong> log<sub>b</sub>(m) + log<sub>b</sub>(n) = log<sub>b</sub>(m * n)';
                    break;
                case 'quotient':
                    gameTitle.textContent = 'Quotient Rule Challenge';
                    ruleExplanationText.innerHTML = '<strong>Quotient Rule:</strong> log<sub>b</sub>(m) - log<sub>b</sub>(n) = log<sub>b</sub>(m / n)';
                    break;
                case 'power':
                    gameTitle.textContent = 'Power Rule Challenge';
                    ruleExplanationText.innerHTML = '<strong>Power Rule:</strong> k * log<sub>b</sub>(m) = log<sub>b</sub>(m<sup>k</sup>)';
                    break;
                case 'definition':
                    gameTitle.textContent = 'Definition of Logarithm Challenge';
                    ruleExplanationText.innerHTML = '<strong>Definition:</strong> log<sub>b</sub>(x) = y  &nbsp;  &hArr;  &nbsp;  b<sup>y</sup> = x';
                    break;
                case 'special':
                    gameTitle.textContent = 'Special Cases Challenge';
                    ruleExplanationText.innerHTML = `<strong>Special Cases:</strong><br>1. log<sub>b</sub>(1) = 0<br>2. log<sub>b</sub>(b) = 1`;
                    break;
            }
            generateProblem();
        }

        function generateProblem() {
            problemData = {};
            let problemHTML = '';

            const base = getRandomInt(2, 5);
            let m, n, k, x, y;

            switch (currentRule) {
                case 'product':
                    m = getRandomInt(2, 10);
                    n = getRandomInt(2, 10);
                    problemData = { base, m, n, answer: m * n };
                    problemHTML = `log<sub>${base}</sub>(${m}) + log<sub>${base}</sub>(${n}) = log<sub>${base}</sub>(<input type="number" id="ans_val" />)`;
                    break;
                case 'quotient':
                    n = getRandomInt(2, 8);
                    m = n * getRandomInt(2, 8); 
                    problemData = { base, m, n, answer: m / n };
                    problemHTML = `log<sub>${base}</sub>(${m}) - log<sub>${base}</sub>(${n}) = log<sub>${base}</sub>(<input type="number" id="ans_val" />)`;
                    break;
                case 'power':
                    m = getRandomInt(2, 5);
                    k = getRandomInt(2, 4);
                    if (Math.random() < 0.7) { 
                        problemData = { type: 'arg_power', base, m, k, answer: Math.pow(m, k) };
                        problemHTML = `${k} * log<sub>${base}</sub>(${m}) = log<sub>${base}</sub>(<input type="number" id="ans_val" />)`;
                    } else { 
                        problemData = { type: 'coeff', base, m, k, answer: k };
                        problemHTML = `log<sub>${base}</sub>(${Math.pow(m,k)}) = <input type="number" id="ans_val" /> * log<sub>${base}</sub>(${m})`;
                    }
                    break;
                case 'definition':
                    y = getRandomInt(2, 4);
                    x = Math.pow(base, y);
                    const partToAsk = getRandomInt(1,3);
                    if (partToAsk === 1) {
                         problemData = { type: 'def_base', base_ans: base, exp: y, res: x };
                         problemHTML = `log<sub><input type="number" id="ans_b" /></sub>(${x}) = ${y} &nbsp;  &hArr;  &nbsp; <span class="blank">${base}</span><sup>${y}</sup> = ${x}`;
                    } else if (partToAsk === 2) {
                         problemData = { type: 'def_log_res', base_val: base, exp_ans: y, arg: x };
                         problemHTML = `log<sub>${base}</sub>(${x}) = <input type="number" id="ans_y" /> &nbsp;  &hArr;  &nbsp; ${base}<sup><span class="blank">${y}</span></sup> = ${x}`;
                    } else {
                         problemData = { type: 'def_log_arg', base_val: base, exp: y, arg_ans: x };
                         problemHTML = `log<sub>${base}</sub>(<input type="number" id="ans_x" />) = ${y} &nbsp;  &hArr;  &nbsp; ${base}<sup>${y}</sup> = <span class="blank">${x}</span>`;
                    }
                    break;
                case 'special':
                    const specialCaseType = getRandomInt(1, 2);
                    if (specialCaseType === 1) {
                        problemData = { type: 'log_one', base, answer: 0 };
                        problemHTML = `log<sub>${base}</sub>(1) = <input type="number" id="ans_val" />`;
                    } else {
                        problemData = { type: 'log_base', base, answer: 1 };
                        problemHTML = `log<sub>${base}</sub>(${base}) = <input type="number" id="ans_val" />`;
                    }
                    break;
            }
            problemStatementText.innerHTML = problemHTML;
            const firstInput = problemStatementText.querySelector('input');
            if (firstInput) firstInput.focus();
            feedbackText.textContent = '';
            feedbackText.className = 'feedback';
        }
        
        function getProblemDescriptionForLog(data, rule) {
            let desc = '';
            switch (rule) {
                case 'product':
                    desc = `log<sub>${data.base}</sub>(${data.m}) + log<sub>${data.base}</sub>(${data.n}) = log<sub>${data.base}</sub>(?)`;
                    break;
                case 'quotient':
                    desc = `log<sub>${data.base}</sub>(${data.m}) - log<sub>${data.base}</sub>(${data.n}) = log<sub>${data.base}</sub>(?)`;
                    break;
                case 'power':
                    if (data.type === 'arg_power') {
                        desc = `${data.k} * log<sub>${data.base}</sub>(${data.m}) = log<sub>${data.base}</sub>(?)`;
                    } else { 
                        desc = `log<sub>${data.base}</sub>(${Math.pow(data.m,data.k)}) = ? * log<sub>${data.base}</sub>(${data.m})`;
                    }
                    break;
                case 'definition':
                    if (data.type === 'def_base') {
                         desc = `log<sub>?</sub>(${data.res}) = ${data.exp}`;
                    } else if (data.type === 'def_log_res') {
                         desc = `log<sub>${data.base_val}</sub>(${data.arg}) = ?`;
                    } else if (data.type === 'def_log_arg') {
                         desc = `log<sub>${data.base_val}</sub>(?) = ${data.exp}`;
                    }
                    break;
                case 'special':
                     if (data.type === 'log_one') {
                        desc = `log<sub>${data.base}</sub>(1) = ?`;
                    } else { 
                        desc = `log<sub>${data.base}</sub>(${data.base}) = ?`;
                    }
                    break;
            }
            return desc;
        }

        function getCorrectAnswerForLog(data, rule) {
            switch (rule) {
                case 'product':
                case 'quotient':
                case 'special':
                    return data.answer;
                case 'power':
                    return data.answer; 
                case 'definition':
                    if (data.type === 'def_base') return data.base_ans;
                    if (data.type === 'def_log_res') return data.exp_ans;
                    if (data.type === 'def_log_arg') return data.arg_ans;
                    break;
            }
            return 'N/A';
        }
        
        function checkAnswer() {
            if (Object.keys(problemData).length === 0) return;

            let isCorrect = false;
            let userAnswerStr = "N/A"; 
            let userAnswerNum;
            let correctAnswer = getCorrectAnswerForLog(problemData, currentRule);
            let problemDescription = getProblemDescriptionForLog(problemData, currentRule);

            try {
                let inputElement;
                switch (currentRule) {
                    case 'product':
                    case 'quotient':
                    case 'special':
                        inputElement = document.getElementById('ans_val');
                        userAnswerStr = inputElement.value;
                        userAnswerNum = parseInt(userAnswerStr);
                        isCorrect = (userAnswerNum === problemData.answer);
                        break;
                    case 'power':
                         inputElement = document.getElementById('ans_val');
                         userAnswerStr = inputElement.value;
                         userAnswerNum = parseInt(userAnswerStr);
                         isCorrect = (userAnswerNum === problemData.answer); 
                         break;
                    case 'definition':
                        if (problemData.type === 'def_base') {
                            inputElement = document.getElementById('ans_b');
                            userAnswerStr = inputElement.value;
                            userAnswerNum = parseInt(userAnswerStr);
                            isCorrect = (userAnswerNum === problemData.base_ans);
                        } else if (problemData.type === 'def_log_res') {
                             inputElement = document.getElementById('ans_y');
                             userAnswerStr = inputElement.value;
                             userAnswerNum = parseInt(userAnswerStr);
                             isCorrect = (userAnswerNum === problemData.exp_ans);
                        } else if (problemData.type === 'def_log_arg') {
                             inputElement = document.getElementById('ans_x');
                             userAnswerStr = inputElement.value;
                             userAnswerNum = parseInt(userAnswerStr);
                             isCorrect = (userAnswerNum === problemData.arg_ans);
                        }
                        break;
                }
                 if (userAnswerStr.trim() === "") userAnswerStr = "[empty]";

            } catch (e) {
                isCorrect = false;
                console.error("Error parsing answer:", e);
                userAnswerStr = "[error processing input]";
            }

            const logEntry = {
                timestamp: new Date().toLocaleString(),
                rule: gameTitle.textContent.replace(' Challenge', ''),
                problem: problemDescription,
                userAnswer: userAnswerStr,
                correctAnswer: correctAnswer,
                isCorrect: isCorrect
            };
            userAttemptsLog.unshift(logEntry); 
            renderLog();

            if (!feedbackText.classList.contains('correct')) { 
                totalAsked++;
            }
            
            if (isCorrect) {
                if (!feedbackText.classList.contains('correct')) { 
                   score++;
                }
                feedbackText.textContent = 'Correct!';
                feedbackText.className = 'feedback correct';
            } else {
                feedbackText.textContent = 'Incorrect. Try again or click "Next Problem".';
                feedbackText.textContent += ` Correct answer: ${correctAnswer}`;
                feedbackText.className = 'feedback incorrect';
            }
            updateScore();
        }

        function renderLog() {
            logEntriesDiv.innerHTML = ''; 

            if (userAttemptsLog.length === 0) {
                logEntriesDiv.innerHTML = '<p class="no-attempts">No attempts yet.</p>';
                return;
            }

            userAttemptsLog.forEach(entry => {
                const entryDiv = document.createElement('div');
                entryDiv.classList.add('log-entry');
                entryDiv.classList.add(entry.isCorrect ? 'correct-attempt' : 'incorrect-attempt');
                
                entryDiv.innerHTML = `
                    <p><small>${entry.timestamp}</small> - <strong>Rule:</strong> ${entry.rule}</p>
                    <p><strong>Problem:</strong> ${entry.problem}</p>
                    <p><strong>Your Answer:</strong> ${entry.userAnswer}</p>
                    <p><strong>Correct Answer:</strong> ${entry.correctAnswer}</p>
                    <p><strong>Status:</strong> ${entry.isCorrect ? 'Correct' : 'Incorrect'}</p>
                `;
                logEntriesDiv.appendChild(entryDiv);
            });
        }
        
        function clearLog() {
            if (confirm("Are you sure you want to clear the attempt log?")) {
                userAttemptsLog = [];
                renderLog();
            }
        }


        function nextProblem() {
            generateProblem();
        }

        function updateScore() {
            scoreText.textContent = `Score: ${score} / ${totalAsked}`;
        }

        // Initialize
        showMenu();
        updateScore();
        renderLog(); 

    </script>
</body>
</html>
