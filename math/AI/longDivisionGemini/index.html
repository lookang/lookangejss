<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Long Division</title>
<link rel="stylesheet" href="styles.css">

<!-- Google Analytics -->
<script async="true" src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
<script>

  gtag('config', 'G-S9EWRY1CPJ');

<!-- Google AdSense -->
<script data-ad-client="ca-pub-0121577198857509" async="true" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>

</head>
<body>

<div class="long-division-container">
    <!-- Row 1: Quotient -->
    <div class="grid-item"></div> <!-- Spacer for divisor col -->
    <div class="grid-item"></div> <!-- Spacer for bracket col -->
    <div class="grid-item" id="q1_val"></div>
    <div class="grid-item" id="q2_val"></div>
    <div class="grid-item" id="q3_val"></div>

    <!-- Row 2: Problem Setup -->
    <select id="divisorInput" class="input-style"></select>
    <div class="grid-item division-bracket-cell">)</div>
    <div class="grid-item dividend-roof"></div> <!-- Roof Line -->
    <select id="d1_val" class="input-style"></select>
    <select id="d2_val" class="input-style"></select>
    <select id="d3_val" class="input-style"></select>
    
    <!-- Row 3: First Subtraction Line -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item subtraction-sign" id="subSign1">-</div>
    <div class="grid-item" id="m1_val"></div> 
    <div class="grid-item" id="line1"></div> <!-- Line under m1_val -->
    <div class="grid-item"></div> <!-- Spacer -->

    <!-- Row 4: First Subtraction Result & Bring Down 1 -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item" id="s1_res_val"></div> 
    <div class="grid-item" id="d2_brought_val"></div>
    <div class="grid-item"></div> <!-- Spacer -->

    <!-- Row 5: Second Subtraction Line -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item subtraction-sign" id="subSign2">-</div>
    <div class="grid-item" id="m2_val_tens"></div>
    <div class="grid-item" id="m2_val_ones"></div>
    <div class="grid-item" id="line2"></div> <!-- Line under m2_val -->
    
    <!-- Row 6: Second Subtraction Result & Bring Down 2 -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item" id="s2_res_val"></div> 
    <div class="grid-item" id="d3_brought_val"></div>

    <!-- Row 7: Third Subtraction Line -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item subtraction-sign" id="subSign3">-</div>
    <div class="grid-item" id="m3_val_tens"></div>
    <div class="grid-item" id="m3_val_ones"></div>
    <div class="grid-item" id="line3"></div> <!-- Line under m3_val -->

    <!-- Row 8: Final Remainder -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item"></div> <!-- Spacer -->
    <div class="grid-item" id="s3_res_val"></div>
</div>

<div class="controls">
    <button id="startResetBtn">Start/Reset Division</button>
    <button id="prevStepBtn">Previous Step</button>
    <button id="nextStepBtn">Next Step</button>
</div>
<div class="explanation-prompts">
    <p id="promptText"></p>
    <button id="speakBtn" title="Read Aloud">🔊</button>
    <textarea id="userExplanationArea" placeholder="Type your explanation for the current step here..."></textarea>
</div>

<!-- New Credits Section -->
<div class="credits">

</div>

<script src="script.js"></script>
</body>
</html>
