  function uppersum () {  // > CustomCode.uppersum:1
  //Supremum  // > CustomCode.uppersum:2
  x[0]=begin;  // > CustomCode.uppersum:3
  y[0]=Math.sin(x[0]);  // > CustomCode.uppersum:4
  delta =(end-begin)/(n-1);  // > CustomCode.uppersum:5
  x1[0]=x[0]+delta;  // > CustomCode.uppersum:6
  sup[0]=Math.sin(x1[0]);  // > CustomCode.uppersum:7
  Abl[0]=Math.cos(x[0]);  // > CustomCode.uppersum:8
  Isup[0]=sup[0]*delta;  // > CustomCode.uppersum:9
  for (var i=1; i<n ; i++) { //loop  // > CustomCode.uppersum:10
  x[i]=begin + i*delta;  // > CustomCode.uppersum:11
  y[i]=Math.sin(x[i]);  // > CustomCode.uppersum:12
  Abl[i]=Math.cos(x[i]);  // > CustomCode.uppersum:13
  x1[i]=x[i] + delta;  // > CustomCode.uppersum:14
  if ( y[i]>y[i-1] && Abl[i-1]*Abl[i]>0) { //case 1 increasing y ,no change in sign of function  // > CustomCode.uppersum:15
    sup[i-1]=y[i]; // let y be upper  // > CustomCode.uppersum:16
  hint = "1= "+sup[i-1];  // > CustomCode.uppersum:17
  }  // > CustomCode.uppersum:18
  //if ( y[i]<y[i-1] && Abl[i-1]*Abl[i]>0)   // > CustomCode.uppersum:19
  else if ( y[i]<y[i-1] && Abl[i-1]*Abl[i]>0) { //case 2 decreasing y, ,no change in sign  // > CustomCode.uppersum:20
    sup[i-1]=y[i-1]; //let y earlier be upper  // > CustomCode.uppersum:21
    hint = "2= "+sup[i-1];  // > CustomCode.uppersum:22
    }  // > CustomCode.uppersum:23
  //if ( Abl[i-1]*Abl[i]<0 && y[i]>0)  // > CustomCode.uppersum:24
  else if ( Abl[i-1]*Abl[i]<0 && y[i]>0) { //case 3 top of function  // > CustomCode.uppersum:25
  //sup[i-1]=1.0 ;  // > CustomCode.uppersum:26
  sup[i-1]= Math.max(y[i],y[i-1]);  // > CustomCode.uppersum:27
  hint = "3= "+sup[i-1];  // > CustomCode.uppersum:28
  }  // > CustomCode.uppersum:29
  //if ( Abl[i-1]*Abl[i]<0 && y[i]<0)  // > CustomCode.uppersum:30
  else if ( Abl[i-1]*Abl[i]<0 && y[i]<0){  //case 4 bottom of fucntion  // > CustomCode.uppersum:31
  sup[i-1]=Math.max(y[i],y[i-1]) ;  // > CustomCode.uppersum:32
  hint = "4= " +sup[i-1];  // > CustomCode.uppersum:33
  }  // > CustomCode.uppersum:34
  Isup[i]=Isup[i-1]+sup[i]*delta;  // > CustomCode.uppersum:35
  sumsup=Isup[n-1]; // put outside loop to get answer once  // > CustomCode.uppersum:36
  //alert(sumsup);  // > CustomCode.uppersum:37
  } //loop  // > CustomCode.uppersum:38
  }  // > CustomCode.uppersum:39

  function lowersum () {  // > CustomCode.lowersum:1

  x[0]=begin;  // > CustomCode.lowersum:3
  y[0]=Math.sin(x[0]);  // > CustomCode.lowersum:4
  delta =(end-begin)/(n-1);  // > CustomCode.lowersum:5
  x1[0]=x[0]+delta;  // > CustomCode.lowersum:6
  inf[0]=Math.sin(x1[0]);  // > CustomCode.lowersum:7
  Abl[0]=Math.cos(x[0]);  // > CustomCode.lowersum:8
  Iinf[0]=inf[0]*delta;  // > CustomCode.lowersum:9
  for (var i=1; i<n ; i++) {  // > CustomCode.lowersum:10
  x[i]=begin + i*delta;  // > CustomCode.lowersum:11
  y[i]=Math.sin(x[i]);  // > CustomCode.lowersum:12
  Abl[i]=Math.cos(x[i]);  // > CustomCode.lowersum:13
  x1[i]=x[i] + delta;  // > CustomCode.lowersum:14
  if ( y[i]>y[i-1] && Abl[i-1]*Abl[i]>0)   // > CustomCode.lowersum:15
  {inf[i-1]=y[i-1];}  // > CustomCode.lowersum:16
  if ( y[i]<y[i-1] && Abl[i-1]*Abl[i]>0)   // > CustomCode.lowersum:17
  {inf[i-1]=y[i];}  // > CustomCode.lowersum:18
  if ( Abl[i-1]*Abl[i]<0 && y[i]>0)  // > CustomCode.lowersum:19
  {inf[i-1]=Math.min(y[i-1],y[i]) ;}  // > CustomCode.lowersum:20
  if ( Abl[i-1]*Abl[i]<0 && y[i]<0)  // > CustomCode.lowersum:21

  Iinf[i]=Iinf[i-1]+inf[i]*delta;  // > CustomCode.lowersum:23
  suminf=Iinf[n-1];  // > CustomCode.lowersum:24
  }  // > CustomCode.lowersum:25
  }  // > CustomCode.lowersum:26
