  _model._userUnserialize = function(json) {

  _model.getOdes = function() { return []; }

  }

  function initFunctions() { // > Custom code page: initFunctions - line 1
      reset(); // > Custom code page: initFunctions - line 2
      initPlottedPoints(); // > Custom code page: initFunctions - line 3
  } // > Custom code page: initFunctions - line 4

  function reset () { // > Custom code page: reset - line 1
      plottedPointsX = []; // > Custom code page: reset - line 2
      plottedPointsY = []; // > Custom code page: reset - line 3
      plottedPoints = []; // > Custom code page: reset - line 4
      selectedPlottedPoints = []; // > Custom code page: reset - line 5
      plottedPointIndex = -1; // > Custom code page: reset - line 6
      selectedPointIndex = -1; // > Custom code page: reset - line 7
      plottedLineX = [undefined]; // > Custom code page: reset - line 8
      plottedLineY = [undefined]; // > Custom code page: reset - line 9

      plottedSizeY = [undefined]; // > Custom code page: reset - line 11
       // > Custom code page: reset - line 12
  } // > Custom code page: reset - line 13

  function initPlottedPoints() { // > Custom code page: initPlottedPoints - line 1
      plottedPointIndex = -1; // > Custom code page: initPlottedPoints - line 2
      selectedPointIndex = -1; // > Custom code page: initPlottedPoints - line 3
   // > Custom code page: initPlottedPoints - line 4
      const tickSeparation = 1; // > Custom code page: initPlottedPoints - line 5
   // > Custom code page: initPlottedPoints - line 6
      plottedPointsX = []; // > Custom code page: initPlottedPoints - line 7
      plottedPointsY = []; // > Custom code page: initPlottedPoints - line 8
      plottedPoints = []; // > Custom code page: initPlottedPoints - line 9
   // > Custom code page: initPlottedPoints - line 10
      for (let x = -graphY; x <= graphX + graphY; x += tickSeparation) { // > Custom code page: initPlottedPoints - line 11
          for (let y = -graphX; y <= graphY + graphX; y += tickSeparation) { // > Custom code page: initPlottedPoints - line 12
              let isoX = (x - y) * tickSeparation / Math.sqrt(2); // > Custom code page: initPlottedPoints - line 13
              let isoY = (x + y) * tickSeparation / Math.sqrt(2); // > Custom code page: initPlottedPoints - line 14
   // > Custom code page: initPlottedPoints - line 15
              isoX = Math.round(isoX * 10) / 10; // > Custom code page: initPlottedPoints - line 16
              isoY = Math.round(isoY * 10) / 10; // > Custom code page: initPlottedPoints - line 17
   // > Custom code page: initPlottedPoints - line 18
              if (isoX >= 0 && isoY >= 0 && isoX <= graphX && isoY <= graphY) { // > Custom code page: initPlottedPoints - line 19
                  plottedPointsX.push(isoX); // > Custom code page: initPlottedPoints - line 20
                  plottedPointsY.push(isoY); // > Custom code page: initPlottedPoints - line 21
                  plottedPoints.push({ // > Custom code page: initPlottedPoints - line 22
                      x: isoX, // > Custom code page: initPlottedPoints - line 23
                      y: isoY, // > Custom code page: initPlottedPoints - line 24
                      connected: [] // > Custom code page: initPlottedPoints - line 25
                  }); // > Custom code page: initPlottedPoints - line 26
              } // > Custom code page: initPlottedPoints - line 27
          } // > Custom code page: initPlottedPoints - line 28
      } // > Custom code page: initPlottedPoints - line 29
   // > Custom code page: initPlottedPoints - line 30
      selectedPlottedPoints = Array(plottedPointsX.length).fill(0); // > Custom code page: initPlottedPoints - line 31
       // > Custom code page: initPlottedPoints - line 32
  } // > Custom code page: initPlottedPoints - line 33
   // > Custom code page: initPlottedPoints - line 34

  function onClickPlottedPoints (plottedPointIndex) { // > Custom code page: onClickPlottedPoints - line 1
      if (selectedPointIndex === -1) { // > Custom code page: onClickPlottedPoints - line 2
          selectedPointIndex = plottedPointIndex; // > Custom code page: onClickPlottedPoints - line 3
          selectedPlottedPoints[selectedPointIndex] = 2; // > Custom code page: onClickPlottedPoints - line 4
      } else if (selectedPointIndex === plottedPointIndex) { // > Custom code page: onClickPlottedPoints - line 5
          selectedPointIndex = -1; // > Custom code page: onClickPlottedPoints - line 6
          selectedPlottedPoints[plottedPointIndex] = 0; // > Custom code page: onClickPlottedPoints - line 7
      } else { // > Custom code page: onClickPlottedPoints - line 8
          plottedLineX.push(plottedPointsX[selectedPointIndex]); // > Custom code page: onClickPlottedPoints - line 9
          plottedLineY.push(plottedPointsY[selectedPointIndex]); // > Custom code page: onClickPlottedPoints - line 10
          plottedLineX.push(plottedPointsX[plottedPointIndex]); // > Custom code page: onClickPlottedPoints - line 11
          plottedLineY.push(plottedPointsY[plottedPointIndex]); // > Custom code page: onClickPlottedPoints - line 12
          plottedLineX.push(undefined); // > Custom code page: onClickPlottedPoints - line 13
          plottedLineY.push(undefined); // > Custom code page: onClickPlottedPoints - line 14
           // > Custom code page: onClickPlottedPoints - line 15
          plottedSizeX.push(undefined); // > Custom code page: onClickPlottedPoints - line 16
          plottedSizeY.push(undefined); // > Custom code page: onClickPlottedPoints - line 17
          plottedSizeX.push(plottedPointsX[selectedPointIndex] - plottedPointsX[plottedPointIndex]); // > Custom code page: onClickPlottedPoints - line 18
          plottedSizeY.push(plottedPointsY[selectedPointIndex] - plottedPointsY[plottedPointIndex]); // > Custom code page: onClickPlottedPoints - line 19
          plottedSizeX.push(undefined); // > Custom code page: onClickPlottedPoints - line 20
          plottedSizeY.push(undefined); // > Custom code page: onClickPlottedPoints - line 21
           // > Custom code page: onClickPlottedPoints - line 22
           // > Custom code page: onClickPlottedPoints - line 23

          plottedPointIndex = -1; // > Custom code page: onClickPlottedPoints - line 29

function _simulationView (_topFrame,_libraryPath,_codebasePath) {
  var _view = EJSS_CORE.createView(_topFrame);

  if (_libraryPath)  _view._setLibraryPath(_libraryPath);
  if (_codebasePath) _view._setResourcePath(_codebasePath);


  _view._reset = function() {
    _view._clearAll();
    _view._addElement(EJSS_INTERFACE.panel, 'panel', _view._topFrame);
    _view._addElement(EJSS_INTERFACE.panel, 'first_row', _view.panel)
      .setProperty("CSS","{ margin-bottom: 10px }")
      ;
    _view._addElement(EJSS_INTERFACE.imageAndTextButton, 'label', _view.first_row)
      .setProperty("Text","This is an isometric grid, try connecting the points to create a figure")
      ;
    _view._addElement(EJSS_INTERFACE.panel, 'second_row', _view.panel)
      .setProperty("CSS","{ margin-bottom: 10px }")
      ;
    _view._addElement(EJSS_INTERFACE.button, 'clear', _view.second_row)
      .setProperty("Text","Clear Scnenario")
      ;
    _view._addElement(EJSS_DRAWING2D.plottingPanel, 'plottingPanel', _view.panel)
      .setProperty("Width","500px")
      .setProperty("Height","500px")
      .setProperty("AutoScaleX",false)
      .setProperty("AutoScaleY",false)
      .setProperty("MinimumX",0)
      .setProperty("MinimumY",0)
      .setProperty("Gutters",[0,0,0,0])
      .setProperty("XFixedTick",0)
      .setProperty("XTickStep",1)
      .setProperty("YTickStep",1)
      .setProperty("YFixedTick",0)
      .setProperty("XAutoTicks",false)
      .setProperty("YAutoTicks",false)
      .setProperty("AxisYShow",false)
      .setProperty("AxisXShow",false)
      .setProperty("Enabled",true)
      .setProperty("GridXShow",false)
      .setProperty("GridYShow",false)
      ;
    _view._addElement(EJSS_DRAWING2D.shapeSet, 'plottedPoints', _view.plottingPanel)
      .setProperty("SizeX",0.2)
      .setProperty("SizeY",0.2)
      .setProperty("EnabledPosition","ENABLED_NO_MOVE")
      .setProperty("ShapeType","ELLIPSE")
      .setProperty("FillColor","LightGray")
      ;
    _view._addElement(EJSS_DRAWING2D.segmentSet, 'plottedLine', _view.plottingPanel)
      .setProperty("LineColor","Black")
      .setProperty("LineWidth",5)
      ;
  }; // end of _view._reset
  return _view;
}
