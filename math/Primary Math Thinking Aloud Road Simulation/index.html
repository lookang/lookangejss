<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sine Curve Animation</title>
    <style>
        canvas {
            border: 1px solid black;
            display: flex;
            margin: 0 auto;
        }

        #scenarios-div {
            display: flex;
            justify-content: center;
            margin: 10px;
        }

        #description {
            text-align: center;
            font-size: 20px;
            font-weight: lighter;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <p id="description">Scenario Description</p>
    <div id="scenarios-div">
        <select name="scenarios" id="scenarios">
            <option value="Scenario A">Scenario A</option>
            <option value="Scenario B">Scenario B</option>
            <option value="Scenario C">Scenario C</option>
            <option value="Scenario D">Scenario D</option>
        </select>
        <button id="check">Check</button>
    </div>
    <canvas id="plotCanvas" width="1200" height="600"></canvas>
    <div style="width: 1200px; margin: 0 auto; margin-top: 10px">
        <p id="past-attempts" style="padding: 0px; margin: 0px auto; text-align: left; display: block;"></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
