  function initPails() { // > Custom code page: initFunctions - line 1
      scenarios[selectedScenario].pails.forEach(pail => pail.currentVol = 0); // > Custom code page: initFunctions - line 2
      scenarios[selectedScenario].tank.currentVol = 0; // > Custom code page: initFunctions - line 3
       // > Custom code page: initFunctions - line 4
      pailX = []; // > Custom code page: initFunctions - line 5
      pailY = []; // > Custom code page: initFunctions - line 6
      waterX = []; // > Custom code page: initFunctions - line 7
      waterY = []; // > Custom code page: initFunctions - line 8
      coverX = []; // > Custom code page: initFunctions - line 9
      coverY = []; // > Custom code page: initFunctions - line 10
      textX = []; // > Custom code page: initFunctions - line 11
      textY = []; // > Custom code page: initFunctions - line 12
       // > Custom code page: initFunctions - line 13
      let numOfPails = scenarios[selectedScenario].pails.length; // > Custom code page: initFunctions - line 14
      let currentY = 15; // > Custom code page: initFunctions - line 15
      let pailIndex = 0; // > Custom code page: initFunctions - line 16
       // > Custom code page: initFunctions - line 17
      while (pailIndex < numOfPails) { // > Custom code page: initFunctions - line 18
          let pailsInRow = Math.min(3, numOfPails - pailIndex); // > Custom code page: initFunctions - line 19
          let xCoords = []; // > Custom code page: initFunctions - line 20
           // > Custom code page: initFunctions - line 21
          for (let i = 0; i < pailsInRow; i++) { // > Custom code page: initFunctions - line 22
              xCoords.push((i + 0.6) * (12 / (pailsInRow + 0.2))); // > Custom code page: initFunctions - line 23
          } // > Custom code page: initFunctions - line 24
           // > Custom code page: initFunctions - line 25
          for (let i = 0; i < pailsInRow; i++) { // > Custom code page: initFunctions - line 26
              pailX.push(xCoords[i]); // > Custom code page: initFunctions - line 27
              pailY.push(currentY); // > Custom code page: initFunctions - line 28
              coverX.push(xCoords[i]); // > Custom code page: initFunctions - line 29
              coverY.push(currentY+scenarios[selectedScenario].pails[pailIndex].volume/2) // > Custom code page: initFunctions - line 30
              waterX.push(xCoords[i]); // > Custom code page: initFunctions - line 31
              waterY.push(currentY-scenarios[selectedScenario].pails[pailIndex].volume/2) // > Custom code page: initFunctions - line 32
              textX.push(xCoords[i]); // > Custom code page: initFunctions - line 33
              textY.push(currentY-scenarios[selectedScenario].pails[pailIndex].volume/2-0.5) // > Custom code page: initFunctions - line 34
              pailIndex++; // > Custom code page: initFunctions - line 35
          }  // > Custom code page: initFunctions - line 36
       // > Custom code page: initFunctions - line 37
          currentY -= 6; // > Custom code page: initFunctions - line 38
      } // > Custom code page: initFunctions - line 39
  } // > Custom code page: initFunctions - line 40

  function onClick (element) { // > Custom code page: onClick - line 1
       // > Custom code page: onClick - line 2

          } // > Custom code page: onClick - line 21
           // > Custom code page: onClick - line 22
          if (selected[0] === element) { // > Custom code page: onClick - line 23
              selected = []; // > Custom code page: onClick - line 24
              if (typeof element === "number") { // > Custom code page: onClick - line 25
                   scenarios[selectedScenario].pails[element].selected = false; // > Custom code page: onClick - line 26
              } // > Custom code page: onClick - line 27
              return; // > Custom code page: onClick - line 28
               // > Custom code page: onClick - line 29
          } // > Custom code page: onClick - line 30
           // > Custom code page: onClick - line 31
          if (selected[0] === "hose" && typeof element === "number") { // > Custom code page: onClick - line 32
              scenarios[selectedScenario].pails[element].currentVol = scenarios[selectedScenario].pails[element].volume; // > Custom code page: onClick - line 33
              selected = []; // > Custom code page: onClick - line 34
              return; // > Custom code page: onClick - line 35
          } // > Custom code page: onClick - line 36
           // > Custom code page: onClick - line 37
          if (typeof selected[0] === "number" && element === "tank") { // > Custom code page: onClick - line 38
              const selectedPail = scenarios[selectedScenario].pails[selected[0]]; // > Custom code page: onClick - line 39
              const tank = scenarios[selectedScenario].tank; // > Custom code page: onClick - line 40
           // > Custom code page: onClick - line 41
              if (tank.currentVol === 10) { // > Custom code page: onClick - line 42
                  alert("Tank is already full!"); // > Custom code page: onClick - line 43
                  return; // > Custom code page: onClick - line 44
              } // > Custom code page: onClick - line 45
           // > Custom code page: onClick - line 46
              const transferableVolume = Math.min(10 - tank.currentVol, selectedPail.currentVol); // > Custom code page: onClick - line 47
           // > Custom code page: onClick - line 48
              tank.currentVol += transferableVolume; // > Custom code page: onClick - line 49
              selectedPail.currentVol -= transferableVolume; // > Custom code page: onClick - line 50
           // > Custom code page: onClick - line 51
              selectedPail.selected = false; // > Custom code page: onClick - line 52
              selected = []; // > Custom code page: onClick - line 53
              return; // > Custom code page: onClick - line 54
          } // > Custom code page: onClick - line 55
           // > Custom code page: onClick - line 56
          if (typeof selected[0] === "number" && typeof element === "number") { // > Custom code page: onClick - line 57
              const sourcePail = scenarios[selectedScenario].pails[selected[0]]; // > Custom code page: onClick - line 58
              const destinationPail = scenarios[selectedScenario].pails[element]; // > Custom code page: onClick - line 59
           // > Custom code page: onClick - line 60
              if (destinationPail.currentVol === destinationPail.volume) { // > Custom code page: onClick - line 61
                  alert("Pail is already full!"); // > Custom code page: onClick - line 62
                  return; // > Custom code page: onClick - line 63
              } // > Custom code page: onClick - line 64
           // > Custom code page: onClick - line 65
              const transferableVolume = Math.min(destinationPail.volume - destinationPail.currentVol, sourcePail.currentVol); // > Custom code page: onClick - line 66
           // > Custom code page: onClick - line 67
              destinationPail.currentVol += transferableVolume; // > Custom code page: onClick - line 68
              sourcePail.currentVol -= transferableVolume; // > Custom code page: onClick - line 69
           // > Custom code page: onClick - line 70
              sourcePail.selected = false; // > Custom code page: onClick - line 71
              selected = []; // > Custom code page: onClick - line 72
          } // > Custom code page: onClick - line 73
   // > Custom code page: onClick - line 74
      } // > Custom code page: onClick - line 75
   // > Custom code page: onClick - line 76
  } // > Custom code page: onClick - line 77

      _view.textSet.linkProperty('Y', function() { return textY; }, function(_v) { textY = _v; }); // linking Y of textSet
      _view.textSet.linkProperty('Text', function() { return scenarios[selectedScenario].pails.map(pail => `${pail.currentVol}L / ${pail.volume}L`); }); // linking Text of textSet
      _view.tankText.linkProperty('Text', function() { return `${scenarios[selectedScenario].tank.currentVol}L / ${scenarios[selectedScenario].tank.volume}L`; }); // linking Text of tankText
      _view.hose.linkProperty('Rotate', function() { return selected[0] === "hose" ? 7: 0; }); // linking Rotate of hose
      _view.hose.setAction('OnPress', function(_data, _info) { // Action OnPress for element hose
        onClick("hose") // property OnPress of hose: line 1
      });
    }; // end of new reset

    _model.setView(_view);
    _model.reset();
    _view._enableEPub();
  } // end of _createView

  _model.setAutoplay(false);
  _model.setFPS(20);
  _model.setStepsPerDisplay(1);
  _createView(); // this includes _model.reset()
  return _model;
}
