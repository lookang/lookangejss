    <h1>
      The vibrating string
    </h1>
    <p>
      This model solves the <b>one-dimensional wave equation </b>using an 
      explicit difference method. The wave equation is a second-order linear 
      partial differential equation, obtained by considering the forces which 
      apply to a small element of the string of length <font face="Monospaced">dx</font>.
    </p>
