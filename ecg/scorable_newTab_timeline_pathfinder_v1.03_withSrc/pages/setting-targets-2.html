<div id="setting-targets-2" class="layout-wrapper">
  <div class="sidebar">
    <button class="back-btn" onclick="window.history.back()">BACK</button>

    <div class="puzzle-container">
      <img src="./img/explore-opportunities-triangle-v1.png" alt="Logo" />
    </div>
  </div>

  <div class="main-content">
    <div class="title-container">
      <h1>Knowing My Purpose: Who Am I Becoming?</h1>
    </div>
    <h1>Target Setting</h1>
    <div class="question-label">
      Identify two personal strengths and state how each
      <span>strength</span>
      will help you to achieve your targets.
    </div>
    <div class="input-wrapper">
      <div class="textarea-container" id="input-container">
        <textarea
          class="answer-q1"
          id="strength-answer"
          placeholder="Type your answer"
          maxlength="300"
        ></textarea>

        <span class="char-counter" id="counter-strength">0/300</span>

        <div class="example-box" id="example-box">
          <span class="close-btn" id="close-example">&times;</span>
          <img class="example-icon" src="./img/tips-small.png" alt="Tips" />
          <div>
            Example:<br />
            <strong>Discipline:</strong> I am able to plan and commit to
            schedules and deadlines to achieve my targets.
          </div>
        </div>
      </div>

      <div class="tips-btn" id="tipsBtn" role="button" tabindex="0">
        <img src="./img/tips-icon.png" alt="Tips" />
      </div>
    </div>

    <div class="footer">
      <button class="continue-btn" id="continue-btn">CONTINUE</button>
    </div>
  </div>
</div>
