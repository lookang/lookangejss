<header></header>
<div id="create-mind-map">
  <div class="main-container">
    <div class="tips-btn" id="tipsBtn" role="button" tabindex="0">
      <img src="./img/tips-icon.png" alt="Tips" />
    </div>
    <div class="sidebar">
      <div class="sidebar-text">
        If you need help identifying more job roles, you can refer to
        <a href="https://go.gov.sg/mysfsec" target="_blank"
          >https://go.gov.sg/mysfsec</a
        >
        <br /><br />
        Return to this page to continue creating your career mindmap.
      </div>
      <button class="sidebar-btn">SAVE DRAFT</button>
      <button id="exportPdfButton" class="sidebar-btn">EXPORT AS PDF</button>
    </div>

    <div class="mindmap-area">
      <svg class="lines-svg" preserveAspectRatio="none">
        <line x1="50%" y1="45%" x2="17.5%" y2="24%" class="line" />
        <line x1="50%" y1="45%" x2="42.5%" y2="24%" class="line" />
        <line x1="50%" y1="45%" x2="62.5%" y2="24%" class="line" />
        <line x1="50%" y1="45%" x2="87.5%" y2="24%" class="line" />
        <line x1="50%" y1="55%" x2="17.5%" y2="72%" class="line" />
        <line x1="50%" y1="55%" x2="42.5%" y2="72%" class="line" />
        <line x1="50%" y1="55%" x2="62.5%" y2="72%" class="line" />
        <line x1="50%" y1="55%" x2="87.5%" y2="72%" class="line" />
      </svg>

      <div class="node-row">
        <div class="input-group">
          <input type="text" class="answer-q1" placeholder="Type your answer" />
        </div>
        <div class="input-group">
          <input type="text" class="answer-q2" placeholder="Type your answer" />
        </div>
        <div class="input-group">
          <input type="text" class="answer-q3" placeholder="Type your answer" />
        </div>
        <div class="input-group">
          <input type="text" class="answer-q4" placeholder="Type your answer" />
        </div>
      </div>

      <div class="center-row">
        <div class="center-node mindmap-selected-purpose">
          Provide quality and accessible healthcare
        </div>
      </div>

      <div class="node-row">
        <div class="input-group">
          <input type="text" class="answer-q5" placeholder="Type your answer" />
        </div>
        <div class="input-group">
          <input type="text" class="answer-q6" placeholder="Type your answer" />
        </div>
        <div class="input-group">
          <input type="text" class="answer-q7" placeholder="Type your answer" />
        </div>
        <div class="input-group">
          <input type="text" class="answer-q8" placeholder="Type your answer" />
        </div>
      </div>

      <div id="validation-error" class="error-msg">
        ⚠️ Please provide all job roles to continue.
      </div>
    </div>
  </div>
  <div class="create-btn-wrapper">
    <button id="create-submit-btn" class="create-btn">CREATE</button>
  </div>

  <div id="tipsModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">CLOSE</span>
      <h2
        style="color: var(--primary-blue); text-align: center; padding-top: 0px"
      >
        Mindmap Tips
      </h2>
      <img
        src="./img/create-mind-map-tip.png"
        alt="Tips Image"
        class="modal-img"
        onerror="this.style.display = 'none'"
      />
    </div>
  </div>
</div>

<div id="export-canvas" class="is-hidden"></div>
