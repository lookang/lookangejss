<div id="question">
  <header class="flex items-center justify-center"></header>

  <div class="content flex">
    <div class="flex items-center flex-col">
      <h2 class="text-center">Click on any factor to get started!</h2>

      <div id="wheel-container">
        <img id="factor-wheel" src="./img/wheel.png" alt="Wheel" />
        <div id="svg-overlay"></div>
      </div>
    </div>

    <div id="question-container">
      <h2 class="title title-alt"></h2>
      <p class="description"></p>

      <div class="tab flex justify-center">
        <button class="tablinks" data-tab="Questions">Questions</button>
        <button class="tablinks" data-tab="Resources">Resources</button>
      </div>

      <div id="Questions" class="tabcontent hide"></div>

      <div id="Resources" class="tabcontent hide"></div>
    </div>
  </div>

  <img
    src="./img/scroll-to-top.png"
    alt="Scroll to top"
    id="scroll-to-top"
    class="hide"
  />
</div>
