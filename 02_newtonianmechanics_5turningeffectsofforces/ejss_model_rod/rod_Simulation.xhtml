  function der(state) {  // > CustomCode.derivatives:1
    var vel = [3];  // > CustomCode.derivatives:2
    var cs = Math.cos(state[1]),  // > CustomCode.derivatives:3
           sn = Math.sin(state[1]);  // > CustomCode.derivatives:4
    vel[1] = state[2];  // > CustomCode.derivatives:5
    vel[0] = (t1 == 0.0) ? .5*cs*Math.sqrt(Math.abs(3.0*(y0-cs))) : Math.pow(y0,1.5)/3.0;  // > CustomCode.derivatives:6
    vel[2] = (t1 == 0.0) ? 1.5*sn : 6.0*sn*(2.0-cs*state[2]*state[2])/(8.0-6.0*cs*cs);  // > CustomCode.derivatives:7
    return vel;  // > CustomCode.derivatives:8
  }  // > CustomCode.derivatives:9
