  var xs,ys,zs,r,r3,b,dx,dy,dz,dx1,dy1,dz1;  // > CustomCode.calBfield:1
  function calBfield(x, y, z, yc, clear){  // > CustomCode.calBfield:2
   if(clear)bx=by=bz=0;  // > CustomCode.calBfield:3
   for(var i=1;i<n;i++){  // > CustomCode.calBfield:4
    dx=PX[i]-PX[i-1];  // > CustomCode.calBfield:5
    dy=0;//PY[i]-PY[i-1];  // > CustomCode.calBfield:6
    dz=PZ[i]-PZ[i-1];  // > CustomCode.calBfield:7
    xs=x-PX[i-1];  // > CustomCode.calBfield:8
    ys=y-yc;  // > CustomCode.calBfield:9
    zs=z-PZ[i-1];  // > CustomCode.calBfield:10
    r=Math.sqrt(xs*xs+ys*ys+zs*zs);  // > CustomCode.calBfield:11
    r3=r*r*r/bcst;  // > CustomCode.calBfield:12
    bz+=(dx*ys-dy*xs)/r3;  // > CustomCode.calBfield:13
    bx+=(dy*zs-dz*ys)/r3;  // > CustomCode.calBfield:14
    by+=(dz*xs-zs*dx)/r3;  // > CustomCode.calBfield:15
   }  // > CustomCode.calBfield:16
  }  // > CustomCode.calBfield:17

  //var xs,ys,zs,r,r3,b,dx,dy,dz,dx1,dy1,dz1;  // > CustomCode.calBF:1
  var xs,ys,zs,r,r3,b,dx,dy,dz,dx1,dy1,dz1; // make b global variable  // > CustomCode.calBF:2
  function calBF(){  // > CustomCode.calBF:3
  dx1=(xmax-xmin)/(nb-1);  // > CustomCode.calBF:4
  dy1=(ymax-ymin)/(nb-1);  // > CustomCode.calBF:5
  dz1=(zmax-zmin)/(nb-1);  // > CustomCode.calBF:6
   for(var j=0;j<nb;j++){  // > CustomCode.calBF:7
    for(var k=0;k<nb;k++){  // > CustomCode.calBF:8
      calField(bf[0][0][j][k],bf[0][1][j][k],bf[0][2][j][k]);  // > CustomCode.calBF:9
      b=Math.sqrt(bx*bx+by*by+bz*bz);  // > CustomCode.calBF:10
      bf[0][3][j][k]=I*dx1*bx/b;//Frem: swapped the array to fit arrow set  // > CustomCode.calBF:11
      bf[0][4][j][k]=I*dy1*by/b;//Frem: swapped the array to fit arrow set  // > CustomCode.calBF:12
      bf[0][5][j][k]=I*dz1*bz/b;//Frem: swapped the array to fit arrow set  // > CustomCode.calBF:13
      bf[0][6][j][k]=I*b;//Frem: swapped the array to fit arrow set  // > CustomCode.calBF:14
      bflookangdx[j+nb*k] = I*dx1*bx/b;  // > CustomCode.calBF:15
      bflookangdy[j+nb*k] =I*dy1*by/b;  // > CustomCode.calBF:16
      bflookangdz[j+nb*k] =I*dz1*bz/b;  // > CustomCode.calBF:17
    }  // > CustomCode.calBF:18
   }  // > CustomCode.calBF:19
   //set current  // > CustomCode.calBF:20
   //I =b/(mu0*0.8^1.5*numberofturns/R);  // > CustomCode.calBF:21
  }  // > CustomCode.calBF:22

  function calField(x, y, z){  // > CustomCode.calField:1
   calBfield(x,y,z,Y1,true);  // > CustomCode.calField:2
   calBfield(x,y,z,Y2,false);  // > CustomCode.calField:3
  }  // > CustomCode.calField:4

  function getA (x, y, z, va, vb, id) {  // > CustomCode.getA:1
   calField(x,y,z);  // > CustomCode.getA:2
   if(id==0) return qm*(va*bz-vb*by);  // > CustomCode.getA:3
   else if(id==1)return qm*(va*bx-vb*bz);  // > CustomCode.getA:4
   return qm*(va*by-vb*bx);  // > CustomCode.getA:5
  }  // > CustomCode.getA:6

  function _ODE_evolution1() {
    var __odeSelf = {};
    var __eventSolver;
    var __solverClass = EJSS_ODE_SOLVERS.rungeKutta4;
    var __state=[];
    var __ignoreErrors=false;
    var __mustInitialize=true;
    var __isEnabled=true;
    var __mustUserReinitialize=false;
    var __mustReinitialize=true;


    __odeSelf._getOdeVars = function (){ return["x","y","z","vz","vy","vx","t"]};

    __odeSelf.setSolverClass = function(__aSolverClass) {
      __solverClass = __aSolverClass;
      __instantiateSolver();
    };

    function __instantiateSolver() {
      __state=[];
      __pushState();
      __eventSolver = EJSS_ODE_SOLVERS.interpolatorEventSolver(__solverClass(),__odeSelf);
      __mustInitialize = true;
    }

    __odeSelf.setEnabled = function(_enabled) { __isEnabled = _enabled; };

    __odeSelf.getIndependentVariableValue = function() { return __eventSolver.getIndependentVariableValue(); };

    __odeSelf.getInternalStepSize = function() { return __eventSolver.getInternalStepSize(); };

    __odeSelf.isAccelerationIndependentOfVelocity = function() { return false; };

    __odeSelf.initializeSolver = function() {
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); return; }
      __pushState();
      __eventSolver.initialize(dt);
      __eventSolver.setBestInterpolation(false);
      __eventSolver.setMaximumInternalSteps(10000);
      __eventSolver.removeAllEvents();
      for(k in userEvents1){__eventSolver.addEvent(userEvents1[k]);}
      __eventSolver.setEstimateFirstStep(false);
      __eventSolver.setEnableExceptions(false);
      __eventSolver.setTolerances(0.0000001,0.0000001);
      __mustReinitialize = true;
      __mustInitialize = false;
    };

    function __pushState() {
      // Copy our variables to __state[] 
        var __j=0;
        var __n=0;
        var __cIn=0;
        if (__state[__cIn]!=x) __mustReinitialize = true;
        __state[__cIn++] = x;
        if (__state[__cIn]!=y) __mustReinitialize = true;
        __state[__cIn++] = y;
        if (__state[__cIn]!=z) __mustReinitialize = true;
        __state[__cIn++] = z;
        if (__state[__cIn]!=vz) __mustReinitialize = true;
        __state[__cIn++] = vz;
        if (__state[__cIn]!=vy) __mustReinitialize = true;
        __state[__cIn++] = vy;
        if (__state[__cIn]!=vx) __mustReinitialize = true;
        __state[__cIn++] = vx;
        if (__state[__cIn]!=t) __mustReinitialize = true;
        __state[__cIn++] = t;
    }

    function __arraysChanged () {
      return false;
    }

    __odeSelf.getEventSolver = function() {
      return __eventSolver;
    };

    __odeSelf.resetSolver = function() {
      __mustUserReinitialize = true;
    };

    __odeSelf.automaticResetSolver = function() {
      __mustReinitialize = true;
    };

    function __errorAction () {
      if (__ignoreErrors) return;
      console.log (__eventSolver.getErrorMessage());
      _pause();
      // Make sure the solver is reinitialized;
      __mustReinitialize = true;
    }

    __odeSelf.step = function() { return __privateStep(false); };

    __odeSelf.solverStep = function() { return __privateStep(true); };

    function __privateStep(__takeMaximumStep) {
      if (!__isEnabled) return 0;
      if (dt===0) return 0;
      if (__mustInitialize) __odeSelf.initializeSolver();
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); }
      __eventSolver.setStepSize(dt);
      __eventSolver.setInternalStepSize(dt);
      __eventSolver.setMaximumInternalSteps(10000);
      __eventSolver.setTolerances(0.0000001,0.0000001);
      __pushState();
      if (__mustUserReinitialize) { 
        __eventSolver.userReinitialize();
        __mustUserReinitialize = false;
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      else if (__mustReinitialize) { 
        __eventSolver.reinitialize();
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      var __stepTaken = __takeMaximumStep ? __eventSolver.maxStep() : __eventSolver.step();
      // Extract our variables from __state
        var __i=0;
        var __cOut=0;
        x = __state[__cOut++];
        y = __state[__cOut++];
        z = __state[__cOut++];
        vz = __state[__cOut++];
        vy = __state[__cOut++];
        vx = __state[__cOut++];
        t = __state[__cOut++];
      // Check for error
      if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      return __stepTaken;
    }

    __odeSelf.getState = function() { return __state; };

    __odeSelf.getRate = function(_aState,_aRate) {
      // Extract our variables from _aState
        var __i=0;
        var __cOut=0;
        var x = _aState[__cOut++];
        var y = _aState[__cOut++];
        var z = _aState[__cOut++];
        var vz = _aState[__cOut++];
        var vy = _aState[__cOut++];
        var vx = _aState[__cOut++];
        var t = _aState[__cOut++];
      // Compute the rate
        var __cRate=0;
        _aRate[__cRate++] = vx; // Rate for ODE: Evol Page 3:x
        _aRate[__cRate++] = vy; // Rate for ODE: Evol Page 3:y
        _aRate[__cRate++] = vz; // Rate for ODE: Evol Page 3:z
        _aRate[__cRate++] = getA(x,y,z,vx,vy,2); // Rate for ODE: Evol Page 3:vz
        _aRate[__cRate++] = getA(x,y,z,vz,vx,1); // Rate for ODE: Evol Page 3:vy
        _aRate[__cRate++] = getA(x,y,z,vy,vz,0); // Rate for ODE: Evol Page 3:vx
        _aRate[__cRate++] = 1; // independent variable
        return _aRate;
    }; //end of getRate

    __odeSelf._addEvent = function(userCondition,userAction,eventType,eventMethod,maxIter,eventTolerance,endAtEvent){
    var User_Event = function (userCondition,userAction,eventType,eventMethod,maxIter,eventTolerance,endAtEvent) {
      var _eventSelf = {};

      _eventSelf.getTypeOfEvent = function() { return eventType; };

      _eventSelf.getRootFindingMethod = function() { return eventMethod; };

      _eventSelf.getMaxIterations = function() { return maxIter; };

      _eventSelf.getTolerance = function() { return eventTolerance; };

      _eventSelf.evaluate = function(_aState) { 
      // Extract our variables from _aState
        var __i=0;
        var __cOut=0;
        var x = _aState[__cOut++];
        var y = _aState[__cOut++];
        var z = _aState[__cOut++];
        var vz = _aState[__cOut++];
        var vy = _aState[__cOut++];
        var vx = _aState[__cOut++];
        var t = _aState[__cOut++];
      return eval(userCondition);
      };

      _eventSelf.action = function() { 
      // Extract our variables from __state
        var __i=0;
        var __cOut=0;
        x = __state[__cOut++];
        y = __state[__cOut++];
        z = __state[__cOut++];
        vz = __state[__cOut++];
        vy = __state[__cOut++];
        vx = __state[__cOut++];
        t = __state[__cOut++];
        var _returnValue = __userDefinedAction();
      // Copy our variables to __state[] 
        var __j=0;
        var __n=0;
        var __cIn=0;
        __state[__cIn++] = x;
        __state[__cIn++] = y;
        __state[__cIn++] = z;
        __state[__cIn++] = vz;
        __state[__cIn++] = vy;
        __state[__cIn++] = vx;
        __state[__cIn++] = t;
        return _returnValue;
      };

      function __userDefinedAction() {
        if (undefined != functions) eval(functions.toString());
        eval(userAction);
        return endAtEvent;
      }

      return _eventSelf;
    }; // End of event

   userEvents1.push(User_Event(userCondition,userAction,eventType,eventMethod,maxIter,eventTolerance,endAtEvent));
   }

    __instantiateSolver();

    return __odeSelf;
  }
