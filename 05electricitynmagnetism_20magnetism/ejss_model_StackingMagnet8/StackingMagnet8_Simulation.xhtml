     // > CustomCode.changeOrientation:25

        ayMagnetX = g-k*vyMagnetX - attractivepowerXY;  // > CustomCode.MagnetismX:14
        //ayMagnetY = g-k*vyMagnetY;  // > CustomCode.MagnetismX:15
        if (yMagnetX<=yMagnetY+yBlockSize){// Makes sure Z is nicely placed on top  // > CustomCode.MagnetismX:16
