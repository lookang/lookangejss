  function randomize () {  // > CustomCode.randomize:1

  function _ODE_evolution1() {
    var __odeSelf = {};
    var __eventSolver;
    var __solverClass = EJSS_ODE_SOLVERS.euler;
    var __state=[];
    var __mustInitialize=true;
    var __isEnabled=true;
    var __mustUserReinitialize=false;
    var __mustReinitialize=true;

    var _xLength;
    var _yLength;
    var _vxLength;
    var _vyLength;

    __odeSelf._getOdeVars = function (){ return["x","y","vx","vy","t"]};

    __odeSelf.setSolverClass = function(__aSolverClass) {
      __solverClass = __aSolverClass;
      __instantiateSolver();
    };

    function __instantiateSolver() {
      __state=[];
      _xLength = x.length;
      _yLength = y.length;
      _vxLength = vx.length;
      _vyLength = vy.length;
      __pushState();
      __eventSolver = EJSS_ODE_SOLVERS.interpolatorEventSolver(__solverClass(),__odeSelf);
      __mustInitialize = true;
    }

    __odeSelf.setEnabled = function(_enabled) { __isEnabled = _enabled; };

    __odeSelf.getIndependentVariableValue = function() { return __eventSolver.getIndependentVariableValue(); };

    __odeSelf.getInternalStepSize = function() { return __eventSolver.getInternalStepSize(); };

    __odeSelf.isAccelerationIndependentOfVelocity = function() { return false; };

    __odeSelf.initializeSolver = function() {
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); return; }
      __pushState();
      __eventSolver.initialize(dt);
      __eventSolver.setBestInterpolation(false);
      __eventSolver.setMaximumInternalSteps(10000);
      __eventSolver.removeAllEvents();
      for(k in userEvents1){__eventSolver.addEvent(userEvents1[k]);}
      __eventSolver.setEstimateFirstStep(false);
      __eventSolver.setEnableExceptions(false);
      __mustReinitialize = true;
      __mustInitialize = false;
    };

    function __pushState() {
      // Copy our variables to __state[] 
        var __j=0;
        var __n=0;
        var __cIn=0;
      if (!__mustReinitialize)
        for (__j=0,__n=__cIn; __j<_xLength; __j++)
           if (__state[__n++]!=x[__j]) { __mustReinitialize = true; break; }
        for (__j=0;__j<_xLength; __j++) {
          __state[__cIn++] = x[__j];
        }
      if (!__mustReinitialize)
        for (__j=0,__n=__cIn; __j<_yLength; __j++)
           if (__state[__n++]!=y[__j]) { __mustReinitialize = true; break; }
        for (__j=0;__j<_yLength; __j++) {
          __state[__cIn++] = y[__j];
        }
      if (!__mustReinitialize)
        for (__j=0,__n=__cIn; __j<_vxLength; __j++)
           if (__state[__n++]!=vx[__j]) { __mustReinitialize = true; break; }
        for (__j=0;__j<_vxLength; __j++) {
          __state[__cIn++] = vx[__j];
        }
      if (!__mustReinitialize)
        for (__j=0,__n=__cIn; __j<_vyLength; __j++)
           if (__state[__n++]!=vy[__j]) { __mustReinitialize = true; break; }
        for (__j=0;__j<_vyLength; __j++) {
          __state[__cIn++] = vy[__j];
        }
        if (__state[__cIn]!=t) __mustReinitialize = true;
        __state[__cIn++] = t;
    }

    function __arraysChanged () {
      if (_xLength != x.length) return true;
      if (_yLength != y.length) return true;
      if (_vxLength != vx.length) return true;
      if (_vyLength != vy.length) return true;
      return false;
    }

    __odeSelf.getEventSolver = function() {
      return __eventSolver;
    };

    __odeSelf.resetSolver = function() {
      __mustUserReinitialize = true;
    };

    __odeSelf.automaticResetSolver = function() {
      __mustReinitialize = true;
    };

    function __errorAction () {
      // Make sure the solver is reinitialized;
      __mustReinitialize = true;
      var _errorCode = __eventSolver.getErrorCode();
      if (__pagesEnabled["Error handling code"]) {
        { // For any error: 
        }
      }
    }

    __odeSelf.step = function() { return __privateStep(false); };

    __odeSelf.solverStep = function() { return __privateStep(true); };

    function __privateStep(__takeMaximumStep) {
      if (!__isEnabled) return 0;
      if (dt===0) return 0;
      if (__mustInitialize) __odeSelf.initializeSolver();
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); }
      __eventSolver.setStepSize(dt);
      __eventSolver.setInternalStepSize(dt);
      __eventSolver.setMaximumInternalSteps(10000);
      __pushState();
      if (__mustUserReinitialize) { 
        __eventSolver.userReinitialize();
        __mustUserReinitialize = false;
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      else if (__mustReinitialize) { 
        __eventSolver.reinitialize();
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      var __stepTaken = __takeMaximumStep ? __eventSolver.maxStep() : __eventSolver.step();
      // Extract our variables from __state
        var __i=0;
        var __cOut=0;
        for (__i=0;__i<_xLength; __i++) {
          x[__i] = __state[__cOut++];
        }
        for (__i=0;__i<_yLength; __i++) {
          y[__i] = __state[__cOut++];
        }
        for (__i=0;__i<_vxLength; __i++) {
          vx[__i] = __state[__cOut++];
        }
        for (__i=0;__i<_vyLength; __i++) {
          vy[__i] = __state[__cOut++];
        }
        t = __state[__cOut++];
      // Check for error
      if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      return __stepTaken;
    }

    __odeSelf.getState = function() { return __state; };

    __odeSelf.getRate = function(_aState,_aRate) {
      // Extract our variables from _aState
        var __i=0;

        var x = [];
        for (__i=0;__i<_xLength; __i++) {
          x[__i] = _aState[__cOut++];
        }

    _view._addElement(EJSS_INTERFACE.panel,"html1", _view.fullscreen) // EJsS HtmlView.HtmlView Page: declaration of element 'html1'
      .setProperty("Html","<h2>Why outbreaks like coronavirus spread exponentially, and how to “flatten the curve”</h2> <p>Coronavirus disease (COVID-19) is an infectious disease caused by a new virus.The disease causes respiratory illness (like the flu) with symptoms such as a cough, fever, and in more severe cases, difficulty breathing. You can protect yourself by washing your hands frequently, avoiding touching your face, and avoiding close contact (1 meter or 3 feet) with people who are unwell.</p> <h2>HOW IT SPREADS</h2> <p>Coronavirus disease spreads primarily through contact with an infected person when they cough or sneeze. It also spreads when a person touches a surface or object that has the virus on it, then touches their eyes, nose, or mouth.</p> <h2>Prevention</h2> <p>There’s currently no vaccine to prevent coronavirus disease (COVID-19).You can protect yourself and help prevent spreading the virus to others if you:</p> <h4>Do</h4> <ul>   <li>Wash your hands regularly for 20 seconds, with soap and water or alcohol-based hand rub</li> <li>Cover your nose and mouth with a disposable tissue or flexed elbow when you cough or sneeze</li> <li>Avoid close contact (1 meter or 3 feet) with people who are unwell</li> <li>Stay home and self-isolate from others in the household if you feel unwell</li> </ul> <h4>Don't</h4> <ul> <li>Touch your eyes, nose, or mouth if your hands are not clean</li> </ul> <h2>View</h2> <p>Left panel shows the visualization or the big picture view a population of 100 people, modelled as balls</p> <p>Right panel show the graphs of healthy, sick and recovered people based on the colors representation.</p> <h2>Simulations Features</h2> <p> The simulation is designed to be simple to use via dropdown menu. the option are self explanatory. </p> <p>Exponential spread is modelled using a random velocity and random direction, the spread of the virus from sick to healthy is probabilistic based on closeness or collision. The reason why each country is preventing this rapid growth rate to prevent filling up the hospitals to their maximum capacity, forcing emergency rooms to close their doors to new patients. This will likely lead to more deaths due to COVID-19.</p>") // EJsS HtmlView.HtmlView Page: setting property 'Html' for element 'html1'

      ;

    _view._addElement(EJSS_INTERFACE.panel,"html6", _view.fullscreen) // EJsS HtmlView.HtmlView Page: declaration of element 'html6'
      .setProperty("Html","<p>more options are coming, stay tuned for more updates!</p> <h2>Assumptions made in the model</h2> <p>The motion of the people (balls) are completely random, this might not be the case in real life, most people travel to work or to school in a regular timing.</p> <p>The healthy is moving about randomly, after collision contact, the balls moves off obeying collision laws of physics.</p> <p>The sick can only infect healthy, and the first sick remains sick until the virus is spread to another healthy ball making it sick too.</p> <p>The sick takes 14 days to recover after the first contact with another sick ball, this is a arbitrary length of days, email me if you think you have a better approximation?</p> <p>The recovered cannot be infected by the sick again. As more real world data surfaced, this assumption could be incorrect but not accounted for in the model.</p> <p>Social distancing completely makes the probability of virus spreading p = 0, which could be inaccurate as the virus could spread through 1. Person-to-person spread (modelled), 2.Spread from contact with contaminated surfaces or objects (not modelled) </p> <h2>Interaction/Games</h2> <p>Drag any balls, especially the sick ball to infect more balls at the beginning when time t = 0 day. This allows you to determine the initial number of sick.</p> <p>Inspired by https://www.washingtonpost.com/graphics/2020/world/corona-simulator/ </p>") // EJsS HtmlView.HtmlView Page: setting property 'Html' for element 'html6'
