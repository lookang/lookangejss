<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Growth Simulation</title>
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
        }
        .slider, .combobox {
            width: 300px;
            margin: 10px;
        }
        .display {
            font-size: 1.5em;
            margin: 10px;
        }
    </style>
    <script src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-S9EWRY1CPJ');
    </script>
</head>
<body>
    <div class="container">
        <h1>Plant Growth Simulation</h1>
        <label for="soilSelect">Select Soil: </label>
        <select id="soilSelect" class="combobox" onchange="updateValues()">
            <option value="A">Soil A</option>
            <option value="B">Soil B</option>
        </select>
        <br>
        <label for="timeSlider">Time (weeks): </label>
        <input type="range" id="timeSlider" min="0" max="6" step="1" value="0" class="slider" oninput="updateValues()">
        <div id="timeDisplay" class="display">Time: 0 weeks</div>
        <div id="soilDisplay" class="display">Soil A Plant Height: 0.00 cm</div>
    </div>

    <script>
        const data = {
            soilA: [0.00, 0.80, 1.60, 2.20, 3.40, 3.75, 4.50],
            soilB: [0.00, 0.45, 0.80, 1.00, 1.60, 2.20, 2.50]
        };

        function updateValues() {
            const timeSlider = document.getElementById("timeSlider");
            const soilSelect = document.getElementById("soilSelect");
            const time = timeSlider.value;
            const selectedSoil = soilSelect.value;
            const displayText = selectedSoil === "A" ? data.soilA[time] : data.soilB[time];

            document.getElementById("timeDisplay").innerText = `Time: ${time} weeks`;
            document.getElementById("soilDisplay").innerText = `${selectedSoil === "A" ? 'Soil A' : 'Soil B'} Plant Height: ${displayText.toFixed(2)} cm`;
        }

        // Ensuring the initial values are set properly
        document.addEventListener("DOMContentLoaded", updateValues);
    </script>
</body>
</html>
