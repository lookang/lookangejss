<!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML5 Interactive Content</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
    <!-- Google Tag Manager Analytics Script -->
<script async="true" src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}  // Google Analytics helper
  gtag('js', new Date());
  gtag('config', 'G-S9EWRY1CPJ');
</script>

<!-- Game wrapper -->
<div id="gameWrapper">
  <h1 id="title">Build‑a‑Word Bank!</h1>

  <!-- Score + progress information for the learner -->
  <div id="hud">
    <span id="score">Score: 0</span>
    <span id="progress">Question 1 / 10</span>
  </div>

  <!-- Question text appears here -->
  <div id="questionBox"></div>

  <!-- Multiple‑choice answers are injected here as buttons -->
  <div id="optionsBox"></div>

  <!-- Feedback area (Correct! / Try Again!) -->
  <div id="feedback" aria-live="polite"></div>

  <!-- Next button shown after each attempt -->
  <button id="nextBtn" class="hidden">Next ➡️</button>

  <!-- Summary screen shown after last question -->
  <div id="summaryScreen" class="hidden">
    <h2>Great Job! Here is your activity log:</h2>
    <ol id="logList"></ol>
    <button id="retryBtn">Play Again 🔄</button>
  </div>

  <!-- Credit & extra resources -->
  <footer>
    <p>Created by <a target="_blank" href="https://moeptt.vercel.app/#menuD">https://moeptt.vercel.app/#menuD</a> using GPT‑o3</p>
    <p>More fun English resources at <a target="_blank" href="https://sg.iwant2study.org/ospsg/index.php/interactive-resources/english">iwant2study.org</a></p>
  </footer>
</div>
        <script src="script.js"></script>
    </body>
    </html>
