  function track (pixels, width, height, colorFns) {  // > CustomCode.trackColor:1
      var results = [];  // > CustomCode.trackColor:2
      for (var k = 0; k < colorFns.length; k++) {  // > CustomCode.trackColor:3
        var r = trackColor(pixels, width, height, colorFns[k], k);  // > CustomCode.trackColor:4
        results = results.concat(r);  // > CustomCode.trackColor:5
      }  // > CustomCode.trackColor:6
      return results;  // > CustomCode.trackColor:7
  }  // > CustomCode.trackColor:8
  // Find the given color in the given matrix of pixels.  // > CustomCode.trackColor:9
  function trackColor (pixels, width, height, colorFn, id) {  // > CustomCode.trackColor:10
      var currGroup = new Int32Array(pixels.length >> 2);  // > CustomCode.trackColor:11
      var currGroupSize;  // > CustomCode.trackColor:12
      var currI, currJ, currW;  // > CustomCode.trackColor:13
      var marked = new Int8Array(pixels.length);  // > CustomCode.trackColor:14
      var minGroupSize = 30; // minimum group size to be classified as a rectangle  // > CustomCode.trackColor:15
      var neighboursW = getNeighboursForWidth(width);  // > CustomCode.trackColor:16
      var queue = new Int32Array(pixels.length);  // > CustomCode.trackColor:17
      var queuePosition;  // > CustomCode.trackColor:18
      var results = [];  // > CustomCode.trackColor:19
      var w = -4;  // > CustomCode.trackColor:20
      for (var i = 0; i < height; i++) {  // > CustomCode.trackColor:21
        for (var j = 0; j < width; j++) {  // > CustomCode.trackColor:22
          w += 4;  // > CustomCode.trackColor:23
          if (marked[w]) {  // > CustomCode.trackColor:24
            continue;  // > CustomCode.trackColor:25
          }  // > CustomCode.trackColor:26
          currGroupSize = 0;  // > CustomCode.trackColor:27
          queuePosition = -1;  // > CustomCode.trackColor:28
          queue[++queuePosition] = w;  // > CustomCode.trackColor:29
          queue[++queuePosition] = i;  // > CustomCode.trackColor:30
          queue[++queuePosition] = j;  // > CustomCode.trackColor:31
          marked[w] = 1;  // > CustomCode.trackColor:32
          while (queuePosition >= 0) {  // > CustomCode.trackColor:33
            currJ = queue[queuePosition--];  // > CustomCode.trackColor:34
            currI = queue[queuePosition--];  // > CustomCode.trackColor:35
            currW = queue[queuePosition--];  // > CustomCode.trackColor:36
            if (colorFn(pixels[currW], pixels[currW + 1], pixels[currW + 2])) {  // > CustomCode.trackColor:37
              currGroup[currGroupSize++] = currJ;  // > CustomCode.trackColor:38
              currGroup[currGroupSize++] = currI;  // > CustomCode.trackColor:39
              for (var k = 0; k < neighboursW.length; k++) {  // > CustomCode.trackColor:40
                var otherW = currW + neighboursW[k];  // > CustomCode.trackColor:41
                var otherI = currI + neighboursI[k];  // > CustomCode.trackColor:42
                var otherJ = currJ + neighboursJ[k];  // > CustomCode.trackColor:43
                if (!marked[otherW] && otherI >= 0 && otherI < height && otherJ >= 0 && otherJ < width) {  // > CustomCode.trackColor:44
                  queue[++queuePosition] = otherW;  // > CustomCode.trackColor:45
                  queue[++queuePosition] = otherI;  // > CustomCode.trackColor:46
                  queue[++queuePosition] = otherJ;  // > CustomCode.trackColor:47
                  marked[otherW] = 1;  // > CustomCode.trackColor:48
                }  // > CustomCode.trackColor:49
              }  // > CustomCode.trackColor:50
            }  // > CustomCode.trackColor:51
          }  // > CustomCode.trackColor:52
          if (currGroupSize >= minGroupSize) {  // > CustomCode.trackColor:53
            var data = calculateDimensions(currGroup, currGroupSize);  // > CustomCode.trackColor:54
            if (data) {  // > CustomCode.trackColor:55
              data.color = ""+id;  // > CustomCode.trackColor:56
              results.push(data);  // > CustomCode.trackColor:57
            }  // > CustomCode.trackColor:58
          }  // > CustomCode.trackColor:59
        }  // > CustomCode.trackColor:60
      }  // > CustomCode.trackColor:61
      return mergeRectangles(results);  // > CustomCode.trackColor:62
  }  // > CustomCode.trackColor:63
  var neighboursI = new Int32Array([-1, -1, 0, 1, 1, 1, 0, -1]);  // > CustomCode.trackColor:64
  var neighboursJ = new Int32Array([0, 1, 1, 1, 0, -1, -1, -1]);  // > CustomCode.trackColor:65
  // Gets the eight offset values of the neighbours surrounding a pixel.  // > CustomCode.trackColor:66
  function getNeighboursForWidth (width) {  // > CustomCode.trackColor:67
      var neighbours = new Int32Array(8);  // > CustomCode.trackColor:68
      neighbours[0] = -width * 4;  // > CustomCode.trackColor:69
      neighbours[1] = -width * 4 + 4;  // > CustomCode.trackColor:70
      neighbours[2] = 4;  // > CustomCode.trackColor:71
      neighbours[3] = width * 4 + 4;  // > CustomCode.trackColor:72
      neighbours[4] = width * 4;  // > CustomCode.trackColor:73
      neighbours[5] = width * 4 - 4;  // > CustomCode.trackColor:74
      neighbours[6] = -4;  // > CustomCode.trackColor:75
      neighbours[7] = -width * 4 - 4;  // > CustomCode.trackColor:76
      return neighbours;  // > CustomCode.trackColor:77
  };  // > CustomCode.trackColor:78
  // Calculates the central coordinate from the cloud points.  // > CustomCode.trackColor:79
  function calculateDimensions (cloud, total) {  // > CustomCode.trackColor:80
      var maxx = -1;  // > CustomCode.trackColor:81
      var maxy = -1;  // > CustomCode.trackColor:82
      var minx = Infinity;  // > CustomCode.trackColor:83
      var miny = Infinity;  // > CustomCode.trackColor:84
      for (var c = 0; c < total; c += 2) {  // > CustomCode.trackColor:85
        var x = cloud[c];  // > CustomCode.trackColor:86
        var y = cloud[c + 1];  // > CustomCode.trackColor:87
        if (x < minx) {  // > CustomCode.trackColor:88
          minx = x;  // > CustomCode.trackColor:89
        }  // > CustomCode.trackColor:90
        if (x > maxx) {  // > CustomCode.trackColor:91
          maxx = x;  // > CustomCode.trackColor:92
        }  // > CustomCode.trackColor:93
        if (y < miny) {  // > CustomCode.trackColor:94
          miny = y;  // > CustomCode.trackColor:95
        }  // > CustomCode.trackColor:96
        if (y > maxy) {  // > CustomCode.trackColor:97
          maxy = y;  // > CustomCode.trackColor:98
        }  // > CustomCode.trackColor:99
      }  // > CustomCode.trackColor:100
      return {  // > CustomCode.trackColor:101
        width: maxx - minx,  // > CustomCode.trackColor:102
        height: maxy - miny,  // > CustomCode.trackColor:103
        x: minx,  // > CustomCode.trackColor:104
        y: miny  // > CustomCode.trackColor:105
      };  // > CustomCode.trackColor:106
    };  // > CustomCode.trackColor:107
  // Unites groups whose bounding box intersect with each other.  // > CustomCode.trackColor:108
  function mergeRectangles (rects) {  // > CustomCode.trackColor:109
      var intersects;  // > CustomCode.trackColor:110
      var results = [];  // > CustomCode.trackColor:111
      var minDimension = 20; // minimum dimension to classify a rectangle.  // > CustomCode.trackColor:112
      var maxDimension = Infinity;  // > CustomCode.trackColor:113
      for (var r = 0; r < rects.length; r++) {  // > CustomCode.trackColor:114
        var r1 = rects[r];  // > CustomCode.trackColor:115
        intersects = true;  // > CustomCode.trackColor:116
        for (var s = r + 1; s < rects.length; s++) {  // > CustomCode.trackColor:117
          var r2 = rects[s];  // > CustomCode.trackColor:118
          if (intersectRect(r1.x, r1.y, r1.x + r1.width, r1.y + r1.height, r2.x, r2.y, r2.x + r2.width, r2.y + r2.height)) {  // > CustomCode.trackColor:119
            intersects = false;  // > CustomCode.trackColor:120
            var x1 = Math.min(r1.x, r2.x);  // > CustomCode.trackColor:121
            var y1 = Math.min(r1.y, r2.y);  // > CustomCode.trackColor:122
            var x2 = Math.max(r1.x + r1.width, r2.x + r2.width);  // > CustomCode.trackColor:123
            var y2 = Math.max(r1.y + r1.height, r2.y + r2.height);  // > CustomCode.trackColor:124
            r2.height = y2 - y1;  // > CustomCode.trackColor:125
            r2.width = x2 - x1;  // > CustomCode.trackColor:126
            r2.x = x1;  // > CustomCode.trackColor:127
            r2.y = y1;  // > CustomCode.trackColor:128
            break;  // > CustomCode.trackColor:129
          }  // > CustomCode.trackColor:130
        }  // > CustomCode.trackColor:131
        if (intersects) {  // > CustomCode.trackColor:132
          if (r1.width >= minDimension && r1.height >= minDimension) {  // > CustomCode.trackColor:133
            if (r1.width <= maxDimension && r1.height <= maxDimension) {  // > CustomCode.trackColor:134
              results.push(r1);  // > CustomCode.trackColor:135
            }  // > CustomCode.trackColor:136
          }  // > CustomCode.trackColor:137
        }  // > CustomCode.trackColor:138
      }  // > CustomCode.trackColor:139
      return results;  // > CustomCode.trackColor:140
    };  // > CustomCode.trackColor:141
      // > CustomCode.trackColor:142
  // Tests if a rectangle intersects with another.  // > CustomCode.trackColor:143
  function intersectRect (x0, y0, x1, y1, x2, y2, x3, y3) {  // > CustomCode.trackColor:144
      return !(x2 > x1 || x3 < x0 || y2 > y1 || y3 < y0);  // > CustomCode.trackColor:145
  };  // > CustomCode.trackColor:146

  // yellow  // > CustomCode.mycolor:1
  function yellowFn (r, g, b) {  // > CustomCode.mycolor:2
      var threshold = 50,  // > CustomCode.mycolor:3
        dx = r - 255,  // > CustomCode.mycolor:4
        dy = g - 255,  // > CustomCode.mycolor:5
        dz = b - 0;  // > CustomCode.mycolor:6
      if ((r - b) >= threshold && (g - b) >= threshold) {  // > CustomCode.mycolor:7
        return true;  // > CustomCode.mycolor:8
      }  // > CustomCode.mycolor:9
      return dx * dx + dy * dy + dz * dz < 10000;  // > CustomCode.mycolor:10
  }  // > CustomCode.mycolor:11
  // green  // > CustomCode.mycolor:12
  function greenFn (r, g, b) {  // > CustomCode.mycolor:13
      if (r < 20 && g > 50 && b > 50) {  // > CustomCode.mycolor:14
        return true;  // > CustomCode.mycolor:15
      }  // > CustomCode.mycolor:16
      return false;  // > CustomCode.mycolor:17
  }  // > CustomCode.mycolor:18

  // check platform for web browsers  // > CustomCode.iOSOrientation:18

  //navigator  // > CustomCode.iOSOrientation:23
  var Firefox = navigator.userAgent.indexOf("Firefox") != -1;  // > CustomCode.iOSOrientation:24
     // > CustomCode.iOSOrientation:25
  switch (window.orientation) { // using window.orientation as deciding factor  // > CustomCode.iOSOrientation:26
    case 0:  // > CustomCode.iOSOrientation:27

      this.screenOrientation = 'portrait';  // > CustomCode.iOSOrientation:29

        return window.screen.height*kapple;  //0.1 for app and 0.1 for nonfullscreenapp    // > CustomCode.iOSOrientation:32
        // > CustomCode.iOSOrientation:33

        //   return Math.max(window.screen.width,window.screen.height)*0.9;  // > CustomCode.iOSOrientation:36

        //  return window.innerHeight;  // > CustomCode.iOSOrientation:39
        // return document.documentElement.clientHeight;  // > CustomCode.iOSOrientation:40
      }  // > CustomCode.iOSOrientation:41
       // > CustomCode.iOSOrientation:42
      else {  // > CustomCode.iOSOrientation:43
       return window.innerHeight*k;  // > CustomCode.iOSOrientation:44
        //return 100*k+"vh";  // > CustomCode.iOSOrientation:45
