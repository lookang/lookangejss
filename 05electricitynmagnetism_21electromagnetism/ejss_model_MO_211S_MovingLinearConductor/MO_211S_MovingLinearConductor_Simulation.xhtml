  //generates the field for display  // > CustomCode.compute Field Vectors:1
  //no change required to complete activity  // > CustomCode.compute Field Vectors:2
  function computeField() {  // > CustomCode.compute Field Vectors:3
    var top=C+L/2;  // > CustomCode.compute Field Vectors:4
    var delta=L/(i-1);  // > CustomCode.compute Field Vectors:5
    for (var j=0; j<i; j++) {  // > CustomCode.compute Field Vectors:6
      //setting up location of field vectors  // > CustomCode.compute Field Vectors:7
      for (var k = 0; k<i; k++) {  // > CustomCode.compute Field Vectors:8
        for (var n = 0; n<i; n++) {  // > CustomCode.compute Field Vectors:9
          Location [k+i*j+i*i*n][0]=boxSize*2*(k+1)/(i+1)-boxSize;  // > CustomCode.compute Field Vectors:10
          Location [k+i*j+i*i*n][1] = boxSize*2*(j+1)/(i+1)-boxSize;  // > CustomCode.compute Field Vectors:11
          Location [k+i*j+i*i*n][2]=top-delta*n; //z vectors only in region set by sliders  // > CustomCode.compute Field Vectors:12
        }  // > CustomCode.compute Field Vectors:13
      }  // > CustomCode.compute Field Vectors:14
    }  // > CustomCode.compute Field Vectors:15
  }  // > CustomCode.compute Field Vectors:16

  //gets the value of the field at a specified location  // > CustomCode.Get Bx:1
  function getBx (z) {  // > CustomCode.Get Bx:2
    if(z>C+L/2 || z<C-L/2) return 0; //if z is outside location of field  // > CustomCode.Get Bx:3
                                     //return 0   // > CustomCode.Get Bx:4
    return Bx;                       //otherwise value is Bx   // > CustomCode.Get Bx:5
  }  // > CustomCode.Get Bx:6

  function getBy (z) {  // > CustomCode.get By:1
    if(z>C+L/2 || z<C-L/2) return 0; //if z is outside location of field  // > CustomCode.get By:2
                                     //return 0   // > CustomCode.get By:3
    return By;                       //otherwise value is By   // > CustomCode.get By:4
  }  // > CustomCode.get By:5

    if (!document.fullscreenElement &&    // alternative standard method  // > CustomCode.fullscreen:5

  _model.addToInitialization(function() {
    if (!__pagesEnabled["Init Page"]) return;
    //do not need to change anything here to complete the computational exercises  // > Initialization.Init Page:1
    computeField();  // > Initialization.Init Page:2
    B = Math.sqrt(Bx*Bx + By*By + Bz*Bz);  // > Initialization.Init Page:3
    conductorX1= conductorX;  // > Initialization.Init Page:4
    conductorY1= conductorY;  // > Initialization.Init Page:5
    conductorZ1= conductorZ;  // > Initialization.Init Page:6
    t0=t;  // > Initialization.Init Page:7
  });

  _model.addToEvolution(function() {
    if (!__pagesEnabled["Evol Page"]) return;
    t=t+0.01;  // > Evolution.Evol Page:1
    if( conductorX1!=conductorX || conductorY1!=conductorY|| conductorZ1!=conductorZ) {  // > Evolution.Evol Page:2
      deltat = t-t0;  // > Evolution.Evol Page:3
      velX = (conductorX-conductorX1)/deltat;  // > Evolution.Evol Page:4
      velY = (conductorY-conductorY1)/deltat;  // > Evolution.Evol Page:5
      velZ = (conductorZ-conductorZ1)/deltat;  // > Evolution.Evol Page:6
      velocity = Math.sqrt(velX*velX + velY*velY + velZ*velZ);  // > Evolution.Evol Page:7
      V = Math.sqrt((velY*Bz - velZ*By)*(velY*Bz - velZ*By) + (velZ*Bx - velX*Bz)*(velZ*Bx - velX*Bz) + (velX*By - velY*Bx)*(velX*By - velY*Bx)) * conductorLength;  // > Evolution.Evol Page:8
    //producto escalar para obtener el ángulo con signo no funciona  // > Evolution.Evol Page:9
      aux = velX*Bx + velY*By + velZ*Bz;  // > Evolution.Evol Page:10
      //System.out.println(aux/(velocity*B));  // > Evolution.Evol Page:11
      angle = Math.acos(aux/(velocity*B));  // > Evolution.Evol Page:12
      conductorX1 = conductorX;  // > Evolution.Evol Page:13
      conductorY1 = conductorY;  // > Evolution.Evol Page:14
      conductorZ1 = conductorZ;  // > Evolution.Evol Page:15
    }  // > Evolution.Evol Page:16
    else {  // > Evolution.Evol Page:17
      t0=t;angle=0;V=0;  // > Evolution.Evol Page:18
    }  // > Evolution.Evol Page:19
    //colorVector[0]=Math.min((int)Math.abs(V),255);  // > Evolution.Evol Page:20
    //colorVector[1]=200;  // > Evolution.Evol Page:21
    //colorVector[2]=0;  // > Evolution.Evol Page:22
    //tubeColor = new java.awt.Color(colorVector[0],colorVector[1],colorVector[2]);//SI PONGO ESTO EL TUBO NO SE MUEVE BIEN  // > Evolution.Evol Page:23
    //tubeColor= java.awt.Color.RED; //SI PONGO ESTO SÍ SE MUEVE BIEN  // > Evolution.Evol Page:24
    voltArrowAngle =102- V*105./300.;  // > Evolution.Evol Page:25
  });
