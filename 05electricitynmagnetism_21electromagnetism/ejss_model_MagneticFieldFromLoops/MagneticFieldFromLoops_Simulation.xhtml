  bX[0][i][j] *= factor*I; // added *I for variablility with I by lookang  // > CustomCode.updateAction:23
        bY[0][i][j] *= factor*I; // factor is the currently not using distance? hmmmm   // > CustomCode.updateAction:24
        bZ[0][i][j] *= factor*I;  // > CustomCode.updateAction:25
     // > CustomCode.updateAction:26
   bXlookang[i+ np*j]  = bX[0][i][j];//rearragned array frem  // > CustomCode.updateAction:27

  function computeBfield(index1, index2, x, y, z) {  // > CustomCode.computeBField:1
    var bx=0, by=0, bz=0;  // > CustomCode.computeBField:2
    for(var i=1;i<n;i++) {  // > CustomCode.computeBField:3
      var dx=xn[i]-xn[i-1];  // > CustomCode.computeBField:4
      var dy=yn[i]-yn[i-1];  // > CustomCode.computeBField:5
      var dz=zn[i]-zn[i-1];  // > CustomCode.computeBField:6
      var xs=x-xn[i-1];  // > CustomCode.computeBField:7
      var ys=y-yn[i-1];  // > CustomCode.computeBField:8
      var zs=z-zn[i-1];  // > CustomCode.computeBField:9
      var r=Math.sqrt(xs*xs+ys*ys+zs*zs);  // > CustomCode.computeBField:10
      var r3=r*r*r;  // > CustomCode.computeBField:11
      bz+=(dx*ys-dy*xs)/r3;  // > CustomCode.computeBField:12
      bx+=(dy*zs-dz*ys)/r3;  // > CustomCode.computeBField:13
      by+=(dz*xs-zs*dx)/r3;  // > CustomCode.computeBField:14
    }  // > CustomCode.computeBField:15
    bX[0][index1][index2] = bx;//rearragned array frem  // > CustomCode.computeBField:16
    bY[0][index1][index2] = by;  // > CustomCode.computeBField:17
    bZ[0][index1][index2] = bz;  // > CustomCode.computeBField:18
   // bXlookang[index1+i*index2] = bx;//rearragned array frem  // > CustomCode.computeBField:19

  function calPsi(x, y, z) {  // > CustomCode.calPsi:1
    var p=0;  // > CustomCode.calPsi:2

      var xs=x-xn[i-1];  // > CustomCode.calPsi:4
      var ys=y-yn[i-1];  // > CustomCode.calPsi:5
      var zs=z-zn[i-1];  // > CustomCode.calPsi:6
      var dz=zn[i]-zn[i-1];  // > CustomCode.calPsi:7
      var r=Math.sqrt(xs*xs+ys*ys+zs*zs);  // > CustomCode.calPsi:8
      var r2=Math.sqrt(xn[i-1]*xn[i-1]+yn[i-1]*yn[i-1]);  // > CustomCode.calPsi:9
      if(r>size)p+=r2/r;// p+=dz*r2/(r*r);  // > CustomCode.calPsi:10
    }  // > CustomCode.calPsi:11
    return p;  // > CustomCode.calPsi:12

  function calShape() {  // > CustomCode.calShape:1
    var dy=size*2;  // > CustomCode.calShape:2

      var c=(i-n2)*dc*t/T;  // > CustomCode.calShape:6
      xn[i]=-R*Math.cos(c);  // > CustomCode.calShape:7
      zn[i]=R*Math.sin(c);  // > CustomCode.calShape:8

    }  // > CustomCode.calShape:10
  }  // > CustomCode.calShape:11

  function _ODE_evolution1() {
    var __odeSelf = {};
    var __eventSolver;
    var __solverClass = EJSS_ODE_SOLVERS.cashKarp45;
    var __state=[];
    var _ODE_evolution1_Event1;
    var _ODE_evolution1_Event2;
    var __ignoreErrors=false;
    var __mustInitialize=true;
    var __isEnabled=true;
    var __mustUserReinitialize=false;
    var __mustReinitialize=true;

    var _xnLength;
    var _znLength;
    var _ctaLength;

    __odeSelf._getOdeVars = function (){ return["xn","zn","cta","t"]};

    __odeSelf.setSolverClass = function(__aSolverClass) {
      __solverClass = __aSolverClass;
      __instantiateSolver();
    };

    function __instantiateSolver() {
      __state=[];
      _xnLength = xn.length;
      _znLength = zn.length;
      _ctaLength = cta.length;
      __pushState();
      __eventSolver = EJSS_ODE_SOLVERS.interpolatorEventSolver(__solverClass(),__odeSelf);
      __mustInitialize = true;
    }

    __odeSelf.setEnabled = function(_enabled) { __isEnabled = _enabled; };

    __odeSelf.getIndependentVariableValue = function() { return __eventSolver.getIndependentVariableValue(); };

    __odeSelf.getInternalStepSize = function() { return __eventSolver.getInternalStepSize(); };

    __odeSelf.isAccelerationIndependentOfVelocity = function() { return false; };

    __odeSelf.initializeSolver = function() {
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); return; }
      __pushState();
      __eventSolver.initialize(dt);
      __eventSolver.setBestInterpolation(false);
      __eventSolver.setMaximumInternalSteps(10000);
      __eventSolver.removeAllEvents();
      if (__pagesEnabled["First Coil"]) __eventSolver.addEvent(_ODE_evolution1_Event1());
      if (__pagesEnabled["Last Coil"]) __eventSolver.addEvent(_ODE_evolution1_Event2());
      for(k in userEvents1){__eventSolver.addEvent(userEvents1[k]);}
      __eventSolver.setEstimateFirstStep(false);
      __eventSolver.setEnableExceptions(false);
      __eventSolver.setTolerances(0.00001,0.00001);
      __mustReinitialize = true;
      __mustInitialize = false;
    };

    function __pushState() {
      // Copy our variables to __state[] 
        var __j=0;
        var __n=0;
        var __cIn=0;
      if (!__mustReinitialize)
        for (__j=0,__n=__cIn; __j<_xnLength; __j++)
           if (__state[__n++]!=xn[__j]) { __mustReinitialize = true; break; }
        for (__j=0;__j<_xnLength; __j++) {
          __state[__cIn++] = xn[__j];
        }
      if (!__mustReinitialize)
        for (__j=0,__n=__cIn; __j<_znLength; __j++)
           if (__state[__n++]!=zn[__j]) { __mustReinitialize = true; break; }
        for (__j=0;__j<_znLength; __j++) {
          __state[__cIn++] = zn[__j];
        }
      if (!__mustReinitialize)
        for (__j=0,__n=__cIn; __j<_ctaLength; __j++)
           if (__state[__n++]!=cta[__j]) { __mustReinitialize = true; break; }
        for (__j=0;__j<_ctaLength; __j++) {
          __state[__cIn++] = cta[__j];
        }
        if (__state[__cIn]!=t) __mustReinitialize = true;
        __state[__cIn++] = t;
    }

    function __arraysChanged () {
      if (_xnLength != xn.length) return true;
      if (_znLength != zn.length) return true;
      if (_ctaLength != cta.length) return true;
      return false;
    }

    __odeSelf.getEventSolver = function() {
      return __eventSolver;
    };

    __odeSelf.resetSolver = function() {
      __mustUserReinitialize = true;
    };

    __odeSelf.automaticResetSolver = function() {
      __mustReinitialize = true;
    };

    function __errorAction () {
      if (__ignoreErrors) return;
      console.log (__eventSolver.getErrorMessage());
      _pause();
      // Make sure the solver is reinitialized;
      __mustReinitialize = true;
    }

    __odeSelf.step = function() { return __privateStep(false); };

    __odeSelf.solverStep = function() { return __privateStep(true); };

    function __privateStep(__takeMaximumStep) {
      if (!__isEnabled) return 0;
      if (dt===0) return 0;
      if (__mustInitialize) __odeSelf.initializeSolver();
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); }
      __eventSolver.setStepSize(dt);
      __eventSolver.setInternalStepSize(dt);
      __eventSolver.setMaximumInternalSteps(10000);
      __eventSolver.setTolerances(0.00001,0.00001);
      __pushState();
      if (__mustUserReinitialize) { 
        __eventSolver.userReinitialize();
        __mustUserReinitialize = false;
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      else if (__mustReinitialize) { 
        __eventSolver.reinitialize();
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      var __stepTaken = __takeMaximumStep ? __eventSolver.maxStep() : __eventSolver.step();
      // Extract our variables from __state
        var __i=0;
        var __cOut=0;
        for (__i=0;__i<_xnLength; __i++) {
          xn[__i] = __state[__cOut++];
        }
        for (__i=0;__i<_znLength; __i++) {
          zn[__i] = __state[__cOut++];
        }
        for (__i=0;__i<_ctaLength; __i++) {
          cta[__i] = __state[__cOut++];
        }
        t = __state[__cOut++];
      // Check for error
      if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      return __stepTaken;
    }

    __odeSelf.getState = function() { return __state; };

    __odeSelf.getRate = function(_aState,_aRate) {
      // Extract our variables from _aState
        var __i=0;
        var __cOut=0;
        var xn = [];
        for (__i=0;__i<_xnLength; __i++) {
          xn[__i] = _aState[__cOut++];
        }
        var zn = [];
        for (__i=0;__i<_znLength; __i++) {
          zn[__i] = _aState[__cOut++];
