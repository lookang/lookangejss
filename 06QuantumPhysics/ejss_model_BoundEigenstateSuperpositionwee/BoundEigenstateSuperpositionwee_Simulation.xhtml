    }  // > CustomCode.Color Methods:14
  }  // > CustomCode.Color Methods:15

  function normTable() {  // > CustomCode.Row Methods:15

      var En=kn*kn/2;  // > CustomCode.ISW:4

      coefData[s-1][1]=En;// energy  // > CustomCode.ISW:6

    }  // > CustomCode.ISW:8
  }  // > CustomCode.ISW:9
  function ISW () {  // > CustomCode.ISW:10
    var k0=Math.PI/a;  // > CustomCode.ISW:11
    var E0=k0*k0/2;  // > CustomCode.ISW:12
    var norm=Math.sqrt(0.5/a);  // > CustomCode.ISW:13
    for(var i=0; i<np; i++) {  // > CustomCode.ISW:14
      rePsi[i]=0;  // > CustomCode.ISW:15
      imPsi[i]=0;  // > CustomCode.ISW:16
      var xi=x[i];  // > CustomCode.ISW:17
      for(var s=1; s<=n;s++) {  // > CustomCode.ISW:18
        if(Math.abs(xi)>=a/2)continue;  //psi is zero outside of box  // > CustomCode.ISW:19
        var psiRe, psiIm;  // > CustomCode.ISW:20
        if(s%2===0) {  // > CustomCode.ISW:21
          psiRe=norm*coefData[s-1][2]*Math.sin(s*k0*xi);  // > CustomCode.ISW:22
          psiIm=norm*coefData[s-1][3]*Math.sin(s*k0*xi);  // > CustomCode.ISW:23
        } else {  // > CustomCode.ISW:24
          psiRe=norm*coefData[s-1][2]*Math.cos(s*k0*xi);  // > CustomCode.ISW:25
