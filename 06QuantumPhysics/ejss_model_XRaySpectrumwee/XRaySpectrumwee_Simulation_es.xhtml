  function filt ( EE,  ZZ,  rrho,  tt) {  // > CustomCode.Lib Page:1
    var mmu = rrho*(tau0*Math.pow(ZZ/Z0,3.0)*Math.pow(E0/EE,3.0)+sigma0*(E0/EE));  // > CustomCode.Lib Page:2
    return Math.exp(-mmu*tt);  // > CustomCode.Lib Page:3
  }  // > CustomCode.Lib Page:4
  function raw_spectrum ( Etmp,  this_Emax) {  // > CustomCode.Lib Page:5
    //Brem plus Intrinsic (K)  // > CustomCode.Lib Page:6
    Imax=this_Emax/Em0*Im0;  // > CustomCode.Lib Page:7
    I58=0;  // > CustomCode.Lib Page:8
    if(this_Emax>70.3) {  // > CustomCode.Lib Page:9
      I58=Imax*(this_Emax-58)/this_Emax*(0.086*this_Emax-6.05);  // > CustomCode.Lib Page:10
    }  // > CustomCode.Lib Page:11
    var Ispec_out=Imax*(this_Emax-Etmp)/this_Emax;  // > CustomCode.Lib Page:12
    var dI=0;  // > CustomCode.Lib Page:13
    if(Math.abs(Etmp-58-0.499999*dE)<=0.5*dE) {  // > CustomCode.Lib Page:14
      dI=I58;  // > CustomCode.Lib Page:15
    } else if(Math.abs(Etmp-59.5-0.499999*dE)<=0.5*dE) {  // > CustomCode.Lib Page:16
      dI=1.75*I58;  // > CustomCode.Lib Page:17
    } else if(Math.abs(Etmp-67.0-0.499999*dE)<=0.5*dE) {  // > CustomCode.Lib Page:18
      dI=0.597*I58;  // > CustomCode.Lib Page:19
    } else if(Math.abs(Etmp-69-0.499999*dE)<=0.5*dE) {  // > CustomCode.Lib Page:20
      dI=0.157*I58;  // > CustomCode.Lib Page:21
    }  // > CustomCode.Lib Page:22
    return Math.max(Ispec_out+dI,0);  // > CustomCode.Lib Page:23
  }  // > CustomCode.Lib Page:24
  function base_spectrum( EE) {  // > CustomCode.Lib Page:25
    // "intrinsic filtering" due to Xray Tube Components  // > CustomCode.Lib Page:26
    return raw_spectrum(EE,Emax)*filt(EE,29.0,1.0,0.1);  // > CustomCode.Lib Page:27
  }  // > CustomCode.Lib Page:28
  function filt_spectrum( EE) {  // > CustomCode.Lib Page:29
    return base_spectrum(EE)*filt(EE,Z1,rho1,t1);  // > CustomCode.Lib Page:30
  }  // > CustomCode.Lib Page:31
  function mod_spectrum( EE) {  // > CustomCode.Lib Page:32
    var nc=16;  // > CustomCode.Lib Page:33
    var this_Emax;  // > CustomCode.Lib Page:34
    var A=0.005*Ripple_percent;  // > CustomCode.Lib Page:35
    var mod_spectrum_return=0;  // > CustomCode.Lib Page:36
    for (var ic=0; ic<nc; ic++) {  // > CustomCode.Lib Page:37

    }  // > CustomCode.Lib Page:40
    mod_spectrum_return=mod_spectrum_return/nc;  // > CustomCode.Lib Page:41

  }  // > CustomCode.Lib Page:43
