  // invoked when the packet width changes  // > CustomCode.Change Wavenumber:1
  function changePacketWidth() {  // > CustomCode.Change Wavenumber:2
    t=0;  // > CustomCode.Change Wavenumber:3
    sigma=Math.max(0.05,sigma);  // enforce a minimum value for packet width  // > CustomCode.Change Wavenumber:4
    sigma=Math.min(10.0,sigma);  // enforce a maximum value for packet width  // > CustomCode.Change Wavenumber:5
    a=1.0/(2*sigma*sigma);  // > CustomCode.Change Wavenumber:6
    beta=2*hbar*a/m;  // > CustomCode.Change Wavenumber:7
    scale=xmax;  // > CustomCode.Change Wavenumber:8
    scaleAxis();  // > CustomCode.Change Wavenumber:9
    plotPhiFunction ();  // > CustomCode.Change Wavenumber:10
  }  // > CustomCode.Change Wavenumber:11

  function scaleAxis() {  // > CustomCode.Scale Axis:1
    var x0=scale;  // > CustomCode.Scale Axis:2
    var norm=Math.pow(2*a/Math.PI, 0.25);  // > CustomCode.Scale Axis:3
    var re=a/(1+beta*beta*t*t);  // > CustomCode.Scale Axis:4
    var reExp=norm*Math.exp(-x0*x0*re);  // > CustomCode.Scale Axis:5
    while(reExp>1.E-2){  // > CustomCode.Scale Axis:6
      reExp=norm*Math.exp(-x0*x0*re);  // > CustomCode.Scale Axis:7
      x0*=1.005;  // > CustomCode.Scale Axis:8
    }  // > CustomCode.Scale Axis:9
    x0=Math.max(x0,xmax);  // > CustomCode.Scale Axis:10
    x0=Math.min(x0,20);  // > CustomCode.Scale Axis:11
    ymax=Math.max(ymax,0.8);  // > CustomCode.Scale Axis:12
    scale=x0;  // > CustomCode.Scale Axis:13
    ymin=components?-ymax:0;  // > CustomCode.Scale Axis:14
  }  // > CustomCode.Scale Axis:15

  function plotPsiFunction () {  // > CustomCode.Plot Wavefunction:1
    _view.psiTrace.clear();  // > CustomCode.Plot Wavefunction:2
    _view.sketchPsiTrace.clear();  // > CustomCode.Plot Wavefunction:3
    for(var i=0; i<n; i++) {  // > CustomCode.Plot Wavefunction:4
      var color=getColor(phase[i]);  // > CustomCode.Plot Wavefunction:5
      _view.psiTrace.getMarkStyle().setFillColor(color);  // > CustomCode.Plot Wavefunction:6
      _view.psiTrace.getMarkStyle().setLineColor(color);  // > CustomCode.Plot Wavefunction:7
      _view.psiTrace.addPoint(x[i],prob[i]);  // > CustomCode.Plot Wavefunction:8
      _view.sketchPsiTrace.getMarkStyle().setFillColor(color);  // > CustomCode.Plot Wavefunction:9
      _view.sketchPsiTrace.getMarkStyle().setLineColor(color);  // > CustomCode.Plot Wavefunction:10
      _view.sketchPsiTrace.addPoint(x[i],prob[i]);  // > CustomCode.Plot Wavefunction:11
    }  // > CustomCode.Plot Wavefunction:12
  }  // > CustomCode.Plot Wavefunction:13
  function plotPhiFunction () {  // > CustomCode.Plot Wavefunction:14
    var pi=xmin, dp=(xmax-xmin)/(n-1);  // > CustomCode.Plot Wavefunction:15
    var norm=Math.pow(2/Math.PI/a, 0.25);  // > CustomCode.Plot Wavefunction:16
    _view.phiTrace.clear();  // > CustomCode.Plot Wavefunction:17
    _view.sketchPhiTrace.clear();  // > CustomCode.Plot Wavefunction:18
    var color=getColor(-Math.PI);  // > CustomCode.Plot Wavefunction:19
    for(var i=0; i<n; i++) {  // > CustomCode.Plot Wavefunction:20
      _view.phiTrace.getMarkStyle().setFillColor(color);  // > CustomCode.Plot Wavefunction:21
      _view.phiTrace.getMarkStyle().setLineColor(color);  // > CustomCode.Plot Wavefunction:22
      _view.sketchPhiTrace.getMarkStyle().setFillColor(color);  // > CustomCode.Plot Wavefunction:23
      _view.sketchPhiTrace.getMarkStyle().setLineColor(color);  // > CustomCode.Plot Wavefunction:24
      var y=norm*Math.exp(-pi*pi/a);  // > CustomCode.Plot Wavefunction:25
      _view.phiTrace.addPoint(pi,y);  // > CustomCode.Plot Wavefunction:26
      _view.sketchPhiTrace.addPoint(pi,y);  // > CustomCode.Plot Wavefunction:27
      rePhi[i]=y;  // > CustomCode.Plot Wavefunction:28
      imPhi[i]=0;  // > CustomCode.Plot Wavefunction:29
      p[i]=pi;  // > CustomCode.Plot Wavefunction:30
      pi+=dp;  // > CustomCode.Plot Wavefunction:31
    }  // > CustomCode.Plot Wavefunction:32
  }  // > CustomCode.Plot Wavefunction:33

  function getColorOLD(value) {  // > CustomCode.Color Methods:1
    //value from -PI to PI  // > CustomCode.Color Methods:2
    var hue=((1-value/Math.PI)*180).toString(10);  // > CustomCode.Color Methods:3
    return ["hsl(",hue,",100%,40%)"].join("");  // > CustomCode.Color Methods:4
  }  // > CustomCode.Color Methods:5
  function getColor(value) {  // > CustomCode.Color Methods:6
    //phase value from -PI to PI  // > CustomCode.Color Methods:7
    //var index=Math.trunc((Math.PI+value)*50);  //  new EMCA script function; not supported in IE  // > CustomCode.Color Methods:8
    var index=((Math.PI+value)*49.5)|0;  // bitwise OR operation truncates  // > CustomCode.Color Methods:9
    return colors[index];  // > CustomCode.Color Methods:10
  }  // > CustomCode.Color Methods:11
  function computeColors() {  // > CustomCode.Color Methods:12
