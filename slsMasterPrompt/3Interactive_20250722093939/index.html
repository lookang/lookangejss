<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore Government Branches Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main container that adapts to iframe or full window -->
    <div id="main-container">
        <!-- Tooltip for displaying information -->
        <div id="tooltip" class="tooltip"></div>
        
        <!-- Game interface -->
        <div id="game-interface">
            <!-- Progress indicator -->
            <div id="progress-bar">
                <div id="progress-fill"></div>
                <span id="progress-text">0/9 Functions Matched</span>
            </div>
            
            <!-- Score display -->
            <div id="score-display">
                <span id="score">Score: 0</span>
                <span id="streak">Streak: 0</span>
            </div>
            
            <!-- Main game area -->
            <div id="game-area">
                <!-- Government branches (drop zones) -->
                <div id="branches-container">
                    <div class="branch-zone" data-branch="legislature" 
                         data-tooltip="Legislature: Makes and passes laws. Consists of Parliament which debates and votes on proposed legislation.">
                        <div class="branch-header">
                            <h3>Legislature</h3>
                            <div class="branch-icon">🏛️</div>
                        </div>
                        <div class="functions-container" id="legislature-functions"></div>
                    </div>
                    
                    <div class="branch-zone" data-branch="executive" 
                         data-tooltip="Executive: Implements and enforces laws. Led by the Prime Minister and Cabinet, includes government ministries and agencies.">
                        <div class="branch-header">
                            <h3>Executive</h3>
                            <div class="branch-icon">⚖️</div>
                        </div>
                        <div class="functions-container" id="executive-functions"></div>
                    </div>
                    
                    <div class="branch-zone" data-branch="judiciary" 
                         data-tooltip="Judiciary: Interprets and applies laws. Independent court system that ensures justice and resolves legal disputes.">
                        <div class="branch-header">
                            <h3>Judiciary</h3>
                            <div class="branch-icon">👨‍⚖️</div>
                        </div>
                        <div class="functions-container" id="judiciary-functions"></div>
                    </div>
                </div>
                
                <!-- Function cards to drag -->
                <div id="functions-pool">
                    <h4>Drag the functions to the correct government branch:</h4>
                    <div id="draggable-functions"></div>
                </div>
            </div>
            
            <!-- Action buttons -->
            <div id="action-buttons">
                <button id="hint-btn" class="action-btn">💡 Get Hint</button>
                <button id="reset-btn" class="action-btn">🔄 Reset Game</button>
                <button id="check-btn" class="action-btn">✅ Check Answers</button>
            </div>
            
            <!-- Results panel -->
            <div id="results-panel" class="hidden">
                <div id="results-content">
                    <h3 id="results-title"></h3>
                    <div id="results-details"></div>
                    <button id="play-again-btn" class="action-btn">🎮 Play Again</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script async="true" src=" https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ "></script>

    window.dataLayer = window.dataLayer || [];

    gtag('config', 'G-S9EWRY1CPJ');

</body>
</html>
