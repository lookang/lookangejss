<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light and Shadow Physics Simulation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main container for the simulation -->
    <div class="container">
        <!-- Control panel with interactive buttons and object selector -->
        <div class="control-panel" title="Light and Shadow Physics Simulation - Drag objects horizontally to see how shadows change">
            <div class="controls">
                <button id="playBtn" class="control-btn">Play</button>
                <button id="pauseBtn" class="control-btn">Pause</button>
                <button id="resetBtn" class="control-btn">Reset</button>
            </div>
            <div class="object-selector">
                <label for="objectType">Object:</label>
                <select id="objectType">
                    <option value="cube">Cube</option>
                    <option value="sphere">Sphere</option>
                </select>
            </div>
        </div>
        
        <!-- Main simulation canvas area -->
        <div class="simulation-area">
            <canvas id="simulationCanvas"></canvas>
            
            <!-- Information panel showing physics concepts -->
            <div class="info-panel">
                <div class="info-item">
                    <strong>Light Source:</strong> Point light emitting straight rays
                </div>
                <div class="info-item">
                    <strong>Shadow Formation:</strong> Light blocked by opaque object
                </div>
                <div class="info-item">
                    <strong>Shadow Size:</strong> Depends on object-light-screen distances
                </div>
            </div>
        </div>
    </div>
