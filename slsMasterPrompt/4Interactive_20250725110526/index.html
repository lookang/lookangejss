<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Subtraction with Regrouping</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main container with tooltip for header information -->
    <div class="main-container" title="Interactive Subtraction with Regrouping - Learn step by step how to subtract with borrowing">
        
        <!-- Step indicator -->
        <div class="step-indicator">
            <span id="step-text">Step 1: Set up the problem</span>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Problem display area -->
        <div class="problem-area">
            <!-- Tens and Ones columns header -->
            <div class="column-headers">
                <div class="column-header">T</div>
                <div class="column-header">O</div>
            </div>
            
            <!-- First number (minuend) -->
            <div class="number-row" id="minuend-row">
                <div class="digit-container tens-place">
                    <span class="digit" id="tens-minuend">4</span>
                    <span class="crossed-out" id="tens-crossed">3</span>
                    <span class="borrowed" id="tens-borrowed">1</span>
                </div>
                <div class="digit-container ones-place">
                    <span class="digit" id="ones-minuend">0</span>
                    <span class="borrowed-to" id="ones-borrowed">10</span>
                </div>
            </div>

            <!-- Subtraction symbol and second number (subtrahend) -->
            <div class="number-row" id="subtrahend-row">
                <div class="operation-symbol">-</div>
                <div class="digit-container tens-place">
                    <span class="digit" id="tens-subtrahend">2</span>
                </div>
                <div class="digit-container ones-place">
                    <span class="digit" id="ones-subtrahend">7</span>
                </div>
            </div>

            <!-- Line separator -->
            <div class="separator-line"></div>

            <!-- Answer row -->
            <div class="number-row" id="answer-row">
                <div class="digit-container tens-place">
                    <span class="digit answer-digit" id="tens-answer">1</span>
                </div>
                <div class="digit-container ones-place">
                    <span class="digit answer-digit" id="ones-answer">3</span>
                </div>
            </div>
        </div>

        <!-- Control buttons -->
        <div class="controls">
            <button id="prev-btn" class="control-btn" disabled>← Previous</button>
            <button id="next-btn" class="control-btn">Next →</button>
            <button id="reset-btn" class="control-btn">Reset</button>
        </div>

        <!-- Explanation area -->
        <div class="explanation">
            <p id="explanation-text">Click 'Next' to start learning subtraction with regrouping step by step!</p>
        </div>

        <!-- Character illustration -->
        <div class="character">
            <div class="character-face">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="mouth"></div>
            </div>
            <div class="character-body"></div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
