<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed and Velocity Mind Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main container for the mind map -->
    <div class="container">
        <!-- SVG canvas for drawing connection lines -->
        <svg id="connections" class="connections-layer"></svg>
        
        <!-- Mind map bubbles container -->
        <div id="mindMap" class="mind-map">
            <!-- Central bubble - main topic -->
            <div class="bubble central-bubble" id="central" data-title="Speed and Velocity - The study of how fast things move and in which direction">
                <span class="bubble-text">Speed & Velocity</span>
            </div>
            
            <!-- Main branch bubbles -->
            <div class="bubble main-branch" id="speed" data-title="Speed - How fast something moves without considering direction">
                <span class="bubble-text">Speed</span>
            </div>
            
            <div class="bubble main-branch" id="velocity" data-title="Velocity - Speed with direction included">
                <span class="bubble-text">Velocity</span>
            </div>
            
            <div class="bubble main-branch" id="measurement" data-title="Units and Tools - How we measure and express speed and velocity">
                <span class="bubble-text">Measurement</span>
            </div>
            
            <div class="bubble main-branch" id="examples" data-title="Real Life Examples - Speed and velocity in everyday situations">
                <span class="bubble-text">Examples</span>
            </div>
            
            <!-- Sub-branch bubbles for Speed -->
            <div class="bubble sub-branch speed-sub" id="distance-time" data-title="Distance ÷ Time - The basic formula for calculating speed">
                <span class="bubble-text">Distance ÷ Time</span>
            </div>
            
            <div class="bubble sub-branch speed-sub" id="no-direction" data-title="No Direction - Speed only tells us how fast, not which way">
                <span class="bubble-text">No Direction</span>
            </div>
            
            <!-- Sub-branch bubbles for Velocity -->
            <div class="bubble sub-branch velocity-sub" id="speed-direction" data-title="Speed + Direction - Velocity includes both how fast and which way">
                <span class="bubble-text">Speed + Direction</span>
            </div>
            
            <div class="bubble sub-branch velocity-sub" id="vector" data-title="Vector Quantity - Has both size (magnitude) and direction">
                <span class="bubble-text">Vector</span>
            </div>
            
            <!-- Sub-branch bubbles for Measurement -->
            <div class="bubble sub-branch measurement-sub" id="units" data-title="Common Units - m/s (metres per second), km/h (kilometres per hour)">
                <span class="bubble-text">m/s, km/h</span>
            </div>
            
            <div class="bubble sub-branch measurement-sub" id="tools" data-title="Measuring Tools - Stopwatch, ruler, speedometer">
                <span class="bubble-text">Stopwatch, Ruler</span>
            </div>
            
            <!-- Sub-branch bubbles for Examples -->
            <div class="bubble sub-branch examples-sub" id="car" data-title="Car Example - A car moving at 60 km/h north has both speed and velocity">
                <span class="bubble-text">Car: 60 km/h North</span>
            </div>
            
            <div class="bubble sub-branch examples-sub" id="runner" data-title="Running Example - A runner moving at 5 m/s around a track">
                <span class="bubble-text">Runner: 5 m/s</span>
            </div>
        </div>
        
        <!-- Tooltip for displaying additional information -->
        <div id="tooltip" class="tooltip"></div>
        
        <!-- Instructions panel -->
        <div class="instructions" data-title="Interactive Mind Map - Drag bubbles to reposition them and explore connections between concepts">
            <span>💡 Drag bubbles to move • Hover for details</span>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
