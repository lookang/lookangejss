<style id="aiz-footer-style">
#aiz-footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 10px;
  z-index: 2147483000;
  display: flex;
  justify-content: center;
  pointer-events: auto; /* keep links clickable */
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
  color: #222;
}
#aiz-footer p {
  margin: 0;
  padding: 6px 10px;
  background: rgba(255,255,255,0.9);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);

#aiz-footer a { color: #0b69ff; text-decoration: underline; }

<body>
    <div class="container">
        <!-- Control Panel at the top -->
        <div class="control-panel">
            <button id="playBtn" class="control-btn" title="Play: Animate light source movement">▶ Play</button>
            <button id="pauseBtn" class="control-btn" title="Pause: Stop animation">⏸ Pause</button>
            <button id="resetBtn" class="control-btn" title="Reset: Return to initial state">↻ Reset</button>
            
            <!-- Object selector -->
            <div class="selector-group">
                <label for="objectSelect" title="Select object type">Object:</label>
                <select id="objectSelect" title="Choose between Sphere or Cube">
                    <option value="sphere">Sphere</option>
                    <option value="cube">Cube</option>
                </select>
            </div>
            
            <!-- Info tooltip -->
            <div class="info-icon" title="Light source emits rays tangent to the object, creating a shadow on the screen. Drag elements to explore shadow formation.">ℹ</div>
        </div>

        <!-- Main simulation canvas area -->
        <div class="canvas-wrapper">
            <svg id="simulationCanvas" class="simulation-canvas" width="100%" height="100%" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid meet">
                <!-- Light source (point light) -->
                <circle id="lightSource" class="light-source" cx="50" cy="225" r="8" draggable="true"></circle>
                
                <!-- Light rays (will be drawn dynamically) -->
                <g id="lightRays" class="light-rays"></g>
                
                <!-- Object (sphere or cube) -->
                <g id="objectGroup" class="object-group">
                    <!-- Sphere (default) -->
                    <circle id="sphere" class="object sphere" cx="300" cy="225" r="40" draggable="true"></circle>
                    
                    <!-- Cube (hidden by default) -->
                    <rect id="cube" class="object cube" x="260" y="185" width="80" height="80" draggable="true" style="display:none;"></rect>
                </g>
                
                <!-- Screen (right side) -->
                <rect id="screen" class="screen" x="500" y="100" width="15" height="250" draggable="true"></rect>
                
                <!-- Shadow on screen (will be drawn dynamically) -->
                <g id="shadowGroup" class="shadow-group"></g>
                
                <!-- Boundary guides (light gray lines) -->
                <line class="boundary-guide" x1="20" y1="0" x2="20" y2="100%"></line>
                <line class="boundary-guide" x1="580" y1="0" x2="580" y2="100%"></line>
            </svg>
        </div>

        <!-- Tooltip for detailed information -->
        <div id="tooltip" class="tooltip"></div>
    </div>

    <script src="script.js"></script>
<footer id="aiz-footer" role="contentinfo"><p id="generated-footer-credit">Made by lookang, using SLS Claude 4. For more resources: <a href="https://sg.iwant2study.org/ospsg/index.php/interactive-resources/physics/04-waves/04-light" target="_blank" rel="noopener noreferrer">https://sg.iwant2study.org/ospsg/index.php/interactive-resources/physics/04-waves/04-light</a></p></footer>
</body>
</html>
