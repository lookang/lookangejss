<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Fractional Equations Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main game container -->
    <div id="gameContainer">
        <!-- Game header with score and progress -->
        <div id="gameHeader">
            <div id="scoreDisplay" title="Current Score">Score: <span id="score">0</span>/99</div>
            <div id="questionCounter" title="Question Progress">Question: <span id="currentQ">1</span>/10</div>
            <div id="streakDisplay" title="Current Streak">Streak: <span id="streak">0</span></div>
        </div>

        <!-- Question display area -->
        <div id="questionArea">
            <div id="questionText" title="Solve this fractional equation"></div>
            <div id="workingArea">
                <div id="equation"></div>
                <div id="steps"></div>
            </div>
        </div>

        <!-- Answer input section -->
        <div id="answerSection">
            <div id="inputGroup">
                <label for="answerInput" title="Enter your answer as a fraction or decimal">Your Answer:</label>
                <input type="text" id="answerInput" placeholder="e.g., 1/2 or 0.5">
                <button id="submitBtn" title="Submit your answer">Submit</button>
            </div>
            <div id="hintBtn" title="Get a helpful hint">💡 Hint</div>
        </div>

        <!-- Feedback area -->
        <div id="feedbackArea">
            <div id="feedback"></div>
            <button id="nextBtn" style="display: none;" title="Continue to next question">Next Question</button>
        </div>

        <!-- Analytics panel for teachers -->
        <div id="analyticsPanel">
            <div id="analyticsToggle" title="View detailed analytics">📊 Analytics</div>
            <div id="analyticsContent" style="display: none;">
                <h3>Real-time Analytics</h3>
                <div id="performanceChart">
                    <div class="metric">
                        <span class="label">Accuracy:</span>
                        <span id="accuracy">0%</span>
                    </div>
                    <div class="metric">
                        <span class="label">Common Errors:</span>
                        <div id="errorTypes"></div>
                    </div>
                    <div class="metric">
                        <span class="label">Time per Question:</span>
                        <span id="avgTime">0s</span>
                    </div>
                </div>
                <div id="questionHistory"></div>
            </div>
        </div>

        <!-- Game completion screen -->
        <div id="gameComplete" style="display: none;">
            <h2>Game Complete!</h2>
            <div id="finalScore"></div>
            <div id="finalAnalytics"></div>
            <button id="restartBtn" title="Start a new game">Play Again</button>
        </div>
    </div>

    <!-- Tooltip for displaying hints and information -->
    <div id="tooltip" style="display: none;"></div>

    <script src="script.js"></script>
    <script async="true" src=" https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ "></script>

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S9EWRY1CPJ');

</body>
</html>
