<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Cycle Quiz - Drag & Drop</title>
    <link rel="stylesheet" href="styles.css">
<script async="true" src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-S9EWRY1CPJ');
</script>
<style id="aiz-footer-style">
#aiz-footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 10px;
  z-index: 2147483000;
  display: flex;
  justify-content: center;
  pointer-events: auto; /* keep links clickable */
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
  color: #222;
}
#aiz-footer p {
  margin: 0;
  padding: 6px 10px;
  background: rgba(255,255,255,0.9);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
#aiz-footer a { color: #0b69ff; text-decoration: underline; }
</style>
</head>
<body>
    <div class="container">
        <!-- Main Quiz Panel -->
        <div class="main-panel">
            <!-- Header with tooltip -->
            <div class="header-section">
                <div class="title-icon" title="Match the life cycle stages to the correct organism">🔄</div>
                <div class="organism-selector">
                    <button class="organism-btn active" data-organism="grasshopper" title="Grasshopper - Incomplete Metamorphosis">🦗</button>
                    <button class="organism-btn" data-organism="beetle" title="Beetle - Complete Metamorphosis">🪲</button>
                    <button class="organism-btn" data-organism="mosquito" title="Mosquito - Complete Metamorphosis">🦟</button>
                    <button class="organism-btn" data-organism="cockroach" title="Cockroach - Incomplete Metamorphosis">🪳</button>
                    <button class="organism-btn" data-organism="chicken" title="Chicken - Direct Development">🐔</button>
                </div>
            </div>

            <!-- Quiz Content Area -->
            <div class="quiz-content">
                <!-- Left Side: Drag Sources (Life Cycle Stages) -->
                <div class="stages-panel">
                    <div class="panel-label">Stages</div>
                    <div class="stages-container" id="stagesContainer">
                        <!-- Dynamically populated with life cycle stages -->
                    </div>
                </div>

                <!-- Right Side: Drop Targets (Timeline) -->
                <div class="timeline-panel">
                    <div class="panel-label">Timeline</div>
                    <div class="timeline-container" id="timelineContainer">
                        <!-- Dynamically populated with drop zones -->
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="button-group">
                <button class="btn btn-check" id="checkBtn">Check Answer</button>
                <button class="btn btn-reset" id="resetBtn">Reset</button>
                <button class="btn btn-analytics" id="analyticsBtn">📊 View Analytics</button>
            </div>

            <!-- Feedback Section -->
            <div class="feedback-section" id="feedbackSection" style="display: none;">
                <div class="feedback-content">
                    <div class="feedback-icon" id="feedbackIcon"></div>
                    <div class="feedback-text" id="feedbackText"></div>
                </div>
            </div>
        </div>

        <!-- Analytics Panel (Hidden by default) -->
        <div class="analytics-panel" id="analyticsPanel" style="display: none;">
            <div class="analytics-header">
                <h3>📊 Performance Analytics</h3>
                <button class="close-btn" id="closeAnalyticsBtn">✕</button>
            </div>
            
            <div class="analytics-content">
                <!-- Summary Stats -->
                <div class="stats-summary">
                    <div class="stat-card">
                        <div class="stat-label">Attempts</div>
                        <div class="stat-value" id="attemptsCount">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Correct</div>
                        <div class="stat-value" id="correctCount">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Accuracy</div>
                        <div class="stat-value" id="accuracyPercent">0%</div>
                    </div>
                </div>

                <!-- Time-based Log -->
                <div class="log-section">
                    <div class="log-header">Time-based Activity Log</div>
                    <div class="log-container" id="logContainer">
                        <!-- Dynamically populated with time-based logs -->
                    </div>
                </div>

                <!-- Organism Performance -->
                <div class="organism-performance">
                    <div class="perf-header">Performance by Organism</div>
                    <div class="perf-list" id="perfList">
                        <!-- Dynamically populated -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<footer id="aiz-footer" role="contentinfo"><p id="generated-footer-credit">Made by lookang, using SLS Claude 4. For more resources: <a href="https://sg.iwant2study.org/ospsg/index.php/interactive-resources/physics/04-waves/04-light" target="_blank" rel="noopener noreferrer">https://sg.iwant2study.org/ospsg/index.php/interactive-resources/physics/04-waves/04-light</a></p></footer>
</body>
</html>
