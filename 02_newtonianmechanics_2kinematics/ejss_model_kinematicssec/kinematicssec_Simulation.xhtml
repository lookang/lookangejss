 the kinematics equation s = ut+ 1/2at^2.</li> </ol> <br /> <h2 style=\"color: black;\">  Other interesting fun activities </h2> <br /> <ol> <li>this model can be used to experience negative acceleration and deceleration, a common difficult concept among students.</li> <li>select negative acceleration from the drop-down menu, record down on a paper the value of a. try other scenario to get negative acceleration. what did you notice about the sign of a when t is called \"negative acceleration\"?</li> <li>select deceleration from the drop-down menu, record down the is the magnitude increasing (moving away from 0) or deceasing (moving towards 0 value)</li> <li>explore your own scenario here to test your initial understanding and fine tune it to be more accurate.</li> <li>this model also allow figure out velocity and speed , a common difficult concept among students.</li> <li>select v = 5 m/s, a = -1 m/s^2, select check-box v vs t for the graph to appear with hints for speed |v| and velocity v added  what did you notice about the difference between |v| and v when v passes zero m/s?</li> <li>select a different scenario, record down when does |v| and v differs?</li> <li>are you able to figure out that |v| is increasing if the velocity moves greater than zero and |v| is decreasing if velocity v moves lesser towards zero value?</li> <li>leave me a Google+ answer/comment/question/requests etc here <a href=\"http://weelookang.blogspot.sg/2013/12/ejss-kinematics-model.html\">http://weelookang.blogspot.sg/2013/12/ejss-kinematics-model.html</a></li> </ol> <br /> <h2> Sample Learning Goals</h2> <div> (e) plot and interpret a displacement-time graph and a velocity-time graph<br /> (f) deduce from the shape of a displacement-time graph when a body is:<br /> (i) at rest&nbsp;<span style=\"background-color: lime;\">&nbsp;example of&nbsp;</span><span style=\"background-color: lime;\">progressive mathematical model is encouraged X = 0</span><span style=\"background-color: lime;\">&nbsp;</span><br /> (ii) moving with uniform velocity&nbsp;<span style=\"background-color: lime;\">&nbsp;</span><span style=\"background-color: lime;\">example of &nbsp;</span><span style=\"background-color: lime;\">progressive mathematical model is encouraged&nbsp;</span><span style=\"background-color: lime;\">X = 1*t</span><span style=\"background-color: lime;\">&nbsp;</span><span style=\"background-color: lime;\">&nbsp;</span><span style=\"background-color: lime;\">for a constant velocity motion of v =1 m/s</span><br /> (iii) moving with non-uniform velocity&nbsp;<span style=\"background-color: lime;\">example of&nbsp;</span><span style=\"background-color: lime;\">X = 0.5*1*t^2&nbsp;</span><span style=\"background-color: lime;\">for a constant acceleration motion of a =1 m/s^2</span><br /> (g) deduce from the shape of a velocity-time graph when a body is:<br /> (i) at rest<br /> (ii) moving with uniform velocity<br /> (iii) moving with uniform acceleration<br /> (iv) moving with non-uniform acceleration<br /> <h2>  Version: </h2> <ol> <li><a href=\"http://weelookang.blogspot.sg/2013/12/ejss-kinematics-model.htm\">http://weelookang.blogspot.sg/2013/12/ejss-kinematics-model.htm</a>l &nbsp; &nbsp; &nbsp;</li> </ol> </div>") // EJsS HtmlView.HtmlView Page: setting property 'Html' for element 'questionArea'
