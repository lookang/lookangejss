<!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML5 Interactive Content</title>
        <style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    /* Ensuring all text is black color for better visibility */
    color: #000;
}

body {
    background-color: #f0f0f0;
    overflow: hidden;
}

#simulation-container {
    width: 100%;
    height: 100vh;
    display: grid;
    grid-template-rows: auto auto 1fr;
    grid-template-columns: 1fr;
    padding: 10px;
    gap: 10px;
}

/* Control Panel Styles */
#control-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    padding: 10px;
    background-color: #e0e0e0;
    border-radius: 5px;
}

.control-group {
    display: flex;
    align-items: center;
    gap: 5px;
}

.control-group label {
    font-weight: bold;
    /* Ensuring label is black */
    color: #000;
    min-width: 100px;
}

.sub-control {
    margin-left: 10px;
    min-width: auto !important;
}

input[type="range"] {
    width: 150px;
}

/* Button Panel Styles */
#button-panel {
    display: flex;
    gap: 10px;
    padding: 5px;
    background-color: #e0e0e0;
    border-radius: 5px;
}

button {
    padding: 8px 15px;
    border: none;
    border-radius: 4px;
    background-color: #4CAF50;
    /* Keeping button text white for contrast against green background */
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s;
}

button:hover {
    background-color: #45a049;
}

button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
}

/* Simulation View Styles */
#simulation-view {
    position: relative;
    background-color: #d0e6ff;
    border: 1px solid #999;
    border-radius: 5px;
    overflow: hidden;
}

#simulation-canvas {
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, #87CEEB, #1E90FF);
}

#data-display {
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: rgba(255, 255, 255, 0.8);
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
    /* Ensuring all text is black */
    color: #000;
}

#data-display div {
    margin: 5px 0;
}

/* Graph Styles */
#graph-container {
    position: relative;
    height: 200px;
    background-color: white;
    border: 1px solid #999;
    border-radius: 5px;
}

#graph-canvas {
    width: 100%;
    height: 100%;
}

#graph-labels {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.x-label {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    /* Ensuring label is black */
    color: #000;
}

.y-label {
    position: absolute;
    left: 5px;
    top: 50%;
    transform: translateY(-50%) rotate(-90deg);
    font-size: 12px;
    /* Ensuring label is black */
    color: #000;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    #simulation-container {
        grid-template-rows: auto auto 1fr auto;
    }
    
    .control-group {
        flex-direction: column;
        align-items: flex-start;
    }
    
    input[type="range"] {
        width: 100%;
    }
}
        </style>
    </head>
    <body>
    <div id="simulation-container">
    <div id="control-panel">
        <div class="control-group">
            <label for="initial-height">Initial Height (m):</label>
            <input type="range" id="initial-height" min="10" max="100" value="100" step="5">
            <span id="initial-height-value">100</span>
        </div>
        <div class="control-group">
            <label for="gravity">Gravity (m/s²):</label>
            <input type="range" id="gravity" min="1" max="20" value="9.81" step="0.1">
            <span id="gravity-value">9.81</span>
        </div>
        <div class="control-group">
            <label for="air-resistance">Air Resistance:</label>
            <input type="checkbox" id="air-resistance">
            <label for="drag-coefficient" class="sub-control">k value:</label>
            <input type="range" id="drag-coefficient" min="0.01" max="0.5" value="0.1" step="0.01" disabled>
            <span id="drag-coefficient-value">0.1</span>
        </div>
        <div class="control-group">
            <label for="show-vectors">Show Vectors:</label>
            <input type="checkbox" id="show-vectors" checked>
        </div>
    </div>
    
    <div id="button-panel">
        <button id="play-btn">▶ Play</button>
        <button id="pause-btn" disabled>|| Pause</button>
        <button id="step-btn">▶| Step</button>
        <button id="reset-btn">↻ Reset</button>
    </div>
    
    <div id="simulation-view">
        <canvas id="simulation-canvas"></canvas>
        <div id="data-display">
            <div>Time: <span id="time-value">0.00</span> s</div>
            <div>Height: <span id="height-value">100.00</span> m</div>
            <div>Velocity: <span id="velocity-value">0.00</span> m/s</div>
            <div>Acceleration: <span id="acceleration-value">-9.81</span> m/s²</div>
        </div>
    </div>
    
    <div id="graph-container">
        <canvas id="graph-canvas"></canvas>
        <div id="graph-labels">
            <div class="x-label">Time (s)</div>
            <div class="y-label">Height (m)</div>
        </div>
    </div>
</div>

<!-- Added Google Analytics and AdSense scripts as requested -->
<script async="true" src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
<script data-ad-client="ca-pub-0121577198857509" async="true" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
        <script>
    // Global variables for simulation
let canvas, ctx;
let graphCanvas, graphCtx;
let animationId = null;
let simulationRunning = false;
let timeStep = 0.02; // seconds per step

// Physics variables
let time = 0;
let initialHeight = 100; // meters
let height = initialHeight;
let velocity = 0; // m/s
let acceleration = 0; // m/s²
let gravity = 9.81; // m/s²
let useAirResistance = false;
let dragCoefficient = 0.1;
let showVectors = true;

// Ball properties
let ballRadius = 15;
let ballColor = '#ffffff';

// Data for graph
let timeData = [];
let heightData = [];
const maxDataPoints = 1000;

// Initialize the simulation when the window loads
window.onload = function() {
    // Get canvas elements and contexts
    canvas = document.getElementById('simulation-canvas');
    ctx = canvas.getContext('2d');
    graphCanvas = document.getElementById('graph-canvas');
    graphCtx = graphCanvas.getContext('2d');
    
    // Set canvas dimensions
    resizeCanvases();
    window.addEventListener('resize', resizeCanvases);
    
    // Initialize event listeners for controls
    initializeControls();
    
    // Initial reset to set up the simulation
    resetSimulation();
    
    // Draw the initial state
    drawSimulation();
    drawGraph();
    
    // Initialize Google Analytics
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S9EWRY1CPJ');
};

// Set canvas dimensions based on container size
function resizeCanvases() {
    // Simulation canvas
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    
    // Graph canvas
    graphCanvas.width = graphCanvas.parentElement.clientWidth;
    graphCanvas.height = graphCanvas.parentElement.clientHeight;
    
    // Redraw if not running
    if (!simulationRunning) {
        drawSimulation();
        drawGraph();
    }
}

// Initialize all control event listeners
function initializeControls() {
    // Initial height slider
    const initialHeightSlider = document.getElementById('initial-height');
    const initialHeightValue = document.getElementById('initial-height-value');
    initialHeightSlider.addEventListener('input', function() {
        initialHeight = parseFloat(this.value);
        initialHeightValue.textContent = initialHeight;
        if (!simulationRunning) {
            resetSimulation();
        }
    });
    
    // Gravity slider
    const gravitySlider = document.getElementById('gravity');
    const gravityValue = document.getElementById('gravity-value');
    gravitySlider.addEventListener('input', function() {
        gravity = parseFloat(this.value);
        gravityValue.textContent = gravity.toFixed(2);
        if (!simulationRunning) {
            updateAcceleration();
            updateDisplayValues();
            drawSimulation();
        }
    });
    
    // Air resistance checkbox
    const airResistanceCheckbox = document.getElementById('air-resistance');
    const dragCoefficientSlider = document.getElementById('drag-coefficient');
    airResistanceCheckbox.addEventListener('change', function() {
        useAirResistance = this.checked;
        dragCoefficientSlider.disabled = !useAirResistance;
        if (!simulationRunning) {
            updateAcceleration();
            updateDisplayValues();
            drawSimulation();
        }
    });
    
    // Drag coefficient slider
    const dragCoefficientValue = document.getElementById('drag-coefficient-value');
    dragCoefficientSlider.addEventListener('input', function() {
        dragCoefficient = parseFloat(this.value);
        dragCoefficientValue.textContent = dragCoefficient.toFixed(2);
        if (!simulationRunning && useAirResistance) {
            updateAcceleration();
            updateDisplayValues();
            drawSimulation();
        }
    });
    
    // Show vectors checkbox
    const showVectorsCheckbox = document.getElementById('show-vectors');
    showVectorsCheckbox.addEventListener('change', function() {
        showVectors = this.checked;
        if (!simulationRunning) {
            drawSimulation();
        }
    });
    
    // Play button
    document.getElementById('play-btn').addEventListener('click', startSimulation);
    
    // Pause button
    document.getElementById('pause-btn').addEventListener('click', pauseSimulation);
    
    // Step button
    document.getElementById('step-btn').addEventListener('click', stepSimulation);
    
    // Reset button
    document.getElementById('reset-btn').addEventListener('click', resetSimulation);
}

// Start the simulation animation
function startSimulation() {
    if (simulationRunning) return;
    
    simulationRunning = true;
    document.getElementById('play-btn').disabled = true;
    document.getElementById('pause-btn').disabled = false;
    document.getElementById('step-btn').disabled = true;
    
    // Start the animation loop
    animateSimulation();
}

// Pause the simulation
function pauseSimulation() {
    simulationRunning = false;
    document.getElementById('play-btn').disabled = false;
    document.getElementById('pause-btn').disabled = true;
    document.getElementById('step-btn').disabled = false;
    
    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }
}

// Advance the simulation by one time step
function stepSimulation() {
    if (simulationRunning) return;
    
    // Update physics for one time step
    updatePhysics();
    
    // Update display values
    updateDisplayValues();
    
    // Redraw the simulation
    drawSimulation();
    drawGraph();
}

// Reset the simulation to initial state
function resetSimulation() {
    // Stop any running animation
    if (simulationRunning) {
        pauseSimulation();
    }
    
    // Reset physics variables
    time = 0;
    height = initialHeight;
    velocity = 0;
    updateAcceleration();
    
    // Clear data arrays
    timeData = [0];
    heightData = [height];
    
    // Update display values
    updateDisplayValues();
    
    // Redraw the simulation
    drawSimulation();
    drawGraph();
    
    // Reset button states
    document.getElementById('play-btn').disabled = false;
    document.getElementById('pause-btn').disabled = true;
    document.getElementById('step-btn').disabled = false;
}

// Animation loop for the simulation
function animateSimulation() {
    // Update physics
    updatePhysics();
    
    // Update display values
    updateDisplayValues();
    
    // Draw the current state
    drawSimulation();
    drawGraph();
    
    // Check if ball has hit the ground
    if (height <= 0) {
        pauseSimulation();
        height = 0;
        velocity = 0;
        updateDisplayValues();
        drawSimulation();
        return;
    }
    
    // Continue animation
    animationId = requestAnimationFrame(animateSimulation);
}

// Update physics calculations for one time step
function updatePhysics() {
    // Update time
    time += timeStep;
    
    // Calculate new acceleration based on current velocity if using air resistance
    updateAcceleration();
    
    // Update velocity using current acceleration
    velocity += acceleration * timeStep;
    
    // Update position using current velocity
    height -= velocity * timeStep;
    
    // Ensure height doesn't go below zero (ground)
    if (height < 0) {
        height = 0;
        velocity = 0;
    }
    
    // Store data for graph (limit number of points to prevent performance issues)
    if (timeData.length >= maxDataPoints) {
        timeData.shift();
        heightData.shift();
    }
    timeData.push(time);
    heightData.push(height);
}

// Calculate acceleration based on gravity and air resistance
function updateAcceleration() {
    if (useAirResistance) {
        // Air resistance force is proportional to velocity squared and in opposite direction
        // F = -k*v² => a = -k*v²/m (assuming mass=1 for simplicity)
        let airResistance = dragCoefficient * velocity * Math.abs(velocity);
        acceleration = gravity - airResistance;
    } else {
        acceleration = gravity;
    }
    
    // If ball is on ground, acceleration is 0
    if (height <= 0) {
        acceleration = 0;
    }
}

// Update the display values in the UI
function updateDisplayValues() {
    document.getElementById('time-value').textContent = time.toFixed(2);
    document.getElementById('height-value').textContent = height.toFixed(2);
    document.getElementById('velocity-value').textContent = velocity.toFixed(2);
    document.getElementById('acceleration-value').textContent = (-acceleration).toFixed(2);
}

// Draw the simulation on the canvas
function drawSimulation() {
    // Clear the canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw background elements (ground, grid, etc.)
    drawBackground();
    
    // Calculate ball position on canvas
    const groundY = canvas.height - 20;
    const ballY = groundY - (height / initialHeight) * (groundY - 50);
    const ballX = canvas.width / 2;
    
    // Draw the ball
    ctx.beginPath();
    ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
    ctx.fillStyle = ballColor;
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Draw soccer ball pattern
    drawSoccerBallPattern(ballX, ballY, ballRadius);
    
    // Draw vectors if enabled
    if (showVectors && height > 0) {
        drawVectors(ballX, ballY);
    }
}

// Draw background elements
function drawBackground() {
    // Draw ground
    const groundY = canvas.height - 20;
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(0, groundY, canvas.width, 20);
    
    // Draw grass
    ctx.fillStyle = '#228B22';
    ctx.fillRect(0, groundY - 5, canvas.width, 5);
    
    // Draw height scale on the left side
    drawHeightScale();
}

// Draw the height scale on the left side
function drawHeightScale() {
    const groundY = canvas.height - 20;
    const maxHeight = initialHeight > 100 ? initialHeight : 100;
    const scaleInterval = maxHeight > 50 ? 20 : 10;
    
    ctx.strokeStyle = '#000'; // Using black for better visibility
    ctx.fillStyle = '#000';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '12px Arial';
    
    for (let h = 0; h <= maxHeight; h += scaleInterval) {
        const y = groundY - (h / initialHeight) * (groundY - 50);
        
        // Draw tick mark
        ctx.beginPath();
        ctx.moveTo(40, y);
        ctx.lineTo(50, y);
        ctx.stroke();
        
        // Draw height label
        ctx.fillText(h + ' m', 35, y);
    }
}

// Draw soccer ball pattern
function drawSoccerBallPattern(x, y, radius) {
    // Draw pentagon in the center
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
        const angle = (i * 2 * Math.PI / 5) - Math.PI / 2;
        const px = x + radius * 0.5 * Math.cos(angle);
        const py = y + radius * 0.5 * Math.sin(angle);
        if (i === 0) {
            ctx.moveTo(px, py);
        } else {
            ctx.lineTo(px, py);
        }
    }
    ctx.closePath();
    ctx.fillStyle = '#000';
    ctx.fill();
    
    // Draw hexagons around the ball
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
        const angle = (i * Math.PI / 3);
        const cx = x + radius * 0.6 * Math.cos(angle);
        const cy = y + radius * 0.6 * Math.sin(angle);
        
        ctx.beginPath();
        for (let j = 0; j < 6; j++) {
            const a = angle + (j * Math.PI / 3);
            const px = cx + radius * 0.3 * Math.cos(a);
            const py = cy + radius * 0.3 * Math.sin(a);
            if (j === 0) {
                ctx.moveTo(px, py);
            } else {
                ctx.lineTo(px, py);
            }
        }
        ctx.closePath();
        ctx.stroke();
    }
}

// Draw force vectors on the ball
function drawVectors(ballX, ballY) {
    // Using black color for all vectors for better visibility
    // Draw gravity vector (downward)
    const gravityVectorLength = Math.min(50, gravity * 5);
    drawVector(ballX, ballY, ballX, ballY + gravityVectorLength, '#000000', 'mg = ' + gravity.toFixed(2) + ' N');
    
    // Draw velocity vector
    if (Math.abs(velocity) > 0.1) {
        const velocityVectorLength = Math.min(100, Math.abs(velocity) * 2);
        const velocityDirection = velocity > 0 ? 1 : -1;
        drawVector(ballX, ballY, ballX, ballY + velocityVectorLength * velocityDirection, '#000000', 'v = ' + velocity.toFixed(2) + ' m/s');
    }
    
    // Draw air resistance vector if enabled
    if (useAirResistance && Math.abs(velocity) > 0.1) {
        const airResistance = dragCoefficient * velocity * Math.abs(velocity);
        const arVectorLength = Math.min(30, Math.abs(airResistance) * 5);
        const arDirection = airResistance > 0 ? 1 : -1;
        drawVector(ballX, ballY, ballX, ballY - arVectorLength * arDirection, '#000000', 'Fdrag = ' + airResistance.toFixed(2) + ' N');
    }
}

// Helper function to draw a vector with label
function drawVector(x1, y1, x2, y2, color, label) {
    const headSize = 8;
    const angle = Math.atan2(y2 - y1, x2 - x1);
    
    // Draw the line
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Draw the arrowhead
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(
        x2 - headSize * Math.cos(angle - Math.PI / 6),
        y2 - headSize * Math.sin(angle - Math.PI / 6)
    );
    ctx.lineTo(
        x2 - headSize * Math.cos(angle + Math.PI / 6),
        y2 - headSize * Math.sin(angle + Math.PI / 6)
    );
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    
    // Draw the label
    ctx.fillStyle = color; // Using black for all vector labels
    ctx.font = '12px Arial';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x2 + 10, y2);
}

// Draw the height vs time graph
function drawGraph() {
    // Clear the canvas
    graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
    
    // Draw axes
    drawGraphAxes();
    
    // Draw the data points
    if (timeData.length > 1) {
        const maxTime = Math.max(...timeData);
        const timeScale = (graphCanvas.width - 60) / (maxTime > 5 ? maxTime : 5);
        const heightScale = (graphCanvas.height - 40) / initialHeight;
        
        graphCtx.beginPath();
        graphCtx.moveTo(
            30 + timeData[0] * timeScale,
            graphCanvas.height - 20 - heightData[0] * heightScale
        );
        
        for (let i = 1; i < timeData.length; i++) {
            graphCtx.lineTo(
                30 + timeData[i] * timeScale,
                graphCanvas.height - 20 - heightData[i] * heightScale
            );
        }
        
        // Changed graph line color to black for better visibility
        graphCtx.strokeStyle = '#000000';
        graphCtx.lineWidth = 2;
        graphCtx.stroke();
    }
}

// Draw the axes for the graph
function drawGraphAxes() {
    const width = graphCanvas.width;
    const height = graphCanvas.height;
    
    // Draw axes
    graphCtx.beginPath();
    graphCtx.moveTo(30, 10);
    graphCtx.lineTo(30, height - 20);
    graphCtx.lineTo(width - 10, height - 20);
    graphCtx.strokeStyle = '#000'; // Using black
    graphCtx.lineWidth = 1;
    graphCtx.stroke();
    
    // Draw x-axis ticks and labels
    graphCtx.textAlign = 'center';
    graphCtx.textBaseline = 'top';
    graphCtx.font = '10px Arial';
    graphCtx.fillStyle = '#000'; // Ensuring text is black
    
    const maxTime = Math.max(...timeData, 5);
    const timeInterval = maxTime > 10 ? 1 : 0.5;
    
    for (let t = 0; t <= maxTime; t += timeInterval) {
        const x = 30 + t * ((width - 40) / maxTime);
        
        graphCtx.beginPath();
        graphCtx.moveTo(x, height - 20);
        graphCtx.lineTo(x, height - 15);
        graphCtx.stroke();
        
        graphCtx.fillText(t.toFixed(1), x, height - 15);
    }
    
    // Draw y-axis ticks and labels
    graphCtx.textAlign = 'right';
    graphCtx.textBaseline = 'middle';
    
    const heightInterval = initialHeight > 50 ? 20 : 10;
    
    for (let h = 0; h <= initialHeight; h += heightInterval) {
        const y = height - 20 - h * ((height - 30) / initialHeight);
        
        graphCtx.beginPath();
        graphCtx.moveTo(30, y);
        graphCtx.lineTo(25, y);
        graphCtx.stroke();
        
        graphCtx.fillText(h, 23, y);
    }
}
