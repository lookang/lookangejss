  function getMissilePosition(missile) {  // > CustomCode.Tools:19

    if (missile<0 || missile>nMissiles) return null;  // > CustomCode.Tools:21

  function getMissileVelocity(missile) {  // > CustomCode.Tools:29
    if (!missileVis[missile]) return null;  // > CustomCode.Tools:30
    if (missile<0 || missile>nMissiles) return null;  // > CustomCode.Tools:31
    var vel = missileVel[missile];  // > CustomCode.Tools:32
    return [vel[0],vel[1]];  // > CustomCode.Tools:33

  /*  // > CustomCode.Tools:35
   * Computes the velocity vector to go from pos to targetPos   // > CustomCode.Tools:36
   * Returns [vx,vy,time to target]  // > CustomCode.Tools:37
   */  // > CustomCode.Tools:38
  function velocity (speed,pos,targetPos) {  // > CustomCode.Tools:39
    var dx = (targetPos[0]-pos[0]);  // > CustomCode.Tools:40
    var dy = (targetPos[1]-pos[1]);  // > CustomCode.Tools:41
    var distance = Math.sqrt(dx*dx+dy*dy);  // > CustomCode.Tools:42
    return [speed*dx/distance, speed*dy/distance, distance/speed]; // vx,vy, time to target  // > CustomCode.Tools:43
  }  // > CustomCode.Tools:44
  /**  // > CustomCode.Tools:45
   * Distance between two points  // > CustomCode.Tools:46
   */  // > CustomCode.Tools:47
  function distance (point1,point2) {  // > CustomCode.Tools:48
    var dx = (point2[0]-point1[0]);  // > CustomCode.Tools:49
    var dy = (point2[1]-point1[1]);  // > CustomCode.Tools:50
    return Math.sqrt(dx*dx+dy*dy);  // > CustomCode.Tools:51

  /**  // > CustomCode.Tools:53

  function findClosestMissile(position) {  // > CustomCode.Tools:58
    var closestMissile = -1;  // > CustomCode.Tools:59
    var minDistance = Number.POSITIVE_INFINITY;  // > CustomCode.Tools:60
    var maxIndex = getNumberOfMissiles()-1;  // > CustomCode.Tools:61
    for (var missile = 0; missile<=maxIndex; missile++) {  // > CustomCode.Tools:62
      var missilePosition = getMissilePosition(missile);  // > CustomCode.Tools:63
      if (missilePosition===null) continue; // Not falling  // > CustomCode.Tools:64
      var distanceToMissile = distance (position,missilePosition);  // > CustomCode.Tools:65

  /**  // > CustomCode.Autoplay:19
   * Returns the best launch parameters for the  // > CustomCode.Autoplay:20
   * missile closest to the given position  // > CustomCode.Autoplay:21
   * @param point an array[2] with the coordinates   // > CustomCode.Autoplay:22
   * of the point you clicked or tapped (meters)  // > CustomCode.Autoplay:23
   * @return an array[2] with [angle, timeToExplode]  // > CustomCode.Autoplay:24
   */  // > CustomCode.Autoplay:25
  function assistedGuidance(position) {  // > CustomCode.Autoplay:26
    var missile = findClosestMissile(position);  // > CustomCode.Autoplay:27
    if (missile<0) return null; // no missile around!  // > CustomCode.Autoplay:28
    return aimToMissile(missile);  // > CustomCode.Autoplay:29
  }  // > CustomCode.Autoplay:30
  /**  // > CustomCode.Autoplay:31
   * Computes the best angle and explosion time to  // > CustomCode.Autoplay:32
   * destroy a falling missile  // > CustomCode.Autoplay:33
   * @param missile the integer index for the missile  // > CustomCode.Autoplay:34
   * @return an array with [angle, timeToExplode]  // > CustomCode.Autoplay:35
   */  // > CustomCode.Autoplay:36
  function aimToMissile(missile) {  // > CustomCode.Autoplay:37
    var position = getMissilePosition(missile);  // > CustomCode.Autoplay:38
    var velocity = getMissileVelocity(missile);  // > CustomCode.Autoplay:39
    var turret = getTurretPosition();  // > CustomCode.Autoplay:40
    // Compute time  // > CustomCode.Autoplay:41
    var dx = position[0]-turret[0];  // > CustomCode.Autoplay:42
    var dy = position[1]-turret[1];  // > CustomCode.Autoplay:43
    var vx = velocity[0], vy = velocity[1];  // > CustomCode.Autoplay:44
    var a = bombSpeed*bombSpeed - vx*vx - vy*vy;  // > CustomCode.Autoplay:45
    var b = - 2 * (dx*vx + dy*vy);  // > CustomCode.Autoplay:46
    var c = - (dx*dx + dy*dy);  // > CustomCode.Autoplay:47
    // Get the solution with positive value of the square root  // > CustomCode.Autoplay:48
    var timeToExplode = ( -b + Math.sqrt(b*b-4*a*c))/(2*a);   // > CustomCode.Autoplay:49
    // Compute angle  // > CustomCode.Autoplay:50
    var cosine = (dx+vx*timeToExplode)/(bombSpeed*timeToExplode);  // > CustomCode.Autoplay:51
    var angle = Math.acos(cosine);  // > CustomCode.Autoplay:52
    return [angle,timeToExplode];  // > CustomCode.Autoplay:53
  }  // > CustomCode.Autoplay:54
  /**  // > CustomCode.Autoplay:55
   * Action to autommatically destroy a missile  // > CustomCode.Autoplay:56
   */  // > CustomCode.Autoplay:57
  function autoplayAction(missile) {  // > CustomCode.Autoplay:58
    if (autoplayOption!=AUTOPLAY_AUTO) return;  // > CustomCode.Autoplay:59
    if (!turretNotDestroyed) return;  // > CustomCode.Autoplay:60
    if (!autoDefensesFiredForMisile[missile]) { // Fire only once  // > CustomCode.Autoplay:61
      var position = missilePos[missile];  // > CustomCode.Autoplay:62
      if (position[1]>airSpaceHeight) return;  // > CustomCode.Autoplay:63
      var aimTo = aimToMissile(missile);  // > CustomCode.Autoplay:64
      if (aimTo!==null) {  // > CustomCode.Autoplay:65
        addBomb (bombSpeed*Math.cos(aimTo[0]),bombSpeed*Math.sin(aimTo[0]),aimTo[1]);  // > CustomCode.Autoplay:66
        autoDefensesFiredForMisile[missile] = true;  // > CustomCode.Autoplay:67
      }  // > CustomCode.Autoplay:68
    }  // > CustomCode.Autoplay:69
  }  // > CustomCode.Autoplay:70

  // *** No need to edit this page  // > CustomCode.Random:1
  // Returns a random integer between the given ones, both included  // > CustomCode.Random:2
  function getRandomInteger(min,max) {  // > CustomCode.Random:3
    return randomGenerator.nextRange(min,max+1);  // > CustomCode.Random:4
  }  // > CustomCode.Random:5
  // Returns a random double between the given ones, both included  // > CustomCode.Random:6
  function getRandomDouble(min,max) {  // > CustomCode.Random:7
    return min + randomGenerator.nextDouble()*(max-min);  // > CustomCode.Random:8
  }  // > CustomCode.Random:9
  // Random number generator  // > CustomCode.Random:10
  // Adapted from http://stackoverflow.com/questions/424292/seedable-javascript-random-number-generator  // > CustomCode.Random:11
  function RNG(seed) {   // > CustomCode.Random:12
    var self = {};  // > CustomCode.Random:13
    // LCG using GCC's constants  // > CustomCode.Random:14
    self.m = 0x80000000; // 2**31;  // > CustomCode.Random:15
    self.a = 1103515245;  // > CustomCode.Random:16
    self.c = 12345;  // > CustomCode.Random:17
    self.firstState = (seed) ? seed : Math.floor(Math.random() * (self.m-1));   // > CustomCode.Random:18
    self.state = self.firstState;  // > CustomCode.Random:19
      // > CustomCode.Random:20
    self.nextInt = function() {  // > CustomCode.Random:21
      self.state = (self.a * self.state + self.c) % self.m;  // > CustomCode.Random:22
      return self.state;  // > CustomCode.Random:23
    };  // > CustomCode.Random:24
      // > CustomCode.Random:25
    self.nextDouble = function() { // returns in range [0,1]  // > CustomCode.Random:26
      return self.nextInt() / (self.m - 1);  // > CustomCode.Random:27
    };  // > CustomCode.Random:28
    self.nextRange = function(start, end) {  // > CustomCode.Random:29
    // returns in range [start, end): including start, excluding end  // > CustomCode.Random:30
    // can't modulu nextInt because of weak randomness in lower bits  // > CustomCode.Random:31
      var rangeSize = end - start;  // > CustomCode.Random:32
      var randomUnder1 = self.nextInt() / self.m;  // > CustomCode.Random:33
      return start + Math.floor(randomUnder1 * rangeSize);  // > CustomCode.Random:34
    };  // > CustomCode.Random:35
    self.setResetState = function() {  // > CustomCode.Random:36
      self.firstState = self.state;  // > CustomCode.Random:37
    };  // > CustomCode.Random:38
      // > CustomCode.Random:39
    self.reset = function() {  // > CustomCode.Random:40
      self.state = self.firstState;  // > CustomCode.Random:41
    };  // > CustomCode.Random:42
      // > CustomCode.Random:43
    return self;  // > CustomCode.Random:44
  }  // > CustomCode.Random:45
