  function computeStochasticDecay () {  // > CustomCode.Stochastic Decay:1
    var topToMiddleProbability=1-Math.exp(-k1*dt);       // 1->2 decay probability within dt  // > CustomCode.Stochastic Decay:2
    //double topToBottomProbability=1-Math.exp(-(k1+k2)*dt);  // 1->3 decay probability within dt  // > CustomCode.Stochastic Decay:3
    var middleToBottomProbability=1-Math.exp(-k2*dt);    // 2->3 decay probability within dt  // > CustomCode.Stochastic Decay:4
    dN1=0;  // > CustomCode.Stochastic Decay:5
    dN2=0;  // > CustomCode.Stochastic Decay:6
    for (var i = 0; i < N; i++) {  // > CustomCode.Stochastic Decay:7
      var p=Math.random();  // > CustomCode.Stochastic Decay:8
      if((colors[i]==="RED")&& p<p12) { // decay from state 1 to 2  // > CustomCode.Stochastic Decay:9
        colors[i]="GREEN";  // > CustomCode.Stochastic Decay:10
        N1--;  // > CustomCode.Stochastic Decay:11
        N2++;  // > CustomCode.Stochastic Decay:12
        dN1++;  // > CustomCode.Stochastic Decay:13
      } else if((colors[i]==="RED")&& p<p12+p13) { // decvay from state 1 to 3  // > CustomCode.Stochastic Decay:14
        colors[i]="BLUE";  // > CustomCode.Stochastic Decay:15
        N1--;  // > CustomCode.Stochastic Decay:16
        N3++;  // > CustomCode.Stochastic Decay:17
        dN1++;  // > CustomCode.Stochastic Decay:18
        dN2++;  // > CustomCode.Stochastic Decay:19
      } else if((colors[i]==="GREEN")&&p<p2) { // decay from state 2  // > CustomCode.Stochastic Decay:20
        colors[i]="BLUE";  // > CustomCode.Stochastic Decay:21
        N2--;  // > CustomCode.Stochastic Decay:22
        N3++;  // > CustomCode.Stochastic Decay:23
        dN2++;  // > CustomCode.Stochastic Decay:24

    }  // > CustomCode.Stochastic Decay:26
  }  // > CustomCode.Stochastic Decay:27

      __eventSolver.setStepSize(dt);

        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();

      else if (__mustReinitialize) { 
        __eventSolver.reinitialize();
        __mustReinitialize = false;
        if (__eventSolver.getErrorCode()!=EJSS_ODE_SOLVERS.ERROR.NO_ERROR) __errorAction();
      }
      var __stepTaken = __takeMaximumStep ? __eventSolver.maxStep() : __eventSolver.step();
