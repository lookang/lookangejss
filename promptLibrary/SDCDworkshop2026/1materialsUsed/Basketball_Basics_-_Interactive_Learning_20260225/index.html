<html lang="en">
<head>

<style id="aiz-footer-style">
#aiz-footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 10px;
  z-index: 2147483000;
  display: flex;
  justify-content: center;
  pointer-events: auto; /* keep links clickable */
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
  color: #222;
}
#aiz-footer p {
  margin: 0;
  padding: 6px 10px;
  background: rgba(255,255,255,0.9);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);

<body>
    <!-- Main container that adapts to iframe or full page -->
    <div id="mainContainer">
        
        <!-- Basketball Court Visualization -->
        <div id="courtSection">
            <canvas id="basketballCourt"></canvas>
            
            <!-- Interactive Controls Overlay -->
            <div id="controlsOverlay">
                <button id="dribbleBtn" class="action-btn">
                    <span class="btn-icon">⛹️</span>
                    <span class="btn-text">Dribble</span>
                </button>
                <button id="passBtn" class="action-btn">
                    <span class="btn-icon">🤾</span>
                    <span class="btn-text">Pass</span>
                </button>
                <button id="shootBtn" class="action-btn">
                    <span class="btn-icon">🏀</span>
                    <span class="btn-text">Shoot</span>
                </button>
            </div>
        </div>

        <!-- Quiz Section -->
        <div id="quizSection">
            <div id="questionDisplay">
                <div id="questionText"></div>
                <div id="optionsContainer"></div>
            </div>
            
            <div id="quizControls">
                <button id="nextQuestionBtn" class="control-btn">Next Question</button>
                <button id="resetQuizBtn" class="control-btn">Reset Quiz</button>
            </div>
            
            <div id="scoreDisplay">
                <span id="scoreText">Score: 0/0</span>
            </div>
        </div>

        <!-- Real-time Analytics Panel -->
        <div id="analyticsPanel">
            <div id="analyticsHeader">
                <h3>📊 Learning Analytics</h3>
                <button id="toggleAnalytics" class="toggle-btn">Hide</button>
            </div>
            <div id="analyticsContent">
                <div id="analyticsLog"></div>
                <button id="clearAnalytics" class="control-btn">Clear Log</button>
            </div>
        </div>

        <!-- Tooltip for information display -->
        <div id="tooltip" class="tooltip"></div>
    </div>

    <script src="script.js"></script>
