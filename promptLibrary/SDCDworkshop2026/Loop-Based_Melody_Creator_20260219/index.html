<body>
    <!-- Main container with tooltip for header information -->
    <div class="container" title="Loop-Based Melody Creator - Compose repeating melodic patterns and explore tempo variations">
        
        <!-- Control Panel Section -->
        <div class="control-panel">
            
            <!-- Transport Controls -->
            <div class="transport-controls">
                <button id="recordBtn" class="control-btn record-btn" title="Start recording your melody (R)">
                    <span class="btn-icon">●</span> Record
                </button>
                <button id="playBtn" class="control-btn play-btn" title="Play your loop (Space)">
                    <span class="btn-icon">▶</span> Play
                </button>
                <button id="stopBtn" class="control-btn stop-btn" title="Stop playback (S)">
                    <span class="btn-icon">■</span> Stop
                </button>
                <button id="clearBtn" class="control-btn clear-btn" title="Clear all notes and start over">
                    <span class="btn-icon">✕</span> Clear
                </button>
            </div>

            <!-- Loop Length Selector -->
            <div class="loop-settings">
                <div class="setting-group">
                    <label title="Select the number of beats in your loop">Loop Length:</label>
                    <div class="loop-length-btns">
                        <button class="loop-btn" data-length="8">8 beats</button>
                        <button class="loop-btn active" data-length="16">16 beats</button>
                        <button class="loop-btn" data-length="32">32 beats</button>
                    </div>
                </div>

                <!-- BPM Control -->
                <div class="setting-group">
                    <label title="Beats Per Minute - controls the speed of your loop">BPM:</label>
                    <div class="bpm-control">
                        <button id="bpmDown" class="bpm-btn" title="Decrease tempo">−</button>
                        <input type="number" id="bpmInput" value="120" min="40" max="240" step="1">
                        <button id="bpmUp" class="bpm-btn" title="Increase tempo">+</button>
                    </div>
                </div>
            </div>

            <!-- Save/Load Controls -->
            <div class="file-controls">
                <button id="saveBtn" class="control-btn save-btn" title="Save your composition">💾 Save</button>
                <button id="loadBtn" class="control-btn load-btn" title="Load a saved composition">📂 Load</button>
            </div>
        </div>

        <!-- Loop Progress Indicator -->
        <div class="progress-section">
            <div class="beat-counter" title="Current beat position in the loop">
                Beat: <span id="currentBeat">0</span> / <span id="totalBeats">16</span>
            </div>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Visual Note Display -->
        <div class="note-display" title="Visual representation of your recorded melody">
            <canvas id="noteCanvas" width="1489" height="103"></canvas>
        </div>

        <!-- Piano Keyboard -->
        <div class="keyboard-container">
            <div class="keyboard" id="keyboard">
                <!-- White keys with computer keyboard mappings -->
                <div class="key white" data-note="C4" data-key="A" title="C4 (A key)">
                    <span class="key-label">C4</span>
                    <span class="key-mapping">A</span>
                </div>
                <div class="key black" data-note="C#4" data-key="W" title="C#4 (W key)">
                    <span class="key-label">C#4</span>
                    <span class="key-mapping">W</span>
                </div>
                <div class="key white" data-note="D4" data-key="S" title="D4 (S key)">
                    <span class="key-label">D4</span>
                    <span class="key-mapping">S</span>
                </div>
                <div class="key black" data-note="D#4" data-key="E" title="D#4 (E key)">
                    <span class="key-label">D#4</span>
                    <span class="key-mapping">E</span>
                </div>
                <div class="key white" data-note="E4" data-key="D" title="E4 (D key)">
                    <span class="key-label">E4</span>
                    <span class="key-mapping">D</span>
                </div>
                <div class="key white" data-note="F4" data-key="F" title="F4 (F key)">
                    <span class="key-label">F4</span>
                    <span class="key-mapping">F</span>
                </div>
                <div class="key black" data-note="F#4" data-key="T" title="F#4 (T key)">
                    <span class="key-label">F#4</span>
                    <span class="key-mapping">T</span>
                </div>
                <div class="key white" data-note="G4" data-key="G" title="G4 (G key)">
                    <span class="key-label">G4</span>
                    <span class="key-mapping">G</span>
                </div>
                <div class="key black" data-note="G#4" data-key="Y" title="G#4 (Y key)">
                    <span class="key-label">G#4</span>
                    <span class="key-mapping">Y</span>
                </div>
                <div class="key white" data-note="A4" data-key="H" title="A4 (H key)">
                    <span class="key-label">A4</span>
                    <span class="key-mapping">H</span>
                </div>
                <div class="key black" data-note="A#4" data-key="U" title="A#4 (U key)">
                    <span class="key-label">A#4</span>
                    <span class="key-mapping">U</span>
                </div>
                <div class="key white" data-note="B4" data-key="J" title="B4 (J key)">
                    <span class="key-label">B4</span>
                    <span class="key-mapping">J</span>
                </div>
                <div class="key white" data-note="C5" data-key="K" title="C5 (K key)">
                    <span class="key-label">C5</span>
                    <span class="key-mapping">K</span>
                </div>
            </div>
        </div>

        <!-- Hidden file input for loading -->
        <input type="file" id="fileInput" accept=".json" style="display: none;">
    </div>
