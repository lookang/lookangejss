<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Formation Virtual Lab</title>
    <link rel="stylesheet" href="styles.css">
<script async="true" src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>

<style id="aiz-footer-style">
#aiz-footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 10px;
  z-index: 2147483000;
  display: flex;
  justify-content: center;
  pointer-events: auto; /* keep links clickable */
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
  color: #222;
}
#aiz-footer p {
  margin: 0;
  padding: 6px 10px;
  background: rgba(255,255,255,0.9);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);

#aiz-footer a { color: #0b69ff; text-decoration: underline; }

<body>
    <!-- Tooltip for header information -->
    <div id="tooltip" class="tooltip"></div>
    
    <!-- Main container -->
    <div class="container" title="Shadow Formation Virtual Lab - Explore how light creates shadows with different objects and positions">
        
        <!-- Control Panel -->
        <div class="control-panel">
            <div class="controls-left">
                <label for="objectSelect">Object:</label>
                <select id="objectSelect">
                    <option value="cube">Cube</option>
                    <option value="sphere">Sphere</option>
                </select>
            </div>
            
            <div class="controls-center">
                <button id="playBtn" class="btn">▶ Play</button>
                <button id="pauseBtn" class="btn">⏸ Pause</button>
                <button id="resetBtn" class="btn">🔄 Reset</button>
            </div>
            
            <div class="controls-right">
                <button id="toggleAnalytics" class="btn">📊 Analytics</button>
            </div>
        </div>

        <!-- Main Lab Area -->
        <div class="lab-container">
            <svg id="labSvg" viewBox="0 0 800 300">
                <!-- Background grid for reference -->
                <defs>
                    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
                    </pattern>
                    <!-- Light source gradient -->
                    <radialGradient id="lightGradient" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:0.8" />
                    </radialGradient>
                    <!-- Shadow gradient -->
                    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#333333;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#666666;stop-opacity:0.6" />
                    </linearGradient>
                </defs>
                
                <!-- Grid background -->
                <rect width="100%" height="100%" fill="url(#grid)" />
                
                <!-- Light rays -->
                <line id="ray1" class="light-ray" />
                <line id="ray2" class="light-ray" />
                
                <!-- Shadow on screen -->
                <rect id="shadow" class="shadow" />
                
                <!-- Light source -->
                <circle id="lightSource" class="light-source draggable" cx="100" cy="150" r="15" />
                <text id="lightLabel" class="label" x="100" y="180">Light Source</text>
                
                <!-- Opaque object (cube by default) -->
                <g id="objectGroup" class="draggable">
                    <rect id="cubeObject" class="opaque-object" x="340" y="120" width="60" height="60" />
                    <circle id="sphereObject" class="opaque-object" cx="370" cy="150" r="30" style="display:none" />
                </g>
                <text id="objectLabel" class="label" x="370" y="200">Opaque Object</text>
                
                <!-- Screen -->
                <rect id="screen" class="screen draggable" x="650" y="50" width="10" height="200" />
                <text id="screenLabel" class="label" x="655" y="270">Screen</text>
                
                <!-- Distance measurements -->
                <g id="measurements" class="measurements">
                    <line id="distLine1" class="dist-line" />
                    <text id="distText1" class="dist-text"></text>
                    <line id="distLine2" class="dist-line" />
                    <text id="distText2" class="dist-text"></text>
                </g>
            </svg>
        </div>

        <!-- Information Panel -->
        <div class="info-panel">
            <div class="info-item">
                <span class="info-label">Shadow Height:</span>
                <span id="shadowHeight" class="info-value">0 cm</span>
            </div>
            <div class="info-item">
                <span class="info-label">Object Distance:</span>
                <span id="objectDistance" class="info-value">0 cm</span>
            </div>
            <div class="info-item">
                <span class="info-label">Screen Distance:</span>
                <span id="screenDistance" class="info-value">0 cm</span>
            </div>
        </div>

        <!-- Analytics Panel -->
        <div id="analyticsPanel" class="analytics-panel">
            <div class="analytics-header">
                <h3>📊 Learning Analytics</h3>
                <button id="clearLog" class="btn-small">Clear Log</button>
            </div>
            <div id="actionLog" class="action-log"></div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
