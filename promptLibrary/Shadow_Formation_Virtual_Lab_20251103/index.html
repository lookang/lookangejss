<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Shadow Formation Virtual Lab</title>
    <link rel="stylesheet" href="styles.css">

<style id="aiz-footer-style">
#aiz-footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 10px;
  z-index: 2147483000;
  display: flex;
  justify-content: center;
  pointer-events: auto; /* keep links clickable */
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
  color: #222;
}
#aiz-footer p {
  margin: 0;
  padding: 6px 10px;
  background: rgba(255,255,255,0.9);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
#aiz-footer a { color: #0b69ff; text-decoration: underline; }
</style>

<body>
    <!-- Main container with tooltip for title -->
    <div class="container" title="Shadow Formation Virtual Lab - Explore how light sources create shadows">
        
        <!-- Main simulation area -->
        <div class="simulation-area">
            <!-- Light source controls -->
            <div class="controls-panel">
                <div class="control-group">
                    <label for="lightHeight">Light Height</label>
                    <input type="range" id="lightHeight" min="50" max="200" value="100" class="slider">
                    <span id="lightHeightValue">100px</span>
                </div>
                
                <div class="control-group">
                    <label for="lightAngle">Light Angle</label>
                    <input type="range" id="lightAngle" min="-45" max="45" value="0" class="slider">
                    <span id="lightAngleValue">0°</span>
                </div>
                
                <div class="control-group">
                    <label for="objectHeight">Object Height</label>
                    <input type="range" id="objectHeight" min="30" max="120" value="60" class="slider">
                    <span id="objectHeightValue">60px</span>
                </div>
                
                <div class="control-group">
                    <label for="objectPosition">Object Position</label>
                    <input type="range" id="objectPosition" min="100" max="300" value="200" class="slider">
                    <span id="objectPositionValue">200px</span>
                </div>
                
                <button id="resetBtn" class="reset-button">Reset to Default</button>
            </div>
            
            <!-- Shadow formation visualization -->
            <div class="visualization-container">
                <svg id="shadowSvg" viewBox="0 0 400 300">
                    <!-- Ground line -->
                    <line x1="0" y1="250" x2="400" y2="250" stroke="#8B4513" stroke-width="3" class="ground-line"/>
                    
                    <!-- Shadow (rendered first so it appears behind the object) -->
                    <polygon id="shadowShape" points="" fill="#333" opacity="0.6" class="shadow"/>
                    
                    <!-- Light source -->
                    <circle id="lightSource" cx="50" cy="100" r="8" fill="#FFD700" class="light-source"/>
                    <g id="lightRays" class="light-rays"></g>
                    
                    <!-- Object (rectangular block) -->
                    <rect id="shadowObject" x="190" y="190" width="20" height="60" fill="#4169E1" class="shadow-object"/>
                    
                    <!-- Labels -->
                    <text x="50" y="85" text-anchor="middle" class="label">Light Source</text>
                    <text x="200" y="280" text-anchor="middle" class="label">Shadow</text>
                </svg>
                
                <!-- Measurement display -->
                <div class="measurements">
                    <div class="measurement-item">
                        <span class="measurement-label">Shadow Length:</span>
                        <span id="shadowLength">0px</span>
                    </div>
                    <div class="measurement-item">
                        <span class="measurement-label">Shadow Width:</span>
                        <span id="shadowWidth">20px</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Learning insights panel -->
        <div class="insights-panel">
            <div class="insights-header">
                <h3>💡 Key Observations</h3>
            </div>
            <div id="insightsContent" class="insights-content">
                <p>Adjust the controls to see how shadows change!</p>
            </div>
        </div>
        
        <!-- Analytics panel (collapsible) -->
        <div class="analytics-panel">
            <div class="analytics-header" id="analyticsToggle">
                <span>📊 Learning Analytics</span>
                <span class="toggle-icon">▼</span>
            </div>
            <div id="analyticsContent" class="analytics-content">
                <div class="analytics-controls">
                    <button id="clearLog" class="clear-log-btn">Clear Log</button>
                </div>
                <div id="actionLog" class="action-log">
                    <div class="log-entry">
                        <span class="timestamp">t=0s</span>
                        <span class="action">🚀 Simulation started</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
<footer id="aiz-footer" role="contentinfo"><p id="generated-footer-credit">Made by lookang, using Claude 4.0 in SLS. For more resources: <a href="https://sg.iwant2study.org/ospsg/index.php/ai-prompt-library" target="_blank" rel="noopener noreferrer">https://sg.iwant2study.org/ospsg/index.php/ai-prompt-library</a></p></footer>
</body>
</html>
