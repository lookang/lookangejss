<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigonometry Unit Circle Interactive</title>
    <link rel="stylesheet" href="styles.css">
<script async="true" src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-S9EWRY1CPJ');

<style id="aiz-footer-style">
#aiz-footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 10px;
  z-index: 2147483000;
  display: flex;
  justify-content: center;
  pointer-events: auto; /* keep links clickable */
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
  color: #222;
}
#aiz-footer p {
  margin: 0;
  padding: 6px 10px;
  background: rgba(255,255,255,0.9);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
#aiz-footer a { color: #0b69ff; text-decoration: underline; }
</style>
</head>
<body>
    <!-- Main container with responsive height -->
    <div class="container">
        <!-- Control panel for user interactions -->
        <div class="control-panel">
            <!-- Angle input slider with real-time display -->
            <div class="control-group">
                <label for="angleSlider" title="Drag to change the angle in degrees">Angle: <span id="angleValue">0°</span></label>
                <input type="range" id="angleSlider" min="0" max="360" value="0" step="1">
            </div>
            
            <!-- Unit selection for angle measurement -->
            <div class="control-group">
                <label title="Choose angle measurement unit">
                    <input type="radio" name="unit" value="degrees" checked> Degrees
                </label>
                <label title="Choose angle measurement unit">
                    <input type="radio" name="unit" value="radians"> Radians
                </label>
            </div>
            
            <!-- Display options for enhanced learning -->
            <div class="control-group">
                <label title="Show/hide coordinate grid">
                    <input type="checkbox" id="showGrid" checked> Grid
                </label>
                <label title="Show/hide angle arc">
                    <input type="checkbox" id="showArc" checked> Arc
                </label>
                <label title="Show/hide coordinate values">
                    <input type="checkbox" id="showCoords" checked> Coordinates
                </label>
            </div>
            
            <!-- Quick angle buttons for common angles -->
            <div class="control-group">
                <div class="angle-buttons">
                    <button class="angle-btn" data-angle="0" title="Set angle to 0°">0°</button>
                    <button class="angle-btn" data-angle="30" title="Set angle to 30°">30°</button>
                    <button class="angle-btn" data-angle="45" title="Set angle to 45°">45°</button>
                    <button class="angle-btn" data-angle="60" title="Set angle to 60°">60°</button>
                    <button class="angle-btn" data-angle="90" title="Set angle to 90°">90°</button>
                </div>
            </div>
            
            <!-- Reset button -->
            <button id="resetBtn" class="reset-btn" title="Reset to default values">Reset</button>
        </div>
        
        <!-- Main visualization area -->
        <div class="visualization">
            <!-- SVG canvas for unit circle -->
            <svg id="unitCircle" viewBox="-150 -150 300 300">
                <!-- Grid lines (optional display) -->
                <g id="gridGroup">
                    <!-- Horizontal and vertical grid lines will be generated by JavaScript -->
                </g>
                
                <!-- Unit circle -->
                <circle cx="0" cy="0" r="100" fill="none" stroke="#333" stroke-width="2"/>
                
                <!-- Coordinate axes -->
                <line x1="-120" y1="0" x2="120" y2="0" stroke="#666" stroke-width="1"/>
                <line x1="0" y1="-120" x2="0" y2="120" stroke="#666" stroke-width="1"/>
                
                <!-- Axis labels -->
                <text x="115" y="-5" font-size="12" fill="#666">x</text>
                <text x="5" y="-115" font-size="12" fill="#666">y</text>
                
                <!-- Angle arc -->
                <path id="angleArc" fill="none" stroke="#ff6b6b" stroke-width="2"/>
                
                <!-- Radius line -->
                <line id="radiusLine" x1="0" y1="0" x2="100" y2="0" stroke="#4ecdc4" stroke-width="3"/>
                
                <!-- Point on circle -->
                <circle id="circlePoint" cx="100" cy="0" r="6" fill="#4ecdc4"/>
                
                <!-- Coordinate lines -->
                <line id="xCoordLine" stroke="#ff9f43" stroke-width="2" stroke-dasharray="5,5"/>
                <line id="yCoordLine" stroke="#ff9f43" stroke-width="2" stroke-dasharray="5,5"/>
                
                <!-- Coordinate labels -->
                <text id="coordText" x="110" y="-10" font-size="14" fill="#333" font-weight="bold"/>
            </svg>
        </div>
        
        <!-- Values display panel -->
        <div class="values-panel">
            <div class="value-item" title="Cosine value (x-coordinate)">
                <span class="label">cos θ =</span>
                <span id="cosValue" class="value">1.000</span>
            </div>
            <div class="value-item" title="Sine value (y-coordinate)">
                <span class="label">sin θ =</span>
                <span id="sinValue" class="value">0.000</span>
            </div>
            <div class="value-item" title="Tangent value">
                <span class="label">tan θ =</span>
                <span id="tanValue" class="value">0.000</span>
            </div>
        </div>
        
        <!-- Analytics panel for learning assessment -->
        <div class="analytics-panel" title="Learning analytics - track your exploration">
            <div class="analytics-header">Learning Analytics</div>
            <div class="analytics-content">
                <div class="analytics-item">
                    <span class="analytics-label">Interactions:</span>
                    <span id="interactionCount">0</span>
                </div>
                <div class="analytics-item">
                    <span class="analytics-label">Quadrants explored:</span>
                    <span id="quadrantsExplored">0/4</span>
                </div>
                <div class="analytics-item">
                    <span class="analytics-label">Special angles visited:</span>
                    <span id="specialAngles">0/8</span>
                </div>
                <div class="analytics-item">
                    <span class="analytics-label">Time spent:</span>
                    <span id="timeSpent">0s</span>
                </div>
            </div>
        </div>
        
        <!-- Tooltip for additional information -->
        <div id="tooltip" class="tooltip"></div>
    </div>
    
    <script src="script.js"></script>

</html>
