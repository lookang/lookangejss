  left: 0;

<body>
    <!-- Main container with tooltip for header information -->
    <div class="container" title="Law of Reflection Interactive Simulation - Explore how light reflects off surfaces">
        
        <!-- Control Panel -->
        <div class="control-panel">
            <div class="control-group">
                <label for="incidentAngle">Incident Angle: <span id="angleValue">30°</span></label>
                <input type="range" id="incidentAngle" min="10" max="80" value="30" class="slider">
            </div>
            
            <div class="control-group">
                <label for="surfaceType">Surface Type:</label>
                <select id="surfaceType" class="dropdown">
                    <option value="plane">Plane Mirror</option>
                    <option value="rough">Rough Surface</option>
                    <option value="curved">Curved Mirror</option>
                </select>
            </div>
            
            <div class="control-buttons">
                <button id="resetBtn" class="btn">Reset</button>
                <button id="toggleGrid" class="btn">Toggle Grid</button>
                <button id="showNormal" class="btn active">Show Normal</button>
            </div>
        </div>

        <!-- Main Simulation Area -->
        <div class="simulation-area">
            <canvas id="reflectionCanvas" width="400" height="300"></canvas>
            
            <!-- Measurement Display -->
            <div class="measurement-panel">
                <div class="measurement-item">
                    <span class="label">Incident Angle (θᵢ):</span>
                    <span id="incidentDisplay">30°</span>
                </div>
                <div class="measurement-item">
                    <span class="label">Reflected Angle (θᵣ):</span>
                    <span id="reflectedDisplay">30°</span>
                </div>
                <div class="law-statement">
                    <span id="lawCheck">θᵢ = θᵣ ✓</span>
                </div>
            </div>
        </div>

        <!-- Analytics Panel -->
        <div class="analytics-panel">
            <div class="analytics-header" title="Real-time learning analytics tracking your interactions">
                📊 Learning Analytics
            </div>
            <div class="analytics-content">
                <div class="stat-item">
                    <span class="stat-label">Interactions:</span>
                    <span id="interactionCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Angle Changes:</span>
                    <span id="angleChanges">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Surface Changes:</span>
                    <span id="surfaceChanges">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Time Spent:</span>
                    <span id="timeSpent">0s</span>
                </div>
            </div>
        </div>

        <!-- Tooltip for additional information -->
        <div id="tooltip" class="tooltip"></div>
    </div>

    <script src="script.js"></script>

</html>
