<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Express Fractions as Single Fraction</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main container with tooltip for header -->
    <div class="container" id="mainContainer">
        <!-- Tooltip for header information -->
        <div class="header-tooltip" id="headerTooltip">
            Express Fractions as Single Fraction - Interactive Practice
            <button class="close-tooltip" id="closeTooltip" aria-label="Close tooltip">×</button>
        </div>

        <!-- Main content area -->
        <div class="main-content">
            <!-- Left panel: Problem and controls -->
            <div class="problem-panel">
                <!-- Problem display -->
                <div class="problem-display" id="problemDisplay">
                    <div class="problem-text" id="problemText"></div>
                </div>

                <!-- Visual representation -->
                <div class="visual-container">
                    <canvas id="visualCanvas" width="400" height="200"></canvas>
                </div>

                <!-- Control buttons -->
                <div class="controls">
                    <button class="btn btn-primary" id="newProblemBtn">New Problem</button>
                    <button class="btn btn-secondary" id="showHintBtn">Show Hint</button>
                    <button class="btn btn-secondary" id="showStepsBtn">Show Steps</button>
                    <button class="btn btn-success" id="checkAnswerBtn">Check Answer</button>
                </div>

                <!-- Difficulty selector -->
                <div class="difficulty-selector">
                    <label for="difficultyLevel">Difficulty:</label>
                    <select id="difficultyLevel">
                        <option value="easy">Easy (Simple fractions)</option>
                        <option value="medium" selected>Medium (Mixed operations)</option>
                        <option value="hard">Hard (Complex expressions)</option>
                    </select>
                </div>

                <!-- Answer input area -->
                <div class="answer-input-section">
                    <div class="input-label">Your Answer:</div>
                    <div class="fraction-input">
                        <input type="number" id="numeratorInput" placeholder="Numerator" aria-label="Numerator">
                        <div class="fraction-bar"></div>
                        <input type="number" id="denominatorInput" placeholder="Denominator" aria-label="Denominator">
                    </div>
                    <div class="feedback-message" id="feedbackMessage"></div>
                </div>

                <!-- Hint panel -->
                <div class="hint-panel hidden" id="hintPanel">
                    <div class="hint-header">
                        <span>💡 Hint</span>
                        <button class="close-btn" id="closeHintBtn" aria-label="Close hint">×</button>
                    </div>
                    <div class="hint-content" id="hintContent"></div>
                </div>

                <!-- Steps panel -->
                <div class="steps-panel hidden" id="stepsPanel">
                    <div class="steps-header">
                        <span>📝 Step-by-Step Solution</span>
                        <button class="close-btn" id="closeStepsBtn" aria-label="Close steps">×</button>
                    </div>
                    <div class="steps-content" id="stepsContent"></div>
                </div>
            </div>

            <!-- Right panel: Analytics -->
            <div class="analytics-panel" id="analyticsPanel">
                <div class="analytics-header">
                    <span>📊 Learning Analytics</span>
                    <button class="toggle-analytics" id="toggleAnalytics" aria-label="Toggle analytics">−</button>
                </div>
                <div class="analytics-content" id="analyticsContent">
                    <div class="analytics-stats">
                        <div class="stat-item">
                            <span class="stat-label">Problems Attempted:</span>
                            <span class="stat-value" id="problemsAttempted">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Correct Answers:</span>
                            <span class="stat-value" id="correctAnswers">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Accuracy:</span>
                            <span class="stat-value" id="accuracy">0%</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Input Device:</span>
                            <span class="stat-value" id="inputDevice">Detecting...</span>
                        </div>
                    </div>
                    <div class="action-log-header">
                        <span>Action Log</span>
                        <button class="btn-small" id="clearLogBtn">Clear Log</button>
                    </div>
                    <div class="action-log" id="actionLog"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
