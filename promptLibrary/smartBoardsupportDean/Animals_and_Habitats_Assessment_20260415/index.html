<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animals and Habitats Assessment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main container that adapts to iframe or standalone -->
    <div id="mainContainer">
        
        <!-- Tooltip for header information (appears on hover/tap) -->
        <div id="headerTooltip" class="tooltip hidden">
            <button class="close-btn" id="closeTooltip" aria-label="Close tooltip">✕</button>
            <h3>Animals and Habitats Assessment</h3>
            <p>Drag each animal to its correct habitat. Get immediate feedback and learn about where different animals live!</p>
        </div>

        <!-- Info button to show header tooltip -->
        <button id="infoBtn" class="info-button" aria-label="Show information">ℹ️ Instructions</button>

        <!-- Progress indicator -->
        <div id="progressContainer">
            <div class="progress-label">Progress: <span id="progressText">0/12</span></div>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <!-- Main interaction area -->
        <div id="interactionArea">
            
            <!-- Animal cards pool (draggable items) -->
            <div id="animalPool" class="animal-pool">
                <div class="pool-label">Animals to Sort:</div>
                <div id="animalCards" class="animal-cards-container">
                    <!-- Animal cards will be dynamically generated here -->
                </div>
            </div>

            <!-- Habitat zones (drop targets) -->
            <div id="habitatZones" class="habitat-zones">
                <!-- Habitat zones will be dynamically generated here -->
            </div>

        </div>

        <!-- Control buttons -->
        <div id="controlButtons">
            <button id="submitBtn" class="control-btn submit-btn">Submit All Answers</button>
            <button id="tryAgainBtn" class="control-btn try-again-btn hidden">Try Again (Reset Incorrect)</button>
            <button id="resetBtn" class="control-btn reset-btn">Reset All</button>
        </div>

        <!-- Score display -->
        <div id="scoreDisplay" class="score-display hidden">
            <span id="scoreText"></span>
        </div>

        <!-- Feedback message area -->
        <div id="feedbackMessage" class="feedback-message hidden"></div>

        <!-- Analytics panel (collapsible) -->
        <div id="analyticsPanel" class="analytics-panel collapsed">
            <button id="toggleAnalytics" class="toggle-analytics-btn">📊 Show Analytics</button>
            <div id="analyticsContent" class="analytics-content hidden">
                <div class="analytics-header">
                    <h4>Learning Analytics Log</h4>
                    <button id="clearLog" class="clear-log-btn">Clear Log</button>
                </div>
                <div class="device-info">
                    <strong>Device Type:</strong> <span id="deviceType">Detecting...</span>
                </div>
                <div id="analyticsLog" class="analytics-log">
                    <!-- Log entries will be added here -->
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
