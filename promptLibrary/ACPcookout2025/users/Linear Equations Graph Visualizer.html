<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Equations Graph Visualizer</title>
    <link rel="stylesheet" href="./Linear Equations Graph Visualizer_files/styles.css">
</head>
<body>
    <!-- Main container with tooltip for header information -->
    <div class="container" title="Linear Equations Graph Visualizer - Explore how equations relate to graphs by adjusting parameters">
        
        <!-- Control panel for equation parameters -->
        <div class="control-panel">
            <!-- Equation display -->
            <div class="equation-display">
                <span class="equation-text">y = <span id="slope-value">1.0</span>x + <span id="intercept-value">0.0</span></span>
            </div>
            
            <!-- Parameter controls -->
            <div class="controls-grid">
                <!-- Slope control -->
                <div class="control-group">
                    <label for="slope-slider" title="Slope (m) - Controls the steepness of the line">m:</label>
                    <input type="range" id="slope-slider" min="-5" max="5" step="0.1" value="1" class="slider">
                    <input type="number" id="slope-input" min="-5" max="5" step="0.1" value="1" class="number-input">
                </div>
                
                <!-- Y-intercept control -->
                <div class="control-group">
                    <label for="intercept-slider" title="Y-intercept (c) - Where the line crosses the y-axis">c:</label>
                    <input type="range" id="intercept-slider" min="-10" max="10" step="0.5" value="0" class="slider">
                    <input type="number" id="intercept-input" min="-10" max="10" step="0.5" value="0" class="number-input">
                </div>
            </div>
            
            <!-- Action buttons -->
            <div class="button-group">
                <button id="reset-btn" class="action-btn" title="Reset to default values">Reset</button>
                <button id="random-btn" class="action-btn" title="Generate random equation">Random</button>
                <button id="grid-toggle" class="action-btn" title="Toggle grid visibility">Grid</button>
            </div>
        </div>
        
        <!-- Graph canvas container -->
        <div class="graph-container">
            <canvas id="graph-canvas" width="1614" height="874" style="width: 1614px; height: 874.797px;"></canvas>
            
            <!-- Coordinate display -->
            <div id="coordinate-display" class="coordinate-info">
                <span id="mouse-coords">(-4.2, 10.5)</span>
            </div>
            
            <!-- Zoom controls -->
            <div class="zoom-controls">
                <button id="zoom-in" class="zoom-btn" title="Zoom in">+</button>
                <button id="zoom-out" class="zoom-btn" title="Zoom out">−</button>
                <button id="zoom-reset" class="zoom-btn" title="Reset zoom">⌂</button>
            </div>
        </div>
        
        <!-- Information panel -->
        <div class="info-panel">
            <div class="info-item">
                <span class="info-label">Slope:</span>
                <span id="slope-description" style="color: rgb(16, 185, 129);">Positive - line goes up</span>
            </div>
            <div class="info-item">
                <span class="info-label">Y-intercept:</span>
                <span id="intercept-description">Line crosses y-axis at 0.0</span>
            </div>
        </div>
    </div>
    
    <script src="./Linear Equations Graph Visualizer_files/script.js"></script>
