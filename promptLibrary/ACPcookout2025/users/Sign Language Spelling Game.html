<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Spelling Game</title>
    <link rel="stylesheet" href="./Sign Language Spelling Game_files/styles.css">
</head>
<body>
    <!-- Main game container with responsive height -->
    <div class="game-container" id="gameContainer" style="height: 90vh;">
        
        <!-- Top status bar with progress tracking -->
        <div class="status-bar">
            <div class="level-display" title="Current Level">
                <span>Level: <span id="currentLevel">1</span></span>
            </div>
            <div class="score-display" title="Current Score">
                <span>Score: <span id="currentScore">0</span></span>
            </div>
            <div class="progress-bar" title="Progress to Next Level">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Main game area -->
        <div class="game-area">
            
            <!-- Word display section with image and current word -->
            <div class="word-section">
                <div class="word-image" id="wordImage" title="Word to spell"><div class="image-placeholder">🐶</div></div>
                <div class="word-display">
                    <div class="word-blanks" id="wordBlanks"><div class="word-blank current"></div><div class="word-blank"></div><div class="word-blank"></div></div>
                    <div class="word-hint" id="wordHint">A loyal pet that barks</div>
                </div>
            </div>

            <!-- Letter selection grid based on Singapore Sign Language -->
            <div class="letter-grid" id="letterGrid">
                <!-- Letters A-Z with sign language representations -->
                <button class="letter-btn" data-letter="A" title="Letter A Sign">
                    <div class="sign-image">✊</div>
                    <div class="letter-text">A</div>
                </button>
                <button class="letter-btn" data-letter="B" title="Letter B Sign">
                    <div class="sign-image">🖐️</div>
                    <div class="letter-text">B</div>
                </button>
                <button class="letter-btn" data-letter="C" title="Letter C Sign">
                    <div class="sign-image">👌</div>
                    <div class="letter-text">C</div>
                </button>
                <button class="letter-btn" data-letter="D" title="Letter D Sign">
                    <div class="sign-image">👆</div>
                    <div class="letter-text">D</div>
                </button>
                <button class="letter-btn" data-letter="E" title="Letter E Sign">
                    <div class="sign-image">✊</div>
                    <div class="letter-text">E</div>
                </button>
                <button class="letter-btn" data-letter="F" title="Letter F Sign">
                    <div class="sign-image">👌</div>
                    <div class="letter-text">F</div>
                </button>
                <button class="letter-btn" data-letter="G" title="Letter G Sign">
                    <div class="sign-image">👉</div>
                    <div class="letter-text">G</div>
                </button>
                <button class="letter-btn" data-letter="H" title="Letter H Sign">
                    <div class="sign-image">👉</div>
                    <div class="letter-text">H</div>
                </button>
                <button class="letter-btn" data-letter="I" title="Letter I Sign">
                    <div class="sign-image">🤙</div>
                    <div class="letter-text">I</div>
                </button>
                <button class="letter-btn" data-letter="J" title="Letter J Sign">
                    <div class="sign-image">🤙</div>
                    <div class="letter-text">J</div>
                </button>
                <button class="letter-btn" data-letter="K" title="Letter K Sign">
                    <div class="sign-image">✌️</div>
                    <div class="letter-text">K</div>
                </button>
                <button class="letter-btn" data-letter="L" title="Letter L Sign">
                    <div class="sign-image">👆</div>
                    <div class="letter-text">L</div>
                </button>
                <button class="letter-btn" data-letter="M" title="Letter M Sign">
                    <div class="sign-image">✊</div>
                    <div class="letter-text">M</div>
                </button>
                <button class="letter-btn" data-letter="N" title="Letter N Sign">
                    <div class="sign-image">✊</div>
                    <div class="letter-text">N</div>
                </button>
                <button class="letter-btn" data-letter="O" title="Letter O Sign">
                    <div class="sign-image">👌</div>
                    <div class="letter-text">O</div>
                </button>
                <button class="letter-btn" data-letter="P" title="Letter P Sign">
                    <div class="sign-image">👆</div>
                    <div class="letter-text">P</div>
                </button>
                <button class="letter-btn" data-letter="Q" title="Letter Q Sign">
                    <div class="sign-image">👌</div>
                    <div class="letter-text">Q</div>
                </button>
                <button class="letter-btn" data-letter="R" title="Letter R Sign">
                    <div class="sign-image">🤞</div>
                    <div class="letter-text">R</div>
                </button>
                <button class="letter-btn" data-letter="S" title="Letter S Sign">
                    <div class="sign-image">✊</div>
                    <div class="letter-text">S</div>
                </button>
                <button class="letter-btn" data-letter="T" title="Letter T Sign">
                    <div class="sign-image">✊</div>
                    <div class="letter-text">T</div>
                </button>
                <button class="letter-btn" data-letter="U" title="Letter U Sign">
                    <div class="sign-image">✌️</div>
                    <div class="letter-text">U</div>
                </button>
                <button class="letter-btn" data-letter="V" title="Letter V Sign">
                    <div class="sign-image">✌️</div>
                    <div class="letter-text">V</div>
                </button>
                <button class="letter-btn" data-letter="W" title="Letter W Sign">
                    <div class="sign-image">🤟</div>
                    <div class="letter-text">W</div>
                </button>
                <button class="letter-btn" data-letter="X" title="Letter X Sign">
                    <div class="sign-image">👆</div>
                    <div class="letter-text">X</div>
                </button>
                <button class="letter-btn" data-letter="Y" title="Letter Y Sign">
                    <div class="sign-image">🤙</div>
                    <div class="letter-text">Y</div>
                </button>
                <button class="letter-btn" data-letter="Z" title="Letter Z Sign">
                    <div class="sign-image">👆</div>
                    <div class="letter-text">Z</div>
                </button>
            </div>

        </div>

        <!-- Action buttons -->
        <div class="action-buttons">
            <button class="action-btn" id="clearBtn" title="Clear current word">Clear</button>
            <button class="action-btn" id="submitBtn" title="Submit your answer">Submit</button>
            <button class="action-btn" id="skipBtn" title="Skip this word">Skip</button>
        </div>

        <!-- Avatar and inventory section -->
        <div class="avatar-section" id="avatarSection">
            <div class="avatar-display" title="Your Avatar">
                <div class="avatar" id="avatar">👤</div>
                <div class="avatar-accessories" id="avatarAccessories"></div>
            </div>
            <button class="inventory-btn" id="inventoryBtn" title="Open Inventory">👜</button>
        </div>

        <!-- Feedback modal for correct/incorrect responses -->
        <div class="feedback-modal" id="feedbackModal">
            <div class="feedback-content">
                <div class="feedback-message" id="feedbackMessage"></div>
                <button class="feedback-btn" id="nextBtn">Next Word</button>
            </div>
        </div>

        <!-- Inventory modal -->
        <div class="inventory-modal" id="inventoryModal">
            <div class="inventory-content">
                <div class="inventory-header">
                    <h3>Inventory</h3>
                    <button class="close-btn" id="closeInventoryBtn">×</button>
                </div>
                <div class="inventory-grid" id="inventoryGrid"><div class="inventory-item locked" data-accessory-id="hat" title="Top Hat (Unlock at Level 2)">🎩</div><div class="inventory-item locked" data-accessory-id="glasses" title="Glasses (Unlock at Level 3)">🤓</div><div class="inventory-item locked" data-accessory-id="crown" title="Crown (Unlock at Level 4)">👑</div><div class="inventory-item locked" data-accessory-id="bow" title="Bow Tie (Unlock at Level 5)">🎀</div><div class="inventory-item locked" data-accessory-id="medal" title="Medal (Unlock at Level 6)">🏅</div></div>
            </div>
        </div>

        <!-- Tooltip for displaying information -->
        <div class="tooltip" id="tooltip"></div>

    </div>

    <script src="./Sign Language Spelling Game_files/script.js"></script>
