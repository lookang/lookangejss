<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Nearest Neighbor Algorithm Visualization</title>
    <link rel="stylesheet" href="./K-Nearest Neighbor Algorithm Visualization_files/styles.css">
</head>
<body>
    <!-- Main container with tooltip for header information -->
    <div class="container" title="K-Nearest Neighbor Algorithm Visualization - Interactive learning tool for understanding KNN classification">
        
        <!-- Control panel for parameter adjustments -->
        <div class="control-panel">
            <!-- K value slider with visual feedback -->
            <div class="control-group">
                <label for="k-slider" title="Number of nearest neighbors to consider for classification">K Value: <span id="k-value">3</span></label>
                <input type="range" id="k-slider" min="1" max="15" value="3" class="slider">
            </div>

            <!-- Number of data points control -->
            <div class="control-group">
                <label for="points-slider" title="Total number of training data points">Data Points: <span id="points-value">50</span></label>
                <input type="range" id="points-slider" min="20" max="100" value="50" class="slider">
            </div>

            <!-- Category selection for classification -->
            <div class="control-group">
                <label for="categories" title="Number of different classes/categories">Categories: <span id="categories-value">3</span></label>
                <input type="range" id="categories" min="2" max="5" value="3" class="slider">
            </div>

            <!-- Action buttons with appropriate sizing -->
            <div class="button-group">
                <button id="randomize-btn" title="Generate new random data points">Randomize Data</button>
                <button id="reset-btn" title="Reset all parameters to default values">Reset</button>
                <button id="toggle-3d-btn" title="Switch between 2D and 3D visualization">Toggle 3D</button>
            </div>
        </div>

        <!-- Visualization canvas area -->
        <div class="visualization-container">
            <canvas id="visualization-canvas" width="1904" height="715"></canvas>
            
            <!-- Test point input panel -->
            <div class="test-input-panel">
                <div class="input-group">
                    <label title="X coordinate of test point">X:</label>
                    <input type="number" id="test-x" value="0" step="0.1" min="-10" max="10">
                </div>
                <div class="input-group">
                    <label title="Y coordinate of test point">Y:</label>
                    <input type="number" id="test-y" value="0" step="0.1" min="-10" max="10">
                </div>
                <div class="input-group" id="test-z-group" style="display: none;">
                    <label title="Z coordinate of test point (3D mode only)">Z:</label>
                    <input type="number" id="test-z" value="0" step="0.1" min="-10" max="10">
                </div>
                <button id="classify-btn" title="Classify the test point using KNN algorithm">Classify</button>
            </div>

            <!-- Results display with classification outcome -->
            <div class="results-panel">
                <div id="classification-result" title="Shows the predicted class and confidence">
                    Click "Classify" to see prediction
                </div>
                <div id="nearest-neighbors" title="Details about the K nearest neighbors used for classification"></div>
            </div>
        </div>

        <!-- 3D controls (hidden by default) -->
        <div class="rotation-controls" id="rotation-controls" style="display: none;">
            <div class="control-group">
                <label title="Rotate visualization around X-axis">Rotate X:</label>
                <input type="range" id="rotate-x" min="0" max="360" value="45" class="slider">
            </div>
            <div class="control-group">
                <label title="Rotate visualization around Y-axis">Rotate Y:</label>
                <input type="range" id="rotate-y" min="0" max="360" value="45" class="slider">
            </div>
            <!-- Added Z-axis rotation control -->
            <div class="control-group">
                <label title="Rotate visualization around Z-axis">Rotate Z:</label>
                <input type="range" id="rotate-z" min="0" max="360" value="0" class="slider">
            </div>
            <div class="control-group">
                <label title="Scale/zoom the visualization">Scale:</label>
                <input type="range" id="scale-slider" min="0.5" max="3" value="1" step="0.1" class="slider">
            </div>
        </div>
    </div>

    <script src="./K-Nearest Neighbor Algorithm Visualization_files/script.js"></script>
