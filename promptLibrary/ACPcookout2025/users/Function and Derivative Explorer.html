<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function and Derivative Explorer</title>
    <link rel="stylesheet" href="./Function and Derivative Explorer_files/styles.css">
</head>
<body>
    <!-- Main container with tooltip for header information -->
    <div class="container" title="Function and Derivative Explorer - Explore how changing parameters affects functions and their derivatives">
        
        <!-- Control panel for function parameters and settings -->
        <div class="control-panel">
            <!-- Function type selector -->
            <div class="control-group">
                <label for="functionType">Function:</label>
                <select id="functionType">
                    <option value="quadratic">f(x) = ax² + bx + c</option>
                    <option value="cubic">f(x) = ax³ + bx² + cx + d</option>
                    <option value="sine">f(x) = a·sin(bx + c) + d</option>
                    <option value="exponential">f(x) = a·e^(bx) + c</option>
                </select>
            </div>

            <!-- Parameter sliders container -->
            <div class="sliders-container">
                <div class="slider-group">
                    <label for="paramA">a: <span id="valueA">1</span></label>
                    <input type="range" id="paramA" min="-5" max="5" step="0.1" value="1">
                </div>
                <div class="slider-group">
                    <label for="paramB">b: <span id="valueB">0</span></label>
                    <input type="range" id="paramB" min="-5" max="5" step="0.1" value="0">
                </div>
                <div class="slider-group">
                    <label for="paramC">c: <span id="valueC">0</span></label>
                    <input type="range" id="paramC" min="-5" max="5" step="0.1" value="0">
                </div>
                <div class="slider-group" id="paramDGroup" style="display: none;">
                    <label for="paramD">d: <span id="valueD">0</span></label>
                    <input type="range" id="paramD" min="-5" max="5" step="0.1" value="0">
                </div>
            </div>

            <!-- Toggle buttons for showing/hiding functions -->
            <div class="toggle-group">
                <button id="toggleFunction" class="toggle-btn active">Show f(x)</button>
                <button id="toggleDerivative" class="toggle-btn active">Show f'(x)</button>
                <button id="togglePoints" class="toggle-btn">Show Points</button>
            </div>

            <!-- Zoom and scale controls -->
            <div class="control-group">
                <button id="zoomIn" class="control-btn">Zoom In</button>
                <button id="zoomOut" class="control-btn">Zoom Out</button>
                <button id="resetView" class="control-btn">Reset View</button>
            </div>
        </div>

        <!-- Graph container with two canvases stacked vertically -->
        <div class="graph-container">
            <!-- Original function graph -->
            <div class="graph-wrapper">
                <canvas id="functionCanvas" width="1888" height="379" style="width: 1888px; height: 379.398px;"></canvas>
                <div class="graph-label">f(x)</div>
            </div>
            
            <!-- Derivative function graph -->
            <div class="graph-wrapper">
                <canvas id="derivativeCanvas" width="1888" height="379" style="width: 1888px; height: 379.398px;"></canvas>
                <div class="graph-label">f'(x)</div>
            </div>
        </div>

        <!-- Information panel for displaying coordinates and values -->
        <div class="info-panel">
            <div id="mouseInfo">x: -2.27, f(x): 5.18</div>
            <div id="equationDisplay">f(x) = 1.0x² + 0.0x + 0.0</div>
            <div id="derivativeDisplay">f'(x) = 2.0x + 0.0</div>
        </div>
    </div>

    <script src="./Function and Derivative Explorer_files/script.js"></script>
