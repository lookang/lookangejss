<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Graph Explorer</title>
    <link rel="stylesheet" href="./Function Graph Explorer_files/styles.css">
</head>
<body>
    <!-- Main container with tooltip for header information -->
    <div id="main-container" title="Function Graph Explorer - Explore power and exponential functions by adjusting parameters">
        
        <!-- Control Panel -->
        <div id="control-panel">
            <!-- Function Type Selector -->
            <div class="control-group">
                <label for="function-type">Function Type:</label>
                <select id="function-type">
                    <option value="power">Power Functions (y = kx^n)</option>
                    <option value="exponential">Exponential Functions (y = ka^x)</option>
                </select>
            </div>

            <!-- Parameter Controls for Power Functions -->
            <div id="power-controls" class="parameter-controls">
                <div class="slider-group">
                    <label for="k-power">k = <span id="k-power-value">1</span></label>
                    <input type="range" id="k-power" min="-5" max="5" step="0.1" value="1">
                </div>
                <div class="slider-group">
                    <label for="n-power">n = <span id="n-power-value">2</span></label>
                    <input type="range" id="n-power" min="-2" max="3" step="1" value="2">
                </div>
                <div class="equation-display">
                    <span id="power-equation">y = x²</span>
                </div>
            </div>

            <!-- Parameter Controls for Exponential Functions -->
            <div id="exponential-controls" class="parameter-controls" style="display: none;">
                <div class="slider-group">
                    <label for="k-exp">k = <span id="k-exp-value">1</span></label>
                    <input type="range" id="k-exp" min="-5" max="5" step="0.1" value="1">
                </div>
                <div class="slider-group">
                    <label for="a-exp">a = <span id="a-exp-value">2</span></label>
                    <input type="range" id="a-exp" min="1" max="5" step="1" value="2">
                </div>
                <div class="equation-display">
                    <span id="exp-equation">y = 1(2)^x</span>
                </div>
            </div>

            <!-- Graph Controls -->
            <div class="control-group">
                <div class="button-group">
                    <button id="zoom-in" title="Zoom In">🔍+</button>
                    <button id="zoom-out" title="Zoom Out">🔍-</button>
                    <button id="reset-view" title="Reset View">⌂</button>
                    <button id="toggle-grid" title="Toggle Grid">⊞</button>
                </div>
            </div>

            <!-- Custom Equation Input -->
            <div class="control-group">
                <label for="custom-equation">Custom Equation:</label>
                <input type="text" id="custom-equation" placeholder="e.g., 2x^3 or 3(2)^x">
                <button id="plot-custom">Plot</button>
            </div>
        </div>

        <!-- Graph Container -->
        <div id="graph-container">
            <canvas id="graph-canvas" width="1610" height="872"></canvas>
            
            <!-- Coordinate Display -->
            <div id="coordinate-display" style="display: block;">
                <span id="coord-text">(5.35, -1.57)</span>
            </div>
        </div>

        <!-- Function Legend -->
        <div id="function-legend">
            <div class="legend-item">
                <span class="legend-color" style="background-color: #e74c3c;"></span>
                <span class="legend-text" id="main-function">y = x²</span>
                <button class="toggle-function" data-function="main">👁</button>
            </div>
            <div class="legend-item" id="custom-legend" style="display: none;">
                <span class="legend-color" style="background-color: #3498db;"></span>
                <span class="legend-text" id="custom-function">Custom</span>
                <button class="toggle-function" data-function="custom">👁</button>
            </div>
        </div>
    </div>

    <script src="./Function Graph Explorer_files/script.js"></script>
