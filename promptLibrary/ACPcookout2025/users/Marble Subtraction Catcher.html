<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marble Subtraction Catcher</title>
    <link rel="stylesheet" href="./Marble Subtraction Catcher_files/styles.css">
</head>
<body>
    <!-- Main game container with tooltip for header information -->
    <div class="game-container" title="Marble Subtraction Catcher - Practice subtraction facts for numbers to 10">
        
        <!-- Game header with score and question display -->
        <div class="game-header">
            <div class="score-display">
                <span class="score-label">Score:</span>
                <span class="score-value" id="scoreValue">0</span>
            </div>
            <div class="question-display" id="questionDisplay">
                <span class="question-text" id="questionText">5 - 5 = ?</span>
            </div>
            <div class="lives-display">
                <span class="lives-label">Lives:</span>
                <span class="lives-value" id="livesValue">❤️❤️❤️</span>
            </div>
        </div>

        <!-- Game area where marbles fall and basket is positioned -->
        <div class="game-area" id="gameArea">
            <!-- Falling marbles will be dynamically created here -->
            
            <!-- Basket catcher at the bottom -->
            <div class="basket" id="tinCan">
                <div class="basket-face" id="canFace">😊</div>
                <!-- Added basket visual elements -->
                <div class="basket-rim"></div>
                <div class="basket-handle-left"></div>
                <div class="basket-handle-right"></div>
            </div>
        </div>

        <!-- Game controls and feedback -->
        <div class="game-controls">
            <button class="start-btn" id="startBtn">Start Game</button>
            <button class="pause-btn" id="pauseBtn" style="display: none;">Pause</button>
            <div class="feedback-message" id="feedbackMessage"></div>
        </div>

        <!-- Game over screen -->
        <div class="game-over" id="gameOver" style="display: none;">
            <div class="game-over-content">
                <h2>Great Job! 🎉</h2>
                <p>Final Score: <span id="finalScore">0</span></p>
                <button class="restart-btn" id="restartBtn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="./Marble Subtraction Catcher_files/script.js"></script>
