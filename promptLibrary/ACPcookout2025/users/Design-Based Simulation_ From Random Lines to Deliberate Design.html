<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design-Based Simulation: From Random Lines to Deliberate Design</title>
    <link rel="stylesheet" href="./Design-Based Simulation_ From Random Lines to Deliberate Design_files/styles.css">
<style>
    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-10px); }
        60% { transform: translateY(-5px); }
    }
</style></head>
<body>
    <!-- Main container with tooltip for header -->
    <div class="container" title="Design-Based Simulation: From Random Lines to Deliberate Design - Transform spontaneous sketches into purposeful design ideas">
        
        <!-- Left Panel: Tools and Controls -->
        <div class="left-panel">
            <!-- Pen Mode Toggle -->
            <div class="tool-section">
                <div class="tool-group">
                    <button id="randomPen" class="pen-btn active" title="Random Pen: Generates straight lines in varied lengths, directions, and opacities">
                        <span class="icon">🎲</span>Random Pen
                    </button>
                    <button id="designPen" class="pen-btn" title="Design Pen: Allows precise tracing and refinement of emergent shapes">
                        <span class="icon">✏️</span>Design Pen
                    </button>
                </div>
            </div>

            <!-- Random Line Controls -->
            <div class="tool-section" id="randomControls">
                <div class="control-group">
                    <label for="density" title="Adjust how many random lines are generated">Density:</label>
                    <input type="range" id="density" min="1" max="10" value="5">
                    <span id="densityValue">5</span>
                </div>
                <div class="control-group">
                    <label for="lineLength" title="Control the length of random lines">Length:</label>
                    <input type="range" id="lineLength" min="20" max="200" value="100">
                    <span id="lengthValue">100</span>
                </div>
                <div class="control-group">
                    <label for="opacity" title="Adjust transparency of random lines">Opacity:</label>
                    <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.7">
                    <span id="opacityValue">0.7</span>
                </div>
            </div>

            <!-- Additional Tools -->
            <div class="tool-section">
                <div class="tool-group">
                    <button id="eraser" class="tool-btn" title="Eraser: Clean intersections and unwanted lines">
                        <span class="icon">🧽</span>Eraser
                    </button>
                    <button id="smudge" class="tool-btn" title="Smudge Tool: Soften intersections">
                        <span class="icon">👆</span>Smudge
                    </button>
                </div>
            </div>

            <!-- Color Palette -->
            <div class="tool-section">
                <label class="section-label">Colors:</label>
                <div class="color-palette">
                    <div class="color-option active" data-color="#000000" style="background: #000000" title="Black"></div>
                    <div class="color-option" data-color="#FF0000" style="background: #FF0000" title="Red"></div>
                    <div class="color-option" data-color="#00FF00" style="background: #00FF00" title="Green"></div>
                    <div class="color-option" data-color="#0000FF" style="background: #0000FF" title="Blue"></div>
                    <div class="color-option" data-color="#FFFF00" style="background: #FFFF00" title="Yellow"></div>
                    <div class="color-option" data-color="#FF00FF" style="background: #FF00FF" title="Magenta"></div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="tool-section">
                <button id="generateRandom" class="action-btn primary" title="Generate random lines on canvas">Generate Random Lines</button>
                <button id="shapeHint" class="action-btn" title="Highlight potential enclosed forms">Shape Detection Hint</button>
                <button id="animate" class="action-btn success" title="Convert final sketch into hyperrealistic AI-generated image">Animate Sketch</button>
                <button id="reset" class="action-btn danger" title="Clear canvas to start new exploration">Reset Canvas</button>
            </div>

            <!-- Zoom Controls -->
            <div class="tool-section">
                <div class="zoom-controls">
                    <button id="zoomIn" class="zoom-btn" title="Zoom in to examine details">+</button>
                    <span id="zoomLevel">100%</span>
                    <button id="zoomOut" class="zoom-btn" title="Zoom out for overview">-</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-container">
            <canvas id="mainCanvas" width="1488" height="876"></canvas>
            <div id="animationOverlay" class="animation-overlay hidden">
                <div id="animationContent"></div>
            </div>
        </div>

        <!-- Right Panel: Gallery and Reflection -->
        <div class="right-panel">
            <!-- Result Gallery -->
            <div class="gallery-section">
                <label class="section-label">Gallery:</label>
                <div id="gallery" class="gallery-grid"></div>
            </div>

            <!-- Reflection Box -->
            <div class="reflection-section">
                <label class="section-label">Reflection:</label>
                <textarea id="reflection" placeholder="Describe what you observed and created. How did randomness spark your ideas? What shape did you find?" title="Record your design thinking process"></textarea>
                <button id="saveReflection" class="action-btn" title="Save your reflection and current sketch">Save Entry</button>
            </div>

            <!-- Design Tips -->
            <div class="tips-section">
                <div class="tip-card" title="Design Thinking Principle">
                    <strong>💡 Tip:</strong> Find meaning in the mess — designers see possibilities where others see noise.
                </div>
            </div>
        </div>
    </div>

    <!-- Tooltip for center display -->
    <div id="centerTooltip" class="center-tooltip hidden">Welcome! Start by generating random lines, then use the Design Pen to trace shapes you discover.</div>

    <script src="./Design-Based Simulation_ From Random Lines to Deliberate Design_files/script.js"></script>

</body></html>
