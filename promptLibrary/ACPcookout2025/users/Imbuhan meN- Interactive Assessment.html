<html lang="ms"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imbuhan meN- Interactive Assessment</title>
    <link rel="stylesheet" href="./Imbuhan meN- Interactive Assessment_files/styles.css">
</head>
<body>
    <!-- Main container with tooltip for header information -->
    <div class="container" title="Penilaian Imbuhan meN-: Kategorikan kata dasar mengikut bentuk imbuhan yang betul">
        
        <!-- Added: Title section for Imbuhan meN- -->
        <div class="title-section">
            <h1>Imbuhan meN-</h1>
        </div>
        
        <!-- Control panel with mode toggle and utilities -->
        <div class="control-panel">
            <div class="mode-toggle">
                <button id="sortingMode" class="mode-btn active">Pengkategorian</button>
                <button id="sentenceMode" class="mode-btn">Ayat</button>
            </div>
            
            <div class="utilities">
                <div class="score-display">Skor: <span id="score">0</span></div>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill" style="width: 0%;"></div>
                    </div>
                </div>
                <button id="hintBtn" class="utility-btn">Petunjuk</button>
                <button id="undoBtn" class="utility-btn">Batal</button>
                <button id="resetBtn" class="utility-btn">Set Semula</button>
            </div>
        </div>

        <!-- Main content area -->
        <div class="main-content">
            
            <!-- Sorting Mode Interface -->
            <div id="sortingInterface" class="interface active">
                <!-- Drop zones for different meN- variants -->
                <div class="drop-zones">
                    <!-- Modified: Updated me- zone hint to include corrected transformations -->
                    <div class="drop-zone" data-category="me">
                        <div class="zone-header">me-</div>
                        <div class="zone-content"></div>
                        <div class="zone-hint">l, m, n, ng, ny, r, w, y, k→ng, t→n, p→m, s→ny</div>
                    </div>
                    
                    <div class="drop-zone" data-category="mem">
                        <div class="zone-header">mem-</div>
                        <div class="zone-content"></div>
                        <div class="zone-hint">b, f, v</div>
                    </div>
                    
                    <div class="drop-zone" data-category="men">
                        <div class="zone-header">men-</div>
                        <div class="zone-content"></div>
                        <div class="zone-hint">c, d, j, z</div>
                    </div>
                    
                    <div class="drop-zone" data-category="meng">
                        <div class="zone-header">meng-</div>
                        <div class="zone-content"></div>
                        <div class="zone-hint">g, h, vokal</div>
                    </div>
                    
                    <div class="drop-zone" data-category="menge">
                        <div class="zone-header">menge-</div>
                        <div class="zone-content"></div>
                        <div class="zone-hint">satu suku kata</div>
                    </div>
                </div>
                
                <!-- Word bank for draggable items -->
                <div class="word-bank">
                    <div class="bank-header">Bank Kata</div>
                    <div id="wordCards" class="word-cards"><div class="word-card" draggable="true" data-word-index="0" data-correct-category="mem">beli</div><div class="word-card" draggable="true" data-word-index="1" data-correct-category="meng">guna</div><div class="word-card" draggable="true" data-word-index="2" data-correct-category="menge">bom</div><div class="word-card" draggable="true" data-word-index="3" data-correct-category="meng">emas</div><div class="word-card" draggable="true" data-word-index="4" data-correct-category="me">kira</div><div class="word-card" draggable="true" data-word-index="5" data-correct-category="mem">veto</div><div class="word-card" draggable="true" data-word-index="6" data-correct-category="mem">baca</div><div class="word-card" draggable="true" data-word-index="7" data-correct-category="me">yakin</div><div class="word-card" draggable="true" data-word-index="8" data-correct-category="men">cari</div><div class="word-card" draggable="true" data-word-index="9" data-correct-category="me">lihat</div><div class="word-card" draggable="true" data-word-index="10" data-correct-category="meng">ganti</div><div class="word-card" draggable="true" data-word-index="11" data-correct-category="men">dapat</div><div class="word-card" draggable="true" data-word-index="12" data-correct-category="menge">cop</div><div class="word-card" draggable="true" data-word-index="13" data-correct-category="me">siram</div><div class="word-card" draggable="true" data-word-index="14" data-correct-category="men">dengar</div></div>
                </div>
            </div>

            <!-- Sentence Mode Interface -->
            <div id="sentenceInterface" class="interface">
                <div class="sentence-container">
                    <div id="sentenceQuestion" class="sentence-question"></div>
                    <div id="sentenceOptions" class="sentence-options"></div>
                </div>
            </div>
        </div>

        <!-- Feedback and results area -->
        <div id="feedbackArea" class="feedback-area"></div>
        
        <!-- Results modal -->
        <div id="resultsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">Keputusan Penilaian</div>
                <div id="resultsContent" class="results-content"></div>
                <button id="closeResults" class="modal-btn">Tutup</button>
            </div>
        </div>

        <!-- Hint modal -->
        <div id="hintModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">Petunjuk</div>
                <div id="hintContent" class="hint-content"></div>
                <button id="closeHint" class="modal-btn">Tutup</button>
            </div>
        </div>

        <!-- REMOVED: Tooltip element completely removed -->
    </div>

    <script src="./Imbuhan meN- Interactive Assessment_files/script.js"></script>

</body></html>
