<body>
    <!-- Main container with tooltip for header information -->
    <div class="container" title="Listen and Choose: Past Tense Verbs Quiz - Choose the correct past tense verb form after listening to the sentence">
        
        <!-- Progress section -->
        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
            <span class="progress-text" id="progressText">Question 1 of 8</span>
        </div>

        <!-- Audio control section -->
        <div class="audio-section">
            <button class="audio-btn" id="playAudioBtn" title="Click to play the sentence">
                <span class="audio-icon">🔊</span>
                <span class="audio-text">Listen to the sentence</span>
            </button>
            <button class="replay-btn" id="replayBtn" title="Replay the sentence">
                <span class="replay-icon">↻</span>
            </button>
        </div>

        <!-- Question instruction -->
        <div class="instruction" title="Choose the verb form that matches what you heard in the sentence">
            Choose the correct verb form:
        </div>

        <!-- Answer choices section -->
        <div class="choices-section" id="choicesSection"><button class="choice-btn">walk</button><button class="choice-btn">walked</button><button class="choice-btn">walking</button></div>

        <!-- Feedback section -->
        <div class="feedback-section" id="feedbackSection">
            <div class="feedback-message" id="feedbackMessage"></div>
            <div class="hint-message" id="hintMessage"></div>
        </div>

        <!-- Action buttons -->
        <div class="action-buttons" id="actionButtons">
            <button class="try-again-btn" id="tryAgainBtn" style="display: none;">Try Again</button>
            <button class="next-btn" id="nextBtn" style="display: none;">Next Question</button>
        </div>

        <!-- Final score section -->
        <div class="score-section" id="scoreSection" style="display: none;">
            <div class="score-display">
                <h2>Quiz Complete!</h2>
                <div class="final-score" id="finalScore"></div>
                <div class="score-message" id="scoreMessage"></div>
                <button class="restart-btn" id="restartBtn">Try Again</button>
            </div>
        </div>

        <!-- Hidden audio element -->
        <audio id="audioPlayer" preload="auto"></audio>
    </div>
