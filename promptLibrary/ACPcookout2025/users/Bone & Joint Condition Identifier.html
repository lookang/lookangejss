<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bone &amp; Joint Condition Identifier</title>
    <link rel="stylesheet" href="./Bone &amp; Joint Condition Identifier_files/styles.css">
</head>
<body>
    <!-- Main game container with responsive height -->
    <div class="game-container" id="gameContainer">
        
        <!-- Game header with stats -->
        <div class="game-header">
            <!-- Score display with tooltip -->
            <div class="stat-item" title="Your current score">
                <span class="stat-label">Score:</span>
                <span class="stat-value" id="score">0</span>
            </div>
            
            <!-- Lives display with heart icons -->
            <div class="stat-item" title="Lives remaining">
                <span class="stat-label">Lives:</span>
                <div class="hearts-container" id="heartsContainer">
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                </div>
            </div>
            
            <!-- Timer display -->
            <div class="stat-item" title="Time remaining for this question">
                <span class="stat-label">Time:</span>
                <span class="stat-value timer" id="timer" style="background: rgba(255, 255, 255, 0.2);">5</span>
            </div>
        </div>

        <!-- Main game area -->
        <div class="game-main">
            <!-- Diagram display area -->
            <div class="diagram-container" data-original-title="">
                <div class="diagram-placeholder" id="diagramArea">
                    <div class="diagram-content" id="diagramContent">
                        <!-- Diagram will be displayed here -->
                        <div class="loading-text">Click Start Game to begin!</div>
                    </div>
                </div>
            </div>

            <!-- Answer buttons grid -->
            <div class="answers-container">
                <button class="answer-btn" id="btn-osteoporosis" data-condition="osteoporosis">
                    Osteoporosis
                </button>
                <button class="answer-btn" id="btn-fracture" data-condition="fracture">
                    Fracture
                </button>
                <button class="answer-btn" id="btn-arthritis" data-condition="arthritis">
                    Arthritis
                </button>
                <button class="answer-btn" id="btn-dislocation" data-condition="dislocation">
                    Dislocation
                </button>
                <button class="answer-btn" id="btn-sprain" data-condition="sprain">
                    Sprain
                </button>
            </div>
        </div>

        <!-- Game controls -->
        <div class="game-controls">
            <button class="control-btn start-btn" id="startBtn">Start Game</button>
            <button class="control-btn restart-btn" id="restartBtn" style="display: none;">Restart Game</button>
        </div>

        <!-- Feedback overlay -->
        <div class="feedback-overlay" id="feedbackOverlay" style="display: none;">
            <div class="feedback-content">
                <div class="feedback-icon" id="feedbackIcon"></div>
                <div class="feedback-text" id="feedbackText"></div>
            </div>
        </div>

        <!-- Game over screen -->
        <div class="game-over-screen" id="gameOverScreen" style="display: none;">
            <div class="game-over-content">
                <h2 id="gameOverTitle">Game Over!</h2>
                <p id="gameOverMessage">Your final score: <span id="finalScore">0</span></p>
                <button class="control-btn" id="playAgainBtn">Play Again</button>
            </div>
        </div>

        <!-- Tooltip for additional information -->
        <div class="tooltip" id="tooltip" style="display: block; left: 1437px; top: 663px;"></div>
    </div>

    <script src="./Bone &amp; Joint Condition Identifier_files/script.js"></script>
