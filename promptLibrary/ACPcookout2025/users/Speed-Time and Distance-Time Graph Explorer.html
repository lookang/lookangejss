<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed-Time and Distance-Time Graph Explorer</title>
    <link rel="stylesheet" href="./Speed-Time and Distance-Time Graph Explorer_files/styles.css">
</head>
<body>
    <!-- Main container with tooltip for header information -->
    <div class="container" title="Speed-Time and Distance-Time Graph Explorer - Explore the relationship between motion graphs">
        
        <!-- Control panel for graph type selection -->
        <div class="control-panel">
            <div class="control-group">
                <label>Graph Type:</label>
                <div class="button-group">
                    <button id="constant" class="graph-btn active" title="Constant speed - horizontal line on speed-time graph">Constant</button>
                    <button id="increasing" class="graph-btn" title="Increasing speed - upward slant on speed-time graph">Increasing</button>
                    <button id="decreasing" class="graph-btn" title="Decreasing speed - downward slant on speed-time graph">Decreasing</button>
                    <button id="piecewise" class="graph-btn" title="Piecewise motion - combination of different speed patterns">Piecewise</button>
                </div>
            </div>
            
            <div class="control-group">
                <div class="animation-controls">
                    <button id="playPause" class="control-btn" title="Play/Pause animation">▶️ Play</button>
                    <button id="reset" class="control-btn" title="Reset animation to start">🔄 Reset</button>
                    <button id="stepMode" class="control-btn" title="Toggle step-by-step mode for detailed observation">📋 Step Mode</button>
                </div>
            </div>
        </div>

        <!-- Main content area with split-screen layout -->
        <div class="main-content">
            <!-- Left panel: Speed-Time Graph -->
            <div class="graph-panel">
                <div class="panel-title" title="Speed-Time Graph - Shows how speed changes over time">
                    Speed-Time Graph
                </div>
                <div class="graph-container">
                    <canvas id="speedCanvas" width="300" height="200" style="width: 300px; height: 200px;"></canvas>
                    <div class="axis-labels">
                        <div class="y-label">Speed (m/s)</div>
                        <div class="x-label">Time (s)</div>
                    </div>
                </div>
                
                <!-- Moving object animation -->
                <div class="object-track">
                    <div class="track-line"></div>
                    <div id="movingObject" class="moving-object" title="Moving object - speed reflects the current graph value" style="left: 0px;">🚗</div>
                </div>
            </div>

            <!-- Right panel: Distance-Time Graph -->
            <div class="graph-panel">
                <div class="panel-title" title="Distance-Time Graph - Shows cumulative distance traveled over time">
                    Distance-Time Graph
                </div>
                <div class="graph-container">
                    <canvas id="distanceCanvas" width="300" height="200" style="width: 300px; height: 200px;"></canvas>
                    <div class="axis-labels">
                        <div class="y-label">Distance (m)</div>
                        <div class="x-label">Time (s)</div>
                    </div>
                </div>
                
                <!-- Information display -->
                <div class="info-display">
                    <div class="info-item" title="Current time in the animation">
                        Time: <span id="currentTime">0.0</span>s
                    </div>
                    <div class="info-item" title="Current speed of the object">
                        Speed: <span id="currentSpeed">5.0</span>m/s
                    </div>
                    <div class="info-item" title="Total distance traveled so far">
                        Distance: <span id="totalDistance">0.0</span>m
                    </div>
                </div>
            </div>
        </div>

        <!-- Tooltip for detailed explanations -->
        <div id="tooltip" class="tooltip" style="left: 1334px; top: 523px;">Time: 0.0s<br>Distance: 0.0m<br><br>Slope of curve = Speed</div>
        
        <!-- Key concepts panel -->
        <div class="concepts-panel">
            <div class="concept-item" title="The slope of distance-time graph represents speed">
                💡 Slope of distance-time = Speed
            </div>
            <div class="concept-item" title="Area under speed-time graph represents distance traveled">
                📐 Area under speed-time = Distance
            </div>
        </div>
    </div>

    <script src="./Speed-Time and Distance-Time Graph Explorer_files/script.js"></script>

</body></html>
