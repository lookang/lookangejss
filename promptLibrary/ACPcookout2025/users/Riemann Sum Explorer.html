<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riemann Sum Explorer</title>
    <link rel="stylesheet" href="./Riemann Sum Explorer_files/styles.css">
</head>
<body>
    <!-- Main container with responsive height -->
    <div class="container">
        <!-- Control panel for user inputs -->
        <div class="control-panel">
            <!-- Function selector with tooltip -->
            <div class="control-group" title="Select the function to integrate">
                <label for="function-select">Function:</label>
                <select id="function-select">
                    <option value="quadratic">f(x) = x²</option>
                    <option value="cubic">f(x) = x³</option>
                    <option value="sine">f(x) = sin(x)</option>
                    <option value="exponential">f(x) = e^x</option>
                </select>
            </div>

            <!-- Number of rectangles slider -->
            <div class="control-group" title="Number of rectangles (n) - more rectangles give better approximation">
                <label for="n-slider">Rectangles (n): <span id="n-value">10</span></label>
                <input type="range" id="n-slider" min="1" max="100" value="10" step="1">
            </div>

            <!-- Integration bounds -->
            <div class="bounds-group">
                <div class="control-group" title="Lower bound of integration">
                    <label for="lower-bound">Lower bound (a):</label>
                    <input type="number" id="lower-bound" value="0" step="0.1" min="-10" max="10">
                </div>
                <div class="control-group" title="Upper bound of integration">
                    <label for="upper-bound">Upper bound (b):</label>
                    <input type="number" id="upper-bound" value="2" step="0.1" min="-10" max="10">
                </div>
            </div>

            <!-- Riemann sum method selector -->
            <div class="control-group" title="Choose how to calculate rectangle heights">
                <label for="method-select">Method:</label>
                <select id="method-select">
                    <option value="left">Left Riemann Sum</option>
                    <option value="right">Right Riemann Sum</option>
                    <option value="midpoint">Midpoint Rule</option>
                </select>
            </div>
        </div>

        <!-- Visualization canvas -->
        <div class="canvas-container">
            <canvas id="graph-canvas" width="1345" height="672" style="width: 1345px; height: 672px;"></canvas>
        </div>

        <!-- Results display -->
        <div class="results-panel">
            <div class="result-item" title="Approximated area using Riemann sum">
                <span class="label">Riemann Sum:</span>
                <span id="riemann-result">2.280</span>
            </div>
            <div class="result-item" title="Exact integral value (when available)">
                <span class="label">Exact Value:</span>
                <span id="exact-result">2.667</span>
            </div>
            <div class="result-item" title="Percentage error between approximation and exact value">
                <span class="label">Error:</span>
                <span id="error-result">14.50%</span>
            </div>
        </div>

        <!-- Information tooltip -->
        <div id="tooltip" class="tooltip"></div>
    </div>

    <script src="./Riemann Sum Explorer_files/script.js"></script>
