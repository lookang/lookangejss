<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukulele Chord Simulator</title>
    <link rel="stylesheet" href="./Ukulele Chord Simulator_files/styles.css">
</head>
<body>
    <!-- Main container with tooltip for header information -->
    <div class="container" title="Ukulele Chord Simulator - Learn C, F, and A minor chords">
        
        <!-- Ukulele visual representation -->
        <div class="ukulele-container">
            <div class="ukulele">
                <!-- Ukulele neck with frets -->
                <div class="neck">
                    <!-- Fret markers -->
                    <div class="fret fret-0"></div>
                    <div class="fret fret-1"></div>
                    <div class="fret fret-2"></div>
                    <div class="fret fret-3"></div>
                    <div class="fret fret-4"></div>
                    
                    <!-- Strings (G-C-E-A from top to bottom) -->
                    <div class="string string-1" data-string="G"></div>
                    <div class="string string-2" data-string="C"></div>
                    <div class="string string-3" data-string="E"></div>
                    <div class="string string-4" data-string="A"></div>
                    
                    <!-- Finger positions for chords -->
                    <div class="finger-positions">
                        <!-- C chord positions -->
                        <div class="finger c-chord finger-c-3" data-chord="C" data-string="3" data-fret="3"></div>
                        
                        <!-- F chord positions -->
                        <div class="finger f-chord finger-f-1" data-chord="F" data-string="2" data-fret="1"></div>
                        <div class="finger f-chord finger-f-2" data-chord="F" data-string="4" data-fret="1"></div>
                        
                        <!-- A minor chord positions -->
                        <div class="finger am-chord finger-am-2" data-chord="Am" data-string="4" data-fret="2"></div>
                    </div>
                </div>
                
                <!-- Ukulele body -->
                <div class="body">
                    <div class="sound-hole"></div>
                </div>
            </div>
        </div>
        
        <!-- Chord buttons and information -->
        <div class="controls-container">
            <div class="chord-info">
                <div class="current-chord" id="currentChord">Select a chord</div>
                <div class="chord-description" id="chordDescription">Tap a chord button to see fingering and hear the sound</div>
            </div>
            
            <div class="chord-buttons">
                <button class="chord-btn" data-chord="C" title="C Major Chord - Place finger on 3rd fret of E string">
                    <span class="chord-name">C</span>
                    <span class="chord-type">Major</span>
                </button>
                
                <button class="chord-btn" data-chord="F" title="F Major Chord - Place fingers on 1st fret of C and A strings">
                    <span class="chord-name">F</span>
                    <span class="chord-type">Major</span>
                </button>
                
                <button class="chord-btn" data-chord="Am" title="A Minor Chord - Place finger on 2nd fret of A string">
                    <span class="chord-name">Am</span>
                    <span class="chord-type">Minor</span>
                </button>
            </div>
        </div>
        
        <!-- Visual feedback for strumming -->
        <div class="strum-effect" id="strumEffect"></div>
    </div>
    
    <script src="./Ukulele Chord Simulator_files/script.js"></script>
