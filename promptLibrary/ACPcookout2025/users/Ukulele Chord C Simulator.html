<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukulele Chord C Simulator</title>
    <link rel="stylesheet" href="./Ukulele Chord C Simulator_files/styles.css">
</head>
<body>
    <!-- Main container with tooltip for header information -->
    <div class="container" title="Ukulele Chord C Learning Simulator - Click the chord button to see fingering and hear the sound">
        
        <!-- Ukulele visualization section -->
        <div class="ukulele-section">
            <!-- Ukulele neck representation -->
            <div class="ukulele-neck">
                <!-- Fret markers -->
                <div class="fret-markers">
                    <div class="fret-number">1</div>
                    <div class="fret-number">2</div>
                    <div class="fret-number">3</div>
                    <div class="fret-number">4</div>
                    <div class="fret-number">5</div>
                </div>
                
                <!-- Strings (4 strings for ukulele) -->
                <div class="strings">
                    <div class="string" data-string="1">
                        <div class="fret" data-fret="1" title=""></div>
                        <div class="fret" data-fret="2" title=""></div>
                        <div class="fret" data-fret="3" title=""></div>
                        <div class="fret" data-fret="4" title=""></div>
                        <div class="fret" data-fret="5" title=""></div>
                    </div>
                    <div class="string" data-string="2">
                        <div class="fret" data-fret="1" title=""></div>
                        <div class="fret" data-fret="2" title=""></div>
                        <div class="fret" data-fret="3" title=""></div>
                        <div class="fret" data-fret="4" title=""></div>
                        <div class="fret" data-fret="5" title=""></div>
                    </div>
                    <div class="string" data-string="3">
                        <div class="fret" data-fret="1" title=""></div>
                        <div class="fret" data-fret="2" title=""></div>
                        <div class="fret" data-fret="3" title=""></div>
                        <div class="fret" data-fret="4" title=""></div>
                        <div class="fret" data-fret="5" title=""></div>
                    </div>
                    <div class="string" data-string="4">
                        <div class="fret" data-fret="1" title=""></div>
                        <div class="fret" data-fret="2" title=""></div>
                        <div class="fret" data-fret="3" title=""></div>
                        <div class="fret" data-fret="4" title=""></div>
                        <div class="fret" data-fret="5" title=""></div>
                    </div>
                </div>
                
                <!-- Fret lines -->
                <div class="fret-lines">
                    <div class="fret-line"></div>
                    <div class="fret-line"></div>
                    <div class="fret-line"></div>
                    <div class="fret-line"></div>
                    <div class="fret-line"></div>
                </div>
            </div>
            
            <!-- String labels -->
            <div class="string-labels">
                <div class="string-label">G</div>
                <div class="string-label">C</div>
                <div class="string-label">E</div>
                <div class="string-label">A</div>
            </div>
        </div>
        
        <!-- Control section -->
        <div class="controls-section">
            <!-- Chord button -->
            <button class="chord-button" id="chordC" title="Click to play Chord C and see fingering position">
                Play Chord C
            </button>
            
            <!-- Instructions tooltip -->
            <div class="instructions" title="Place your finger on the 3rd fret of the bottom string (A string) to form Chord C">
                <span class="info-icon">ℹ</span>
                Hover for instructions
            </div>
        </div>
        
        <!-- Visual feedback section -->
        <div class="feedback-section">
            <div class="chord-name" id="chordName"></div>
            <div class="finger-position" id="fingerPosition"></div>
        </div>
    </div>
