<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDM Drum Sequencer</title>
    <link rel="stylesheet" href="./EDM Drum Sequencer_files/styles.css">
</head>
<body>
    <!-- Main container with responsive height -->
    <div class="sequencer-container">
        
        <!-- Transport Controls Section -->
        <div class="transport-section">
            <button id="playBtn" class="transport-btn play-btn" title="Play/Pause Pattern">▶</button>
            <button id="stopBtn" class="transport-btn" title="Stop Playback">⏹</button>
            <button id="clearBtn" class="transport-btn" title="Clear All Steps">🗑</button>
            <button id="randomBtn" class="transport-btn" title="Generate Random Pattern">🎲</button>
            
            <div class="tempo-control">
                <label for="tempoSlider" class="control-label">BPM</label>
                <input type="range" id="tempoSlider" min="80" max="160" value="120" class="slider">
                <span id="tempoDisplay">120</span>
            </div>
            
            <div class="swing-control">
                <label for="swingSlider" class="control-label">Swing</label>
                <input type="range" id="swingSlider" min="0" max="100" value="0" class="slider">
                <span id="swingDisplay">0%</span>
            </div>

            <!-- Added master filter controls -->
            <div class="master-filter-controls">
                <div class="filter-control">
                    <label for="masterCutoffSlider" class="control-label">Cutoff</label>
                    <input type="range" id="masterCutoffSlider" min="20" max="20000" value="20000" class="slider cutoff-slider">
                    <span id="cutoffDisplay">20k</span>
                </div>
                <div class="filter-control">
                    <label for="masterResonanceSlider" class="control-label">Res</label>
                    <input type="range" id="masterResonanceSlider" min="0" max="30" value="0" class="slider resonance-slider">
                    <span id="resonanceDisplay">0</span>
                </div>
            </div>
        </div>

        <!-- Step Position Indicator - Fixed numbering to start from first beat -->
        <div class="step-indicator">
            <div class="step-numbers">
                <!-- Empty space for track labels column -->
                <div class="step-spacer"></div>
                <!-- Step numbers now properly aligned with beats -->
                <div class="step-num" data-step="0">1</div>
                <div class="step-num" data-step="1">2</div>
                <div class="step-num" data-step="2">3</div>
                <div class="step-num" data-step="3">4</div>
                <div class="step-num" data-step="4">5</div>
                <div class="step-num" data-step="5">6</div>
                <div class="step-num" data-step="6">7</div>
                <div class="step-num" data-step="7">8</div>
                <div class="step-num" data-step="8">9</div>
                <div class="step-num" data-step="9">10</div>
                <div class="step-num" data-step="10">11</div>
                <div class="step-num" data-step="11">12</div>
                <div class="step-num" data-step="12">13</div>
                <div class="step-num" data-step="13">14</div>
                <div class="step-num" data-step="14">15</div>
                <div class="step-num" data-step="15">16</div>
                <!-- Empty space for track controls column -->
                <div class="step-spacer"></div>
            </div>
        </div>

        <!-- Main Sequencer Grid -->
        <div class="sequencer-grid">
            <!-- Kick Track -->
            <div class="track-row">
                <div class="track-label" title="Bass Drum - Foundation of EDM beats">KICK</div>
                <div class="step-buttons" data-track="kick"><button class="step-btn" data-track="kick" data-step="0" title="KICK - Step 1"></button><button class="step-btn" data-track="kick" data-step="1" title="KICK - Step 2"></button><button class="step-btn" data-track="kick" data-step="2" title="KICK - Step 3"></button><button class="step-btn" data-track="kick" data-step="3" title="KICK - Step 4"></button><button class="step-btn" data-track="kick" data-step="4" title="KICK - Step 5"></button><button class="step-btn" data-track="kick" data-step="5" title="KICK - Step 6"></button><button class="step-btn" data-track="kick" data-step="6" title="KICK - Step 7"></button><button class="step-btn" data-track="kick" data-step="7" title="KICK - Step 8"></button><button class="step-btn" data-track="kick" data-step="8" title="KICK - Step 9"></button><button class="step-btn" data-track="kick" data-step="9" title="KICK - Step 10"></button><button class="step-btn" data-track="kick" data-step="10" title="KICK - Step 11"></button><button class="step-btn" data-track="kick" data-step="11" title="KICK - Step 12"></button><button class="step-btn" data-track="kick" data-step="12" title="KICK - Step 13"></button><button class="step-btn" data-track="kick" data-step="13" title="KICK - Step 14"></button><button class="step-btn" data-track="kick" data-step="14" title="KICK - Step 15"></button><button class="step-btn" data-track="kick" data-step="15" title="KICK - Step 16"></button></div>
                <!-- Removed individual filter controls, kept only volume -->
                <div class="track-controls">
                    <input type="range" class="volume-slider" min="0" max="100" value="80" data-track="kick" title="Volume">
                </div>
            </div>

            <!-- Snare Track -->
            <div class="track-row">
                <div class="track-label" title="Snare Drum - Backbeat emphasis">SNARE</div>
                <div class="step-buttons" data-track="snare"><button class="step-btn" data-track="snare" data-step="0" title="SNARE - Step 1"></button><button class="step-btn" data-track="snare" data-step="1" title="SNARE - Step 2"></button><button class="step-btn" data-track="snare" data-step="2" title="SNARE - Step 3"></button><button class="step-btn" data-track="snare" data-step="3" title="SNARE - Step 4"></button><button class="step-btn" data-track="snare" data-step="4" title="SNARE - Step 5"></button><button class="step-btn" data-track="snare" data-step="5" title="SNARE - Step 6"></button><button class="step-btn" data-track="snare" data-step="6" title="SNARE - Step 7"></button><button class="step-btn" data-track="snare" data-step="7" title="SNARE - Step 8"></button><button class="step-btn" data-track="snare" data-step="8" title="SNARE - Step 9"></button><button class="step-btn" data-track="snare" data-step="9" title="SNARE - Step 10"></button><button class="step-btn" data-track="snare" data-step="10" title="SNARE - Step 11"></button><button class="step-btn" data-track="snare" data-step="11" title="SNARE - Step 12"></button><button class="step-btn" data-track="snare" data-step="12" title="SNARE - Step 13"></button><button class="step-btn" data-track="snare" data-step="13" title="SNARE - Step 14"></button><button class="step-btn" data-track="snare" data-step="14" title="SNARE - Step 15"></button><button class="step-btn" data-track="snare" data-step="15" title="SNARE - Step 16"></button></div>
                <!-- Removed individual filter controls, kept only volume -->
                <div class="track-controls">
                    <input type="range" class="volume-slider" min="0" max="100" value="70" data-track="snare" title="Volume">
                </div>
            </div>

            <!-- Hi-Hat Track -->
            <div class="track-row">
                <div class="track-label" title="Closed Hi-Hat - Rhythmic texture">HI-HAT</div>
                <div class="step-buttons" data-track="hihat"><button class="step-btn" data-track="hihat" data-step="0" title="HIHAT - Step 1"></button><button class="step-btn" data-track="hihat" data-step="1" title="HIHAT - Step 2"></button><button class="step-btn" data-track="hihat" data-step="2" title="HIHAT - Step 3"></button><button class="step-btn" data-track="hihat" data-step="3" title="HIHAT - Step 4"></button><button class="step-btn" data-track="hihat" data-step="4" title="HIHAT - Step 5"></button><button class="step-btn" data-track="hihat" data-step="5" title="HIHAT - Step 6"></button><button class="step-btn" data-track="hihat" data-step="6" title="HIHAT - Step 7"></button><button class="step-btn" data-track="hihat" data-step="7" title="HIHAT - Step 8"></button><button class="step-btn" data-track="hihat" data-step="8" title="HIHAT - Step 9"></button><button class="step-btn" data-track="hihat" data-step="9" title="HIHAT - Step 10"></button><button class="step-btn" data-track="hihat" data-step="10" title="HIHAT - Step 11"></button><button class="step-btn" data-track="hihat" data-step="11" title="HIHAT - Step 12"></button><button class="step-btn" data-track="hihat" data-step="12" title="HIHAT - Step 13"></button><button class="step-btn" data-track="hihat" data-step="13" title="HIHAT - Step 14"></button><button class="step-btn" data-track="hihat" data-step="14" title="HIHAT - Step 15"></button><button class="step-btn" data-track="hihat" data-step="15" title="HIHAT - Step 16"></button></div>
                <!-- Removed individual filter controls, kept only volume -->
                <div class="track-controls">
                    <input type="range" class="volume-slider" min="0" max="100" value="60" data-track="hihat" title="Volume">
                </div>
            </div>

            <!-- Open Hat Track -->
            <div class="track-row">
                <div class="track-label" title="Open Hi-Hat - Sustained cymbal sound">OPEN</div>
                <div class="step-buttons" data-track="openhat"><button class="step-btn" data-track="openhat" data-step="0" title="OPENHAT - Step 1"></button><button class="step-btn" data-track="openhat" data-step="1" title="OPENHAT - Step 2"></button><button class="step-btn" data-track="openhat" data-step="2" title="OPENHAT - Step 3"></button><button class="step-btn" data-track="openhat" data-step="3" title="OPENHAT - Step 4"></button><button class="step-btn" data-track="openhat" data-step="4" title="OPENHAT - Step 5"></button><button class="step-btn" data-track="openhat" data-step="5" title="OPENHAT - Step 6"></button><button class="step-btn" data-track="openhat" data-step="6" title="OPENHAT - Step 7"></button><button class="step-btn" data-track="openhat" data-step="7" title="OPENHAT - Step 8"></button><button class="step-btn" data-track="openhat" data-step="8" title="OPENHAT - Step 9"></button><button class="step-btn" data-track="openhat" data-step="9" title="OPENHAT - Step 10"></button><button class="step-btn" data-track="openhat" data-step="10" title="OPENHAT - Step 11"></button><button class="step-btn" data-track="openhat" data-step="11" title="OPENHAT - Step 12"></button><button class="step-btn" data-track="openhat" data-step="12" title="OPENHAT - Step 13"></button><button class="step-btn" data-track="openhat" data-step="13" title="OPENHAT - Step 14"></button><button class="step-btn" data-track="openhat" data-step="14" title="OPENHAT - Step 15"></button><button class="step-btn" data-track="openhat" data-step="15" title="OPENHAT - Step 16"></button></div>
                <!-- Removed individual filter controls, kept only volume -->
                <div class="track-controls">
                    <input type="range" class="volume-slider" min="0" max="100" value="50" data-track="openhat" title="Volume">
                </div>
            </div>

            <!-- Clap Track -->
            <div class="track-row">
                <div class="track-label" title="Hand Clap - Percussive accent">CLAP</div>
                <div class="step-buttons" data-track="clap"><button class="step-btn" data-track="clap" data-step="0" title="CLAP - Step 1"></button><button class="step-btn" data-track="clap" data-step="1" title="CLAP - Step 2"></button><button class="step-btn" data-track="clap" data-step="2" title="CLAP - Step 3"></button><button class="step-btn" data-track="clap" data-step="3" title="CLAP - Step 4"></button><button class="step-btn" data-track="clap" data-step="4" title="CLAP - Step 5"></button><button class="step-btn" data-track="clap" data-step="5" title="CLAP - Step 6"></button><button class="step-btn" data-track="clap" data-step="6" title="CLAP - Step 7"></button><button class="step-btn" data-track="clap" data-step="7" title="CLAP - Step 8"></button><button class="step-btn" data-track="clap" data-step="8" title="CLAP - Step 9"></button><button class="step-btn" data-track="clap" data-step="9" title="CLAP - Step 10"></button><button class="step-btn" data-track="clap" data-step="10" title="CLAP - Step 11"></button><button class="step-btn" data-track="clap" data-step="11" title="CLAP - Step 12"></button><button class="step-btn" data-track="clap" data-step="12" title="CLAP - Step 13"></button><button class="step-btn" data-track="clap" data-step="13" title="CLAP - Step 14"></button><button class="step-btn" data-track="clap" data-step="14" title="CLAP - Step 15"></button><button class="step-btn" data-track="clap" data-step="15" title="CLAP - Step 16"></button></div>
                <!-- Removed individual filter controls, kept only volume -->
                <div class="track-controls">
                    <input type="range" class="volume-slider" min="0" max="100" value="65" data-track="clap" title="Volume">
                </div>
            </div>

            <!-- Crash Track -->
            <div class="track-row">
                <div class="track-label" title="Crash Cymbal - Impact and transitions">CRASH</div>
                <div class="step-buttons" data-track="crash"><button class="step-btn" data-track="crash" data-step="0" title="CRASH - Step 1"></button><button class="step-btn" data-track="crash" data-step="1" title="CRASH - Step 2"></button><button class="step-btn" data-track="crash" data-step="2" title="CRASH - Step 3"></button><button class="step-btn" data-track="crash" data-step="3" title="CRASH - Step 4"></button><button class="step-btn" data-track="crash" data-step="4" title="CRASH - Step 5"></button><button class="step-btn" data-track="crash" data-step="5" title="CRASH - Step 6"></button><button class="step-btn" data-track="crash" data-step="6" title="CRASH - Step 7"></button><button class="step-btn" data-track="crash" data-step="7" title="CRASH - Step 8"></button><button class="step-btn" data-track="crash" data-step="8" title="CRASH - Step 9"></button><button class="step-btn" data-track="crash" data-step="9" title="CRASH - Step 10"></button><button class="step-btn" data-track="crash" data-step="10" title="CRASH - Step 11"></button><button class="step-btn" data-track="crash" data-step="11" title="CRASH - Step 12"></button><button class="step-btn" data-track="crash" data-step="12" title="CRASH - Step 13"></button><button class="step-btn" data-track="crash" data-step="13" title="CRASH - Step 14"></button><button class="step-btn" data-track="crash" data-step="14" title="CRASH - Step 15"></button><button class="step-btn" data-track="crash" data-step="15" title="CRASH - Step 16"></button></div>
                <!-- Removed individual filter controls, kept only volume -->
                <div class="track-controls">
                    <input type="range" class="volume-slider" min="0" max="100" value="40" data-track="crash" title="Volume">
                </div>
            </div>

            <!-- Added Synth Bass Track -->
            <div class="track-row bass-track">
                <div class="track-label" title="Synthesizer Bass - Low frequency foundation">BASS</div>
                <div class="step-buttons" data-track="bass"><button class="step-btn" data-track="bass" data-step="0" title="BASS - Step 1"></button><button class="step-btn" data-track="bass" data-step="1" title="BASS - Step 2"></button><button class="step-btn" data-track="bass" data-step="2" title="BASS - Step 3"></button><button class="step-btn" data-track="bass" data-step="3" title="BASS - Step 4"></button><button class="step-btn" data-track="bass" data-step="4" title="BASS - Step 5"></button><button class="step-btn" data-track="bass" data-step="5" title="BASS - Step 6"></button><button class="step-btn" data-track="bass" data-step="6" title="BASS - Step 7"></button><button class="step-btn" data-track="bass" data-step="7" title="BASS - Step 8"></button><button class="step-btn" data-track="bass" data-step="8" title="BASS - Step 9"></button><button class="step-btn" data-track="bass" data-step="9" title="BASS - Step 10"></button><button class="step-btn" data-track="bass" data-step="10" title="BASS - Step 11"></button><button class="step-btn" data-track="bass" data-step="11" title="BASS - Step 12"></button><button class="step-btn" data-track="bass" data-step="12" title="BASS - Step 13"></button><button class="step-btn" data-track="bass" data-step="13" title="BASS - Step 14"></button><button class="step-btn" data-track="bass" data-step="14" title="BASS - Step 15"></button><button class="step-btn" data-track="bass" data-step="15" title="BASS - Step 16"></button></div>
                <!-- Bass track controls with volume -->
                <div class="track-controls">
                    <input type="range" class="volume-slider" min="0" max="100" value="75" data-track="bass" title="Volume">
                </div>
            </div>
        </div>

        <!-- Preset Section -->
        <div class="preset-section">
            <button class="preset-btn" data-preset="house" title="Classic House Pattern">House</button>
            <button class="preset-btn" data-preset="techno" title="Driving Techno Pattern">Techno</button>
            <button class="preset-btn" data-preset="breakbeat" title="Syncopated Breakbeat">Breaks</button>
            <button class="preset-btn" data-preset="dubstep" title="Heavy Dubstep Pattern">Dubstep</button>
        </div>

        <!-- Tooltip for detailed information -->
        <div id="tooltip" class="tooltip show" style="left: 1419px; top: 650px;">CRASH - Step 13</div>
    </div>
