<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Transpiration Simulation</title>
    <link rel="stylesheet" href="./Plant Transpiration Simulation_files/styles.css">
</head>
<body>
    <!-- Main container with responsive height for iframe vs full browser -->
    <div class="container" id="mainContainer">
        
        <!-- Left Panel: Controls and Plant Visualization -->
        <div class="left-panel">
            <!-- Environmental Controls Section -->
            <div class="controls-section">
                <div class="control-group">
                    <label for="lightSlider">
                        Light Intensity
                        <span class="info-icon" data-tooltip="Higher light intensity opens stomata for photosynthesis, increasing transpiration">ℹ️</span>
                    </label>
                    <input type="range" id="lightSlider" min="0" max="100" value="50" class="slider">
                    <span class="value-display" id="lightValue">50%</span>
                </div>

                <div class="control-group">
                    <label for="tempSlider">
                        Temperature
                        <span class="info-icon" data-tooltip="Higher temperature gives water molecules more kinetic energy, increasing diffusion rate">ℹ️</span>
                    </label>
                    <input type="range" id="tempSlider" min="10" max="40" value="25" class="slider">
                    <span class="value-display" id="tempValue">25°C</span>
                </div>

                <div class="control-group">
                    <label for="windSlider">
                        Wind Speed
                        <span class="info-icon" data-tooltip="Wind removes water vapor from leaf surface, increasing concentration gradient">ℹ️</span>
                    </label>
                    <input type="range" id="windSlider" min="0" max="20" value="5" class="slider">
                    <span class="value-display" id="windValue">5 m/s</span>
                </div>

                <div class="control-group">
                    <label for="humiditySlider">
                        Humidity
                        <span class="info-icon" data-tooltip="High humidity reduces water vapor concentration gradient, decreasing transpiration">ℹ️</span>
                    </label>
                    <input type="range" id="humiditySlider" min="20" max="90" value="50" class="slider">
                    <span class="value-display" id="humidityValue">50%</span>
                </div>
            </div>

            <!-- Plant Visualization -->
            <div class="plant-container">
                <svg id="plantSvg" viewBox="0 0 200 250" class="plant-svg">
                    <!-- Pot -->
                    <rect x="60" y="200" width="80" height="40" fill="#8B4513" rx="5"></rect>
                    <!-- Soil -->
                    <rect x="65" y="205" width="70" height="30" fill="#654321" rx="3"></rect>
                    <!-- Stem -->
                    <rect x="98" y="150" width="4" height="50" fill="#228B22"></rect>
                    <!-- Leaves -->
                    <ellipse cx="80" cy="160" rx="15" ry="8" fill="#32CD32" class="leaf"></ellipse>
                    <ellipse cx="120" cy="170" rx="15" ry="8" fill="#32CD32" class="leaf"></ellipse>
                    <ellipse cx="90" cy="140" rx="18" ry="10" fill="#32CD32" class="leaf"></ellipse>
                    <ellipse cx="110" cy="150" rx="18" ry="10" fill="#32CD32" class="leaf"></ellipse>
                    <!-- Water vapor particles (initially hidden) -->
                    <g id="vaporParticles"></g>
                </svg>
            </div>
        </div>

        <!-- Right Panel: Data Display and Graph -->
        <div class="right-panel">
            <!-- Sensor Panel -->
            <div class="sensor-panel">
                <div class="sensor-reading">
                    <span class="sensor-label">Transpiration Rate</span>
                    <span class="sensor-value" id="transpirationRate">4.9 ml/hr</span>
                </div>
                <div class="sensor-reading">
                    <span class="sensor-label">Status</span>
                    <span class="sensor-value" id="experimentStatus">Ready</span>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="button-group">
                <button id="startBtn" class="control-btn primary">Start Experiment</button>
                <button id="pauseBtn" class="control-btn secondary" disabled="">Pause</button>
                <button id="resetBtn" class="control-btn secondary">Reset</button>
                <button id="compareBtn" class="control-btn tertiary">Compare Conditions</button>
            </div>

            <!-- Real-time Graph -->
            <div class="graph-container">
                <canvas id="transpirationGraph" width="300" height="180"></canvas>
            </div>

            <!-- Guided Mode Toggle -->
            <div class="guided-mode">
                <label class="toggle-label">
                    <input type="checkbox" id="guidedMode">
                    <span class="toggle-slider"></span>
                    Guided Mode
                </label>
            </div>
        </div>

        <!-- Tooltip for displaying information -->
        <div id="tooltip" class="tooltip"></div>

        <!-- Guided Mode Instructions -->
        <div id="guidedInstructions" class="guided-instructions">
            <p id="instructionText">Adjust one environmental factor and observe how it affects transpiration rate.</p>
        </div>
    </div>

<script src="./Plant Transpiration Simulation_files/script.js"></script>
</body></html>
