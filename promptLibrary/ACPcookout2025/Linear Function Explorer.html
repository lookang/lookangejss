<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Function Explorer</title>
    <link rel="stylesheet" href="./Linear Function Explorer_files/styles.css">
</head>
<body>
    <!-- Main container with tooltip for header information -->
    <div class="container" title="Linear Function Explorer: y = mx + c - Explore how slope (m) and y-intercept (c) affect straight lines">
        
        <!-- Graph area with coordinate system -->
        <div class="graph-container">
            <canvas id="graphCanvas" width="1424" height="475"></canvas>
            
            <!-- Equation display overlay -->
            <div class="equation-display" id="equationDisplay">
                y = 1x + 0
            </div>
        </div>
        
        <!-- Controls panel for sliders -->
        <div class="controls-panel">
            
            <!-- Slope (m) control -->
            <div class="control-group">
                <label for="slopeSlider" class="control-label" title="Slope (m): Controls how steep the line is. Positive values slope upward, negative values slope downward.">
                    <span class="label-text">Slope (m):</span>
                    <span class="value-display" id="slopeValue">1</span>
                </label>
                <input type="range" id="slopeSlider" class="slider slope-slider" min="-5" max="5" step="0.1" value="1" title="Drag to change the slope of the line">
            </div>
            
            <!-- Y-intercept (c) control -->
            <div class="control-group">
                <label for="interceptSlider" class="control-label" title="Y-intercept (c): The point where the line crosses the y-axis. Positive values move the line up, negative values move it down.">
                    <span class="label-text">Y-intercept (c):</span>
                    <span class="value-display" id="interceptValue">0</span>
                </label>
                <input type="range" id="interceptSlider" class="slider intercept-slider" min="-10" max="10" step="0.5" value="0" title="Drag to move the line up or down">
            </div>
            
            <!-- Reset button -->
            <button id="resetButton" class="reset-btn" title="Reset to y = 1x + 0">
                Reset
            </button>
            
        </div>
        
        <!-- Information tooltip (appears on hover over graph) -->
        <div class="info-tooltip" id="infoTooltip">
            Click and drag the sliders to see how the line changes!
        </div>
        
    </div>
    
    <script src="./Linear Function Explorer_files/script.js"></script>
