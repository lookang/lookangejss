<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore Air Quality Data Visualization</title>
    <link rel="stylesheet" href="./Singapore Air Quality Data Visualization_files/styles.css">
</head>
<body>
    <!-- Main container with responsive height -->
    <div id="app" class="app-container">
        <!-- Control Panel - Top section with filters and toggles -->
        <div class="control-panel">
            <div class="control-group">
                <select id="yearFilter" class="control-select" title="Select year to analyze">
                    <option value="all">All Years</option>
                    <option value="2019">2019</option>
                    <option value="2020">2020</option>
                    <option value="2021">2021</option>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                </select>
                
                <select id="seasonFilter" class="control-select" title="Filter by season">
                    <option value="all">All Seasons</option>
                    <option value="dry">Dry Season (Feb-Apr)</option>
                    <option value="wet">Wet Season (Nov-Jan)</option>
                    <option value="inter">Inter-monsoon (May-Oct)</option>
                </select>
                
                <button id="compareBtn" class="control-btn" title="Compare multiple regions">Compare Regions</button>
                <button id="downloadBtn" class="control-btn" title="Download raw data">📊 Data</button>
            </div>
            
            <!-- Pollutant toggles -->
            <div class="pollutant-toggles">
                <label class="toggle-label" title="Show/hide PM2.5 data">
                    <input type="checkbox" id="pm25Toggle" checked="">
                    <span class="toggle-text">PM2.5</span>
                </label>
                <label class="toggle-label" title="Show/hide PM10 data">
                    <input type="checkbox" id="pm10Toggle" checked="">
                    <span class="toggle-text">PM10</span>
                </label>
                <label class="toggle-label" title="Show/hide Ozone data">
                    <input type="checkbox" id="ozoneToggle">
                    <span class="toggle-text">O₃</span>
                </label>
            </div>
        </div>

        <!-- Main content area with map and chart -->
        <div class="main-content">
            <!-- Singapore Map Section -->
            <div class="map-section">
                <div id="singaporeMap" class="singapore-map" title="Click on regions to view detailed PSI data">
                    <!-- SVG Map of Singapore with clickable regions -->
                    <svg viewBox="0 0 400 300" class="map-svg">
                        <!-- North Region -->
                        <polygon points="150,50 250,50 250,100 150,100" class="region moderate" id="north" data-region="North" title="North Singapore - Woodlands, Yishun, Sembawang">
                        </polygon>
                        <text x="200" y="80" class="region-label">North</text>
                        
                        <!-- Central Region -->
                        <polygon points="150,100 250,100 250,150 150,150" class="region moderate" id="central" data-region="Central" title="Central Singapore - Orchard, Marina Bay, CBD">
                        </polygon>
                        <text x="200" y="130" class="region-label">Central</text>
                        
                        <!-- East Region -->
                        <polygon points="250,100 350,100 350,200 250,200" class="region moderate" id="east" data-region="East" title="East Singapore - Changi, Tampines, Pasir Ris">
                        </polygon>
                        <text x="300" y="155" class="region-label">East</text>
                        
                        <!-- West Region -->
                        <polygon points="50,100 150,100 150,200 50,200" class="region moderate" id="west" data-region="West" title="West Singapore - Jurong, Clementi, Tuas">
                        </polygon>
                        <text x="100" y="155" class="region-label">West</text>
                        
                        <!-- South Region -->
                        <polygon points="150,200 250,200 250,250 150,250" class="region moderate" id="south" data-region="South" title="South Singapore - Sentosa, HarbourFront">
                        </polygon>
                        <text x="200" y="230" class="region-label">South</text>
                    </svg>
                </div>
                
                <!-- PSI Legend -->
                <div class="psi-legend" title="PSI Health Impact Scale">
                    <div class="legend-title">PSI Scale</div>
                    <div class="legend-item good">0-50 Good</div>
                    <div class="legend-item moderate">51-100 Moderate</div>
                    <div class="legend-item unhealthy">101-200 Unhealthy</div>
                    <div class="legend-item hazardous">201+ Hazardous</div>
                </div>
            </div>

            <!-- Chart Section -->
            <div class="chart-section">
                <div class="chart-container">
                    <canvas id="psiChart" width="600" height="250"></canvas>
                </div>
                
                <!-- Time slider -->
                <div class="time-slider-container">
                    <label for="timeSlider" class="slider-label">Time Period:</label>
                    <input type="range" id="timeSlider" min="0" max="59" value="59" class="time-slider">
                    <div class="slider-labels">
                        <span>2019</span>
                        <span id="currentDate">18/02/2020</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Selected Region Info Panel -->
        <div id="regionInfo" class="region-info hidden">
            <div class="info-header">
                <h3 id="regionTitle">Region Details</h3>
                <button id="closeInfo" class="close-btn">×</button>
            </div>
            <div id="regionContent" class="info-content">
                <!-- Dynamic content populated by JavaScript -->
            </div>
        </div>

        <!-- Event Popup for significant events -->
        <div id="eventPopup" class="event-popup hidden">
            <div class="popup-content">
                <button id="closePopup" class="close-btn">×</button>
                <div id="popupContent"></div>
            </div>
        </div>

        <!-- Tooltip for hover information -->
        <div id="tooltip" class="tooltip hidden"></div>
    </div>

    <script src="./Singapore Air Quality Data Visualization_files/script.js"></script>
