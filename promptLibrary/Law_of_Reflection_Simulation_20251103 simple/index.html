  position: fixed;
  left: 0;

  bottom: 10px;
  z-index: 2147483000;

  color: #222;

#aiz-footer p {

<body>
    <!-- Main container with tooltip for header information -->
    <div id="main-container" title="Law of Reflection Simulation - Explore how light reflects off surfaces">
        
        <!-- Control panel for user inputs -->
        <div id="control-panel">
            <div class="control-group">
                <label for="incident-angle">Incident Angle:</label>
                <input type="range" id="incident-angle" min="10" max="80" value="30" step="1">
                <span id="incident-value">30°</span>
            </div>
            
            <div class="control-group">
                <label for="surface-type">Surface Type:</label>
                <select id="surface-type">
                    <option value="plane">Plane Mirror</option>
                    <option value="rough">Rough Surface</option>
                </select>
            </div>
            
            <div class="control-group">
                <button id="reset-btn">Reset</button>
                <button id="toggle-analytics">📊 Analytics</button>
            </div>
        </div>

        <!-- Main simulation canvas area -->
        <div id="simulation-area">
            <canvas id="reflection-canvas" width="400" height="300"></canvas>
            
            <!-- Information display -->
            <div id="info-panel">
                <div class="info-item">
                    <span class="label">Incident Angle (θᵢ):</span>
                    <span id="display-incident">30°</span>
                </div>
                <div class="info-item">
                    <span class="label">Reflected Angle (θᵣ):</span>
                    <span id="display-reflected">30°</span>
                </div>
                <div class="info-item">
                    <span class="label">Law Status:</span>
                    <span id="law-status">θᵢ = θᵣ ✓</span>
                </div>
            </div>
        </div>

        <!-- Collapsible analytics panel -->
        <div id="analytics-panel" class="collapsed">
            <div id="analytics-header">
                <h3>📊 Interaction Analytics</h3>
                <button id="clear-log">Clear Log</button>
            </div>
            <div id="analytics-content">
                <div id="action-log"></div>
            </div>
        </div>

        <!-- Educational tooltip -->
        <div id="tooltip" class="tooltip"></div>
    </div>

    <script src="script.js"></script>
