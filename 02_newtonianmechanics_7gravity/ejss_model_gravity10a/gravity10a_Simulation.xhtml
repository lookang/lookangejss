  // computes force between charges  // > CustomCode.calcF:1
  function calcF() {  // > CustomCode.calcF:2
    for (var i=0; i<n; i++) {  // > CustomCode.calcF:3
      xForce[i]=0;  // > CustomCode.calcF:4
      yForce[i]=0;  // > CustomCode.calcF:5
      elecForce[i]=0;  // > CustomCode.calcF:6
        // > CustomCode.calcF:7
      if (q0true===true){  // > CustomCode.calcF:8
        q[qLabel]=q0;  //charge value from slider  // > CustomCode.calcF:9
      }  // > CustomCode.calcF:10
      else if(q00true===true){  // > CustomCode.calcF:11
        q[qLabel]=q00;  //charge value from slider2  // > CustomCode.calcF:12
      }  // > CustomCode.calcF:13
      for (var j=0; j<n; j++) {  // > CustomCode.calcF:14
        if (i!=j) {  // > CustomCode.calcF:15
          //calculate force on ith particle due to  // > CustomCode.calcF:16
          //jth particle (therefore exclude i=j calculation)  // > CustomCode.calcF:17
          var deltaX=x[i]-x[j];  // > CustomCode.calcF:18
          var deltaY=y[i]-y[j];  // > CustomCode.calcF:19
          var r2=deltaX*deltaX+deltaY*deltaY;  // > CustomCode.calcF:20
          var r=Math.sqrt(r2);  // > CustomCode.calcF:21
          var cos=deltaX/r;  // > CustomCode.calcF:22
          var sin=deltaY/r;  // > CustomCode.calcF:23
          var r3=r2*r;  // > CustomCode.calcF:24
          var magnitude;  // > CustomCode.calcF:25
        /*  // > CustomCode.calcF:26
        if (r >= Math.abs(radiusx[0]/2)){  // > CustomCode.calcF:27
            magnitude=G*q[i]*q[j]/r2; // added G by lookang  // > CustomCode.calcF:28
          }  // > CustomCode.calcF:29
          else if(r < Math.abs(radiusx[0]/2)){  // > CustomCode.calcF:30
            magnitude=G*q[i]*q[j]*r*26.48/3336.5; // added G by lookang -2.669*2*x[1]/q[1]*(q[0]/100)  // > CustomCode.calcF:31
          }  // > CustomCode.calcF:32
          else if (r >= Math.abs(radiusx[2]/2)){  // > CustomCode.calcF:33
            magnitude=G*q[i]*q[j]/r2; // added G by lookang  // > CustomCode.calcF:34
          }  // > CustomCode.calcF:35
          */  // > CustomCode.calcF:36
          magnitude=G*q[i]*q[j]/r2; // added G by lookang  // > CustomCode.calcF:37
          //xForce[i]=xForce[i]+magnitude*cos;  // x component  // > CustomCode.calcF:38
          //yForce[i]=yForce[i]+magnitude*sin;  // y component  // > CustomCode.calcF:39
          xForce[i]=+xForce[i]-magnitude*cos;  // x component negative for mass lookang  // > CustomCode.calcF:40
          yForce[i]=+yForce[i]-magnitude*sin;  // y component  // > CustomCode.calcF:41
        }  // > CustomCode.calcF:42
      }  // > CustomCode.calcF:43
      elecForce[i]=Math.sqrt(xForce[i]*xForce[i]+yForce[i]*yForce[i]);//magnitude  // > CustomCode.calcF:44
      //forceValue[i]=" F"+" = "+_view._format(elecForce[i],"0.00E00");  // > CustomCode.calcF:45
      forceValue[i]=" |F"+_view._format([i+1],"0")+ "|="+_view._format(elecForce[i],"0.00")+"x10^-7 N ";  // > CustomCode.calcF:46
  if (print == false){   // > CustomCode.calcF:47
    gforceValue[i]=" g = "+_view._format(xForce[i]/q[1],"0.00")+"x10^-¹¹N/kg "; // /10 to compensate for error by factor of 10  // > CustomCode.calcF:48
    phiValue[i] = " ϕ = "+_view._format(-elecForce[1]/q[1]*Math.abs(x[i]-x[1]),"0")+" x10^-¹¹ J/kg ";  // > CustomCode.calcF:49
    phiValueplot[i] =_view._format(-elecForce[1]/q[1]*Math.abs(x[i]-x[1]),"0.00");  // > CustomCode.calcF:50
    massValue[0]=" M1="+(q0).toFixed(0)+" kg ";  // > CustomCode.calcF:51
    massValue[1]=" m="+(q00).toFixed(0)+" kg ";  // > CustomCode.calcF:52
    massValue[2]=" M₂="+(q000).toFixed(0)+" kg ";  // > CustomCode.calcF:53
   }  // > CustomCode.calcF:54
   else {  // > CustomCode.calcF:55
     gforceValue[i] = "";  // > CustomCode.calcF:56
     phiValue[i] = "";  // > CustomCode.calcF:57
     massValue[0] = "";  // > CustomCode.calcF:58
     massValue[1] = "";  // > CustomCode.calcF:59
     massValue[2] = "";  // > CustomCode.calcF:60
   }  // > CustomCode.calcF:61
   }  // > CustomCode.calcF:62

     // > CustomCode.changeOrientation:25
  switch (window.orientation) { // using window.orientation as deciding factor  // > CustomCode.changeOrientation:26

      break;  // > CustomCode.changeOrientation:47

  function _setSolverClass(_odeName, _engine) {
    var ode = _getODE(_odeName);
    if (ode===null) return;
    if (!_engine.setODE) {
      var classname = _engine.toLowerCase();
      if      (classname.indexOf("boga")>=0)   _engine = EJSS_ODE_SOLVERS.bogackiShampine23;
      else if (classname.indexOf("cash")>=0)   _engine = EJSS_ODE_SOLVERS.cashKarp45;
      else if (classname.indexOf("dopri5")>=0) _engine = EJSS_ODE_SOLVERS.dopri5;
      else if (classname.indexOf("dopri8")>=0) _engine = EJSS_ODE_SOLVERS.dopri853;
      else if (classname.indexOf("richa")>=0)  _engine = EJSS_ODE_SOLVERS.eulerRichardson;
      else if (classname.indexOf("euler")>=0)  _engine = EJSS_ODE_SOLVERS.euler;
      else if (classname.indexOf("fehlberg87")>=0) _engine = EJSS_ODE_SOLVERS.fehlberg87;
      else if (classname.indexOf("fehlberg8")>=0)  _engine = EJSS_ODE_SOLVERS.fehlberg8;
      else if (classname.indexOf("radau")>=0)   _engine = EJSS_ODE_SOLVERS.radau5;
      else if (classname.indexOf("runge")>=0)  _engine = EJSS_ODE_SOLVERS.rungeKutta4;
      else if (classname.indexOf("rk4")>=0)    _engine = EJSS_ODE_SOLVERS.rungeKutta4;
      else if (classname.indexOf("verlet")>=0) _engine = EJSS_ODE_SOLVERS.velocityVerlet;
    }
    if (_engine) ode.setSolverClass(_engine);
  }

  function _ODE_evolution1() {
    var __odeSelf = {};
    var __eventSolver;
    var __solverClass = EJSS_ODE_SOLVERS.rungeKutta4;
    var __state=[];
    var _ODE_evolution1_Event1;
    var _ODE_evolution1_Event2;
    var _ODE_evolution1_Event3;
    var _ODE_evolution1_Event4;
    var __ignoreErrors=false;
    var __mustInitialize=true;
    var __isEnabled=true;
    var __mustUserReinitialize=false;
    var __mustReinitialize=true;

    var _xLength;
    var _vxLength;

    __odeSelf._getOdeVars = function (){ return["x","vx","t"]};

    __odeSelf.setSolverClass = function(__aSolverClass) {
      __solverClass = __aSolverClass;
      __instantiateSolver();
    };

    function __instantiateSolver() {
      __state=[];
      _xLength = x.length;
      _vxLength = vx.length;
      __pushState();
      __eventSolver = EJSS_ODE_SOLVERS.interpolatorEventSolver(__solverClass(),__odeSelf);
      __mustInitialize = true;
    }

    __odeSelf.setEnabled = function(_enabled) { __isEnabled = _enabled; };

    __odeSelf.getIndependentVariableValue = function() { return __eventSolver.getIndependentVariableValue(); };

    __odeSelf.getInternalStepSize = function() { return __eventSolver.getInternalStepSize(); };

    __odeSelf.isAccelerationIndependentOfVelocity = function() { return false; };

    __odeSelf.initializeSolver = function() {
      if (__arraysChanged()) { __instantiateSolver(); __odeSelf.initializeSolver(); return; }
      __pushState();
      __eventSolver.initialize(dt);
      __eventSolver.setBestInterpolation(false);
      __eventSolver.setMaximumInternalSteps(10000);
      __eventSolver.removeAllEvents();
      if (__pagesEnabled["hitM1left"]) __eventSolver.addEvent(_ODE_evolution1_Event1());
      if (__pagesEnabled["hitM1right"]) __eventSolver.addEvent(_ODE_evolution1_Event2());
