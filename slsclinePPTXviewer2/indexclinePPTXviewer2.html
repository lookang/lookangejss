<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PPTX Viewer Packager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />

  <!-- Runtime CSS for PPTXjs rendering (for the authoring preview only).
       The packaged ZIP will include a local copy under libs/pptxjs.css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/meshesha/PPTXjs/css/pptxjs.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nvd3@1.8.6/build/nv.d3.min.css" />
</head>
<body>
  <header class="toolbar">
    <div class="left-tools">
      <label class="button primary">
        <input id="file-input" type="file" accept=".pptx" hidden />
        Upload PPTX
      </label>
      <button id="load-sample-btn" class="button">Load Sample</button>
      <div id="drop-hint" class="hint">or drag & drop a .pptx here</div>
    </div>

    <div class="center-tools">
      <button id="prev-btn" class="icon-btn" title="Previous slide" disabled>&#9664;</button>
      <div class="slide-counter">
        <span id="slide-index">0</span> / <span id="slide-total">0</span>
      </div>
      <button id="next-btn" class="icon-btn" title="Next slide" disabled>&#9654;</button>
    </div>

    <div class="right-tools">
      <div id="filename" class="filename">No file selected</div>
      <button id="download-zip-btn" class="button" disabled>Download Package</button>
    </div>
  </header>

  <main class="viewer-shell" id="drop-zone">
    

    <section class="stage">
      <div id="viewer" class="pptx-viewer">
        <div class="empty-state">
          <div class="big-icon">📑</div>
          <div class="msg">Upload a .pptx to preview and package.</div>
        </div>
      </div>
    </section>
  </main>

  <!-- Minimal footer for attributions -->
  <footer class="footer">
    <span>
      Renders client-side with PPTXjs + JSZip. Packaging creates an offline viewer ZIP with all deps.
    </span>
  </footer>

  <!-- Libraries for authoring app runtime -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <!-- Use JSZip v2 for PPTXjs compatibility -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@2.7.0/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/meshesha/PPTXjs/filereader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@3.5.17/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nvd3@1.8.6/build/nv.d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/meshesha/PPTXjs/js/dingbat.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/meshesha/PPTXjs/js/pptxjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/meshesha/PPTXjs/js/divs2slides.min.js"></script>
  <!-- Packaging ZIP helper (separate from JSZip v2 used by PPTXjs) -->
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js"></script>

  <!-- App logic -->
  <script src="./app.js"></script>
</body>
</html>
