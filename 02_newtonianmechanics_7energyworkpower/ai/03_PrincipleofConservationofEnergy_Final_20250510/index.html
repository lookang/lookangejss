<!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML5 Interactive Content</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
    <div class="container">
    <!-- Added title -->
    <h1 class="simulation-title">Energy Conversion of a Ball on Free-Fall</h1>
    
    <div class="controls">
        <div class="slider-container">
            <!-- Changed from brown-text to black-text class -->
            <label for="height-slider" class="black-text">Initial Height: <span id="height-value">30</span> m</label>
            <input type="range" id="height-slider" min="20" max="50" value="30" step="5" class="slider">
        </div>
        <div class="constants">
            <!-- Changed from black-text to brown-text class -->
            <div class="brown-text">mass of ball = 1 kg</div>
            <div class="brown-text">g = 10 m/s<sup>2</sup></div>
        </div>
    </div>
    
    <div class="simulation-area">
        <div class="animation-container">
            <div id="ball"></div>
            <div id="floor"></div>
            <!-- Added floor label -->
            <div id="floor-label">Floor</div>
            <!-- Modified height arrow indicator to be closer to the ball -->
            <div id="height-arrow"></div>
            <div id="height-indicator">h = <span id="current-height">30</span> m</div>
        </div>
        
        <div class="graph-container">
            <div class="graph-title">Energy vs Time</div>
            <div id="graph">
                <canvas id="energy-graph" width="400" height="300"></canvas>
                <div class="axis-label y-axis">energy/J</div>
                <div class="axis-label x-axis">time/s</div>
                <!-- Added scale markers container -->
                <div id="axis-scales"></div>
            </div>
            <!-- Modified legend to be vertical and centered right -->
            <div class="legend">
                <div class="legend-item"><span class="pe-color"></span> PE: </div>
                <div class="legend-item"><span class="ke-color"></span> KE: </div>
                <!-- Added TE to legend -->
                <div class="legend-item"><span class="te-color"></span> TE: </div>
            </div>
        </div>
    </div>
    
    <div class="button-container">
        <button id="start-stop-btn">Start/Stop</button>
        <button id="reset-btn">Reset</button>
    </div>
    
    <div class="energy-values">
        <div class="energy-value">
            <label>K.E.:</label>
            <div id="ke-value" class="value-box">0 J</div>
        </div>
        <div class="energy-value">
            <label>G.P.E.:</label>
            <div id="gpe-value" class="value-box">300 J</div>
        </div>
        <div class="energy-value">
            <label>T.E.:</label>
            <div id="te-value" class="value-box">300 J</div>
        </div>
    </div>
</div>
<script src="script.js"></script>
