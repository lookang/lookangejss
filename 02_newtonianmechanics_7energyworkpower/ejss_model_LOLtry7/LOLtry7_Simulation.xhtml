  function answers1 () {    // depends on SCENARIO, need to include in Fixed relations.   // > CustomCode.toEdit_AnswerTemplate:1
    var LHS = 0;  // > CustomCode.toEdit_AnswerTemplate:2
    var RHS = 0;  // > CustomCode.toEdit_AnswerTemplate:3
    for (let i=0; i< iniTotalEnergy.length; i++){  // > CustomCode.toEdit_AnswerTemplate:4
      LHS += iniTotalEnergy[i];  // > CustomCode.toEdit_AnswerTemplate:5
      RHS += finTotalEnergy[i];  // > CustomCode.toEdit_AnswerTemplate:6
      }  // > CustomCode.toEdit_AnswerTemplate:7
    // (1) Total initial + transferred in = total final + transferred out  // > CustomCode.toEdit_AnswerTemplate:8
    if (LHS+EtransIN == RHS+EtransOUT){  // > CustomCode.toEdit_AnswerTemplate:9
      // (2) Zero C, E, G, I and N in the initial and final amount → only has kinetic → depends on SCENARIO  // > CustomCode.toEdit_AnswerTemplate:10
      if (zeroExceptEnergy(false,false,false,false,true,false) ){  // (C,E,G,I,K,N)  // > CustomCode.toEdit_AnswerTemplate:11
        // (3) Zero transfer out   // > CustomCode.toEdit_AnswerTemplate:12
        if (EtransOUT ==0){  // > CustomCode.toEdit_AnswerTemplate:13
          // (4) Some transfer in mechanically --> depends on SCENARIO  // > CustomCode.toEdit_AnswerTemplate:14
          if (updateTransIN == 2 && EtransIN > 0){      // > CustomCode.toEdit_AnswerTemplate:15
            // (5) Initial state only has K --> depends on SCENARIO  // > CustomCode.toEdit_AnswerTemplate:16
            if (iniTotalEnergy[4] >= 1){  // > CustomCode.toEdit_AnswerTemplate:17
              // (6) Final state K > initial state K --> depends on SCENARIO  // > CustomCode.toEdit_AnswerTemplate:18
              if ( finTotalEnergy[4] >= 1 && (finTotalEnergy[4] > iniTotalEnergy[4])  ){  // > CustomCode.toEdit_AnswerTemplate:19
                updateAnswer = 1;  // > CustomCode.toEdit_AnswerTemplate:20
                hint = '';  // > CustomCode.toEdit_AnswerTemplate:21
                }  // > CustomCode.toEdit_AnswerTemplate:22
              // (6) is wrong  // > CustomCode.toEdit_AnswerTemplate:23
              else {  // > CustomCode.toEdit_AnswerTemplate:24
                updateAnswer = 0;  // > CustomCode.toEdit_AnswerTemplate:25
                hint = "There should be more energy in the kinetic\nstore in the final state of the system.";  // > CustomCode.toEdit_AnswerTemplate:26
                }  // > CustomCode.toEdit_AnswerTemplate:27
              }  // > CustomCode.toEdit_AnswerTemplate:28
            // (5) is wrong  // > CustomCode.toEdit_AnswerTemplate:29
            else {  // > CustomCode.toEdit_AnswerTemplate:30
              updateAnswer = 0;  // > CustomCode.toEdit_AnswerTemplate:31
              hint = "There should only be energy in the kinetic\nstore in the initial state of the system.";  // > CustomCode.toEdit_AnswerTemplate:32
              }  // > CustomCode.toEdit_AnswerTemplate:33
            }  // > CustomCode.toEdit_AnswerTemplate:34
          // (4) is wrong  // > CustomCode.toEdit_AnswerTemplate:35
          else {  // > CustomCode.toEdit_AnswerTemplate:36
            updateAnswer = 0;  // > CustomCode.toEdit_AnswerTemplate:37
            hint = "There should be some energy transferred\n into the system mechanically due to the \nwork done by the child on the car. "; // --> depends on SCENARIO  // > CustomCode.toEdit_AnswerTemplate:38
            }  // > CustomCode.toEdit_AnswerTemplate:39
          }  // > CustomCode.toEdit_AnswerTemplate:40
        // (3) is wrong  // > CustomCode.toEdit_AnswerTemplate:41
        else {  // > CustomCode.toEdit_AnswerTemplate:42
          updateAnswer = 0;  // > CustomCode.toEdit_AnswerTemplate:43
          hint = "The energy transferred out of the \nsystem should be zero."  // > CustomCode.toEdit_AnswerTemplate:44
          }  // > CustomCode.toEdit_AnswerTemplate:45
        }  // > CustomCode.toEdit_AnswerTemplate:46
      // (2) is wrong  // > CustomCode.toEdit_AnswerTemplate:47
      else {  // > CustomCode.toEdit_AnswerTemplate:48
        updateAnswer = 0;  // > CustomCode.toEdit_AnswerTemplate:49
        hint = "The amount of energy in the chemical,\nelastic, gravitational, internal and nuclear\nstores should be zero.";  // > CustomCode.toEdit_AnswerTemplate:50
        }  // > CustomCode.toEdit_AnswerTemplate:51
      }  // > CustomCode.toEdit_AnswerTemplate:52
    // (1) is wrong  // > CustomCode.toEdit_AnswerTemplate:53

  function zeroExceptEnergy(C,E,G,I,K,N){  // Scenario 1: (false, false, false, false, TRUE, false)  // > CustomCode.answerAssistant:1
    // check which index gives false from the argument --> index to check //  // > CustomCode.answerAssistant:2
    let indexLst = [];  // > CustomCode.answerAssistant:3
    if (C==false){indexLst += [0]}  // > CustomCode.answerAssistant:4
    if (E==false){indexLst += [1]}  // > CustomCode.answerAssistant:5
    if (G==false){indexLst += [2]}  // > CustomCode.answerAssistant:6
    if (I==false){indexLst += [3]}  // > CustomCode.answerAssistant:7
    if (K==false){indexLst += [4]}  // > CustomCode.answerAssistant:8
    if (N==false){indexLst += [5]}  // > CustomCode.answerAssistant:9
    // checking process: //  // > CustomCode.answerAssistant:10
    for (let i=0; i< iniTotalEnergy.length; i++){  // > CustomCode.answerAssistant:11
      // Skip any energy that is true, so to check for 0 //  // > CustomCode.answerAssistant:12
      for (let j=0; j < indexLst.length; j++){  // > CustomCode.answerAssistant:13
        if ( (indexLst[j] ==i) && ( (iniTotalEnergy[i] !=0)||(finTotalEnergy[i] !=0)  ) ){  // > CustomCode.answerAssistant:14
          return false  // > CustomCode.answerAssistant:15
          }  // > CustomCode.answerAssistant:16
        }  // > CustomCode.answerAssistant:17
      }  // > CustomCode.answerAssistant:18
    return true  // > CustomCode.answerAssistant:19
    }  // > CustomCode.answerAssistant:20
