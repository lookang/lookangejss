  function zeroExceptEnergy(C,E,G,I,K,N){  // Scenario 1: (false, false, false, false, TRUE, false)  // > CustomCode.answerAssistants:1
    // check which index gives false from the argument --> index to check //  // > CustomCode.answerAssistants:2
    let indexLst = [];  // > CustomCode.answerAssistants:3
    if (C==false){indexLst += [0]}  // > CustomCode.answerAssistants:4

    if (I==false){indexLst += [3]}  // > CustomCode.answerAssistants:7
    if (K==false){indexLst += [4]}  // > CustomCode.answerAssistants:8
    if (N==false){indexLst += [5]}  // > CustomCode.answerAssistants:9
    // checking process: //  // > CustomCode.answerAssistants:10
    for (let i=0; i< iniTotalEnergy.length; i++){  // > CustomCode.answerAssistants:11
      // Skip any energy that is true, so to check for 0 //  // > CustomCode.answerAssistants:12
      for (let j=0; j < indexLst.length; j++){  // > CustomCode.answerAssistants:13
        if ( (indexLst[j] ==i) && ( (iniTotalEnergy[i] !=0)||(finTotalEnergy[i] !=0)  ) ){  // > CustomCode.answerAssistants:14
          return false  // > CustomCode.answerAssistants:15
          }  // > CustomCode.answerAssistants:16
        }  // > CustomCode.answerAssistants:17
      }  // > CustomCode.answerAssistants:18
    return true  // > CustomCode.answerAssistants:19
    }  // > CustomCode.answerAssistants:20
