  function random_elems(arr, count) {  // > CustomCode.random_elems:1
    let len = arr.length;  // > CustomCode.random_elems:2
    let lookup = {};  // > CustomCode.random_elems:3
    let tmp = [];  // > CustomCode.random_elems:4
    if (count > len)  // > CustomCode.random_elems:5
      count = len;  // > CustomCode.random_elems:6
    for (let i = 0; i < count; i++) {  // > CustomCode.random_elems:7
      let index;  // > CustomCode.random_elems:8
      do {  // > CustomCode.random_elems:9
        index = ~~(Math.random() * len);  // > CustomCode.random_elems:10
      } while (index in lookup);  // > CustomCode.random_elems:11
      lookup[index] = null;  // > CustomCode.random_elems:12
      tmp.push(arr[index]);  // > CustomCode.random_elems:13
    }  // > CustomCode.random_elems:14
    return tmp;  // > CustomCode.random_elems:15
  }  // > CustomCode.random_elems:16
