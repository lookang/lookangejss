    <script type="text/javascript"><!--//--><![CDATA[//><!--
function _simulation (_topFrame, _libraryPath, _codebasePath, _inputParameters) {

  var _model = EJSS_CORE.createAnimationLMS();
  var _view;
  var _isPlaying = false;
  var _isPaused = true;
  var _isEPub = false;
  var _isMobile = (navigator===undefined) ? false : navigator.userAgent.match(/iPhone|iPad|iPod|Android|BlackBerry|Opera Mini|IEMobile/i);

  var _stringProperties = {};
  var _tools = {
    showInputDialog : EJSS_INTERFACE.BoxPanel.showInputDialog,
    showOkDialog : EJSS_INTERFACE.BoxPanel.showOkDialog,
    showOkCancelDialog : EJSS_INTERFACE.BoxPanel.showOkCancelDialog,
    downloadText: EJSS_TOOLS.File.downloadText,
    uploadText: function(action) { EJSS_TOOLS.File.uploadText(_model,action); } 
  };

  function _play()  { _isPaused = false; _isPlaying = true;  _model.play();  }
  function _pause() { _isPaused = true;  _isPlaying = false; _model.pause(); }
  function _step()  { _pause();  _model.step(); }
  function _reset() { _model.reset();  _isPaused = _model.isPaused(); _isPlaying = _model.isPlaying(); }
  _model._play  = _play;
  _model._pause = _pause;
  _model._step  = _step;
  _model._reset = _reset;

  function _update() { _model.update(); }
  function _initialize() { _model.initialize(); }
  function _setFPS(_fps) { _model.setFPS(_fps); }
  function _setDelay(_delay) { _model.setDelay(_delay); }
  function _setStepsPerDisplay(_spd) { _model.setStepsPerDisplay(_spd); }
  function _setUpdateView(_updateView) { _model.setUpdateView(_updateView); }
  function _setAutoplay(_auto) { _model.setAutoplay(_auto); }
  function _println(_message) { console.log(_message); }
  function _breakAfterThisPage() { _model.setShouldBreak(true); }
  function _resetSolvers() { if (_model.resetSolvers) _model.resetSolvers(); }
  function _saveText(name,type,content) { if (_model.saveText) _model.saveText(name,type,content); }
  function _saveState(name) { if (_model.saveState) _model.saveState(name); }
  function _saveImage(name,panelname) { if (_model.saveImage) _model.saveImage(name,panelname); }
  function _readState(url,type) { if (_model.readState) _model.readState(url,type); }
  function _readText(url,type,varname) { if (_model.readText) _model.readText(url,type,varname); }
  // Is this still needed if we don't have locales???
  function _getStringProperty(propertyName) {
    var _value = _stringProperties[propertyName];
    if (_value===undefined) return propertyName;
    else return _value;
  }

  var __pagesEnabled = [];
  function _setPageEnabled(pageName,enabled) { __pagesEnabled[pageName] = enabled; }

  var blur; // Model.Variables.Var Table.blur
  var lensLength; // Model.Variables.Var Table.lensLength
  var lensColor; // Model.Variables.Var Table.lensColor
  var imageUrl; // Model.Variables.Var Table.imageUrl
  var opacity; // Model.Variables.Var Table.opacity
  var font; // Model.Variables.Var Table.font
  var state; // Model.Variables.Var Table.state

  function _serialize() { return _model.serialize(); }

  _model._userSerialize = function() {
    return { blur : blur, lensLength : lensLength, lensColor : lensColor, imageUrl : imageUrl, opacity : opacity, font : font, state : state };
  }
  function _serializePublic() { return _model.serializePublic(); }

  _model._userSerializePublic = function() {
    return { blur : blur, lensLength : lensLength, lensColor : lensColor, imageUrl : imageUrl, opacity : opacity, font : font, state : state };
  }

  _model._readParameters = function(json) {
    if(typeof json.blur != 'undefined') blur = json.blur;
    if(typeof json.lensLength != 'undefined') lensLength = json.lensLength;
    if(typeof json.lensColor != 'undefined') lensColor = json.lensColor;
    if(typeof json.imageUrl != 'undefined') imageUrl = json.imageUrl;
    if(typeof json.opacity != 'undefined') opacity = json.opacity;
    if(typeof json.font != 'undefined') font = json.font;
    if(typeof json.state != 'undefined') state = json.state;
  }

  _model._readParametersPublic = function(json) {
    if(typeof json.blur != 'undefined') blur = json.blur;
    if(typeof json.lensLength != 'undefined') lensLength = json.lensLength;
    if(typeof json.lensColor != 'undefined') lensColor = json.lensColor;
    if(typeof json.imageUrl != 'undefined') imageUrl = json.imageUrl;
    if(typeof json.opacity != 'undefined') opacity = json.opacity;
    if(typeof json.font != 'undefined') font = json.font;
    if(typeof json.state != 'undefined') state = json.state;
  }

  function _unserializePublic(json) { return _model.unserializePublic(json); }

  _model._userUnserializePublic = function(json) {
    _model._readParametersPublic(json);
    _resetSolvers();
    _model.update();
  }

  function _unserialize(json) { return _model.unserialize(json); }

  _model._userUnserialize = function(json) {
    _model._readParameters(json);
    _resetSolvers();
    _model.update();
  }

  _model.getOdes = function() { return []; }

  _model.removeEvents = function(){
  }

  _model.addToReset(function() {
    __pagesEnabled['Init Page'] = true;
    __pagesEnabled['FixRel Page'] = true;
  });

  _model.addToReset(function() { // Reset of Var Table
    lensLength = 4; // Model.Variables.Var Table.lensLength
    lensColor = "rgba(0, 0, 0, 0.5)"; // Model.Variables.Var Table.lensColor
    imageUrl = "./blurImage/sample_img1.jpg"; // Model.Variables.Var Table.imageUrl
    opacity = 0.5; // Model.Variables.Var Table.opacity
    font = "normal normal 2vw"; // Model.Variables.Var Table.font
    state = "Translucent"; // Model.Variables.Var Table.state
  }); // End of reset of Var Table

  if (_inputParameters) {
    _inputParameters = _model.parseInputParameters(_inputParameters);
    if (_inputParameters) _model.addToReset(function() { _model._readParameters(_inputParameters); });
  }

  _model.addToReset(function() {
    _model.setAutoplay(false);
    _model.setFPS(5);
    _model.setStepsPerDisplay(1);
  });

  // helper function to set multiple attributes to a single element // > Custom code page: setAttributes - line 1
  // ref: https://stackoverflow.com/questions/12274748/setting-multiple-attributes-for-an-element-at-once-with-javascript // > Custom code page: setAttributes - line 2
  function setAttributes (ele, attrs) { // > Custom code page: setAttributes - line 3
    for(var key in attrs){ // > Custom code page: setAttributes - line 4
      ele.setAttribute(key, attrs[key]); // > Custom code page: setAttributes - line 5
    } // > Custom code page: setAttributes - line 6
  } // > Custom code page: setAttributes - line 7

  _model.addToInitialization(function() {
    if (!__pagesEnabled['Init Page']) return;
    if (_isMobile){ // > Initialization page: Init Page - line 1
      //do nothing // > Initialization page: Init Page - line 2
    } // > Initialization page: Init Page - line 3
    else{ // > Initialization page: Init Page - line 4
        // copy this into the initialization // > Initialization page: Init Page - line 5
        // make the font bigger // > Initialization page: Init Page - line 6
      _view.plottingPanel.getMessageDecoration("TL").getFont().setFontSize("2vw"); // > Initialization page: Init Page - line 7
      _view.plottingPanel.getMessageDecoration("TR").getFont().setFontSize("2vw"); // > Initialization page: Init Page - line 8
      _view.plottingPanel.getMessageDecoration("BL").getFont().setFontSize("2vw"); // > Initialization page: Init Page - line 9
      _view.plottingPanel.getMessageDecoration("BR").getFont().setFontSize("2vw"); // > Initialization page: Init Page - line 10
    } // > Initialization page: Init Page - line 11
  });

  _model.addToFixedRelations(function() { _isPaused = _model.isPaused(); _isPlaying = _model.isPlaying(); });

  _model.addToFixedRelations(function() {
    if (!__pagesEnabled['FixRel Page']) return;
    /* // > Fixed Relations page: FixRel Page - line 1
    creates the svg filters for blurring and for clipping // > Fixed Relations page: FixRel Page - line 2
    HOW IT WORKS: // > Fixed Relations page: FixRel Page - line 3
    On top of the original image, a blurry image is placed on top of it. Using a clipPath, the blurry image is clipped such that it forms a circle, creating // > Fixed Relations page: FixRel Page - line 4
    the illusion that the lens is blurry instead. // > Fixed Relations page: FixRel Page - line 5
    */ // > Fixed Relations page: FixRel Page - line 6
    _view._update(); // > Fixed Relations page: FixRel Page - line 7
    _view._render(); // > Fixed Relations page: FixRel Page - line 8
    if(document.getElementById('lens') != null && document.getElementById('blurFilter') == null) { // > Fixed Relations page: FixRel Page - line 9
    	var defs = document.querySelector('#plottingPanel'); // > Fixed Relations page: FixRel Page - line 10
    	var filter = document.createElementNS("http://www.w3.org/2000/svg", "filter"); // > Fixed Relations page: FixRel Page - line 11
    	// setting the properties of the filter // > Fixed Relations page: FixRel Page - line 12
    	setAttributes(filter, { // > Fixed Relations page: FixRel Page - line 13
    		id: "blurFilter" // > Fixed Relations page: FixRel Page - line 14
    	}) // > Fixed Relations page: FixRel Page - line 15
    	// setting the properties of the blur // > Fixed Relations page: FixRel Page - line 16
    	var gaussBlur = document.createElementNS("http://www.w3.org/2000/svg", 'feGaussianBlur'); // > Fixed Relations page: FixRel Page - line 17
    	setAttributes(gaussBlur, { // > Fixed Relations page: FixRel Page - line 18
    	        id: "gaussBlur", // > Fixed Relations page: FixRel Page - line 19
    		in: "SourceGraphic", // > Fixed Relations page: FixRel Page - line 20
    		stdDeviation: 10 * opacity // > Fixed Relations page: FixRel Page - line 21
    	}); // > Fixed Relations page: FixRel Page - line 22
    	filter.append(gaussBlur); // > Fixed Relations page: FixRel Page - line 23
     // > Fixed Relations page: FixRel Page - line 24
    	// creating clipPath // > Fixed Relations page: FixRel Page - line 25
    	var blurClip = document.createElementNS("http://www.w3.org/2000/svg", "clipPath"); // > Fixed Relations page: FixRel Page - line 26
    	setAttributes(blurClip, { // > Fixed Relations page: FixRel Page - line 27
    		id: "blurClip" // > Fixed Relations page: FixRel Page - line 28
    	}) // > Fixed Relations page: FixRel Page - line 29
     // > Fixed Relations page: FixRel Page - line 30
    	// creating the circle in the clip path // > Fixed Relations page: FixRel Page - line 31
    	var clipCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle"); // > Fixed Relations page: FixRel Page - line 32
    	setAttributes(clipCircle, { // > Fixed Relations page: FixRel Page - line 33
    	       id: "clipCircle" // > Fixed Relations page: FixRel Page - line 34
    	}); // > Fixed Relations page: FixRel Page - line 35
    	var lens = document.getElementById('lens'); // > Fixed Relations page: FixRel Page - line 36
    	setAttributes(clipCircle, { // > Fixed Relations page: FixRel Page - line 37
    		cx: lens.getAttribute('cx'), // > Fixed Relations page: FixRel Page - line 38
    		cy: lens.getAttribute('cy'), // > Fixed Relations page: FixRel Page - line 39
    		r: lens.getAttribute('rx') // > Fixed Relations page: FixRel Page - line 40
    	}); // > Fixed Relations page: FixRel Page - line 41
    	blurClip.prepend(clipCircle); // > Fixed Relations page: FixRel Page - line 42
     // > Fixed Relations page: FixRel Page - line 43
    	defs.prepend(filter, blurClip); // > Fixed Relations page: FixRel Page - line 44
    } // > Fixed Relations page: FixRel Page - line 45
  });

  // Intentionally repeated
  _model.addToFixedRelations(function() { _isPaused = _model.isPaused(); _isPlaying = _model.isPlaying(); });

  _model._fontResized = function(iBase,iSize,iDelta) {
    _view._fontResized(iBase,iSize,iDelta);
  }; // end of _fontResized

  function _createView() {
    _view = new _simulationView(_topFrame,_libraryPath,_codebasePath);
    var _view_super_reset = _view._reset;
    _view._reset = function() {
      _view_super_reset();
      _view.imageLabel.linkProperty('Font', function() { return font; }, function(_v) { font = _v; }); // linking Font of imageLabel
      _view.comboBox.setAction('OnChange', function(_data, _info) { // Action OnChange for element comboBox
        var selected = _view.comboBox.getProperty("SelectedOptions"); // property OnChange of comboBox: line 1
        if(selected == "Image 1"){ // property OnChange of comboBox: line 2
          imageUrl = "./blurImage/sample_img1.jpg" // property OnChange of comboBox: line 3
        } // property OnChange of comboBox: line 4
        else if(selected == "Image 2"){ // property OnChange of comboBox: line 5
          imageUrl = "./blurImage/sample_img2.jpg" // property OnChange of comboBox: line 6
        } // property OnChange of comboBox: line 7
        else if(selected == "Image 3"){ // property OnChange of comboBox: line 8
          imageUrl = "./blurImage/sample_img3.jpg" // property OnChange of comboBox: line 9
        } // property OnChange of comboBox: line 10
        else{ // property OnChange of comboBox: line 11
          imageUrl = "./blurImage/sample_img4.jpg" // property OnChange of comboBox: line 12
        } // property OnChange of comboBox: line 13
      });
      _view.comboBox.linkProperty('Font', function() { return font; }, function(_v) { font = _v; }); // linking Font of comboBox
      _view.opacityLabel.linkProperty('Background', function() { return lensColor; }, function(_v) { lensColor = _v; }); // linking Background of opacityLabel
      _view.opacityLabel.linkProperty('Text', function() { return "Opacity: " + opacity; }); // linking Text of opacityLabel
      _view.opacityLabel.linkProperty('Font', function() { return font; }, function(_v) { font = _v; }); // linking Font of opacityLabel
      _view.opacitySlider.linkProperty('Background', function() { return lensColor; }, function(_v) { lensColor = _v; }); // linking Background of opacitySlider
      _view.opacitySlider.linkProperty('Value', function() { return opacity; }, function(_v) { opacity = _v; }); // linking Value of opacitySlider
      _view.opacitySlider.setAction('OnChange', function(_data, _info) { // Action OnChange for element opacitySlider
        // changing the color of the lens // property OnChange of opacitySlider: line 1
        lensColor = "rgba(0, 0, 0, " + opacity + ")"; // property OnChange of opacitySlider: line 2
        // changing the blurry effect on the lens // property OnChange of opacitySlider: line 3
        var gaussBlur = document.getElementById("gaussBlur"); // property OnChange of opacitySlider: line 4
        setAttributes(gaussBlur, { // property OnChange of opacitySlider: line 5
          stdDeviation: 10 * opacity // property OnChange of opacitySlider: line 6
        }); // property OnChange of opacitySlider: line 7
         // property OnChange of opacitySlider: line 8
        if (opacity==0){state="Transparent"} // property OnChange of opacitySlider: line 9
        else if (opacity==1){state="Opaque"} // property OnChange of opacitySlider: line 10
        else {state="Translucent"} // property OnChange of opacitySlider: line 11
      });
      _view.plottingPanel.linkProperty('TRMessage', function() { return state; }, function(_v) { state = _v; }); // linking TRMessage of plottingPanel
      _view.image.linkProperty('ImageUrl', function() { return imageUrl; }, function(_v) { imageUrl = _v; }); // linking ImageUrl of image
      _view.blurImage.linkProperty('ImageUrl', function() { return imageUrl; }, function(_v) { imageUrl = _v; }); // linking ImageUrl of blurImage
      _view.lens.linkProperty('FillColor', function() { return lensColor; }, function(_v) { lensColor = _v; }); // linking FillColor of lens
      _view.lens.linkProperty('SizeX', function() { return lensLength; }, function(_v) { lensLength = _v; }); // linking SizeX of lens
      _view.lens.linkProperty('SizeY', function() { return lensLength; }, function(_v) { lensLength = _v; }); // linking SizeY of lens
      _view.lens.setAction('OnDrag', function(_data, _info) { // Action OnDrag for element lens
        var lens = document.getElementById('lens'); // property OnDrag of lens: line 1
        var clipCircle = document.getElementById('clipCircle'); // property OnDrag of lens: line 2
        if(lens == null || clipCircle == null){ // property OnDrag of lens: line 3
          console.log(lens, clipCircle); // property OnDrag of lens: line 4
          return; // property OnDrag of lens: line 5
        } // property OnDrag of lens: line 6
        setAttributes(clipCircle, { // property OnDrag of lens: line 7
          cx: lens.getAttribute('cx'), // property OnDrag of lens: line 8
          cy: lens.getAttribute('cy') // property OnDrag of lens: line 9
        }); // property OnDrag of lens: line 10
      });
    }; // end of new reset

    _model.setView(_view);
    _model.reset();
    _view._enableEPub();
  } // end of _createView

  _model.setAutoplay(false);
  _model.setFPS(5);
  _model.setStepsPerDisplay(1);
  _createView(); // this includes _model.reset()
  return _model;
}

function _simulationView (_topFrame,_libraryPath,_codebasePath) {
  var _view = EJSS_CORE.createView(_topFrame);

  if (_libraryPath)  _view._setLibraryPath(_libraryPath);
  if (_codebasePath) _view._setResourcePath(_codebasePath);


  _view._reset = function() {
    _view._clearAll();
    _view._addElement(EJSS_INTERFACE.panel, 'topPanel', _view._topFrame);
    _view._addElement(EJSS_INTERFACE.imageAndTextButton, 'imageLabel', _view.topPanel)
      .setProperty("Text","Choose Image: ")
      ;
    _view._addElement(EJSS_INTERFACE.comboBox, 'comboBox', _view.topPanel)
      .setProperty("Options",["Image 1", "Image 2", "Image 3", "Image 4"])
      ;
    _view._addElement(EJSS_INTERFACE.imageAndTextButton, 'opacityLabel', _view.topPanel);
    _view._addElement(EJSS_INTERFACE.slider, 'opacitySlider', _view.topPanel)
      .setProperty("Width","20%")
      .setProperty("Minimum",0)
      .setProperty("Maximum",1)
      .setProperty("Step",0.1)
      ;
    _view._addElement(EJSS_INTERFACE.panel, 'mainPanel', _view._topFrame);
    _view._addElement(EJSS_DRAWING2D.plottingPanel, 'plottingPanel', _view.mainPanel)
      .setProperty("Height","90vh")
      .setProperty("Width","100%")
      .setProperty("Gutters",[0,0,0,0])
      .setProperty("YScalePrecision",0)
      .setProperty("XFixedTick",0)
      .setProperty("Enabled",true)
      .setProperty("SquareAspect",true)
      .setProperty("MaximumY",4.5)
      .setProperty("YFixedTick",0)
      .setProperty("YAutoTicks",false)
      .setProperty("MinimumY",-4.5)
      .setProperty("XTickStep",1)
      .setProperty("YTickStep",1)
      .setProperty("AutoScaleY",false)
      .setProperty("AutoScaleX",false)
      .setProperty("XAutoTicks",false)
      .setProperty("XScalePrecision",0)
      ;
    _view._addElement(EJSS_DRAWING2D.image, 'image', _view.plottingPanel)
      .setProperty("SizeX",16)
      .setProperty("SizeY",9)
      ;
    _view._addElement(EJSS_DRAWING2D.image, 'blurImage', _view.plottingPanel)
      .setProperty("SizeX",16)
      .setProperty("Attributes",{   "filter": 'url(#blurFilter)',   "clip-path": "url(#blurClip)" })
      .setProperty("SizeY",9)
      ;
    _view._addElement(EJSS_DRAWING2D.shape, 'lens', _view.plottingPanel)
      .setProperty("Sensitivity",100)
      .setProperty("ShapeType","ELLIPSE")
      .setProperty("LineColor","black")
      .setProperty("LineWidth",10)
      .setProperty("EnabledPosition","ENABLED_ANY")
      ;
  }; // end of _view._reset
  return _view;
}
