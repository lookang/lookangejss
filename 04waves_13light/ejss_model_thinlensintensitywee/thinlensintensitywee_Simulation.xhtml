  function dragf2 () {  // > CustomCode.dragf:7

  function updateaction () {  // > CustomCode.update:1
  cvalue=255;  // > CustomCode.update:2
  var dy=lh/n,lymin;  // > CustomCode.update:3
  zero=0;  // > CustomCode.update:4
  x1=x+f;  // > CustomCode.update:5
  x2=x-f;  // > CustomCode.update:6
  if(f!=p)q=x+(x-p)*f/(x-p-f);  // > CustomCode.update:7
  else q=1.e5;  // > CustomCode.update:8
  h2=q/p*h;  // > CustomCode.update:9
  lymin=-lh/2+dy/2-ly;  // > CustomCode.update:10
  for (var i=0;i<n;i++){  // > CustomCode.update:11
    xp1[i]=p;  // > CustomCode.update:12
    yp1[i]=ly;  // > CustomCode.update:13
    dxp1[i]=x-p;  // > CustomCode.update:14
    dyp1[i]=lymin+i*dy;  // > CustomCode.update:15
    xp2[i]=q;  // > CustomCode.update:16
    yp2[i]=h2;  // > CustomCode.update:17
     dxp2[i]=x-q;  // > CustomCode.update:18
     dyp2[i]=dyp1[i]+ly-ly*h2/h;  // > CustomCode.update:19
    block[i]=-1;  // > CustomCode.update:20
    stage[i]=0;  // > CustomCode.update:21
  }  // > CustomCode.update:22
  bcount=0;  // > CustomCode.update:23
  t=0;  // > CustomCode.update:24
  clr=rgb(0,0,255);  // > CustomCode.update:25
   //_resetView();  // > CustomCode.update:26
  }  // > CustomCode.update:27

  _model.addToFixedRelations(function() {
    if (!__pagesEnabled["Cons Page"]) return;
    var vx=0,vy=0,v,x2,y2,ddt;  // > FixedRelations.Cons Page:1
    var count;  // > FixedRelations.Cons Page:2
    count=0;  // > FixedRelations.Cons Page:3
    if(t>dt)for(var i=0;i<n;i++){  // > FixedRelations.Cons Page:4
     if(block[i]==1){//blocked   // > FixedRelations.Cons Page:5
       count++;  // > FixedRelations.Cons Page:6
     }else if(xp1[i]<x){  // > FixedRelations.Cons Page:7
       vx=dxp1[i]; vy=dyp1[i];  // > FixedRelations.Cons Page:8
     }else if(xp1[i]<xmax){  // > FixedRelations.Cons Page:9
       if(dxp2[i]<0){  // > FixedRelations.Cons Page:10
       vx=-dxp2[i]; vy=-dyp2[i];  // > FixedRelations.Cons Page:11
       }else{  // > FixedRelations.Cons Page:12
        vx=dxp2[i]; vy=dyp2[i];  // > FixedRelations.Cons Page:13
       }  // > FixedRelations.Cons Page:14
     }else{// pass xmax  // > FixedRelations.Cons Page:15
       vx=dxp1[i]; vy=dyp1[i];  // > FixedRelations.Cons Page:16
       count++;  // > FixedRelations.Cons Page:17
     }  // > FixedRelations.Cons Page:18
      if(block[i]<1){//not blocked  // > FixedRelations.Cons Page:19
        v=Math.sqrt(vx*vx+vy*vy);  // > FixedRelations.Cons Page:20
        vxp=vx*c/v;  // > FixedRelations.Cons Page:21
        vyp=vy*c/v;  // > FixedRelations.Cons Page:22
        x2=xp1[i]+vxp*dt;  // > FixedRelations.Cons Page:23
        y2=yp1[i]+vyp*dt;  // > FixedRelations.Cons Page:24
        if((bx-xp1[i])*(bx-x2) <=0 ){// may be passing block  // > FixedRelations.Cons Page:25
          ddt=(bx-xp1[i])/vxp;  // > FixedRelations.Cons Page:26
          if( (y2-bh)*(y2-bhbottom)>=0) {// blocked added bottom by lookang  // > FixedRelations.Cons Page:27
            block[i]=1;  // > FixedRelations.Cons Page:28
            x2=bx;  // > FixedRelations.Cons Page:29
            y2=yp1[i]+vyp*ddt;  // > FixedRelations.Cons Page:30
             count++;  // > FixedRelations.Cons Page:31
             bcount++;  // > FixedRelations.Cons Page:32
             blocked=true;  // > FixedRelations.Cons Page:33
             cvalue=parseInt(255.*(n-bcount)*(n-bcount)/n/n);  // > FixedRelations.Cons Page:34
             clr="rgba(0,0,cvalue,cvalue)";  // > FixedRelations.Cons Page:35
          }  // > FixedRelations.Cons Page:36
        }else if((x-xp1[i])*(x-x2) <0 ){//passing lens  // > FixedRelations.Cons Page:37
          ddt=(x-xp1[i])/vxp;  // > FixedRelations.Cons Page:38
          x2=x;  // > FixedRelations.Cons Page:39
          y2=yp1[i]+vyp*ddt;   // > FixedRelations.Cons Page:40
        }  // > FixedRelations.Cons Page:41
          xp1[i]=x2;  // > FixedRelations.Cons Page:42
          yp1[i]=y2;  // > FixedRelations.Cons Page:43
     }  // > FixedRelations.Cons Page:44
    }  // > FixedRelations.Cons Page:45
    Ivalue=parseInt(cvalue*1000/255)/10;  // > FixedRelations.Cons Page:46
    Itext=I_intensity+"= ???%";  // > FixedRelations.Cons Page:47
    if(count===n){  // > FixedRelations.Cons Page:48
     if(autoy){  // > FixedRelations.Cons Page:49
      ly+=ldy;  // > FixedRelations.Cons Page:50
      if(ly>h){  // > FixedRelations.Cons Page:51
       ly=h;  // > FixedRelations.Cons Page:52
      ldy=-Math.abs(ldy);   // > FixedRelations.Cons Page:53
      }else if(ly<0){  // > FixedRelations.Cons Page:54
       ly=0;  // > FixedRelations.Cons Page:55
       ldy=Math.abs(ldy);  // > FixedRelations.Cons Page:56
      }  // > FixedRelations.Cons Page:57
     }  // > FixedRelations.Cons Page:58
    _pause();  // > FixedRelations.Cons Page:59
    Itext=I_intensity+"="+Ivalue+"%";  // > FixedRelations.Cons Page:60
    text = "paused";  // > FixedRelations.Cons Page:61
    //_initialize();  // > FixedRelations.Cons Page:62
    }  // > FixedRelations.Cons Page:63
