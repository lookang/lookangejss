  //https://basarat.gitbook.io/typescript/future-javascript/classes  // > CustomCode.calcShadow:1
  class Point {  // > CustomCode.calcShadow:2
    constructor(x, y, z) {  // > CustomCode.calcShadow:3
      this.x = x;  // > CustomCode.calcShadow:4
      this.y = y;  // > CustomCode.calcShadow:5
      this.z = z;  // > CustomCode.calcShadow:6
    }  // > CustomCode.calcShadow:7
  }  // > CustomCode.calcShadow:8
  // determining the shape of the shadow  // > CustomCode.calcShadow:9
  function calcShadow() {  // > CustomCode.calcShadow:10
    var light = new Point(lightX, lightY, lightZ);  // > CustomCode.calcShadow:11
    var object, length, dy, dx;  // > CustomCode.calcShadow:12
      // > CustomCode.calcShadow:13
    if(objectType == "cube"){  // > CustomCode.calcShadow:14
       object = new Point(cubeX, cubeY, cubeZ + cubeLength / 2); // object the centre of  the 4 points edge of the light touching the cube?  // > CustomCode.calcShadow:15
      // object = new Point(cubeX, cubeY, cubeZ + cubeLength  );  // > CustomCode.calcShadow:16
       length = cubeLength;  // > CustomCode.calcShadow:17
       dx = [1, 1, -1, -1]; // top bottom left right point  // > CustomCode.calcShadow:18
       dy = [1, -1, 1, -1];  // > CustomCode.calcShadow:19
    }  // > CustomCode.calcShadow:20
    else if(objectType == "sphere"){  // > CustomCode.calcShadow:21
      var distance = light.z - sphereZ;  // > CustomCode.calcShadow:22
      var offset = (sphereRadius * sphereRadius) / distance;  // > CustomCode.calcShadow:23
        // > CustomCode.calcShadow:24
      object = new Point(sphereX, sphereY, sphereZ + offset);  // > CustomCode.calcShadow:25
      length = (sphereRadius * Math.sin(Math.acos(sphereRadius / distance))) * 2;  // > CustomCode.calcShadow:26
      dx = [1, -1, 0, 0]; // top bottom left right point  // > CustomCode.calcShadow:27
      dy = [0, 0, 1, -1];  // > CustomCode.calcShadow:28
    }  // > CustomCode.calcShadow:29
      // > CustomCode.calcShadow:30
    // stores the edge points of the shadow  // > CustomCode.calcShadow:31
    shadowCorners = [];  // > CustomCode.calcShadow:32
    for(var i = 0; i < 4; i++) {  // > CustomCode.calcShadow:33
