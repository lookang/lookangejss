  var xi,dx,xf,d1,d2;  // > CustomCode.calpath:1
  function calpath (x, y) {  // > CustomCode.calpath:2
  //  delta=1;  // > CustomCode.calpath:3
    xi=(x[0]+x[2])/2;  // > CustomCode.calpath:4
    dx=(x[0]-xi)/2;  // > CustomCode.calpath:5
    if((eyey>0 && n1>n2)|| (eyey<0 && n1<n2))dx=-dx;  // > CustomCode.calpath:6
    while(Math.abs(dx)>minimum){  // > CustomCode.calpath:7
      xf=xi+dx;  // > CustomCode.calpath:8
      d1=caldiff(xi,x[2],y[2],x[0],y[0]);  // > CustomCode.calpath:9
      d2=caldiff(xf,x[2],y[2],x[0],y[0]);  // > CustomCode.calpath:10
      if(d1*d2>0 && Math.abs(d1)>Math.abs(d2) ) xi=xf;  // > CustomCode.calpath:11
      dx=dx/2;  // > CustomCode.calpath:12
    }  // > CustomCode.calpath:13
    x[1]=xf;  // > CustomCode.calpath:14
  }  // > CustomCode.calpath:15
  function caldiff(x, x1, y1, x2, y2){  // > CustomCode.calpath:16
   if(eyey>0)return n1*(x-x1)/Math.sqrt((x-x1)*(x-x1)+y1*y1)-n2*(x2-x)/Math.sqrt((x-x2)*(x-x2)+y2*y2);  // > CustomCode.calpath:17
   else return n2*(x-x1)/Math.sqrt((x-x1)*(x-x1)+y1*y1)-n1*(x2-x)/Math.sqrt((x-x2)*(x-x2)+y2*y2);  // > CustomCode.calpath:18
  }  // > CustomCode.calpath:19

  function calr12(dx, dy){  // > CustomCode.calr12:4
  var sc2,c1,c2,sc1,r12;  // > CustomCode.calr12:5
  sc2=dx/Math.sqrt(dx*dx+dy*dy);  // > CustomCode.calr12:6
  if(sc2!=0.0){  // > CustomCode.calr12:7
  sc1=n2*sc2/n1;  // > CustomCode.calr12:8
  c1=Math.asin(sc1);  // > CustomCode.calr12:9
  c2=Math.asin(sc2);  // > CustomCode.calr12:10
  r12=Math.sin(c1-c2)/Math.sin(c1+c2);  // > CustomCode.calr12:11
  }else{  // > CustomCode.calr12:12
  r12=0.0;  // > CustomCode.calr12:13
  }  // > CustomCode.calr12:14
  return r12;  // > CustomCode.calr12:15
  }  // > CustomCode.calr12:16
