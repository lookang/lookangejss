e fuzzy.</li>     <li><strong>Opaque</strong>: very little light passes through, so the image cannot be seen clearly.</li>   </ul>    <h3>Questions to Think About</h3>   <ul>     <li>What happens when transmission is high but scattering is low?</li>     <li>What happens when transmission is still high but scattering increases?</li>     <li>Why is a translucent material different from an opaque one?</li>     <li>Can two materials allow the same amount of light through but still look different?</li>   </ul>    <h3>Learning Goal</h3>   <p>     Use this simulation to understand that the appearance of a material depends not only on     how much light it lets through, but also on whether that light remains clear or becomes scattered.   </p> </div>")
