<!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
    <h2>ray model of light: reflection simulation</h2>
<div class="sim-wrapper">
  <!-- VISUALISATION AREA -->
  <canvas id="rayCanvas" width="520" height="320"></canvas>

  <!-- CONTROL PANEL -->
  <div class="controls">
      <label for="angleSlider">
          angle of incidence, i (°): <span id="angleDisplay">30.0</span>
      </label>
      <input type="range" id="angleSlider" min="0" max="90" step="0.1" value="30">
      <button id="recordBtn">record</button>
      <button id="plotBtn">plot graph</button>
      <button id="resetBtn">reset</button>
  </div>

  <!-- TABLE + GRAPH CONTAINER -->
  <div class="result-wrapper">
      <!-- DATA TABLE -->
      <table id="dataTable">
          <thead>
              <tr>
                  <th>#</th>
                  <th>angle of incidence, i (°)</th>
                  <th>angle of reflection, r (°)</th>
              </tr>
          </thead>
          <tbody></tbody>
      </table>
      <!-- GRAPH AREA -->
      <canvas id="graphCanvas" width="320" height="320" class="hidden"></canvas>
  </div>
</div>
<script src="script.js"></script>
