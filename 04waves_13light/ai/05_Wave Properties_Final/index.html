<!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML5 Interactive Content</title>
        <link rel="stylesheet" href="styles.css">
      <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S9EWRY1CPJ');
  </script>
</head>
    <body>
    <div class="container">
    <h1>Wave Properties Simulation</h1>
    
    <div class="graphs-container">
        <div class="graph-wrapper">
            <h3>Displacement-Time Graph</h3>
            <canvas id="timeGraph" width="600" height="300"></canvas>
            <div class="axis-label x-label">Time (s)</div>
            <div class="axis-label y-label">Displacement (cm)</div>
        </div>
        
        <div class="graph-wrapper">
            <h3>Displacement-Distance Graph</h3>
            <canvas id="distanceGraph" width="600" height="300"></canvas>
            <div class="axis-label x-label">Distance (cm)</div>
            <div class="axis-label y-label">Displacement (cm)</div>
        </div>
    </div>
    
    <div class="controls-container">
        <div class="slider-container">
            <label for="wavelength" title="Wavelength is the distance between two crests.">Wavelength (cm): <span id="wavelengthValue">5.0</span></label>
            <input type="range" id="wavelength" min="0.5" max="10" step="0.5" value="5">
        </div>
        
        <div class="slider-container">
            <label for="amplitude" title="Amplitude is the maximum displacement of the wave from its rest position.">Amplitude (cm): <span id="amplitudeValue">2.0</span></label>
            <input type="range" id="amplitude" min="0.5" max="3" step="0.5" value="2">
        </div>
        
        <div class="slider-container">
            <label for="period" title="Period is the time taken for one complete wave.">Period (s): <span id="periodValue">2.0</span></label>
            <input type="range" id="period" min="0.5" max="5" step="0.5" value="2">
        </div>
        
        <div class="slider-container">
            <label for="frequency" title="Frequency is the number of waves generated per second.">Frequency (Hz): <span id="frequencyValue">0.5</span></label>
            <input type="range" id="frequency" min="0.5" max="2" step="0.1" value="0.5">
        </div>
    </div>
    
    <div class="info-container">
        <div class="wave-speed">
            <p>Wave Speed = <span id="waveSpeedValue">2.5</span> cm/s</p>
            <p><em>(Wave Speed = Frequency × Wavelength)</em></p>
        </div>
        
        <div class="buttons-container">
            <!-- Added Start/Pause button -->
            <button id="startPauseButton" class="control-button">Pause</button>
            <button id="resetButton" class="reset-button">Reset</button>
        </div>
    </div>
</div>
<script src="script.js"></script>
        <script src="script.js"></script>
    </body>
    </html>
