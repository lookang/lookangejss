<!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML5 Interactive Content</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
    <div class="container">
    <div class="header">
        <h1>Investigating the Law of Refraction</h1>
    </div>
    <div class="controls">
        <div class="control-group">
            <label for="incidenceSlider">Angle of Incidence (i): <span id="incidenceValue">30°</span></label>
            <input type="range" id="incidenceSlider" min="0" max="90" value="30" class="slider">
        </div>
        <div class="control-group">
            <label for="mediumSelect">Select Medium 2:</label>
            <select id="mediumSelect">
                <option value="1">Air (n=1)</option>
                <option value="1.3" selected>Water (n=1.3)</option>
                <option value="1.5">Glass (n=1.5)</option>
                <option value="2.4">Diamond (n=2.4)</option>
            </select>
        </div>
        <div class="button-group">
            <button id="recordBtn">Record</button>
            <!-- Moved Show Graph button to be between Record and Reset buttons -->
            <button id="showGraphBtn">Show Graph</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>
    <div class="simulation-area">
        <canvas id="simulationCanvas" width="600" height="400"></canvas>
    </div>
    <div class="results-area">
        <div class="data-table">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>i / degree</th>
                        <th>r / degree</th>
                        <th>sin i</th>
                        <th>sin r</th>
                        <th>sin i / sin r</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data rows will be added here by JavaScript -->
                </tbody>
            </table>
        </div>
        <div class="graph-area">
            <canvas id="graphCanvas" width="400" height="400"></canvas>
        </div>
    </div>
</div>
<script src="script.js"></script>
        <script src="script.js"></script>

        <p>Created by ang_keng_kiat@schools.gov.sg using <a href="https://moeptt.vercel.app/" target="_blank">https://moeptt.vercel.app/</a></p>
