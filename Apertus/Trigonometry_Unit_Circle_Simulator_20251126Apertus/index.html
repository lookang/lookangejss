<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trigonometry Unit Circle Simulator</title>
    <style>
        /* Basic styling */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .controls { text-align: center; margin-bottom: 20px; }
        .unit-circle { width: 200px; height: 200px; margin: 20px 0; position: relative; }
        .unit-circle canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .graph { width: 100%; height: 300px; margin: 20px 0; }
        .controls button { margin: 5px; }
        .tooltip { position: absolute; background: rgba(255, 255, 255, 0.8); padding: 10px; border-radius: 5px; font-size: 14px; color: #333; z-index: 10; opacity: 0; transition: opacity 0.3s; }
        .tooltip.show { opacity: 1; }
        /* Touch-friendly and mobile-friendly */
        * { touch-action: none; }
    </style>
    <script>
        // Main JavaScript logic here
    </script>
</head>
<body>
    <div class="container">
        <h2>Trigonometry Unit Circle Simulator</h2>
        <div class="controls">
            <label for="degree">Angle (degrees):</label>
            <input type="number" id="degree" min="0" max="360" value="0" oninput="updateAngle()" />
            <button onclick="reset()">Reset</button>
            <button onclick="toggleRadian()">Toggle Radians</button>
        </div>
        <div class="unit-circle">
            <canvas id="unitCircle" width="200" height="200"></canvas>
            <div class="tooltip" id="angleTip">Angle: 0°</div>
        </div>
        <div class="graph">
            <canvas id="sinGraph" width="400" height="300"></canvas>
            <canvas id="cosGraph" width="400" height="300"></canvas>
            <div class="legend">
                <span>y = sin(x)</span>
                <span>y = cos(x)</span>
            </div>
        </div>
        <div class="analytics">
            <button onclick="toggleAnalytics()">Show Analytics</button>
            <div id="analyticsLog" style="display: none; padding: 10px; border: 1px solid #ccc; border-radius: 5px; max-height: 200px; overflow-y: auto; background: #f9f9f9; color: #333;">
                <p>Action Log (click to clear):</p>
                <ul id="actionLog"></ul>
                <button onclick="clearLog()">Clear Log</button>
            </div>
        </div>
    </div>
</body>
</html>
