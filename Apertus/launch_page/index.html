<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chinese Interactive to support Student Learning Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script async="true" src="https://www.googletagmanager.com/gtag/js?id=G-S9EWRY1CPJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-S9EWRY1CPJ');
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="logo">📚</div>
        <div class="titles">
          <h1><a href="https://vle.learning.moe.edu.sg/class-group/view/fb19f5f8-198c-4f8d-b1fd-1910dc16d40a?tab=forum&typeUuid=3ce7a541-e9da-4c52-89f8-0e6bc2df3d41&actionType=TOPIC" target="_blank" rel="noopener">Chinese Interactive to support Student Learning Space</a></h1>
          <p class="subtitle">Explore other interactives at <a href="https://sg.iwant2study.org/ospsg/index.php/interactive-resources/mother-tongue-languages/chinese" target="_blank" rel="noopener">iwant2study.org Chinese</a>, track views and downloads</p>
        </div>
      </div>
      <div class="stats" id="global-stats">
        <div class="stat"><span id="stat-count">0</span><label>Interactives</label></div>
        <div class="stat"><span id="stat-views">0</span><label>Total Views</label></div>
        <div class="stat"><span id="stat-downloads">0</span><label>Total Downloads</label></div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <div class="search-box">
        <input id="search" type="text" placeholder="Search by title or folder..." />
        <button id="clearSearch" title="Clear">✖</button>
      </div>
      <div class="control-row">
        <div class="control">
          <label for="folderFilter">Folder</label>
          <select id="folderFilter">
            <option value="">All folders</option>
          </select>
        </div>
        <div class="control">
          <label for="sortBy">Sort by</label>
          <select id="sortBy">
            <option value="title">Title (A–Z)</option>
            <option value="modified">Last Modified (newest)</option>
            <option value="views">Views (high→low)</option>
            <option value="downloads">Downloads (high→low)</option>
          </select>
        </div>
        <div class="control">
          <label for="typeFilter">Type</label>
          <select id="typeFilter">
            <option value="">All</option>
            <option value="Folder Index">Folder Index</option>
            <option value="Single HTML">Single HTML</option>
          </select>
        </div>
        <div class="control toggles">
          <label><input type="checkbox" id="hasZipOnly" /> Zip available only</label>
        </div>
      </div>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <template id="card-template">
    <article class="card">
      <div class="card-top">
        <div class="badge type" data-type="">Type</div>
        <div class="badge folder" title="Folder"></div>
      </div>
      <div class="thumb"><img alt="Preview image" loading="lazy" /></div>
      <h3 class="title"></h3>
      <div class="meta">
        <div class="meta-row">
          <span class="meta-item" title="Views">👁️ <b class="views">0</b></span>
          <span class="meta-item" title="Downloads">⬇️ <b class="downloads">0</b></span>
        </div>
        <div class="meta-row small">
          <span class="meta-item" title="Last modified">🕒 <span class="modified">—</span></span>
          <span class="meta-item zip" title="Zip size" hidden>🗜️ <span class="zip-size">—</span></span>
        </div>
      </div>
      <div class="actions">
        <a class="btn primary open" target="_self" rel="noopener">Open</a>
        <a class="btn download" target="_self" rel="noopener" hidden>Download</a>
      </div>
    </article>
  </template>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© <span id="year"></span> Chinese Folder maintainer: <a href="https://www.facebook.com/s.zehuii/" target="_blank" rel="noopener">Francesca</a></span>
      <span class="hint">New items appear automatically from this folder</span>
    </div>
  </footer>

  <script src="app.client.js" type="module"></script>
</body>
</html>
