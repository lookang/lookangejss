  function compareGas(gas,peaks,ampPeaks,MIN_AMPLITUDE) { // added ,MIN_AMPLITUDE as an input  // > CustomCode.lookForGas:141
    var TOLERANCE = 12.0;  // > CustomCode.lookForGas:142
      // > CustomCode.lookForGas:143
    var TOTALINTENSITY=0;  // > CustomCode.lookForGas:144
    var AVERAGEINTENSITY=0;  // > CustomCode.lookForGas:145
    for (var i=0; i<ylabel.length ; i++) {  // > CustomCode.lookForGas:146
     TOTALINTENSITY = (TOTALINTENSITY+ ylabel[i]); //leong  // > CustomCode.lookForGas:147
  }  // > CustomCode.lookForGas:148
  AVERAGEINTENSITY = TOTALINTENSITY/ylabel.length;  // > CustomCode.lookForGas:149
  //console.log(AVERAGEINTENSITY);  // > CustomCode.lookForGas:150
    //var MIN_AMPLITUDE = AVERAGEINTENSITY;  // > CustomCode.lookForGas:151
    //var MIN_AMPLITUDE = 0.2; // remove to allow MIN_AMPLITUDE to work an input  // > CustomCode.lookForGas:152
    var gasInPeaks = true;  // > CustomCode.lookForGas:153
    for (var i=0; i<gas.length; i++) {  // > CustomCode.lookForGas:154
      var gasPeakInPeaks = false;  // > CustomCode.lookForGas:155
      for (var j=0; j<peaks.length; j++) {  // > CustomCode.lookForGas:156
        if (ampPeaks[j] < MIN_AMPLITUDE) continue;  // > CustomCode.lookForGas:157
        gasPeakInPeaks = gasPeakInPeaks ||   // > CustomCode.lookForGas:158
            (Math.abs(parseFloat(gas[i])-parseFloat(peaks[j])) < TOLERANCE);  // > CustomCode.lookForGas:159
      }  // > CustomCode.lookForGas:160
      gasInPeaks = gasInPeaks && gasPeakInPeaks;  // > CustomCode.lookForGas:161
    }  // > CustomCode.lookForGas:162
    return gasInPeaks;  // > CustomCode.lookForGas:163
    //console.log(gasInPeaks);  // > CustomCode.lookForGas:164
  }  // > CustomCode.lookForGas:165

  //https://en.wikipedia.org/wiki/HSL_and_HSV  // > CustomCode.luminance:1
  function hsl_luminance(r,g,b) {  // > CustomCode.luminance:2
    r /= 255, g /= 255, b /= 255; //normalize   // > CustomCode.luminance:3
    var max = Math.max(r, g, b), min = Math.min(r, g, b);  // > CustomCode.luminance:4
    var h, s, l = (max + min) / 2;  // > CustomCode.luminance:5
    if (max == min) {  // > CustomCode.luminance:6
      h = s = 0; // achromatic  // > CustomCode.luminance:7
    } else {  // > CustomCode.luminance:8
      var d = max - min;  // > CustomCode.luminance:9
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);  // > CustomCode.luminance:10
      switch (max) {  // > CustomCode.luminance:11
          case r:  // > CustomCode.luminance:12
              h = (g - b) / d + (g < b ? 6 : 0);  // > CustomCode.luminance:13
              break;  // > CustomCode.luminance:14
          case g:  // > CustomCode.luminance:15
              h = (b - r) / d + 2;  // > CustomCode.luminance:16
              break;  // > CustomCode.luminance:17
          case b:  // > CustomCode.luminance:18
              h = (r - g) / d + 4;  // > CustomCode.luminance:19
              break;  // > CustomCode.luminance:20
      }  // > CustomCode.luminance:21
      h /= 6;  // > CustomCode.luminance:22
    }  // > CustomCode.luminance:23
    return l; //lumumoius, only using l  // > CustomCode.luminance:24
  }  // > CustomCode.luminance:25
  function hsv_value(r,g,b) {  // > CustomCode.luminance:26
      let rabs, gabs, babs, rr, gg, bb, h, s, v, diff, diffc, percentRoundFn;  // > CustomCode.luminance:27
      rabs = r / 255;  // > CustomCode.luminance:28
      gabs = g / 255;  // > CustomCode.luminance:29
      babs = b / 255;  // > CustomCode.luminance:30
      v = Math.max(rabs, gabs, babs),  // > CustomCode.luminance:31
      diff = v - Math.min(rabs, gabs, babs);  // > CustomCode.luminance:32
      diffc = c => (v - c) / 6 / diff + 1 / 2;  // > CustomCode.luminance:33
      percentRoundFn = num => Math.round(num * 100) / 100;  // > CustomCode.luminance:34
      if (diff == 0) {  // > CustomCode.luminance:35
          h = s = 0;  // > CustomCode.luminance:36
      } else {  // > CustomCode.luminance:37
          s = diff / v;  // > CustomCode.luminance:38
          rr = diffc(rabs);  // > CustomCode.luminance:39
          gg = diffc(gabs);  // > CustomCode.luminance:40
          bb = diffc(babs);  // > CustomCode.luminance:41
          if (rabs === v) {  // > CustomCode.luminance:42
              h = bb - gg;  // > CustomCode.luminance:43
          } else if (gabs === v) {  // > CustomCode.luminance:44
              h = (1 / 3) + rr - bb;  // > CustomCode.luminance:45
          } else if (babs === v) {  // > CustomCode.luminance:46
              h = (2 / 3) + gg - rr;  // > CustomCode.luminance:47
          }  // > CustomCode.luminance:48
          if (h < 0) {  // > CustomCode.luminance:49
              h += 1;  // > CustomCode.luminance:50
          }else if (h > 1) {  // > CustomCode.luminance:51
              h -= 1;  // > CustomCode.luminance:52
          }  // > CustomCode.luminance:53
      }  // > CustomCode.luminance:54
      return v;  // > CustomCode.luminance:55
  }  // > CustomCode.luminance:56
  // other alternatives of intensity  // > CustomCode.luminance:57
  function standard_luminance(r,g,b) {  // > CustomCode.luminance:58
     return (0.2126*r + 0.7152*g + 0.0722*b)/255;  // > CustomCode.luminance:59
  }  // > CustomCode.luminance:60
  function perceived1_luminance(r,g,b) {  // > CustomCode.luminance:61
     return (0.299*r + 0.587*g + 0.114*b)/255;  // > CustomCode.luminance:62
  }  // > CustomCode.luminance:63
  function perceived2_luminance(r,g,b) {  // > CustomCode.luminance:64
     return (Math.sqrt( 0.299*(r^2) + 0.587*(g^2) + 0.114*(b^2) ))/255;  // > CustomCode.luminance:65
  }  // > CustomCode.luminance:66

  function spectrum (imgData,luminance) {  // > CustomCode.spectrum:1
    var startLine = _view.start.getPixelPosition();  // > CustomCode.spectrum:2
    var sizeLine = _view.drawingPanel.toPixelMod(spectrumSize);   // > CustomCode.spectrum:3
      // > CustomCode.spectrum:4
    // init arrays  // > CustomCode.spectrum:5
    backData = [];  // > CustomCode.spectrum:6
    specData = [];  // > CustomCode.spectrum:7
    styleList = [];  // > CustomCode.spectrum:8
    var maxBrightness = 0;  // > CustomCode.spectrum:9
      // > CustomCode.spectrum:10
    // distance  // > CustomCode.spectrum:11
    var dist = Math.round(Math.sqrt(sizeLine[0]*sizeLine[0] + sizeLine[1]*sizeLine[1]));  // > CustomCode.spectrum:12
    var incx = sizeLine[0]/dist;  // > CustomCode.spectrum:13
    var incy = sizeLine[1]/dist;  // > CustomCode.spectrum:14
    // calculate  // > CustomCode.spectrum:15
    var row = Math.floor(startLine[1]);  // > CustomCode.spectrum:16
    var col = Math.floor(startLine[0]);  // > CustomCode.spectrum:17
    for (var i = 0; i < dist; i++){  // > CustomCode.spectrum:18
      var index = ( ( Math.round(i*incx) + col ) +   // > CustomCode.spectrum:19
          ( (Math.round(i*incy) + row) * imgData.width ) ) * 4;  // > CustomCode.spectrum:20
      var r = imgData.data[index];  // > CustomCode.spectrum:21
      var g = imgData.data[index + 1];  // > CustomCode.spectrum:22
      var b = imgData.data[index + 2];  // > CustomCode.spectrum:23
      // var a = imgData.data[index + 3];  // > CustomCode.spectrum:24
      var brightness = luminance(r,g,b);  // > CustomCode.spectrum:25
      if (brightness > maxBrightness) maxBrightness = brightness;  // > CustomCode.spectrum:26
      var pos = minX + (i / Math.max(1,dist-1)) * (maxX-minX);  // > CustomCode.spectrum:27
      backData.push([pos,1]);  // > CustomCode.spectrum:28
      specData.push([pos,brightness]);  // > CustomCode.spectrum:29
      // style  // > CustomCode.spectrum:30
      var style = EJSS_DRAWING2D.style("mystyl"+i); // for plottingPanel line  // > CustomCode.spectrum:31
      style.setFillColor("rgb("+r+","+g+","+b+")");  // > CustomCode.spectrum:32
      style.setLineColor("rgb("+r+","+g+","+b+")");  // > CustomCode.spectrum:33
      style.setLineWidth(1.5);  // > CustomCode.spectrum:34
      styleList.push(style);  // > CustomCode.spectrum:35
    }  // > CustomCode.spectrum:36
      // > CustomCode.spectrum:37
    // show peaks  // > CustomCode.spectrum:38
    // init peaks  // > CustomCode.spectrum:39
    xlabel = [];  // > CustomCode.spectrum:40
    ylabel = [];  // > CustomCode.spectrum:41
    tlabel = [];  // > CustomCode.spectrum:42
    for (var i = 2; i < specData.length-2; i++){  // > CustomCode.spectrum:43
      var cv = specData[i]; var current_pos = cv[0]; var current_l = cv[1];  // > CustomCode.spectrum:44
      var p1v = specData[i-1]; var prev1_pos = p1v[0]; var prev1_l = p1v[1];  // > CustomCode.spectrum:45
      var p2v = specData[i-2]; var prev2_pos = p2v[0]; var prev2_l = p2v[1];  // > CustomCode.spectrum:46
      var n1v = specData[i+1]; var next1_pos = n1v[0]; var next1_l = n1v[1];  // > CustomCode.spectrum:47
      var n2v = specData[i+2]; var next2_pos = n2v[0]; var next2_l = n2v[1];  // > CustomCode.spectrum:48
      if ((prev2_l < current_l && prev1_l <= current_l && current_l >= next1_l && current_l > next2_l)  ||  // usual peak  // > CustomCode.spectrum:49
          (current_l == 1 && prev2_l == 1 && prev1_l == 1 && next1_l == 1 && next2_l == 1)) { // flat peak in maximum   // > CustomCode.spectrum:50

  function calibrate_fluorescent (imgData, wData, hData, start, direction) {  // > CustomCode.calibrate_fluorescent:1
    var green_found = false;  // > CustomCode.calibrate_fluorescent:2
    var red_found = false;  // > CustomCode.calibrate_fluorescent:3
      // > CustomCode.calibrate_fluorescent:4
    // direction to iterate  // > CustomCode.calibrate_fluorescent:5
    if (direction == 'vertical')  // > CustomCode.calibrate_fluorescent:6
      var lenData = hData;   // > CustomCode.calibrate_fluorescent:7
    else // 'horizontal'  // > CustomCode.calibrate_fluorescent:8
      var lenData = wData;  // > CustomCode.calibrate_fluorescent:9
        // > CustomCode.calibrate_fluorescent:10
    var red_peak_i = 0;  // > CustomCode.calibrate_fluorescent:11
    var red_peak = 0;  // > CustomCode.calibrate_fluorescent:12
    var green_peak_i = 0;  // > CustomCode.calibrate_fluorescent:13
    var green_peak = 0;  // > CustomCode.calibrate_fluorescent:14
    for (var i = 0; i < lenData; i++) {  // > CustomCode.calibrate_fluorescent:15
      if (direction == 'vertical')  // > CustomCode.calibrate_fluorescent:16
        var index = ( i*wData + start ) * 4;  // > CustomCode.calibrate_fluorescent:17
      else  // > CustomCode.calibrate_fluorescent:18
        var index = ( i + start*wData ) * 4;  // > CustomCode.calibrate_fluorescent:19
      var r = imgData.data[index];  // > CustomCode.calibrate_fluorescent:20
      var g = imgData.data[index + 1];  // > CustomCode.calibrate_fluorescent:21
      var b = imgData.data[index + 2];        // > CustomCode.calibrate_fluorescent:22
            // > CustomCode.calibrate_fluorescent:23
      if ( (g > green_peak && g > threshold) && (g > b && g > r) ) {  // > CustomCode.calibrate_fluorescent:24
         // found green peak  // > CustomCode.calibrate_fluorescent:25
          green_peak_i = i;  // > CustomCode.calibrate_fluorescent:26
          green_peak = g;  // > CustomCode.calibrate_fluorescent:27
          green_found = true;  // > CustomCode.calibrate_fluorescent:28
          red_found = false;  // > CustomCode.calibrate_fluorescent:29
      } else if ( (r >= red_peak && r > threshold) && (green_found && r > b && r > g) ) {  // > CustomCode.calibrate_fluorescent:30
         // found red peak  // > CustomCode.calibrate_fluorescent:31
          red_peak_i = i;  // > CustomCode.calibrate_fluorescent:32
          red_peak = r;  // > CustomCode.calibrate_fluorescent:33
          red_found = true;  // > CustomCode.calibrate_fluorescent:34
      }      // > CustomCode.calibrate_fluorescent:35
    }  // > CustomCode.calibrate_fluorescent:36
    if (green_found && red_found) {  // > CustomCode.calibrate_fluorescent:37
     // see https://commons.wikimedia.org/wiki/File:Fluorescent_lighting_spectrum_peaks_labeled_with_colored_peaks_added.png  // > CustomCode.calibrate_fluorescent:38
     var GREEN_PEAK_REFERENCE = (542.4 + 546.5) / 2;  // > CustomCode.calibrate_fluorescent:39
     var RED_PEAK_REFERENCE = 611.6;  // > CustomCode.calibrate_fluorescent:40
     // firstPos must be minX and endPos must be maxX  // > CustomCode.calibrate_fluorescent:41
     var scale = (red_peak_i - green_peak_i) / (RED_PEAK_REFERENCE - GREEN_PEAK_REFERENCE);  // > CustomCode.calibrate_fluorescent:42
     var minX_i = Math.floor(green_peak_i - ((GREEN_PEAK_REFERENCE - minX) * scale))  // > CustomCode.calibrate_fluorescent:43
     if (direction == 'vertical')  // > CustomCode.calibrate_fluorescent:44
       var minX_index = (minX_i*wData + start ) * 4;  // > CustomCode.calibrate_fluorescent:45
     else  // > CustomCode.calibrate_fluorescent:46
       var minX_index = (minX_i + start*wData ) * 4;  // > CustomCode.calibrate_fluorescent:47
     var first_x = Math.floor((minX_index / 4) % wData);  // > CustomCode.calibrate_fluorescent:48
     var first_y = Math.floor((minX_index / 4) / wData);  // > CustomCode.calibrate_fluorescent:49
     firstPos = _view.drawingPanel.toPanelPosition([first_x,first_y]);  // > CustomCode.calibrate_fluorescent:50
     var maxX_i = Math.floor(red_peak_i + ((maxX - RED_PEAK_REFERENCE) * scale))  // > CustomCode.calibrate_fluorescent:51
     if (direction == 'vertical')  // > CustomCode.calibrate_fluorescent:52
       var maxX_index = (maxX_i*wData + start ) * 4;  // > CustomCode.calibrate_fluorescent:53
     else  // > CustomCode.calibrate_fluorescent:54
       var maxX_index = (maxX_i + start*wData ) * 4;  // > CustomCode.calibrate_fluorescent:55
     var end_x = Math.floor((maxX_index / 4) % wData);  // > CustomCode.calibrate_fluorescent:56
     var end_y = Math.floor((maxX_index / 4) / wData);  // > CustomCode.calibrate_fluorescent:57
     endPos = _view.drawingPanel.toPanelPosition([end_x,end_y]);  // > CustomCode.calibrate_fluorescent:58
     // check spectrum inside of image  // > CustomCode.calibrate_fluorescent:59
     if(minX_i > 0 && maxX_i < lenData) {  // > CustomCode.calibrate_fluorescent:60
       spectrumSize = [endPos[0]-firstPos[0], endPos[1]-firstPos[1]];  // > CustomCode.calibrate_fluorescent:61
       _update();  // > CustomCode.calibrate_fluorescent:62
       return true;  // > CustomCode.calibrate_fluorescent:63
     }  // > CustomCode.calibrate_fluorescent:64
    }  // > CustomCode.calibrate_fluorescent:65
    return false;  // > CustomCode.calibrate_fluorescent:66
  }  // > CustomCode.calibrate_fluorescent:67
