  var dT=0.,I,r,dr;  // > CustomCode.changeRange:1
  function changeRange () {  // > CustomCode.changeRange:2
     dT=(T2-T1)/(n-1);  // > CustomCode.changeRange:3
   for(var i=0;i<n;i++){  // > CustomCode.changeRange:4
     TS[i]=T2-i*dT;  // > CustomCode.changeRange:5
  //  xm=TX[i]=h*c/(4.97*k*TS[i])*1.e10;  // > CustomCode.changeRange:6
  // code to appear Tmax top position  // > CustomCode.changeRange:7
  // taken from http://en.wikipedia.org/wiki/Planck%27s_law  // > CustomCode.changeRange:8
  // This function peaks for hc = 4.97?kT, a factor of 1.76 shorter in wavelength (higher in frequency) than the frequency peak. It is the more commonly used peak in Wien's displacement law.  // > CustomCode.changeRange:9
  // xm is ? where peak occurs  // > CustomCode.changeRange:10
   xm=TX[i]=h*c/(4.97*k*TS[i])*1.e9; // cos weelk doing nm instead of Am  // > CustomCode.changeRange:11
   xmred=TXred=h*c/(4.97*k*T)*1.e9;  // > CustomCode.changeRange:12
  //  TMSG[i]="T="+((int)(TS[i]*10+0.5)/10.)+"K, peak at "+(int)(xm*10+0.5)/10. +"A";  // > CustomCode.changeRange:13
   TMSG[i]="T="+(parseInt((TS[i]*10+0.5)/10.))+"K, peak at "+parseInt((xm*10+0.5)/10.) +" nm";  // > CustomCode.changeRange:14
   TMSGred="T="+(parseInt((T*10+0.5)/10.))+"K, peak at "+parseInt((xmred*10+0.5)/10.) +" nm";  // > CustomCode.changeRange:15
  //   TY[i]=twohc2/((Math.exp(cst/(xm*TS[i]))-1)*(xm*xm*xm*xm*xm));  // > CustomCode.changeRange:16
  // calculate position of text top  // > CustomCode.changeRange:17
   TY[i]=twohc2/((Math.exp(cst/(xm*TS[i]))-1)*(xm*xm*xm*xm*xm));  // > CustomCode.changeRange:18
   TYred=twohc2/((Math.exp(cst/(xmred*T))-1)*(xmred*xmred*xmred*xmred*xmred));  // > CustomCode.changeRange:19
  }  // > CustomCode.changeRange:20
   if(T<T1)T=T1;  // > CustomCode.changeRange:21
   if(T>T2)T=T2;  // > CustomCode.changeRange:22
  Imax=0;  // > CustomCode.changeRange:23
  dr=(rmax-rmin)/(np-1);  // > CustomCode.changeRange:24
  for(var i=0;i<np;i++){  // > CustomCode.changeRange:25
    r=rmin+i*dr;  // > CustomCode.changeRange:26
     I=twohc2/((Math.exp(cst/(r*T2))-1)*(r*r*r*r*r));  // > CustomCode.changeRange:27
   if(I>Imax)Imax=I;  // > CustomCode.changeRange:28
     I=twohc2/((Math.exp(cst/(r*T1))-1)*(r*r*r*r*r));  // > CustomCode.changeRange:29
  // if(I>Imax)Imax=I;  // > CustomCode.changeRange:30
  //   I=twohc2/((Math.exp(cst/(r*T))-1)*(r*r*r*r*r));  // > CustomCode.changeRange:31
   if(I>Imax)Imax=I;  // > CustomCode.changeRange:32
  }  // > CustomCode.changeRange:33
  Imax=Imax*1.05;  // > CustomCode.changeRange:34
  }  // > CustomCode.changeRange:35
