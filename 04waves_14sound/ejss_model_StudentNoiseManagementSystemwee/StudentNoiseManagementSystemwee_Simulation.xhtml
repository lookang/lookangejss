  function init_user_media (callback) {  // > CustomCode.init_user_media:1
    // Audio Context  // > CustomCode.init_user_media:2
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();  // > CustomCode.init_user_media:3
    //set up the analyser  // > CustomCode.init_user_media:4
    analyser = audioCtx.createAnalyser();  // > CustomCode.init_user_media:5
    analyser.minDecibels = minDecibels;   // > CustomCode.init_user_media:6
    analyser.maxDecibels = maxDecibels;  // > CustomCode.init_user_media:7
    analyser.smoothingTimeConstant = 0.85;  // > CustomCode.init_user_media:8
    // filter  // > CustomCode.init_user_media:9
    var distortion = audioCtx.createWaveShaper();  // > CustomCode.init_user_media:10
    var gainNode = audioCtx.createGain();  // > CustomCode.init_user_media:11
    var biquadFilter = audioCtx.createBiquadFilter();  // > CustomCode.init_user_media:12
    var convolver = audioCtx.createConvolver();  // > CustomCode.init_user_media:13
     // > CustomCode.init_user_media:14
    // Get User Media (http://brickhousecodecamp.org/docs/phase-i/Javascript/developer.mozilla.org/en-US/docs/Web/API/MediaDevices/getUserMedia.html)    // > CustomCode.init_user_media:15
    if (navigator.mediaDevices === undefined) navigator.mediaDevices = {};  // > CustomCode.init_user_media:16
    if (navigator.mediaDevices.getUserMedia === undefined) {  // > CustomCode.init_user_media:17
        navigator.mediaDevices.getUserMedia = function(constraints) {  // > CustomCode.init_user_media:18
          // First get ahold of the legacy getUserMedia, if present  // > CustomCode.init_user_media:19
          var getUserMedia = (navigator.getUserMedia ||  // > CustomCode.init_user_media:20
                            navigator.webkitGetUserMedia ||  // > CustomCode.init_user_media:21
                            navigator.mozGetUserMedia ||  // > CustomCode.init_user_media:22
                            navigator.msGetUserMedia);  // > CustomCode.init_user_media:23
          if (!getUserMedia) {  // > CustomCode.init_user_media:24
            return Promise.reject(new Error('getUserMedia is not implemented in this browser'));  // > CustomCode.init_user_media:25
          }  // > CustomCode.init_user_media:26
          return new Promise(function(resolve, reject) {  // > CustomCode.init_user_media:27
            getUserMedia.call(navigator, constraints, resolve, reject);  // > CustomCode.init_user_media:28
          });  // > CustomCode.init_user_media:29
       }  // > CustomCode.init_user_media:30
    }  // > CustomCode.init_user_media:31
    // Call Get User Media  // > CustomCode.init_user_media:32
    navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(function(stream) {  // > CustomCode.init_user_media:33
         console.log('getUserMedia supported.');  // > CustomCode.init_user_media:34
         // alert("getUserMedia supported.") //debugging lookang  // > CustomCode.init_user_media:35
         source = audioCtx.createMediaStreamSource(stream);  // > CustomCode.init_user_media:36
         source.connect(analyser);  // > CustomCode.init_user_media:37
         analyser.connect(distortion);  // > CustomCode.init_user_media:38
         distortion.connect(biquadFilter);  // > CustomCode.init_user_media:39
         biquadFilter.connect(convolver);  // > CustomCode.init_user_media:40
         convolver.connect(gainNode);  // > CustomCode.init_user_media:41
         gainNode.connect(audioCtx.destination);       // > CustomCode.init_user_media:42
           // > CustomCode.init_user_media:43
         callback();  // > CustomCode.init_user_media:44
    }).catch(function(err) {  // > CustomCode.init_user_media:45
      //https://caniuse.com/#search=getusermedia  // > CustomCode.init_user_media:46
     // iOS sarafi not supported in iOS10.3, only available on 11 onwards  // > CustomCode.init_user_media:47
         console.log('The following gUM error occured: ' + err +' likely need iOS safari >11');  // > CustomCode.init_user_media:48
         // alert("The following gUM error occured: " + err);  // > CustomCode.init_user_media:49
    });  // > CustomCode.init_user_media:50
  }  // > CustomCode.init_user_media:51

  function findLong () {  // > CustomCode.finglong:1
    // get peaks  // > CustomCode.finglong:2
    var outp = []; //output of peaks  // > CustomCode.finglong:3
    for (var i=0; i<peakArray.length; i++) { // peakArray store all peaks global variable  // > CustomCode.finglong:4
      if (peakArray[i] > minDecibels) { // minDecibels is global -80  // > CustomCode.finglong:5
        outp.push(freqArray[i]); //freqArray is global   // > CustomCode.finglong:6
       // > CustomCode.finglong:7
      }  // > CustomCode.finglong:8
    }  // > CustomCode.finglong:9
      // > CustomCode.finglong:10
    // find out if open or closed pipe  // > CustomCode.finglong:11
    var margin = 0.2; // error margin  // > CustomCode.finglong:12
    //open open pipe at L = 0.3, v =330, frequencies are 550,1100,1650,2200,2750 Hz  // > CustomCode.finglong:13
    // we use 1100-2*550 <margin*550;  // > CustomCode.finglong:14
    // var open = (Math.abs(outp[1]-2*outp[0]) < margin*outp[1]); //old  // > CustomCode.finglong:15
    // results from our pipe L=0.31, F0 = 538, F1 = 1066, F2 = 1626   // > CustomCode.finglong:16
    var open = (Math.abs(outp[1]-2*outp[0]) < margin*outp[0]);  // > CustomCode.finglong:17
    //open closed pipe at L = 0.3, v =330, frequencies are 275,825,1375,1925,2450 Hz  // > CustomCode.finglong:18
    // we use 825-3*275 <margin*275;  // > CustomCode.finglong:19
   // var closed = (Math.abs(outp[1]-3*outp[0]) < margin*outp[1]);  // > CustomCode.finglong:20
     // > CustomCode.finglong:21
    var closed = (Math.abs(outp[1]-3*outp[0]) < margin*outp[0]);  // > CustomCode.finglong:22
   // var others;  // > CustomCode.finglong:23
    // formula  // > CustomCode.finglong:24
    var sound = 330; //assume to be 330 instead of 335  // > CustomCode.finglong:25
    if (open) {  // > CustomCode.finglong:26
      // true is for open, the formula is average of three F0=550 ,F1=1100 ,F2=1650  // > CustomCode.finglong:27
      return [true, ((sound/(2*outp[0])) + (sound/outp[1]) + ((3*sound)/(2*outp[2]))) / 3];  // > CustomCode.finglong:28
    }  // > CustomCode.finglong:29
    else if (closed){  // > CustomCode.finglong:30
      // false is for open-closed pipe, the formula is average of three F0=275 ,F1=825 ,F2=1375  // > CustomCode.finglong:31
      // using formula v =f lambda , 330 = 275 *lambda which lamdba/4 is Length of pipe   // > CustomCode.finglong:32
      return [false, ((sound/(4*outp[0])) + ((3*sound)/(4*outp[1])) + ((5*sound)/(4*outp[2]))) / 3];  // > CustomCode.finglong:33
    }  // > CustomCode.finglong:34
    else{  // > CustomCode.finglong:35
    return [];    // > CustomCode.finglong:36
    }  // > CustomCode.finglong:37
  }  // > CustomCode.finglong:38
